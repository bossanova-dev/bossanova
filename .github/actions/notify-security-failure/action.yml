name: Notify security scan failure
description: >-
  Open a GitHub issue (or comment on the existing open one) when a security
  scan workflow fails on main or a scheduled run. De-duplicates into a single
  open issue labelled `security-scan-failure`.

inputs:
  github-token:
    description: "Token with issues:write permission (pass ${{ github.token }})."
    required: true

runs:
  using: composite
  steps:
    - name: Open or update security-scan-failure issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const label = 'security-scan-failure';
          const ref = context.ref.replace('refs/heads/', '');
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const title = `Security scan failed on ${ref}`;
          const body = [
            `Workflow **${context.workflow}** failed on \`${context.ref}\` (event: \`${context.eventName}\`).`,
            '',
            `- Run: ${runUrl}`,
            `- Commit: \`${context.sha}\``,
            '',
            '_Opened automatically by the security-scan failure notifier. Close this issue once the failure is resolved; the next failure will open a fresh one._',
          ].join('\n');

          // Ensure the label exists (ignore "already exists").
          try {
            await github.rest.issues.createLabel({
              ...context.repo,
              name: label,
              color: 'B60205',
              description: 'Automated security scan failure',
            });
          } catch (e) {
            if (e.status !== 422) throw e;
          }

          // Re-use the existing open issue if there is one, else create a new one.
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: label,
            per_page: 1,
          });

          if (existing.data.length > 0) {
            const issue_number = existing.data[0].number;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            core.info(`Commented on existing issue #${issue_number}`);
          } else {
            const created = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: [label],
            });
            core.info(`Opened issue #${created.data.number}`);
          }
