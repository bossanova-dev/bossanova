name: Notify security scan failure
description: >-
  Open a Linear issue (or comment on the existing open one) when a security
  scan or nightly workflow fails. De-duplicates into a single open issue
  per team and label (default security-scan-failure).

inputs:
  github-token:
    description: "Token with actions:read permission (pass the workflow's github.token)."
    required: true
  linear-api-key:
    description: 'Linear API key with permission to create issues, labels and comments.'
    required: true
  linear-team-key:
    description: 'Linear team key receiving workflow failure issues.'
    required: true
  label:
    description: 'Issue label the notifier de-duplicates on. Defaults to the security label.'
    required: false
    default: security-scan-failure
  title-prefix:
    description: 'Issue title before ` on <ref>`.'
    required: false
    default: Security scan failed

runs:
  using: composite
  steps:
    - name: Open or update workflow failure issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NOTIFY_LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        NOTIFY_LINEAR_TEAM_KEY: ${{ inputs.linear-team-key }}
        NOTIFY_LABEL: ${{ inputs.label }}
        NOTIFY_TITLE_PREFIX: ${{ inputs.title-prefix }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { pathToFileURL } = require('node:url');
          const { resolve } = require('node:path');
          const { notifyWorkflowFailure } = await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE, 'scripts/release/notify-workflow-failure.mjs')).href);
          await notifyWorkflowFailure({
            github, context, core, fetch,
            apiKey: process.env.NOTIFY_LINEAR_API_KEY,
            teamKey: process.env.NOTIFY_LINEAR_TEAM_KEY,
            label: process.env.NOTIFY_LABEL,
            titlePrefix: process.env.NOTIFY_TITLE_PREFIX,
          });
