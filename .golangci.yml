version: "2"

run:
  timeout: 5m

# guard-id: golangci-uncapped
# No output caps. golangci's defaults (50 per linter, 3 identical) hide violations past the cap,
# so a baseline built from its report misses them. scripts/guards/golangci-caps.mjs enforces this.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report distinct findings even when they share a source line.
  uniq-by-line: false

linters:
  enable:
    - bodyclose
    - depguard
    - errcheck
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    depguard:
      rules:
        # guard-id: boss-connect-only-in-adapters
        boss-connect-only-in-adapters:
          files:
            - '**/services/boss/**'
            - '!**/services/boss/internal/adapter/**'
            - '!$test'
            # BEGIN generated: boss-connect-only-in-adapters baseline (node scripts/guards/boss-connect-only-in-adapters.mjs --write)
            - "!**/services/boss/internal/tuitest/mock_daemon.go"
            # END generated
          deny:
            - pkg: 'connectrpc.com/connect$'
              desc: Keep Connect transport in internal/adapter and use rpcerr.
            - pkg: 'github.com/recurser/bossalib/gen/bossanova/v1/bossanovav1connect$'
              desc: Keep generated transport clients in internal/adapter.
        # guard-id: e2e-harness-imports
        e2e-harness-imports:
          files:
            - '$test'
            - '!**/services/boss/e2e/**'
            - '!**/services/boss/internal/tuidriver/**'
            - '!**/services/boss/internal/tuitest/**'
            - '!**/services/boss/internal/clitest/**'
            - '!**/services/bossd/testharness/**'
            # BEGIN generated: e2e-harness-imports baseline (node scripts/guards/e2e-harness-imports.mjs --write)
            - "!**/services/boss/api/cli/cron/cron_test.go"
            - "!**/services/boss/api/cli/repo/project_apply_test.go"
            - "!**/services/boss/api/cli/repo/project_test.go"
            - "!**/services/boss/api/cli/session/archive_cmd_test.go"
            - "!**/services/boss/api/cli/session/session_json_test.go"
            - "!**/services/boss/api/cli/skills/init_cron_test.go"
            - "!**/services/boss/api/cli/skills/init_interactive_test.go"
            - "!**/services/boss/api/cli/skills/init_repo_test.go"
            - "!**/services/boss/cmd/proof-tui-agent/main_test.go"
            - "!**/services/bossd/api/daemon/ready_handoff_integration_test.go"
            - "!**/services/bossd/internal/evidence/provider_contract_test.go"
            - "!**/services/bossd/internal/mcpcontract/contract_test.go"
            - "!**/services/bossd/internal/session/reconcile_e2e_branch_drift_test.go"
            - "!**/services/bossd/internal/session/reconcile_e2e_test.go"
            # END generated
          deny:
            - pkg: github.com/recurser/boss/internal/tuidriver
              desc: Import e2e harnesses only from e2e or their own directories; see docs/testing/policy.md
            - pkg: github.com/recurser/boss/internal/tuitest
              desc: Import e2e harnesses only from e2e or their own directories; see docs/testing/policy.md
            - pkg: github.com/recurser/boss/internal/clitest
              desc: Import e2e harnesses only from e2e or their own directories; see docs/testing/policy.md
            - pkg: github.com/recurser/bossd/testharness
              desc: Import e2e harnesses only from e2e or their own directories; see docs/testing/policy.md
        # guard-id: boss-tui-screens-isolated
        boss-tui-screens-isolated:
          list-mode: lax
          files:
            - '**/services/boss/api/tui/*/**'
            - '!**/services/boss/api/tui/ui/**'
            - '!$test'
            # BEGIN generated: boss-tui-screens-isolated baseline (node scripts/guards/boss-tui-screens-isolated.mjs --write)
            # END generated
          allow:
            - github.com/recurser/boss/api/tui/ui$
          deny:
            - pkg: github.com/recurser/boss/api/tui
              desc: Screens communicate through api/tui/ui messages, not other screens or the router.
        # guard-id: boss-tui-screens-no-adapters
        boss-tui-screens-no-adapters:
          files:
            - '**/services/boss/api/tui/*/**'
            - '!**/services/boss/api/tui/ui/**'
            - '!$test'
            # BEGIN generated: boss-tui-screens-no-adapters baseline (node scripts/guards/boss-tui-screens-no-adapters.mjs --write)
            # END generated
          deny:
            - pkg: os/exec$
              desc: Declare a consumer interface and inject process operations from the composition root.
            - pkg: github.com/recurser/boss/internal/daemonlife
              desc: Declare a consumer interface and inject daemon operations from the composition root.
            - pkg: github.com/recurser/boss/internal/daemon
              desc: Declare a consumer interface and inject daemon operations from the composition root.
            - pkg: github.com/recurser/boss/internal/upgrade
              desc: Declare a consumer interface and inject upgrade operations from the composition root.
        # Enforce the module boundary documented in CLAUDE.md: out-of-process
        # plugin binaries must not import host (boss/bossd/bosso) packages. They
        # talk to the host over gRPC and duplicate small types rather than take a
        # source dependency. Go's internal/ rule already blocks cross-module
        # internal imports; this catches the importable (non-internal) host
        # packages it does not — e.g. bossd/migrations.
        # Scoped to plugin files so host modules linting against this same config
        # are unaffected.
        # guard-id: depguard-plugin-host-imports
        plugins-no-host-imports:
          files:
            - "**/plugins/bossd-plugin-*/**"
          deny:
            - pkg: github.com/recurser/boss/
              desc: plugins must not import the boss TUI; communicate over gRPC
            - pkg: github.com/recurser/bossd/
              desc: plugins must not import host bossd packages; communicate over gRPC
            - pkg: github.com/recurser/bosso/
              desc: plugins must not import host bosso packages; communicate over gRPC
            - pkg: github.com/recurser/bossanova-mcp/
              desc: plugins must not import the host mcp server; communicate over gRPC
            - pkg: github.com/recurser/bossanova-mcp-gateway/
              desc: plugins must not import the host mcp gateway; communicate over gRPC
        # guard-id: store-only-sql
        store-only-sql:
          files:
            - "**/services/bossd/**/*.go"
            - "**/services/bosso/**/*.go"
            - "!$test"
            - "!**/internal/db/*.go"
            - "!**/internal/db/sqlcgen/*.go"
            - "!**/internal/dbtest/**"
            - "!**/internal/testharness/**"
            - "!**/services/bossd/testharness/**"
            - "!**/services/bossd/internal/adapter/migrate/*.go"
            # BEGIN generated: store-only-sql baseline (node scripts/guards/store-only-sql.mjs --write)
            # END generated
          deny:
            - pkg: database/sql
              desc: call the store; use errors.Is(err, domain.ErrNotFound) instead of sql.ErrNoRows
            - pkg: modernc.org/sqlite
              desc: call the store; use errors.Is(err, domain.ErrNotFound) instead of sql.ErrNoRows
            - pkg: github.com/jackc/pgx/v5
              desc: call the store; use errors.Is(err, domain.ErrNotFound) instead of sql.ErrNoRows
            - pkg: github.com/pressly/goose/v3
              desc: call the store; use errors.Is(err, domain.ErrNotFound) instead of sql.ErrNoRows
            - pkg: github.com/lib/pq
              desc: call the store; use errors.Is(err, domain.ErrNotFound) instead of sql.ErrNoRows
        # guard-id: doors-no-store
        doors-no-store:
          files:
            - '**/services/bossd/api/daemon/**'
            - '**/services/bossd/internal/plugin/**'
            - '**/services/bossd/internal/upstream/**'
            - '**/services/bossd/api/**'
            - '**/services/bosso/api/**'
            - '!$test'
            # BEGIN generated: doors-no-store baseline (node scripts/guards/doors-no-store.mjs --write)
            # END generated
          deny:
            - pkg: github.com/recurser/bosso/internal/db$
              desc: doors must not import the store; declare a consumer interface in this package and accept it in the constructor (cmd wires the store)
            - pkg: github.com/recurser/bosso/internal/db/
              desc: doors must not import the store; declare a consumer interface in this package and accept it in the constructor (cmd wires the store)
            - pkg: github.com/recurser/bossd/internal/db$
              desc: doors must not import the store; declare a consumer interface in this package and accept it in the constructor (cmd wires the store)
            - pkg: github.com/recurser/bossd/internal/db/
              desc: doors must not import the store; declare a consumer interface in this package and accept it in the constructor (cmd wires the store)
            - pkg: github.com/recurser/bosso/internal/adapter/
              desc: doors must not import adapters; declare a consumer interface and inject it from cmd
            - pkg: github.com/recurser/bossd/internal/adapter/
              desc: doors must not import adapters; declare a consumer interface and inject it from cmd
        # guard-id: proto-at-the-edge
        proto-at-the-edge:
          files:
            - '**/services/bosso/**'
            - '!**/services/bosso/api/**'
            - '!**/services/bosso/cmd/**'
            - '**/services/bossd/**'
            - '!**/services/bossd/api/**'
            - '!**/services/bossd/cmd/**'
            - '!$test'
            # BEGIN generated: proto-at-the-edge baseline (node scripts/guards/proto-at-the-edge.mjs --write)
            - "!**/services/bossd/internal/accountwiring/adapters.go"
            - "!**/services/bossd/internal/accountwiring/smoke.go"
            - "!**/services/bossd/internal/adapter/tmux/attach.go"
            - "!**/services/bossd/internal/agent/dispatcher.go"
            - "!**/services/bossd/internal/agent/modal_detector.go"
            - "!**/services/bossd/internal/agent/plugin_runner.go"
            - "!**/services/bossd/internal/agent/poll_fallback.go"
            - "!**/services/bossd/internal/agent/runner.go"
            - "!**/services/bossd/internal/callback/interests.go"
            - "!**/services/bossd/internal/domain/repotrust/repotrust.go"
            - "!**/services/bossd/internal/notesync/worker.go"
            - "!**/services/bossd/internal/plugin/agent_runner_grpc.go"
            - "!**/services/bossd/internal/plugin/eventbus/eventbus.go"
            - "!**/services/bossd/internal/plugin/grpc_plugins.go"
            - "!**/services/bossd/internal/plugin/host.go"
            - "!**/services/bossd/internal/plugin/host_agent_proxy.go"
            - "!**/services/bossd/internal/plugin/host_displace.go"
            - "!**/services/bossd/internal/resume/transient_resumer.go"
            - "!**/services/bossd/internal/rotation/chat_rotator.go"
            - "!**/services/bossd/internal/session/alert_clear.go"
            - "!**/services/bossd/internal/session/blocked_run.go"
            - "!**/services/bossd/internal/session/finalize.go"
            - "!**/services/bossd/internal/session/headless_capability_profile.go"
            - "!**/services/bossd/internal/session/instruction_delivery.go"
            - "!**/services/bossd/internal/session/launch_diagnosis.go"
            - "!**/services/bossd/internal/session/lifecycle.go"
            - "!**/services/bossd/internal/session/switch_account.go"
            - "!**/services/bossd/internal/session/tmux_chat.go"
            - "!**/services/bossd/internal/session/tmux_chat_delivery.go"
            - "!**/services/bossd/internal/sessionattention/sessionattention.go"
            - "!**/services/bossd/internal/status/display_computer.go"
            - "!**/services/bossd/internal/status/repair_lease.go"
            - "!**/services/bossd/internal/status/tmux_idle_reap.go"
            - "!**/services/bossd/internal/status/tmux_poller.go"
            - "!**/services/bossd/internal/status/tmux_reaper.go"
            - "!**/services/bossd/internal/status/tracker.go"
            - "!**/services/bossd/internal/taskorchestrator/orchestrator.go"
            - "!**/services/bossd/internal/verifyevent/trigger.go"
            - "!**/services/bossd/switchdispatchtest/switchdispatchtest.go"
            - "!**/services/bossd/testharness/harness.go"
            - "!**/services/bossd/testharness/mock_agent.go"
            - "!**/services/bossd/testharness/mock_agent_runner.go"
            - "!**/services/bossd/testharness/state_observer.go"
            - "!**/services/bossd/webhookdispatchtest/webhookdispatchtest.go"
            - "!**/services/bosso/internal/adapter/attach/token.go"
            - "!**/services/bosso/internal/billing/policy.go"
            - "!**/services/bosso/internal/daemonproxy/command_dispatch.go"
            - "!**/services/bosso/internal/daemonproxy/command_relay.go"
            - "!**/services/bosso/internal/daemonproxy/command_results.go"
            - "!**/services/bosso/internal/daemonproxy/daemon_commands.go"
            - "!**/services/bosso/internal/daemonproxy/fleet_dispatch.go"
            - "!**/services/bosso/internal/daemonproxy/machine_owner.go"
            - "!**/services/bosso/internal/daemonproxy/repo_owners.go"
            - "!**/services/bosso/internal/daemonproxy/stream_routing.go"
            - "!**/services/bosso/internal/daemonproxy/transfer.go"
            - "!**/services/bosso/internal/domain/authzlevel/authzlevel.go"
            - "!**/services/bosso/internal/domain/trigger/github_type.go"
            - "!**/services/bosso/internal/domain/trigger/http_type.go"
            - "!**/services/bosso/internal/domain/trigger/match.go"
            - "!**/services/bosso/internal/domain/trigger/prompt.go"
            - "!**/services/bosso/internal/domain/trigger/registry.go"
            - "!**/services/bosso/internal/domain/trigger/validate.go"
            - "!**/services/bosso/internal/sessionordertest/fixture.go"
            - "!**/services/bosso/internal/sessionorg/resolver.go"
            - "!**/services/bosso/internal/sessionread/model.go"
            - "!**/services/bosso/internal/sessionwebhook/catalog.go"
            - "!**/services/bosso/internal/sessionwebhook/envelope.go"
            - "!**/services/bosso/internal/sessionwebhook/producer.go"
            - "!**/services/bosso/internal/stream/metrics.go"
            - "!**/services/bosso/internal/stream/registry.go"
            - "!**/services/bosso/internal/stream/state.go"
            - "!**/services/bosso/internal/stream/state_terminal.go"
            - "!**/services/bosso/internal/stream/testing.go"
            - "!**/services/bosso/internal/stream/writer.go"
            - "!**/services/bosso/internal/testharness/fake_daemon.go"
            - "!**/services/bosso/internal/testharness/fake_daemon_stream.go"
            - "!**/services/bosso/internal/testharness/fake_terminal_stream.go"
            - "!**/services/bosso/internal/testharness/harness.go"
            - "!**/services/bosso/internal/triggers/triggeringest/github.go"
            - "!**/services/bosso/internal/triggers/triggeringest/ingest.go"
            - "!**/services/bosso/internal/triggers/triggerlaunch/decide.go"
            - "!**/services/bosso/internal/triggers/triggerlaunch/gate.go"
            - "!**/services/bosso/internal/triggers/triggerlaunch/worker.go"
            # END generated
          deny:
            - pkg: github.com/recurser/bossalib/gen/bossanova/v1$
              desc: translate generated proto types at the API edge; use domain types internally
            - pkg: github.com/recurser/bossalib/gen/bossanova/v1/
              desc: translate generated proto types at the API edge; use domain types internally
        # guard-id: domain-imports
        domain-imports-nothing-internal:
          files:
            - '**/services/bossd/internal/domain/**'
            - '**/services/bosso/internal/domain/**'
            - '!$test'
          list-mode: lax
          allow:
            - github.com/recurser/bossd/internal/domain$
            - github.com/recurser/bossd/internal/domain/
            - github.com/recurser/bosso/internal/domain$
            - github.com/recurser/bosso/internal/domain/
          deny:
            - pkg: github.com/recurser/bossd/
              desc: internal/domain holds entity types and pure decisions and imports only other domain packages within services; move the dependency to the caller
            - pkg: github.com/recurser/bosso/
              desc: internal/domain holds entity types and pure decisions and imports only other domain packages within services; move the dependency to the caller
        # guard-id: mcp-doors-no-adapters
        mcp-doors-no-adapters:
          files:
            - "**/services/mcp/api/**"
            - "**/services/mcp-gateway/api/**"
            - "!$test"
          deny:
            - pkg: github.com/recurser/bossanova-mcp/internal/adapter/
              desc: declare a consumer interface in this package and accept it in the constructor; cmd wires the adapter
            - pkg: github.com/recurser/bossanova-mcp-gateway/internal/adapter/
              desc: declare a consumer interface in this package and accept it in the constructor; cmd wires the adapter
        # guard-id: mcp-proto-at-the-edge
        mcp-proto-at-the-edge:
          files:
            - "**/services/mcp/internal/**"
            - "**/services/mcp-gateway/internal/**"
            - "!**/internal/adapter/**"
            - "!$test"
          deny:
            - pkg: github.com/recurser/bossalib/gen/bossanova/v1
              desc: wire types stay at the edge (doors, cmd, and the adapter that speaks the wire); convert at the boundary
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # BOS-717: the session bootstrap hung forever because its subprocesses had
      # no deadline. exec.CommandContext is the only form that can be bounded, so
      # the bare constructor is banned on the daemon paths this ticket hardened.
      # Setting `forbid` replaces forbidigo's fmt.Print* defaults, which this
      # repo does not want.
      #
      # Deliberately NOT repo-wide: 34 non-test call sites elsewhere (the TUI's
      # `open`/`tmux`/`osascript` launches, daemon install/uninstall, plugin
      # spawn) are fire-and-forget or user-cancelled, and rewriting them is a
      # separate change. The exclusion below narrows the rule to the packages on
      # the session-bootstrap path; widening it later is a one-line edit.
      # guard-id: forbidigo-bootstrap-exec
      forbid:
        - pattern: ^exec\.Command$
          msg: use exec.CommandContext with a deadline — a bare exec.Command cannot be bounded (BOS-717)
    gocritic:
      disabled-checks:
        - singleCaseSwitch # common Bubbletea pattern for key handling
        - ifElseChain
    gosec:
      excludes:
        - G101 # hardcoded credentials — false positives on const names
        - G112 # Slowloris — local Unix sockets and ephemeral OAuth callbacks
        - G115 # integer overflow int->int32 — intentional protobuf conversions
        - G117 # marshaled secret field — tokens stored to encrypted keyring
        - G202 # SQL concatenation — column names are controlled, not user input
        - G204 # subprocess with variable — CLI tool shells out by design
        - G301 # directory permissions 0755 — standard Unix directories
        - G302 # file permissions — socket chmod is intentional
        - G304 # file inclusion via variable — paths are from our config
        - G306 # WriteFile permissions 0644 — standard file permissions
        - G703 # path traversal — paths are from our config
        - G705 # XSS — single OAuth callback page with controlled input
    nolintlint:
      require-explanation: true
      require-specific: true
    # Enable initialism and cross-file receiver checks while retaining the other defaults.
    staticcheck:
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    revive:
      rules:
        # Keep package-name stutter checks without requiring redundant doc comments.
        - name: exported
          arguments:
            - disableChecksOnConstants
            - disableChecksOnFunctions
            - disableChecksOnMethods
            - disableChecksOnTypes
            - disableChecksOnVariables
        - name: blank-imports
          disabled: true # driver imports (e.g. modernc.org/sqlite) are idiomatic

  exclusions:
    paths:
      # Match generated directories only, not names such as agent or skillgen.
      - (^|/)gen/
    rules:
      # Preserve this existing migration package name without hiding other findings.
      - path: (^|/)migrations_postgres/
        text: "should not use underscores in package names"
        linters:
          - staticcheck
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          # forcetypeassert: unchecked assertions in tests panic on mismatch,
          # which is an acceptable loud test failure. Test assertions also often
          # live in closures without a *testing.T in scope, so comma-ok has no
          # clean failure path. Mirrors the gosec/prealloc test relief above;
          # production code is still fully guarded.
          - forcetypeassert
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # forbidigo's exec.Command ban applies only to the packages on the session-
      # bootstrap path (see the forbidigo settings above for why it is not
      # repo-wide).
      #
      # Matched on the DIRECTORY NAME at any depth, deliberately: golangci-lint
      # v2 reports issue paths relative to the config file (run.relative-path-mode
      # defaults to `cfg`), so they arrive repo-relative even under
      # lint-affected.mjs, which runs with the MODULE as cwd — but the pattern
      # should not have to encode that, and the sibling `path:` rules below would
      # be the ones to fix if it ever changed. The cost of matching on the name
      # alone is that services/bosso/internal/server is covered too: intentional
      # and harmless (it has no bare exec.Command), but a violation there would
      # be rejected with a message about the bossd bootstrap, so widen this
      # comment rather than being surprised.
      - path-except: (^|/)internal/(adapter/git|server|session|taskorchestrator)/
        linters:
          - forbidigo
      # Test helpers shell out to git/tooling with no deadline by design; a
      # hung test is caught by the test timeout, not by a context.
      - path: _test\.go
        linters:
          - forbidigo
      # G704 SSRF false positive: socketIsServing dials the local daemon's own
      # controlled Unix socket path, not user input — a "unix" network dial
      # cannot SSRF. gosec's whole-package taint pass only surfaces it when an
      # unrelated env read exists elsewhere in the package.
      - path: services/bossd/api/daemon/singleton\.go
        text: "G704"
        linters:
          - gosec
      # SA1019: x/net 0.59 deprecated the ENTIRE golang.org/x/net/http2 surface —
      # server (http2.Server, http2.ConfigureServer, and the h2s
      # ReadIdleTimeout / PingTimeout keepalive fields) and client
      # (http2.Transport, http2.ConfigureTransports, and the tr AllowHTTP /
      # DialTLSContext / ReadIdleTimeout / PingTimeout fields) alike — in favour
      # of net/http's Server.Protocols / Transport.Protocols + HTTP2Config.
      #
      # This repo cannot take that migration yet, and already says so in code:
      # services/bosso/cmd/main.go and services/bosso/internal/testharness/
      # harness.go carry //nolint:staticcheck recording that the stdlib
      # http.Server.Protocols replacement BREAKS ConnectRPC bidi streams
      # (TestE2E_StreamDropsDuringPendingCommand) against the x/net/http2 client
      # in services/bossd/api/upstream/httpclient.go. The bosso server half
      # and the bossd client half therefore have to flip ATOMICALLY in their own
      # change; doing either alone breaks streaming, and a toolchain bump is the
      # wrong place for it. Those existing //nolint comments cover only the h2c
      # IMPORT lines, so they do not reach these usage sites, which 0.59 newly
      # deprecated.
      #
      # Matched on the deprecated SYMBOL rather than on a path list: the
      # deferral is a property of the x/net/http2 API, not of the ~9 files that
      # happen to use it today, and a path list would silently miss the next
      # file added. The cost is that a NEW use of these same symbols is also
      # excluded — acceptable while the whole package is pending migration, and
      # any OTHER SA1019 deprecation anywhere still fails the gate.
      - text: "SA1019: (http2\\.(Server|Transport|ConfigureServer|ConfigureTransports)|[A-Za-z0-9_]+\\.(AllowHTTP|DialTLSContext|ReadIdleTimeout|PingTimeout)) is deprecated"
        linters:
          - staticcheck

# No `formatters:` block (BOS-371). gofmt+goimports are redundant here — they only
# *re-check* formatting that `make format` / `format-affected` / the pre-commit hook
