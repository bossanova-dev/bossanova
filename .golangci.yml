version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - depguard
    - errcheck
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    depguard:
      rules:
        # Enforce the module boundary documented in CLAUDE.md: out-of-process
        # plugin binaries must not import host (boss/bossd/bosso) packages. They
        # talk to the host over gRPC and duplicate small types rather than take a
        # source dependency. Go's internal/ rule already blocks cross-module
        # internal imports; this catches the importable (non-internal) host
        # packages it does not — e.g. bossd/migrations.
        # Scoped to plugin files so host modules linting against this same config
        # are unaffected.
        plugins-no-host-imports:
          files:
            - "**/plugins/bossd-plugin-*/**"
          deny:
            - pkg: github.com/recurser/boss/
              desc: plugins must not import the boss TUI; communicate over gRPC
            - pkg: github.com/recurser/bossd/
              desc: plugins must not import host bossd packages; communicate over gRPC
            - pkg: github.com/recurser/bosso/
              desc: plugins must not import host bosso packages; communicate over gRPC
            - pkg: github.com/recurser/bossanova-mcp/
              desc: plugins must not import the host mcp server; communicate over gRPC
            - pkg: github.com/recurser/bossanova-mcp-gateway/
              desc: plugins must not import the host mcp gateway; communicate over gRPC
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # BOS-717: the session bootstrap hung forever because its subprocesses had
      # no deadline. exec.CommandContext is the only form that can be bounded, so
      # the bare constructor is banned on the daemon paths this ticket hardened.
      # Setting `forbid` replaces forbidigo's fmt.Print* defaults, which this
      # repo does not want.
      #
      # Deliberately NOT repo-wide: 34 non-test call sites elsewhere (the TUI's
      # `open`/`tmux`/`osascript` launches, daemon install/uninstall, plugin
      # spawn) are fire-and-forget or user-cancelled, and rewriting them is a
      # separate change. The exclusion below narrows the rule to the packages on
      # the session-bootstrap path; widening it later is a one-line edit.
      forbid:
        - pattern: ^exec\.Command$
          msg: use exec.CommandContext with a deadline — a bare exec.Command cannot be bounded (BOS-717)
    gocritic:
      disabled-checks:
        - singleCaseSwitch # common Bubbletea pattern for key handling
        - ifElseChain
    gosec:
      excludes:
        - G101 # hardcoded credentials — false positives on const names
        - G112 # Slowloris — local Unix sockets and ephemeral OAuth callbacks
        - G115 # integer overflow int->int32 — intentional protobuf conversions
        - G117 # marshaled secret field — tokens stored to encrypted keyring
        - G202 # SQL concatenation — column names are controlled, not user input
        - G204 # subprocess with variable — CLI tool shells out by design
        - G301 # directory permissions 0755 — standard Unix directories
        - G302 # file permissions — socket chmod is intentional
        - G304 # file inclusion via variable — paths are from our config
        - G306 # WriteFile permissions 0644 — standard file permissions
        - G703 # path traversal — paths are from our config
        - G705 # XSS — single OAuth callback page with controlled input
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true # interfaces define the contract; method comments are redundant
        - name: blank-imports
          disabled: true # driver imports (e.g. modernc.org/sqlite) are idiomatic

  exclusions:
    paths:
      - gen
    rules:
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          # forcetypeassert: unchecked assertions in tests panic on mismatch,
          # which is an acceptable loud test failure. Test assertions also often
          # live in closures without a *testing.T in scope, so comma-ok has no
          # clean failure path. Mirrors the gosec/prealloc test relief above;
          # production code is still fully guarded.
          - forcetypeassert
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # forbidigo's exec.Command ban applies only to the packages on the session-
      # bootstrap path (see the forbidigo settings above for why it is not
      # repo-wide).
      #
      # Matched on the DIRECTORY NAME at any depth, deliberately: golangci-lint
      # v2 reports issue paths relative to the config file (run.relative-path-mode
      # defaults to `cfg`), so they arrive repo-relative even under
      # lint-affected.mjs, which runs with the MODULE as cwd — but the pattern
      # should not have to encode that, and the sibling `path:` rules below would
      # be the ones to fix if it ever changed. The cost of matching on the name
      # alone is that services/bosso/internal/server is covered too: intentional
      # and harmless (it has no bare exec.Command), but a violation there would
      # be rejected with a message about the bossd bootstrap, so widen this
      # comment rather than being surprised.
      - path-except: (^|/)internal/(git|server|session|taskorchestrator)/
        linters:
          - forbidigo
      # Test helpers shell out to git/tooling with no deadline by design; a
      # hung test is caught by the test timeout, not by a context.
      - path: _test\.go
        linters:
          - forbidigo
      # G704 SSRF false positive: socketIsServing dials the local daemon's own
      # controlled Unix socket path, not user input — a "unix" network dial
      # cannot SSRF. gosec's whole-package taint pass only surfaces it when an
      # unrelated env read exists elsewhere in the package.
      - path: services/bossd/internal/server/singleton\.go
        text: "G704"
        linters:
          - gosec
      # SA1019: x/net 0.59 deprecated the ENTIRE golang.org/x/net/http2 surface —
      # server (http2.Server, http2.ConfigureServer, and the h2s
      # ReadIdleTimeout / PingTimeout keepalive fields) and client
      # (http2.Transport, http2.ConfigureTransports, and the tr AllowHTTP /
      # DialTLSContext / ReadIdleTimeout / PingTimeout fields) alike — in favour
      # of net/http's Server.Protocols / Transport.Protocols + HTTP2Config.
      #
      # This repo cannot take that migration yet, and already says so in code:
      # services/bosso/cmd/main.go and services/bosso/internal/testharness/
      # harness.go carry //nolint:staticcheck recording that the stdlib
      # http.Server.Protocols replacement BREAKS ConnectRPC bidi streams
      # (TestE2E_StreamDropsDuringPendingCommand) against the x/net/http2 client
      # in services/bossd/internal/upstream/httpclient.go. The bosso server half
      # and the bossd client half therefore have to flip ATOMICALLY in their own
      # change; doing either alone breaks streaming, and a toolchain bump is the
      # wrong place for it. Those existing //nolint comments cover only the h2c
      # IMPORT lines, so they do not reach these usage sites, which 0.59 newly
      # deprecated.
      #
      # Matched on the deprecated SYMBOL rather than on a path list: the
      # deferral is a property of the x/net/http2 API, not of the ~9 files that
      # happen to use it today, and a path list would silently miss the next
      # file added. The cost is that a NEW use of these same symbols is also
      # excluded — acceptable while the whole package is pending migration, and
      # any OTHER SA1019 deprecation anywhere still fails the gate.
      - text: "SA1019: (http2\\.(Server|Transport|ConfigureServer|ConfigureTransports)|[A-Za-z0-9_]+\\.(AllowHTTP|DialTLSContext|ReadIdleTimeout|PingTimeout)) is deprecated"
        linters:
          - staticcheck

# No `formatters:` block (BOS-371). gofmt+goimports are redundant here — they only
# *re-check* formatting that `make format` / `format-affected` / the pre-commit hook
# already *apply*, and they dominate golangci wall-time (measured bossd cold
# 22s → 7s, ~3× without them). Whole-tree format is instead enforced by the cheap
# standalone `make lint-go-fmt` gate (gofmt -l + goimports -l, ~1s) run from `make
# lint` / `make lint-all`, plus the pre-commit formatter and BOS-372's sweep.
