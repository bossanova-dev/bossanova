# Codex config
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
notify = ["bash", "-lc", "say done # not a comment"]
started = 1979-05-27 07:32:00Z
ratio = 0.5
big = 1_000
flag = true
instructions = """
[projects."/fake"]
trust_level = "trusted"
"""
literal = '''C:\path ''' # trailing comment

[tui]
notifications = [
  "agent-turn-complete", # comment inside array
  'approval-requested',
]

[mcp_servers.linear]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.linear.app/sse"]
env = { "LINEAR_API_KEY" = "x", OTHER = 'y' }

[mcp_servers."with.dot"]
url = "https://example.com/mcp"

[profiles.fast]
model = "o4-mini"

[projects."/Users/me/code/repo"]
trust_level = "trusted"

[ projects . '/Users/me/code/other' ]
"trust_level" = 'untrusted'
