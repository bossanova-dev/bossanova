  repeated Account accounts = 1;
}

message AddAccountRequest {
  string provider   = 1;   // "claude" | "codex"
  string label      = 2;
  // Field 3 / "email" was optional informational account email metadata.
  reserved 3;
  reserved "email";
  int32  priority   = 4;   // sort order; lower = preferred
  // Credential blob (Claude setup-token string; Codex auth.json bytes).
  // Inbound only — consumed straight into the keyring, NEVER echoed back.
  bytes  credential = 5;
}

