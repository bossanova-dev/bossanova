syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "bossanova/v1/models.proto";
import "bossanova/v1/plugin.proto";
import "google/protobuf/timestamp.proto";

// DaemonService exposes the daemon's RPCs over a Unix socket for the boss CLI.
service DaemonService {
  // Context resolution
  rpc ResolveContext(ResolveContextRequest) returns (ResolveContextResponse);

  // Repo management
  rpc ValidateRepoPath(ValidateRepoPathRequest) returns (ValidateRepoPathResponse);
  rpc RegisterRepo(RegisterRepoRequest) returns (RegisterRepoResponse);
  rpc CloneAndRegisterRepo(CloneAndRegisterRepoRequest) returns (CloneAndRegisterRepoResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc RemoveRepo(RemoveRepoRequest) returns (RemoveRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  // GetRepoSettings returns the web-safe (secret-masked) settings for a repo.
  rpc GetRepoSettings(GetRepoSettingsRequest) returns (GetRepoSettingsResponse);
  rpc ListRepoPRs(ListRepoPRsRequest) returns (ListRepoPRsResponse);
  rpc ListTrackerIssues(ListTrackerIssuesRequest) returns (ListTrackerIssuesResponse);

  // Session lifecycle
  rpc CreateSession(CreateSessionRequest) returns (stream CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc AttachSession(AttachSessionRequest) returns (stream AttachSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc PauseSession(PauseSessionRequest) returns (PauseSessionResponse);
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  rpc RetrySession(RetrySessionRequest) returns (RetrySessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc MergeSession(MergeSessionRequest) returns (MergeSessionResponse);
  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc LinkSessionPR(LinkSessionPRRequest) returns (LinkSessionPRResponse);
  // SwitchSessionAccount stops the session's live chat, rebinds the session to
  // the chosen rotation account, and brings the chat back up under it —
  // resuming the prior conversation cross-account when feasible, else fresh.
  // A mid-turn (WORKING) chat is refused unless force is set (operator confirm).
  rpc SwitchSessionAccount(SwitchSessionAccountRequest) returns (SwitchSessionAccountResponse);

  // Archive / resurrect
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc ResurrectSession(ResurrectSessionRequest) returns (ResurrectSessionResponse);
  rpc EmptyTrash(EmptyTrashRequest) returns (EmptyTrashResponse);

  // Claude chat tracking
  rpc RecordChat(RecordChatRequest) returns (RecordChatResponse);
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc UpdateChatTitle(UpdateChatTitleRequest) returns (UpdateChatTitleResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  // WakeChat brings a previously-started chat back to life when its tmux
  // session has died (host reboot, manual kill, OOM). Idempotent under
  // concurrent calls via per-chat singleflight. Decides --resume vs
  // --session-id by pre-flight stat of the Claude transcript file.
  rpc WakeChat(WakeChatRequest) returns (WakeChatResponse);

  // DescribeChatLaunch returns the exact command bossd uses to launch a chat's
  // agent in its worktree, plus the daemon host. The TUI calls it when a
  // freshly-launched pane dies on startup so it can show a copy-pasteable
  // reproduction command — the usual cause is a PATH / login-shell problem that
  // only reproduces on the daemon host. Read-only: it re-derives argv via the
  // same per-agent BuildInteractiveCommand the spawn path uses.
  rpc DescribeChatLaunch(DescribeChatLaunchRequest) returns (DescribeChatLaunchResponse);

  // GetChatTranscript returns a chat's conversation and final result by routing
  // to the owning agent plugin's ReadTranscript. Request-response (pollable).
  rpc GetChatTranscript(GetChatTranscriptRequest) returns (GetChatTranscriptResponse);

  // SendChatMessage delivers a user message into a chat's live agent (waking it
  // first if asleep) by bracketed-paste, then returns. Drives follow-up turns
  // and cross-agent "second opinion" prompts without an interactive attach.
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse);

  // Chat status (cross-client heartbeat sharing)
  rpc ReportChatStatus(ReportChatStatusRequest) returns (ReportChatStatusResponse);
  rpc GetChatStatuses(GetChatStatusesRequest) returns (GetChatStatusesResponse);
  rpc GetSessionStatuses(GetSessionStatusesRequest) returns (GetSessionStatusesResponse);

  // VCS event delivery (orchestrator → daemon via webhook routing)
  rpc DeliverVCSEvent(DeliverVCSEventRequest) returns (DeliverVCSEventResponse);

  // Auth change notification (CLI → daemon)
  rpc NotifyAuthChange(NotifyAuthChangeRequest) returns (NotifyAuthChangeResponse);

  // --- Cron jobs ---

  // CreateCronJob registers a new scheduled prompt for a repo.
  rpc CreateCronJob(CreateCronJobRequest) returns (CreateCronJobResponse);

  // ListCronJobs returns cron jobs, optionally filtered by repo.
  rpc ListCronJobs(ListCronJobsRequest) returns (ListCronJobsResponse);

  // GetCronJob returns a single cron job by id.
  rpc GetCronJob(GetCronJobRequest) returns (GetCronJobResponse);

  // UpdateCronJob mutates an existing cron job. Mutable fields are optional.
  rpc UpdateCronJob(UpdateCronJobRequest) returns (UpdateCronJobResponse);

  // DeleteCronJob removes a cron job. Sessions previously spawned by it
  // have their cron_job_id reset to NULL (no cascade).
  rpc DeleteCronJob(DeleteCronJobRequest) returns (DeleteCronJobResponse);

  // RunCronJobNow fires a cron job immediately, ignoring its schedule.
  // Subject to the same overlap and concurrency-cap rules as scheduled fires.
  rpc RunCronJobNow(RunCronJobNowRequest) returns (RunCronJobNowResponse);

  // --- GitHub callbacks (BOS-467) ---

  // CreateGithubCallback registers a durable one-shot PR-event callback. The
  // server applies defaults (24h expiry, active state, lowercased repo) and
  // validates the request; lease/trigger/deliver primitives are not exposed.
  rpc CreateGithubCallback(CreateGithubCallbackRequest) returns (CreateGithubCallbackResponse);

  // ListGithubCallbacks returns callbacks matching the optional filters,
  // ordered by creation time then id for a deterministic listing.
  rpc ListGithubCallbacks(ListGithubCallbacksRequest) returns (ListGithubCallbacksResponse);

  // DeleteGithubCallback removes a callback by id. Idempotent: deleting an
  // absent id succeeds.
  rpc DeleteGithubCallback(DeleteGithubCallbackRequest) returns (DeleteGithubCallbackResponse);

  // --- Broadcasts (BOS-556) ---

  // SendBroadcast resolves a selector to an audience and records one delivery
  // per target; the worker then delivers them asynchronously with retry.
  //
  // Resolution happens ONCE, at send time, and the resolved audience is FROZEN
  // into the delivery rows. A broadcast is a message to the chats that existed
  // and matched when it was sent — never a standing subscription. A chat
  // created (or renamed, or moved to a matching repo) after the send is NOT
  // retroactively included, even while the broadcast is still un-expired and
  // deliveries are still being retried.
  //
  // Two boundary cases callers must not conflate:
  //   - Over the cap: if the selector resolves to more chats than the server's
  //     fan-out cap (MaxTargets), the RPC FAILS, naming the resolved count and
  //     the cap. It never silently truncates to the cap — a partially delivered
  //     broadcast the caller believes was complete is worse than a hard error.
  //   - Zero targets: a selector that resolves to nobody is SUCCESS with zero
  //     deliveries, not an error. "No chat currently matches" is a legitimate
  //     answer, and a coordinator broadcasting to an audience that has already
  //     finished should not have to special-case a failure.
  rpc SendBroadcast(SendBroadcastRequest) returns (SendBroadcastResponse);

  // ListBroadcasts returns broadcasts matching the optional filters, ordered by
  // creation time then id for a deterministic listing.
  rpc ListBroadcasts(ListBroadcastsRequest) returns (ListBroadcastsResponse);

  // DeleteBroadcast removes a broadcast and its deliveries by id. Idempotent:
  // deleting an absent id succeeds.
  rpc DeleteBroadcast(DeleteBroadcastRequest) returns (DeleteBroadcastResponse);

  // --- Notes (BOS-550) ---
  //
  // A note is durable free-text a run records against a repository so a later
  // sweep can harvest what was learned. Ownership is repo-scoped and the
  // session/chat are PROVENANCE only: deleting or archiving a session never
  // removes its notes, because reading notes from finished runs is the point.

  // CreateNote records a note. The server validates it (repo id required,
  // non-empty body within the size cap) and normalises tags — trimmed,
  // lowercased, de-duplicated — before storing them.
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);

  // GetNote returns a single note by id, including its tags.
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);

  // ListNotes returns notes matching the optional filters, ordered by creation
  // time then id for a deterministic listing. The tag filter is ANY-OF (a note
  // matching one listed tag is returned), not all-of.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);

  // UpdateNote mutates a note's body and/or tags. Both are optional; an unset
  // field is left alone. A SET tags field REPLACES the note's entire tag set
  // rather than merging into it — sending an empty tag list clears every tag.
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);

  // DeleteNote removes a note and its tags by id. Idempotent: deleting an
  // absent id succeeds.
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // --- Standing broadcast subscriptions (BOS-557) ---

  // CreateBroadcastSubscription registers a STANDING rule: when the owning
  // session reaches an outcome matching trigger_event, the daemon broadcasts
  // the registered message to the audience the selector resolves — resolved at
  // FIRE time, not now. It is a notification primitive, not an orchestration
  // one: it delivers a message, it does not schedule work.
  //
  // A subscription fires at most once (the store's compare-and-swap on the
  // active state is the guard) and is retired by its expiry if the session
  // never settles.
  //
  // CASCADES ARE NOT DETECTED. The broadcast a subscription fires wakes chats,
  // and those chats may themselves hold subscriptions, so subscriptions can
  // chain. There is NO cycle detection in v1: the fan-out cap (a selector
  // resolving to more chats than the cap is refused outright) and subscription
  // expiry are what bound the blast radius. A caller building a topology where
  // A's completion messages B and B's completion messages A owns that loop.
  rpc CreateBroadcastSubscription(CreateBroadcastSubscriptionRequest) returns (CreateBroadcastSubscriptionResponse);

  // ListBroadcastSubscriptions returns subscriptions matching the optional
  // filters, ordered by creation time then id for a deterministic listing. It
  // never returns the registered message body.
  rpc ListBroadcastSubscriptions(ListBroadcastSubscriptionsRequest) returns (ListBroadcastSubscriptionsResponse);

  // DeleteBroadcastSubscription retires a standing subscription by id.
  // Idempotent: deleting an absent id, or one that has already fired, been
  // canceled or expired, succeeds.
  rpc DeleteBroadcastSubscription(DeleteBroadcastSubscriptionRequest) returns (DeleteBroadcastSubscriptionResponse);

  // --- Accounts (BOS-157 rotation registry) ---

  // ListAccounts returns registry accounts, optionally filtered by provider.
  // Metadata only — credential blobs never cross the wire.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // AddAccount registers a new provider login. The credential blob travels
  // inbound only and is stored in the keyring; it is never echoed back.
  rpc AddAccount(AddAccountRequest) returns (AddAccountResponse);

  // RefreshAccount replaces the stored credential blob for an existing account.
  // The credential travels inbound only and is stored in the keyring; it is never echoed back.
  rpc RefreshAccount(RefreshAccountRequest) returns (RefreshAccountResponse);

  // UpdateAccount mutates account metadata. Mutable fields are optional
  // (present-only update semantics).
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // RemoveAccount deletes the account row and purges its keyring credential.
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);

  // TestAccount validates the account's stored credential and, when provider
  // verification is available, runs a trivial CLI invocation. It records the
  // outcome (last_test_ok_at / last_test_error) and never tears down a session.
  rpc TestAccount(TestAccountRequest) returns (TestAccountResponse);

  // --- Repair Diagnostics ---

  // RepairDoctor returns a structured health report for the auto-repair
  // pipeline: which plugins are loaded, whether the workflow is running,
  // whether `claude` is on the daemon's PATH, and a summary of recent
  // repair attempts. Surfaced via `boss repair doctor`.
  rpc RepairDoctor(RepairDoctorRequest) returns (RepairDoctorResponse);

  // StartRepairWorkflow (re-)arms the auto-repair workflow: it declares the
  // repair plugin's desired-started state (from current daemon settings) and
  // ensures the workflow is running. No-op when already RUNNING
  // (already_running=true) — a running workflow is never restarted, because
  // StartWorkflow re-entry cancels in-flight repairs. PAUSED is operator
  // intent and is also left untouched (reported in detail). Surfaced via
  // `boss repair start`.
  rpc StartRepairWorkflow(StartRepairWorkflowRequest) returns (StartRepairWorkflowResponse);

  // ListCheckSnapshots returns the daemon's per-poll record of what it
  // saw for a session's CI checks plus the DisplayStatus it computed.
  // Surfaced via `boss session checks <id>` so the operator can answer
  // "why does the TUI think this PR is passing when GitHub says
  // failing?" without re-running `gh pr checks` by hand.
  rpc ListCheckSnapshots(ListCheckSnapshotsRequest) returns (ListCheckSnapshotsResponse);

  // ListAgents returns the names + GetInfo metadata of every agent runner
  // plugin currently loaded. Used by the boss TUI to (a) decide whether to
  // show the onboarding wizard, (b) populate the new-session agent-select
  // step, (c) render the settings page's per-plugin sections.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // ListPlugins returns every plugin the daemon attempted to load this
  // run, including disabled and failed entries. Surfaced via
  // `boss plugin list` so operators can debug "did my plugin actually
  // load?" without grepping daemon logs.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);

  // --- Global Settings ---

  // GetSettings returns the TUI-editable subset of global settings
  // (settings.json): the top-level worktree/poll/tracing knobs plus each
  // configured agent's enabled flag and dynamic config map.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // UpdateSettings applies a partial update to global settings. Only the
  // optional scalar fields that are set are applied; per-agent updates upsert
  // config keys (an empty value deletes the key). Validation mirrors the boss
  // TUI settings form and the update is persisted atomically to settings.json.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

// --- Context Resolution ---

message ResolveContextRequest {
  // Working directory to resolve. If empty, uses daemon's cwd.
  string working_directory = 1;
}

message ResolveContextResponse {
  // The resolved repo, if inside a registered repo or worktree.
  optional Repo repo = 1;
  // The resolved session, if inside a session worktree.
  optional Session session = 2;
}

// --- Repo Validation ---

message ValidateRepoPathRequest {
  string local_path = 1;
}

message ValidateRepoPathResponse {
  bool is_valid = 1;           // path exists, is dir, is git repo
  string error_message = 2;    // human-readable error if not valid
  string origin_url = 3;       // detected origin remote URL
  bool is_github = 4;          // true if origin URL is github.com
  string default_branch = 5;   // detected default branch (HEAD ref)
}

// --- Repo Management ---

message RegisterRepoRequest {
  string local_path = 1;
  string display_name = 2;
  string default_base_branch = 3;
  string worktree_base_dir = 4;
  optional string setup_script = 5;
}

message RegisterRepoResponse {
  Repo repo = 1;
}

message CloneAndRegisterRepoRequest {
  string clone_url = 1;
  string local_path = 2;
  string display_name = 3;
  string default_base_branch = 4;
  string worktree_base_dir = 5;
  optional string setup_script = 6;
}

message CloneAndRegisterRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message RemoveRepoRequest {
  string id = 1;
}

message RemoveRepoResponse {}

message UpdateRepoRequest {
  string id = 1;
  optional string display_name = 2;
  optional bool can_auto_merge = 3;
  optional bool can_auto_merge_dependabot = 4;
  // 5 (can_auto_address_reviews), 6 (can_auto_resolve_conflicts), and 14
  // (can_auto_fix_checks) were per-behavior repair toggles, collapsed into
  // can_auto_repair below.
  reserved 5, 6, 14;
  optional string merge_strategy = 7;
  optional string setup_script = 8;
  // Legacy plaintext secret fields. Retained for backward-compat: a present
  // value still writes the key. When a SecretUpdate (linear_key/sentry_key
  // below) carries an action other than UNSPECIFIED/UNCHANGED, the SecretUpdate
  // wins over the legacy field for that secret.
  optional string linear_api_key = 9;
  reserved 10;
  optional string sentry_api_key = 11;
  optional string sentry_org = 12;
  reserved 13; // was sentry_project (removed: issues are listed org-wide)
  optional bool can_auto_repair = 15;
  // Tri-state secret actions (UNCHANGED/SET/CLEAR): the authoritative secret
  // surface that never blanks a key on a save that does not re-supply it.
  SecretUpdate linear_key = 16;
  SecretUpdate sentry_key = 17;
  // Optimistic-concurrency token: when set, the update is rejected (CodeAborted)
  // unless it still equals the repo's stored updated_at.
  google.protobuf.Timestamp expected_updated_at = 18;
  optional bool should_archive_sessions_after_merge = 19;
  optional bool can_auto_delete_branches = 20;
  optional bool should_keep_branches_current = 21;
}

message UpdateRepoResponse {
  Repo repo = 1;
}

message GetRepoSettingsRequest { string id = 1; }
message GetRepoSettingsResponse { RepoSettings settings = 1; }

message ListRepoPRsRequest {
  string repo_id = 1;
}

message ListRepoPRsResponse {
  repeated PRSummary pull_requests = 1;
}

message ListTrackerIssuesRequest {
  string repo_id = 1;
  string query = 2;
  // Which task source to query. "linear" (default for back-compat) | "sentry".
  optional string source = 3;
}

message ListTrackerIssuesResponse {
  repeated TrackerIssue issues = 1;
}

// --- Session Lifecycle ---

message CreateSessionRequest {
  string repo_id = 1;
  string title = 2;
  string plan = 3;
  string base_branch = 4;
  // If set, attach to an existing PR instead of creating a new one.
  optional int32 pr_number = 5;
  // If true, remove any existing branch with the same name before creating.
  bool force_branch = 6;
  // If true, run as a quick chat session (no worktree, no branch, no PR).
  bool is_quick_chat = 7;
  // Optional branch name (eg. from Linear's suggested branch name).
  optional string branch_name = 8;
  // External issue tracker fields.
  optional string tracker_id = 9;    // External issue ID (eg. "FRE-1176")
  optional string tracker_url = 10;  // URL to issue in external tracker
  // Agent plugin to run this session under. Empty → server-chosen default agent.
  optional string agent_name = 11;
  // Full selected tracker issue + source, used to format the session plan
  // server-side when plan is empty (web new-session tracker flows).
  optional TrackerIssue tracker_issue = 12;
  optional string tracker_source = 13;  // "linear" | "sentry"
  // If true, run the session's initial agent pass headlessly (codex exec /
  // claude --print) instead of leaving it idle to start interactively on
  // first attach. Set by `boss new --detach`. Default false = interactive:
  // no headless run fires, the agent starts when the user attaches.
  bool detach = 14;
  // Opaque agent model id to run this session under (e.g. an Opus id).
  // Empty → the agent plugin's default model. Mirrors `boss cron add --model`;
  // set by `boss new --model` and the MCP create_session tool.
  optional string model = 15;
  bool is_tmux_unattended = 16;
  // If true, bypass the tracker-issue dedup guard and create a second session
  // for a tracker/PR/branch that already has an active one (BOS-236 escape hatch).
  bool force = 17;
  // account_id binds the session to a rotation account. Presence matters: absent
  // applies the default-account policy; present-and-empty ("") is an explicit
  // system-default account 0 opt-out (no injected env, D9); present-and-non-empty
  // binds that account.
  optional string account_id = 18;
  // If true, create the worktree-backed session but do NOT open a draft PR up
  // front. A PR is opened only at finalize (the Stop-hook EnsurePR path) if the
  // run produces commits. Default false = unchanged eager behavior: an empty
  // draft PR is opened at session start. Meaningful only alongside
  // detach/is_tmux_unattended, which install the finalize hook; useful for
  // read-only/planning sessions. Mirrors StartSessionOpts.DeferPR (used by cron).
  bool defer_pr = 19;
}

message CreateSessionResponse {
  oneof event {
    SetupScriptOutput setup_output = 2;
    SessionCreated session_created = 3;
  }
}

message SetupScriptOutput {
  string text = 1;
}

message SessionCreated {
  Session session = 1;
  // True when this event reports an EXISTING active session that already owns
  // the requested branch/PR (the create was a dedup/attach), rather than a
  // newly created session. On the attach path the request's plan/prompt is NOT
  // run — the caller must run it in the existing session (e.g. send_chat_message).
  bool attached_existing = 2;
}

message GetSessionRequest {
  string id = 1;

  // include_local_http_endpoints opts this read into machine-local endpoint
  // hydration. Only a local Boss TUI read (Home / ChatPicker) sets it; the
  // orchestrator/RemoteClient never does. When false the response's
  // Session.http_endpoints is always empty.
  bool include_local_http_endpoints = 2;

  // client_network_namespace carries the caller's own network-namespace
  // identity (Linux: the /proc/self/ns/net symlink target). The daemon
  // hydrates endpoints only when this exactly equals its own namespace
  // identity, so a Unix socket mounted across namespaces cannot reach a
  // different service's localhost. Empty on macOS and whenever the client
  // cannot read it, which makes the daemon fail closed on Linux.
  string client_network_namespace = 3;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  // Filter by repo.
  optional string repo_id = 1;
  // Filter by state.
  repeated SessionState states = 2;
  // Include archived sessions.
  bool include_archived = 3;

  // include_local_http_endpoints opts this read into machine-local endpoint
  // hydration. Only a local Boss TUI read (Home / ChatPicker) sets it; the
  // orchestrator/RemoteClient never does. When false every returned
  // Session.http_endpoints is empty.
  bool include_local_http_endpoints = 4;

  // client_network_namespace carries the caller's own network-namespace
  // identity (Linux: the /proc/self/ns/net symlink target). See
  // GetSessionRequest.client_network_namespace — the daemon fails closed on
  // Linux unless this exactly equals its own namespace identity.
  string client_network_namespace = 5;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message AttachSessionRequest {
  string id = 1;
}

// AttachSessionResponse is streamed to the CLI while attached to a session.
message AttachSessionResponse {
  oneof event {
    // A line of Claude output.
    OutputLine output_line = 1;
    // Session state changed.
    StateChange state_change = 2;
    // Session ended (merged, closed, or blocked).
    SessionEnded session_ended = 3;
  }
}

message OutputLine {
  string text = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message StateChange {
  SessionState previous_state = 1;
  SessionState new_state = 2;
  SessionEvent trigger = 3;
}

message SessionEnded {
  SessionState final_state = 1;
  optional string reason = 2;
}

message StopSessionRequest {
  string id = 1;
}

message StopSessionResponse {
  Session session = 1;
}

message PauseSessionRequest {
  string id = 1;
}

message PauseSessionResponse {
  Session session = 1;
}

message ResumeSessionRequest {
  string id = 1;
}

message ResumeSessionResponse {
  Session session = 1;
}

message RetrySessionRequest {
  string id = 1;
}

message RetrySessionResponse {
  Session session = 1;
}

message CloseSessionRequest {
  string id = 1;
}

message CloseSessionResponse {
  Session session = 1;
}

message MergeSessionRequest {
  string id = 1;
}

message MergeSessionResponse {
  Session session = 1;
  // Human-readable note about how the merge was performed, e.g. a merge
  // strategy substitution. Empty when the merge ran exactly as configured.
  string detail = 2;
}

message RemoveSessionRequest {
  string id = 1;
}

message RemoveSessionResponse {}

message UpdateSessionRequest {
  string id = 1;
  optional string title = 2;
  optional string tracker_url = 3;  // URL to issue in external tracker
  optional string tracker_id = 4;  // external tracker identifier (e.g. BOS-123)
}

message UpdateSessionResponse {
  Session session = 1;
}

message LinkSessionPRRequest {
  string id = 1;
  string pr = 2;
}

message LinkSessionPRResponse {
  Session session = 1;
}

message SwitchSessionAccountRequest {
  string session_id = 1;
  string account_id = 2;                 // target account id; "" = system default ("account 0")
  optional string agent_session_id = 3;  // which chat to switch; if unset, the session's primary live chat
  bool force = 4;                        // interrupt a mid-turn (WORKING) chat
}

message SwitchSessionAccountResponse {
  bool resumed = 1;
  string target_label = 2;
  string notice_text = 3;
}

// --- Archive / Resurrect ---

message ArchiveSessionRequest {
  string id = 1;
}

message ArchiveSessionResponse {
  Session session = 1;
}

message ResurrectSessionRequest {
  string id = 1;
}

message ResurrectSessionResponse {
  Session session = 1;
}

message EmptyTrashRequest {
  // Only empty sessions archived before this timestamp.
  optional google.protobuf.Timestamp older_than = 1;
}

message EmptyTrashResponse {
  // Number of archived sessions permanently deleted.
  int32 deleted_count = 1;
}

// --- Claude Chat Tracking ---

message RecordChatRequest {
  string session_id = 1;
  string agent_session_id = 2;   // Agent session UUID
  string title = 3;       // First user prompt or "New chat"
  // resume signals that agent_session_id refers to an existing agent session
  // that should be resumed via the coding agent's --resume flag rather than
  // created fresh. Used by the daemon when minting the tmux session host for
  // the chat — ignored if the tmux session already exists.
  bool resume = 4;
  // agent_name overrides the per-chat agent. When unset, the chat inherits
  // the parent session's agent_name. Honored only when the named agent
  // plugin is loaded — otherwise dispatch falls back per AgentDispatcher
  // resolution rules.
  optional string agent_name = 5;
}

