  Account account = 1;   // metadata only; never the credential
}

message RefreshAccountRequest {
  string id = 1;
  // New credential blob (Claude setup-token string; Codex auth.json bytes).
  // Inbound only, consumed straight into the keyring, NEVER echoed back.
  bytes credential = 2;
  // When true, run the same validation path as TestAccount after saving.
  bool test_after_save = 3;
}

message RefreshAccountResponse {
  Account account = 1;
  bool live_smoke_ran = 2;
  string detail = 3;
}

message UpdateAccountRequest {
  string id = 1;
  optional string label    = 2;
  // Field 3 / "email" was optional informational account email metadata.
  reserved 3;
  reserved "email";
  optional int32  priority = 4;
  optional string status   = 5;   // "active" | "disabled"
  repeated string allowed_models = 6; // replaces the set when present
}

message UpdateAccountResponse {
  Account account = 1;
}

message RemoveAccountRequest {
  string id = 1;
}

message RemoveAccountResponse {}

message TestAccountRequest {
  string id = 1;
}

message TestAccountResponse {
  Account account = 1;         // updated metadata (last_test_ok_at / last_test_error)
  bool   live_smoke_ran = 2;   // true only when provider verification executed
  string detail = 3;           // human-readable outcome detail
}

// --- Repair Diagnostics ---

message RepairDoctorRequest {}

// RepairDoctorCheck is one entry in the structured health report. Each check
// has a stable name (so the CLI can render it in a fixed order with
// per-check formatting), a pass/fail bit, and a free-form detail string
// the operator reads to diagnose the failure.
message RepairDoctorCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message StartRepairWorkflowRequest {}

message StartRepairWorkflowResponse {
  // already_running is true when the workflow was RUNNING and StartWorkflow
  // was deliberately NOT re-issued.
  bool already_running = 1;
  // detail is a one-line human-readable summary (prior status, action taken).
  string detail = 2;
}

message RepairDoctorResponse {
  // The checks, in the order they should be displayed.
  repeated RepairDoctorCheck checks = 1;
  // Recent agent-log files the daemon found in the agent-logs dir, sorted
  // newest-first. The CLI shows size, mtime and the head line so the
  // operator can spot empty logs (which Phase 1a forbids) at a glance.
  repeated RepairLogSnapshot recent_logs = 2;
}

message RepairLogSnapshot {
  string path = 1;
  int64 size_bytes = 2;
  google.protobuf.Timestamp modified_at = 3;
  // First text line of the file, or empty if the file is 0 bytes. With
  // Phase 1a this should always start with "[runner] spawning claude".
  string head_line = 4;
}

// --- Check Snapshots ---

message ListCheckSnapshotsRequest {
  string session_id = 1;
  // Number of snapshots to return, newest-first. Defaults to 10 when
  // unset or zero.
  int32 limit = 2;
}

message CheckSnapshot {
  google.protobuf.Timestamp polled_at = 1;
  string head_sha = 2;
  // Raw JSON of the parsed []vcs.CheckResult slice the DisplayPoller
  // fed into ComputeDisplayStatus. The CLI renders this verbatim.
  string raw_json = 3;
  // The DisplayStatus enum int the poller resolved for this snapshot.
  DisplayStatus computed_status = 4;
}

message ListCheckSnapshotsResponse {
  repeated CheckSnapshot snapshots = 1;
}

// --- Agent Listing ---

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message AgentInfo {
  string name = 1;
  string version = 2;
  // user_settings imported from plugin.proto.
  repeated UserSetting user_settings = 3;
}

// --- Installed Plugins ---

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated InstalledPlugin plugins = 1;
}

// InstalledPlugin describes a single entry from the daemon's plugin
// configuration along with its current load state. Both successfully
// loaded and failed plugins are returned so operators can see typos in
// `path` (load_failed) or accidental disables (status=disabled).
message InstalledPlugin {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_LOADED = 1;       // plugin process is running
    STATUS_DISABLED = 2;     // configured with enabled=false
    STATUS_LOAD_FAILED = 3;  // start attempted but errored
  }

  string name = 1;
  string path = 2;
  bool enabled = 3;
  Status status = 4;
  // capabilities is the set of plugin interfaces the daemon dispensed
  // for this plugin: "agent", "workflow", "task_source". Empty for
  // disabled or failed plugins.
  repeated string capabilities = 5;
  // error is populated when status == STATUS_LOAD_FAILED and carries
  // the underlying go-plugin handshake / spawn error.
  string error = 6;
}

// --- Global Settings ---

message GetSettingsRequest {}

message GetSettingsResponse {
  GlobalSettings settings = 1;
}

// GlobalSettings is the TUI-editable subset of settings.json — the fields the
// boss settings form edits — plus one AgentSettings entry per configured agent
// plugin. Non-editable bookkeeping fields (app_data_dir, socket_path, skills,
// managed_accounts, …) are intentionally out of scope.
message GlobalSettings {
  string worktree_base_dir      = 1;
  int32  poll_interval_seconds  = 2;   // 0 = default (30 at read)
  string default_agent          = 3;
  bool   event_tracing_enabled  = 4;
  bool   error_tracking_enabled = 5;
  string posthog_project_token  = 6;
  string posthog_host           = 7;
  repeated AgentSettings agents = 8;
}

// AgentSettings mirrors a PluginConfig entry: the agent's enabled flag plus its
// untyped dynamic config map. The map mirrors on-disk storage (bool kept as
// "true", enum/string stored as-is; an absent key is the zero value).
message AgentSettings {
  string name = 1;
  bool   enabled = 2;
  map<string, string> config = 3;
}

message UpdateSettingsRequest {
  optional string worktree_base_dir      = 1;
  optional int32  poll_interval_seconds  = 2;   // 0 = clear (default 30)
  optional string default_agent          = 3;
  optional bool   event_tracing_enabled  = 4;
  optional bool   error_tracking_enabled = 5;
  optional string posthog_project_token  = 6;
  optional string posthog_host           = 7;
  repeated AgentSettingsUpdate agents    = 8;   // per-agent partial updates
}

// AgentSettingsUpdate carries a per-agent partial update. enabled is applied
// only when present; each config entry is an upsert where an empty value
// deletes the key (matching SetPluginConfigString/Bool semantics).
message AgentSettingsUpdate {
  string name = 1;
  optional bool enabled = 2;
  map<string, string> config = 3;
}

message UpdateSettingsResponse {
  GlobalSettings settings = 1;
}
