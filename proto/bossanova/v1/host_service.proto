syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "bossanova/v1/models.proto";
import "google/protobuf/timestamp.proto";

// HostService is served by the daemon and called by plugins to access VCS data.
// This enables the bidirectional gRPC pattern where the plugin can query the
// daemon's VCS provider without needing direct GitHub/GitLab credentials.
service HostService {
  // ListOpenPRs returns all open pull requests for a repository.
  rpc ListOpenPRs(ListOpenPRsRequest) returns (ListOpenPRsResponse);

  // GetCheckResults returns CI check results for a pull request.
  rpc GetCheckResults(GetCheckResultsRequest) returns (GetCheckResultsResponse);

  // GetPRStatus returns the current status of a pull request.
  rpc GetPRStatus(GetPRStatusRequest) returns (GetPRStatusResponse);

  // ListClosedPRs returns recently-closed (not merged) pull requests.
  rpc ListClosedPRs(ListClosedPRsRequest) returns (ListClosedPRsResponse);

  // --- Session & Event Management (plugin → daemon) ---

  // ListSessions returns all active sessions with hydrated display status.
  rpc ListSessions(HostServiceListSessionsRequest) returns (HostServiceListSessionsResponse);

  // GetReviewComments returns review comments on a pull request.
  rpc GetReviewComments(GetReviewCommentsRequest) returns (GetReviewCommentsResponse);

  // FireSessionEvent fires a state machine event on a session.
  rpc FireSessionEvent(FireSessionEventRequest) returns (FireSessionEventResponse);

  // SetRepairStatus sets or clears the is_repairing flag for a session.
  rpc SetRepairStatus(SetRepairStatusRequest) returns (SetRepairStatusResponse);

  // --- Agent Execution (called by repair plugin) ---

  // StartAgentRun spawns an agent run for the given session. The daemon
  // resolves the worktree path and bossd-owned log path internally and
  // forwards to the loaded AgentRunner plugin. Returns the resolved
  // session ID. Names use the "Host" suffix to avoid clashing with
  // AgentRunnerService.StartRun's StartAgentRunRequest in plugin.proto.
  rpc StartAgentRun(StartAgentRunHostRequest) returns (StartAgentRunHostResponse);

  // WaitAgentRun blocks until the named agent run exits. Returns the exit
  // error message (empty on clean exit).
  rpc WaitAgentRun(WaitAgentRunHostRequest) returns (WaitAgentRunHostResponse);

  // StartChatRun spawns an agent run for the given session inside a tmux
  // session, creates an agent_chats row so the run is visible in the chat
  // list, and configures a run-scoped Stop-hook so the daemon receives a
  // completion callback. Use this instead of StartAgentRun when the run
  // should be operator-attachable (eg. /boss-repair).
  rpc StartChatRun(StartChatRunHostRequest) returns (StartChatRunHostResponse);

  // WaitChatRun blocks until the agent run identified by agent_session_id
  // completes (claude Stop hook fires) or until a 30-minute deadline elapses.
  // Returns the exit error message reported by the hook payload (empty on
  // clean exit). On deadline, returns a synthetic exit error and cleans up
  // the run state so a future call doesn't deadlock.
  rpc WaitChatRun(WaitChatRunHostRequest) returns (WaitChatRunHostResponse);

  // ReclaimRepairChat kills and detaches one daemon-validated Repair chat that
  // is blocking a fresh StartChatRun attempt after daemon restart. The daemon
  // only reclaims rows whose title starts with "Repair:" and whose session_id
  // matches the request.
  rpc ReclaimRepairChat(ReclaimRepairChatHostRequest) returns (ReclaimRepairChatHostResponse);

  // RecordRepairOutcome persists the result of a repair attempt onto the
  // session row so the TUI can surface "last repair: claude not in PATH (3×)"
  // hints alongside the existing display status. Called by the repair
  // plugin's deferred cleanup so every attempt — clean exit, agent error,
  // or runner-level failure — leaves a structured trace in SQLite that
  // outlives the in-memory cooldowns map.
  rpc RecordRepairOutcome(RecordRepairOutcomeRequest) returns (RecordRepairOutcomeResponse);
}

// --- ListOpenPRs ---

message ListOpenPRsRequest {
  // Repository origin URL (eg. "https://github.com/owner/repo").
  string repo_origin_url = 1;
}

message ListOpenPRsResponse {
  repeated PRSummary prs = 1;
}

// --- GetCheckResults ---

message GetCheckResultsRequest {
  // Repository origin URL.
  string repo_origin_url = 1;
  // Pull request number.
  int32 pr_number = 2;
}

message GetCheckResultsResponse {
  repeated CheckResult checks = 1;
}

// --- GetPRStatus ---

message GetPRStatusRequest {
  // Repository origin URL.
  string repo_origin_url = 1;
  // Pull request number.
  int32 pr_number = 2;
}

message GetPRStatusResponse {
  PRStatus status = 1;
}

// --- ListClosedPRs ---

message ListClosedPRsRequest {
  // Repository origin URL (eg. "https://github.com/owner/repo").
  string repo_origin_url = 1;
}

message ListClosedPRsResponse {
  repeated PRSummary prs = 1;
}

// --- ListSessions ---

// HostServiceListSessionsRequest is currently empty as it lists all sessions.
message HostServiceListSessionsRequest {}

message HostServiceListSessionsResponse {
  repeated Session sessions = 1;
}

// --- GetReviewComments ---

message GetReviewCommentsRequest {
  // Repository origin URL.
  string repo_origin_url = 1;
  // Pull request number.
  int32 pr_number = 2;
}

message GetReviewCommentsResponse {
  repeated ReviewComment comments = 1;
}

// --- FireSessionEvent ---

message FireSessionEventRequest {
  // Session ID to fire event on.
  string session_id = 1;
  // Event to fire.
  SessionEvent event = 2;
}

message FireSessionEventResponse {
  // New state after firing the event.
  string new_state = 1;
}

// --- SetRepairStatus ---

message SetRepairStatusRequest {
  // Session ID to set repair status on.
  string session_id = 1;
  // Whether the session is currently being repaired.
  bool is_repairing = 2;
}

message SetRepairStatusResponse {}

// --- StartAgentRun ---

message StartAgentRunHostRequest {
  // Session ID whose worktree should host the run.
  string session_id = 1;
  // Prompt to feed the agent.
  string prompt = 2;
}

message StartAgentRunHostResponse {
  // Resolved session ID returned by the loaded AgentRunner plugin.
  string agent_session_id = 1;
}

// --- WaitAgentRun ---

message WaitAgentRunHostRequest {
  // Session ID returned from StartAgentRun (the agent's session ID).
  string agent_session_id = 1;
}

message WaitAgentRunHostResponse {
  // Empty on clean exit, otherwise the agent's exit error string.
  string exit_error = 1;
}

// --- StartChatRun ---

message StartChatRunHostRequest {
  // Session ID whose worktree should host the run.
  string session_id = 1;
  // Raw prompt to feed the agent (typed as a bracketed paste into the tmux pane).
  // Mutually exclusive with command.
  string prompt = 2;
  // Chat title surfaced in the chat list (eg. `Repair: <session>` or
  // `Run "<cron>"`).
  string title = 3;
  // Boss command name without any agent-specific prefix (eg. "boss-repair").
  // The daemon formats it using the loaded AgentRunner plugin's command_prefix.
  // Mutually exclusive with prompt.
  string command = 4;

  // When true, bossd may replace an existing live chat in the same session
  // before starting this run. Used by auto-repair only after its idle gate
  // has already decided the existing chat is safe to interrupt.
  bool replace_existing_chat = 5;

  // Durable reason written to the replaced chat row.
  string replace_existing_reason = 6;

  // Last chat activity observed by the repair plugin when it decided the
  // blocking chat was idle. bossd refuses replacement if the current blocking
  // chat has produced newer output since that snapshot.
  google.protobuf.Timestamp replace_existing_observed_last_chat_activity_at = 7;

  // When set, resume this prior agent session (claude `--resume <id>`) instead
  // of starting a fresh one, so the agent retains the history of earlier
  // attempts. Used by auto-repair to make each loop iteration continue the
  // previous iteration's conversation. Empty = fresh start.
  string resume_agent_session_id = 8;
}

message StartChatRunHostResponse {
  // Resolved agent session ID returned by the loaded AgentRunner plugin.
  string agent_session_id = 1;
}

// --- WaitChatRun ---

message WaitChatRunHostRequest {
  // Agent session ID returned from StartChatRun.
  string agent_session_id = 1;

  // When > 0, arm an idle watchdog: if the chat tracker reports the run
  // continuously idle (or a repair-owned QUESTION stuck past its window, or
  // STOPPED) for this many seconds, WaitChatRun fast-fails the run and tears
  // the dead pane down instead of burning the full 30m deadline.
  // 0 = no watchdog (legacy 30m-deadline behavior).
  int32 idle_fail_after_seconds = 2;
}

message WaitChatRunHostResponse {
  // Empty on clean exit, otherwise the exit error from the hook payload
  // or a synthetic message when the wait deadline elapsed.
  string exit_error = 1;
  // Provider-owned resume/session UUID, when the agent reports one. Empty means
  // callers should resume using agent_session_id.
  string provider_session_id = 2;
}

// --- ReclaimRepairChat ---

message ReclaimRepairChatHostRequest {
  // Session whose repair attempt is blocked.
  string session_id = 1;
  // Existing agent session ID from the StartChatRun AlreadyExists message.
  string agent_session_id = 2;
  // Human-readable diagnostic stored on the reclaimed chat row.
  string reason = 3;
}

message ReclaimRepairChatHostResponse {
  // True when a tmux session was killed or an already-dead tmux reference was
  // detached from the chat row.
  bool reclaimed = 1;
  // The tmux session name that was detached, empty when the row had none.
  string tmux_session_name = 2;
}

// --- RecordRepairOutcome ---

message RecordRepairOutcomeRequest {
  string session_id = 1;
  // Wall-clock time of the StartAgentRun that drove this attempt.
  int64 started_at_unix = 2;
  // Non-empty when the daemon's StartAgentRun / claude plugin runner
  // refused to spawn (eg. "claude not on PATH"). Mutually exclusive with
  // exit_error in practice.
  string runner_error = 3;
  // Non-empty when the agent ran but exited non-zero / signalled.
  string exit_error = 4;
  // Agent-side session ID, useful for cross-referencing the agent log.
  string agent_session_id = 5;
  // Head SHA and display status this repair attempt targeted. Used to avoid
  // rerunning the same agent repair forever after a non-zero agent exit.
  string head_sha = 6;
  DisplayStatus display_status = 7;
  // Fingerprint of review feedback this repair attempt targeted.
  // Empty for non-review-triggered repairs.
  optional string review_fingerprint = 8;
  // Non-empty when the daemon refused to start the repair chat (a
  // FailedPrecondition displace/reclaim refusal). Routes the outcome into
  // the blocked lane: the reason + timestamp are recorded for operator
  // visibility, but last_repair_attempt_count and the runner/exit error
  // fields are left untouched, so a start-refusal never counts as a repair
  // failure or feeds the exponential backoff.
  string blocked_reason = 9;
}

message RecordRepairOutcomeResponse {}
