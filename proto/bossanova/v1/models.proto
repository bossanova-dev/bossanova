syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "google/protobuf/timestamp.proto";

// SessionState represents the 14 states of the session lifecycle.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_CREATING_WORKTREE = 1;
  SESSION_STATE_STARTING_AGENT = 2;
  SESSION_STATE_PUSHING_BRANCH = 3;
  SESSION_STATE_OPENING_DRAFT_PR = 4;
  SESSION_STATE_IMPLEMENTING_PLAN = 5;
  SESSION_STATE_AWAITING_CHECKS = 6;
  SESSION_STATE_FIXING_CHECKS = 7;
  SESSION_STATE_GREEN_DRAFT = 8;
  SESSION_STATE_READY_FOR_REVIEW = 9;
  SESSION_STATE_BLOCKED = 10;
  SESSION_STATE_MERGED = 11;
  SESSION_STATE_CLOSED = 12;
  SESSION_STATE_FINALIZING = 13;
  // ORPHANED: a headless (boss new --detach) run killed mid-flight by a daemon
  // restart — no recorded exit, no live agent process. Distinct from GREEN_DRAFT
  // so its bootstrap-only PR is never surfaced as green.
  SESSION_STATE_ORPHANED = 14;
}

// SessionEvent represents the 16 events that trigger state transitions.
enum SessionEvent {
  SESSION_EVENT_UNSPECIFIED = 0;
  SESSION_EVENT_WORKTREE_CREATED = 1;
  SESSION_EVENT_AGENT_STARTED = 2;
  SESSION_EVENT_BRANCH_PUSHED = 3;
  SESSION_EVENT_PR_OPENED = 4;
  SESSION_EVENT_PLAN_COMPLETE = 5;
  SESSION_EVENT_CHECKS_PASSED = 6;
  SESSION_EVENT_CHECKS_FAILED = 7;
  SESSION_EVENT_CONFLICT_DETECTED = 8;
  SESSION_EVENT_REVIEW_SUBMITTED = 9;
  SESSION_EVENT_FIX_COMPLETE = 10;
  SESSION_EVENT_FIX_FAILED = 11;
  SESSION_EVENT_BLOCK = 12;
  SESSION_EVENT_UNBLOCK = 13;
  SESSION_EVENT_PR_MERGED = 14;
  SESSION_EVENT_PR_CLOSED = 15;
  SESSION_EVENT_FINALIZE_REQUESTED = 16;
}

// RotationTrigger says why a rotation decision was evaluated. (BOS-176)
enum RotationTrigger {
  ROTATION_TRIGGER_UNSPECIFIED = 0;
  ROTATION_TRIGGER_USAGE_LIMITED = 1;    // usage-cap banner / ErrUsageLimited
  ROTATION_TRIGGER_AUTH_INVALIDATED = 2; // auth failure treated as rotation signal
  ROTATION_TRIGGER_MANUAL = 3;           // user-initiated switch (E3/3.3)
}

// RotationOutcome says what the rotation engine decided. (BOS-176)
enum RotationOutcome {
  ROTATION_OUTCOME_UNSPECIFIED = 0;
  ROTATION_OUTCOME_ROTATED = 1;                   // swapped to to_account and resumed
  ROTATION_OUTCOME_STATUS_ONLY_DISABLED = 2;      // kill-switch off: status set, no swap
  ROTATION_OUTCOME_STATUS_ONLY_NO_CAPABILITY = 3; // agent lacks rotation capability
  ROTATION_OUTCOME_EXHAUSTED = 4;                 // all accounts cooling: parked until reset_at
  ROTATION_OUTCOME_FAILED = 5;                    // swap attempted and failed
  ROTATION_OUTCOME_STATUS_ONLY_NO_ELIGIBLE_ACCOUNT = 6; // no eligible account to rotate to (enable/re-auth one)
}

// RotationEvent is one audit record of a rotation decision (BOS-176).
// Account fields carry labels/ids only — never credentials.
message RotationEvent {
  string id = 1;
  string session_id = 2;
  string chat_id = 3; // empty for headless runs
  string provider = 4; // "claude" | "codex" | …
  RotationTrigger trigger = 5;
  string from_account = 6; // account label (or id when label empty)
  string to_account = 7;   // empty unless outcome == ROTATED
  optional google.protobuf.Timestamp reset_at = 8; // parsed reset / min cooldown
  RotationOutcome outcome = 9;
  string detail = 10; // short human line, e.g. "resets 15:00"; no secrets
  google.protobuf.Timestamp created_at = 11;
}

// CheckStatus represents the status of a CI check run.
enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_QUEUED = 1;
  CHECK_STATUS_IN_PROGRESS = 2;
  CHECK_STATUS_COMPLETED = 3;
}

// CheckConclusion represents the conclusion of a completed CI check.
enum CheckConclusion {
  CHECK_CONCLUSION_UNSPECIFIED = 0;
  CHECK_CONCLUSION_SUCCESS = 1;
  CHECK_CONCLUSION_FAILURE = 2;
  CHECK_CONCLUSION_NEUTRAL = 3;
  CHECK_CONCLUSION_CANCELLED = 4;
  CHECK_CONCLUSION_SKIPPED = 5;
  CHECK_CONCLUSION_TIMED_OUT = 6;
}

// ChecksOverall represents the aggregate status of all checks on a PR.
enum ChecksOverall {
  CHECKS_OVERALL_UNSPECIFIED = 0;
  CHECKS_OVERALL_PENDING = 1;
  CHECKS_OVERALL_PASSED = 2;
  CHECKS_OVERALL_FAILED = 3;
}

// PRState represents the state of a pull request.
enum PRState {
  PR_STATE_UNSPECIFIED = 0;
  PR_STATE_OPEN = 1;
  PR_STATE_CLOSED = 2;
  PR_STATE_MERGED = 3;
}

// ReviewState represents the state of a PR review.
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_APPROVED = 1;
  REVIEW_STATE_CHANGES_REQUESTED = 2;
  REVIEW_STATE_COMMENTED = 3;
  REVIEW_STATE_DISMISSED = 4;
}

// AttemptTrigger represents what triggered a fix attempt.
enum AttemptTrigger {
  ATTEMPT_TRIGGER_UNSPECIFIED = 0;
  ATTEMPT_TRIGGER_CHECK_FAILURE = 1;
  ATTEMPT_TRIGGER_CONFLICT = 2;
  ATTEMPT_TRIGGER_REVIEW_FEEDBACK = 3;
}

// AttemptResult represents the outcome of a fix attempt.
enum AttemptResult {
  ATTEMPT_RESULT_UNSPECIFIED = 0;
  ATTEMPT_RESULT_SUCCESS = 1;
  ATTEMPT_RESULT_FAILED = 2;
  ATTEMPT_RESULT_INCOMPLETE = 3;
}

// --- Domain Types ---

// Repo represents a registered Git repository.
message Repo {
  string id = 1;
  string display_name = 2;
  string local_path = 3;
  string origin_url = 4;
  string default_base_branch = 5;
  string worktree_base_dir = 6;
  optional string setup_script = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool can_auto_merge = 10;
  bool can_auto_merge_dependabot = 11;
  // 12 (can_auto_address_reviews), 13 (can_auto_resolve_conflicts), and 20
  // (can_auto_fix_checks) were per-behavior repair toggles. They gated the
  // removed in-process FixLoop and never reached the repair plugin, so they were
  // collapsed into the single can_auto_repair flag below.
  reserved 12, 13, 20;
  string merge_strategy = 14;
  // Whether the daemon's repair plugin may automatically repair this repo's PRs
  // (failing checks, merge conflicts, review feedback). Honored by the plugin.
  // Defaults on.
  bool can_auto_repair = 21;
  // Whether the daemon automatically archives a session once its PR is merged.
  // Honored by the session dispatcher on the PR-merged transition. Defaults on.
  bool archive_sessions_after_merge = 22;
  string linear_api_key = 15;
  reserved 16;
  // Sentry credentials. Mirrors linear_api_key: a Sentry auth token alone can't
  // address an organization, so the org slug is stored alongside it. Issues are
  // listed org-wide (across every project), so no project slug is needed.
  string sentry_api_key = 17;
  string sentry_org = 18;
  reserved 19; // was sentry_project (removed: issues are listed org-wide)
}

// MergeStrategy is the merge method used when auto-merging PRs. Mirrors the
// domain values in lib/bossalib/models (merge / rebase / squash).
enum MergeStrategy {
  MERGE_STRATEGY_UNSPECIFIED = 0;
  MERGE_STRATEGY_MERGE = 1;
  MERGE_STRATEGY_REBASE = 2;
  MERGE_STRATEGY_SQUASH = 3;
}

// SecretAction is the tri-state applied to a secret field on update.
// UNSPECIFIED is treated as UNCHANGED (safe default for a default-constructed
// message); SET replaces the value; CLEAR removes it.
enum SecretAction {
  SECRET_ACTION_UNSPECIFIED = 0;
  SECRET_ACTION_UNCHANGED = 1;
  SECRET_ACTION_SET = 2;
  SECRET_ACTION_CLEAR = 3;
}

// SecretUpdate carries a secret mutation. value is required iff action == SET
// and is ignored otherwise. Never populated on read/aggregate responses.
message SecretUpdate {
  SecretAction action = 1;
  optional string value = 2;
}

// RepoSettings is the web-safe projection of a Repo: non-secret fields plus
// has_* booleans that report whether a secret is present. It NEVER carries a
// plaintext key. Mirrors the masking done by DaemonRepoRef.
message RepoSettings {
  string id = 1;
  string display_name = 2;
  optional string setup_script = 3;
  MergeStrategy merge_strategy = 4;
  bool can_auto_merge = 5;
  bool can_auto_merge_dependabot = 6;
  bool can_auto_repair = 7;
  string sentry_org = 8;
  bool has_linear_key = 9;
  bool has_sentry_key = 10;
  google.protobuf.Timestamp updated_at = 11; // echoed for optimistic concurrency
}

// Session represents a coding-agent session.
message Session {
  string id = 1;
  string repo_id = 2;
  string title = 3;
  string plan = 4;
  string worktree_path = 5;
  string branch_name = 6;
  string base_branch = 7;
  SessionState state = 8;
  optional string agent_session_id = 9;
  optional int32 pr_number = 10;
  optional string pr_url = 11;
  ChecksOverall last_check_state = 12;
  bool automation_enabled = 13;
  int32 attempt_count = 14;
  optional string blocked_reason = 15;
  optional google.protobuf.Timestamp archived_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;

  // Denormalized repo display name, populated server-side for convenience.
  string repo_display_name = 19;

  // PR display status, hydrated server-side from the PR display tracker.
  DisplayStatus display_status = 20;
  bool display_has_failures = 21;
  bool display_has_changes_requested = 23;

  // Attention status, hydrated server-side from session state.
  optional AttentionStatus attention_status = 22;

  // Whether this session is currently being repaired by the repair plugin.
  bool display_is_repairing = 24;

  // Workflow display fields, hydrated server-side from active workflows.
  WorkflowStatus workflow_display_status = 25;
  int32 workflow_display_leg = 26;
  int32 workflow_display_max_legs = 27;

  // Whether the session has an active Claude Code chat process (heartbeat-tracked).
  bool has_active_chat = 28;

  // External issue tracker fields (eg. Linear, Jira).
  optional string tracker_id = 29;   // External issue ID (eg. "FRE-1176")
  optional string tracker_url = 30;  // URL to issue in external tracker

  // tmux session name for persistent terminal sessions.
  optional string tmux_session_name = 31;

  // Head commit SHA of the PR, used by repair plugin to skip duplicate repairs.
  string pr_display_head_sha = 32;

  // Composite display fields, computed by bossd's DisplayStatusComputer and
  // persisted so every client (TUI, web, future consumers) renders the same
  // label/intent/spinner verbatim — including when bosso falls back to its
  // own DB while the originating bossd is offline.
  string display_label = 33;          // eg. "working", "checking", "running 2/4", "? question", "stopped"
  DisplayIntent display_intent = 34;  // semantic meaning; clients map to styling
  bool display_spinner = 35;          // whether to render the spinner glyph

  // Transfer coordination markers used by the coordinated TransferSession
  // protocol (see docs/plans/2026-04-24-reverse-stream-daemon-model.md,
  // decision #14). When set, the session is hidden from ListForUser on the
  // orchestrator until the transfer protocol completes.
  string transferring_to = 36;    // empty if not transferring out
  string transferring_from = 37;  // empty if not transferring in

  // Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
  string agent_name = 38;

  // Last repair-attempt diagnostics, persisted by the repair plugin via
  // RecordRepairOutcome so the TUI can surface "failing ⚠ repair: claude
  // not in PATH (3×)" hints. Both error fields are empty for clean runs;
  // runner_error means StartAgentRun never produced a process (eg. claude
  // not on PATH), exit_error means the agent ran but exited non-zero.
  // last_repair_attempt_count is a *consecutive-failure* counter: clean
  // runs reset it to zero, failed runs increment it. Total attempts are
  // not tracked.
  optional google.protobuf.Timestamp last_repair_started_at = 39;
  string last_repair_runner_error = 40;
  string last_repair_exit_error = 41;
  int32 last_repair_attempt_count = 42;
  string last_repair_head_sha = 44;
  DisplayStatus last_repair_display_status = 45;

  // Last time any of the session's live chat processes produced output.
  // Populated server-side from the chat tracker — the max LastOutputAt across
  // all of the session's chat tracker entries whose heartbeat is fresh
  // (within StaleThreshold). Empty when no chat is live. The repair plugin
  // uses this to gate auto-repair: an interactive chat that hasn't produced
  // output for `idle_repair_threshold_minutes` is treated as idle, so repair
  // can proceed even though the claude process is still attached.
  optional google.protobuf.Timestamp last_chat_activity_at = 43;

  // Denormalized repo origin URL, populated server-side for webhook routing.
  string repo_origin_url = 46;

  // Fingerprint of review feedback targeted by the last repair run.
  // Empty for non-review-triggered repairs and for legacy rows.
  string last_repair_review_fingerprint = 47;

  // True while the repo's setup script is running during session creation
  // (the "initializing" display status). Transport-only: hydrated server-side
  // from the in-memory DisplayTracker and never persisted. Mirrors
  // display_is_repairing (field 24).
  bool display_setting_up = 48;

  // Denormalized repo.can_auto_repair, populated server-side so the repair
  // plugin can honor the per-repo auto-repair toggle without a separate lookup.
  bool repo_can_auto_repair = 49;

  // Why the repo's configured setup script failed during worktree creation.
  // A setup-script failure is non-fatal — the session still starts — so this
  // flags the degraded state for `boss show <id>` and the TUI. Empty for clean
  // runs or repos with no setup script.
  string setup_error = 50;

  // Blocked-refusal lane: set when the daemon refused to START a repair chat
  // (a FailedPrecondition displace/reclaim refusal) rather than running one.
  // Recorded for operator visibility without bumping last_repair_attempt_count
  // or the runner/exit error fields. Cleared on every real repair outcome, so
  // a non-empty reason IS the latest repair-related state.
  string last_repair_blocked_reason = 51;
  optional google.protobuf.Timestamp last_repair_blocked_at = 52;

  // True while a single-repairer lease is held for this session — i.e. a repair
  // chat has started and its post-repair status has not yet been assessed.
  // Transport-only: hydrated server-side from the in-memory RepairLeaseManager
  // and never persisted. Distinct from display_is_repairing (field 24), which
  // is a best-effort display flag; repair_active is the authoritative,
  // lease-backed signal a dispatcher (boss-epic driver, /boss-repair, plugin
  // sweep) reads to defer to an already-active repairer without racing.
  bool repair_active = 53;

  // PR mergeability, hydrated server-side from the display poller's PR fetch so
  // a conflict-after-green is detectable without attempting a merge. Unset when
  // unknown/not yet polled; true = mergeable; false = conflicting. Transport-
  // only, never persisted.
  optional bool pr_mergeable = 54;

  // Structured reason a session's PR cannot currently be merged, hydrated on
  // get_session/list_sessions from the daemon's display tracker. Lets an
  // unattended driver (boss-epic) decide repair-vs-proceed without scraping tmux.
  MergeBlock merge_block = 55;

  // Most-recent real agent output across the session's chats; advances on
  // genuine output, NOT pane mtime. Absent when never observed.
  optional google.protobuf.Timestamp last_agent_activity_at = 56;

  // account_id binds the session to a rotation account; empty/absent =
  // system-default account 0 (no injected env, D9).
  optional string account_id = 57;

  // account_label is the server-resolved human label for account_id ("Unmanaged
  // local credentials" when unbound); read-only, non-secret.
  optional string account_label = 58;

  // Recent rotation audit events (newest first, capped server-side at 10),
  // hydrated by bossd like the display_* fields so TUI/web render history,
  // the exhausted badge, and toasts from one field. (BOS-176)
  repeated RotationEvent rotation_events = 59;

  // True while a PR merge (MergeSession) is in flight. Transport-only: hydrated
  // server-side from the in-memory DisplayTracker and never persisted. Drives
  // the transient blue "merging" display status. Distinct from
  // display_is_repairing (24) / display_setting_up (48).
  bool display_merging = 60;

  // Denormalized repo.archive_sessions_after_merge, populated server-side by
  // GetSession so the TUI session-detail view can show an "Archiving…" status
  // and know a merged session is about to be auto-archived (BOS-46 follow-up).
  bool repo_archive_sessions_after_merge = 61;
}

// DisplayIntent represents the semantic meaning of a session's display
// status. Clients map intent to styling (color, weight, etc.) — the proto
// itself stays presentation-agnostic.
enum DisplayIntent {
  DISPLAY_INTENT_UNSPECIFIED = 0;
  DISPLAY_INTENT_SUCCESS = 1;
  DISPLAY_INTENT_WARNING = 2;
  DISPLAY_INTENT_DANGER = 3;
  DISPLAY_INTENT_MUTED = 4;
  DISPLAY_INTENT_INFO = 5;
}

// Attempt represents a fix attempt within a session.
message Attempt {
  string id = 1;
  string session_id = 2;
  AttemptTrigger trigger = 3;
  AttemptResult result = 4;
  optional string error = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// --- VCS-Agnostic Types ---

// PRStatus represents the current status of a pull request.
message PRStatus {
  PRState state = 1;
  optional bool mergeable = 2;
  string title = 3;
  string head_branch = 4;
  string base_branch = 5;
}

// CheckResult represents the result of a single CI check.
message CheckResult {
  string id = 1;
  string name = 2;
  CheckStatus status = 3;
  optional CheckConclusion conclusion = 4;
}

// ReviewComment represents a review comment on a PR.
message ReviewComment {
  string author = 1;
  string body = 2;
  ReviewState state = 3;
  optional string path = 4;
  optional int32 line = 5;
}

// PRSummary is a lightweight representation of a PR for listing.
message PRSummary {
  int32 number = 1;
  string title = 2;
  string head_branch = 3;
  PRState state = 4;
  string author = 5;
}

// CreatePROpts contains options for creating a new pull request.
message CreatePROpts {
  string repo_path = 1;
  string head_branch = 2;
  string base_branch = 3;
  string title = 4;
  string body = 5;
  bool draft = 6;
}

// PRInfo is the result of creating a pull request.
message PRInfo {
  int32 number = 1;
  string url = 2;
}

// TrackerIssue represents an issue from an external tracker (Linear, Jira, etc.).
message TrackerIssue {
  string external_id = 1;      // eg. "ENG-123"
  string title = 2;
  string description = 3;
  string branch_name = 4;       // Suggested branch name from tracker
  string url = 5;               // Link to issue in tracker
  string state = 6;             // eg. "In Progress", "Todo"
  int32 pr_number = 7;          // Existing PR if found (0 = none)
  string existing_branch = 8;   // Existing branch if found
}

// --- VCS Events ---

// VCSEvent wraps all possible VCS events in a oneof.
message VCSEvent {
  oneof event {
    ChecksPassedEvent checks_passed = 1;
    ChecksFailedEvent checks_failed = 2;
    ConflictDetectedEvent conflict_detected = 3;
    ReviewSubmittedEvent review_submitted = 4;
    PRMergedEvent pr_merged = 5;
    PRClosedEvent pr_closed = 6;
  }
}

message ChecksPassedEvent {
  int32 pr_id = 1;
}

message ChecksFailedEvent {
  int32 pr_id = 1;
  repeated CheckResult failed_checks = 2;
}

message ConflictDetectedEvent {
  int32 pr_id = 1;
}

message ReviewSubmittedEvent {
  int32 pr_id = 1;
  repeated ReviewComment comments = 2;
}

message PRMergedEvent {
  int32 pr_id = 1;
}

message PRClosedEvent {
  int32 pr_id = 1;
}

// AttentionReason represents why a session needs human attention.
enum AttentionReason {
  ATTENTION_REASON_UNSPECIFIED = 0;
  ATTENTION_REASON_BLOCKED_MAX_ATTEMPTS = 1;
  ATTENTION_REASON_AWAITING_HUMAN_INPUT = 2;
  ATTENTION_REASON_REVIEW_REQUESTED = 3;
  ATTENTION_REASON_MERGE_CONFLICT_UNRESOLVABLE = 4;
  // Agent emitted a login-required signal ("Not logged in" / "Please run
  // /login"); driver should trigger login-rotation recovery.
  ATTENTION_REASON_AGENT_AUTH_FAILED = 5;
}

// AttentionStatus represents whether and why a session needs human attention.
message AttentionStatus {
  bool needs_attention = 1;
  AttentionReason reason = 2;
  string summary = 3;
  google.protobuf.Timestamp since = 4;
}

// DisplayStatus represents the unified display status for a session in the TUI.
enum DisplayStatus {
  DISPLAY_STATUS_UNSPECIFIED = 0;
  DISPLAY_STATUS_IDLE = 1;
  DISPLAY_STATUS_CHECKING = 2;
  DISPLAY_STATUS_FAILING = 3;
  DISPLAY_STATUS_CONFLICT = 4;
  DISPLAY_STATUS_REJECTED = 5;
  DISPLAY_STATUS_PASSING = 6;
  DISPLAY_STATUS_MERGED = 7;
  DISPLAY_STATUS_CLOSED = 8;
  DISPLAY_STATUS_DRAFT = 9;
  DISPLAY_STATUS_APPROVED = 10;
  DISPLAY_STATUS_REVIEW = 11;
}

// MergeBlock explains why a session's PR cannot currently be merged, so an
// unattended driver (boss-epic) can decide repair-vs-proceed without scraping tmux.
message MergeBlock {
  enum Gate {
    GATE_UNSPECIFIED = 0;
    GATE_NONE = 1;       // not blocked — merge should succeed
    GATE_REVIEW = 2;     // outstanding changes-requested review
    GATE_CI = 3;         // failing checks
    GATE_PENDING = 4;    // checks still running / mergeability unknown
    GATE_CONFLICT = 5;   // merge conflict
    GATE_BASE_SYNC = 6;  // local base branch can't fast-forward (merge-time only)
    GATE_DRAFT = 7;      // PR is a draft
  }
  Gate gate = 1;
  string detail = 2;                       // human-readable one-liner
  repeated string blocking_reviewers = 3;  // logins whose latest review is CHANGES_REQUESTED
  DisplayStatus display_status = 4;         // the DisplayStatus this derives from
}

// WorkflowStatus represents the lifecycle state of an autopilot workflow.
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_PENDING = 1;
  WORKFLOW_STATUS_RUNNING = 2;
  WORKFLOW_STATUS_PAUSED = 3;
  WORKFLOW_STATUS_COMPLETED = 4;
  WORKFLOW_STATUS_FAILED = 5;
  WORKFLOW_STATUS_CANCELLED = 6;
}

// WorkflowStep represents the current step in the autopilot skill sequence.
enum WorkflowStep {
  WORKFLOW_STEP_UNSPECIFIED = 0;
  WORKFLOW_STEP_PLAN = 1;
  WORKFLOW_STEP_IMPLEMENT = 2;
  WORKFLOW_STEP_HANDOFF = 3;
  WORKFLOW_STEP_RESUME = 4;
  WORKFLOW_STEP_VERIFY = 5;
  WORKFLOW_STEP_LAND = 6;
}

// ChatStatus represents the live status of a Claude Code chat process.
enum ChatStatus {
  CHAT_STATUS_UNSPECIFIED = 0;
  CHAT_STATUS_WORKING = 1;
  CHAT_STATUS_IDLE = 2;
  CHAT_STATUS_STOPPED = 3;
  CHAT_STATUS_QUESTION = 4;
  CHAT_STATUS_LIMITED = 5;
}

// ClaudeChat represents a Claude Code conversation associated with a session.
message ClaudeChat {
  string id = 1;
  string session_id = 2;
  string agent_session_id = 3;   // Agent session UUID
  string title = 4;              // First user prompt or "New chat"
  string daemon_id = 5;          // Originating daemon (empty = local)
  google.protobuf.Timestamp created_at = 6;
  string tmux_session_name = 7;  // Empty if no tmux session is hosting this chat
  // Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
  string agent_name = 8;
  // Provider-owned resume/session UUID. Empty when provider uses agent_session_id
  // directly or the value has not been discovered yet.
  string provider_session_id = 9;
  // Short human-readable reason the agent never came up for this chat
  // (e.g. "send plan failed: ready marker ❯ not seen within 5s").
  // Empty on the happy path; non-empty rows are preserved as
  // "attempted but never came up" entries so the chat list can show a
  // (failed to start) badge instead of silently swallowing the
  // attempt.
  string start_error = 10;
}

// CronJobStatus is the derived run-status for a cron job, computed from
// the previous run's session state and recorded outcome. Not persisted —
// `last_run_outcome` (string) remains the audit field on disk.
enum CronJobStatus {
  CRON_JOB_STATUS_UNSPECIFIED = 0;
  CRON_JOB_STATUS_IDLE        = 1;
  CRON_JOB_STATUS_RUNNING     = 2;
  CRON_JOB_STATUS_FAILED      = 3;
  CRON_JOB_STATUS_GATED       = 4;  // last fire was blocked by the gate command
  CRON_JOB_STATUS_GATING      = 5;  // gate command currently running (transient, in-memory)
}

// CronJob represents a scheduled prompt that fires on a cron expression.
//
// At fire time, bossd spawns a new session in a fresh worktree with
// PR creation deferred. When Claude's Stop hook fires, the daemon
// finalizes the run: empty diff -> delete worktree; non-empty diff +
// GitHub origin -> push and open PR; otherwise preserve the worktree.
message CronJob {
  string id                  = 1;
  string repo_id             = 2;
  string name                = 3;
  string prompt              = 4;
  string schedule            = 5;   // 5-field cron expression (or @daily, @hourly, etc.)
  string timezone            = 6;   // optional IANA tz name; empty = daemon-local
  bool   enabled             = 7;
  string last_run_session_id = 8;   // empty if never run
  google.protobuf.Timestamp last_run_at  = 9;
  string last_run_outcome    = 10;  // one of: deleted_no_changes, pr_created,
                                    // pr_skipped_no_github, pr_failed,
                                    // chat_spawn_failed, cleanup_failed,
                                    // failed_recovered, fire_failed
  google.protobuf.Timestamp next_run_at  = 11;
  google.protobuf.Timestamp created_at   = 12;
  google.protobuf.Timestamp updated_at   = 13;
  CronJobStatus last_run_status = 14;  // derived; not persisted
  string agent_name = 15;              // agent runner plugin name; empty legacy data defaults to claude
  string model = 16;                   // opaque agent model id; "" = plugin default. Never enumerated by bossd.
  string gate_command = 17;            // optional gate command run before each fire; empty = no gate
  bool   run_setup_command = 18;       // run the repo setup script before the agent; default true
}

// Account is registry metadata for one provider login used by account
// rotation (BOS-157). It carries METADATA ONLY — the credential blob is never
// a field here and never crosses this message (locked decision D3); secrets
// live only in the OS keyring on the daemon host.
message Account {
  string id       = 1;
  string provider = 2;   // "claude" | "codex"
  string label    = 3;
  // Field 4 / "email" was informational account email metadata.
  reserved 4;
  reserved "email";
  string status   = 5;   // "active" | "disabled"
  int32  priority = 6;    // sort order; lower = preferred
  google.protobuf.Timestamp cooldown_until = 7;
  google.protobuf.Timestamp last_used_at   = 8;
  string health   = 9;   // "ok" | "failed"
  string tier     = 10;  // plan/tier metadata, free-form
  repeated string allowed_models = 11;
  google.protobuf.Timestamp last_test_ok_at = 12; // last time a credential test passed
  string last_test_error = 13;                    // most recent test failure detail; "" = none
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Cached per-account rate-limit usage snapshot (BOS-297). METADATA ONLY —
  // never a credential. Absent = never probed.
  UsageSnapshot usage = 16;
  // NO credential field. Ever.
}

// UsageSnapshot is a cached rate-limit usage reading for one account. It is
// derived from the BOS-293 probe result and carries METADATA ONLY:
// utilization fractions, reset instants, a status string, a plan-tier string,
// and the fetch time. It NEVER contains a token or any credential.
message UsageSnapshot {
  double util_5h = 1;                       // 0..1 fraction of the 5h window consumed
  double util_7d = 2;                       // 0..1 fraction of the 7d rolling window consumed
  google.protobuf.Timestamp reset_5h = 3;  // when the 5h window resets (absent = unknown)
  google.protobuf.Timestamp reset_7d = 4;  // when the 7d window resets (absent = unknown)
  string status = 5;                        // rate-limit status string from RateLimitStatus
  string plan_tier = 6;                     // detected plan tier (free-form; e.g. "max", "pro")
  google.protobuf.Timestamp fetched_at = 7; // when this snapshot was probed
}

// ChatMessage is a transport-neutral, single turn of an agent chat transcript,
// flattened from the agent's on-disk JSONL by the owning plugin. It carries
// enough to render a conversation and to derive the "final result" without the
// daemon needing to understand any agent-specific transcript format.
message ChatMessage {
  string role = 1;       // user | assistant | system | tool
  string text = 2;       // flattened text content of the turn
  string timestamp = 3;  // RFC3339, best-effort from the transcript ("" if unknown)
  string kind = 4;       // optional: text | tool_use | tool_result
}
