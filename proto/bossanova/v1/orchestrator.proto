syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "bossanova/v1/daemon.proto";
import "bossanova/v1/models.proto";
import "bossanova/v1/stream.proto";
import "google/protobuf/timestamp.proto";

// OrchestratorService is the cloud-hosted service that coordinates multiple
// daemons, provides remote CLI access, and handles webhook routing.
service OrchestratorService {
  // Daemon registry
  rpc RegisterDaemon(RegisterDaemonRequest) returns (RegisterDaemonResponse);
  // PublishDaemonSnapshot is a unary fallback for networks that proxy normal
  // HTTPS but do not support Connect bidirectional streaming end-to-end.
  // Daemons authenticate with their RegisterDaemon session token and publish
  // the same snapshot shape used as the first DaemonStream event.
  rpc PublishDaemonSnapshot(PublishDaemonSnapshotRequest) returns (PublishDaemonSnapshotResponse);
  // DaemonStream is the long-lived bidirectional channel between a daemon
  // and the orchestrator. Daemons push session deltas and other events;
  // the orchestrator pushes commands (proxy RPC invocations, transfer
  // directives, etc.). Replaces Heartbeat and SyncSessions.
  rpc DaemonStream(stream DaemonEvent) returns (stream OrchestratorCommand);
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse);

  // Session transfer between daemons
  rpc TransferSession(TransferSessionRequest) returns (TransferSessionResponse);

  // Proxied daemon RPCs (remote CLI → orchestrator → daemon)
  rpc ProxyListSessions(ProxyListSessionsRequest) returns (ProxyListSessionsResponse);
  // Union of sessions across EVERY organization the caller is a member of.
  // A sibling of ProxyListSessions, not a replacement: ProxyListSessions must
  // keep failing when the caller's scope resolves to no single organization,
  // because that error is how a caller learns to claim one. This read must
  // succeed exactly then.
  rpc ProxyListSessionsAcrossOrganizations(ProxyListSessionsAcrossOrganizationsRequest) returns (ProxyListSessionsAcrossOrganizationsResponse);
  rpc ProxyGetSession(ProxyGetSessionRequest) returns (ProxyGetSessionResponse);
  rpc ProxyAttachSession(ProxyAttachSessionRequest) returns (stream ProxyAttachSessionResponse);
  // Creates a new session on a chosen daemon, streaming setup output as it
  // runs and terminating with the created Session or an in-band error.
  // Routes to the daemon named by daemon_id (no session exists yet).
  rpc ProxyCreateSession(ProxyCreateSessionRequest) returns (stream ProxyCreateSessionResponse);
  rpc ProxyStopSession(ProxyStopSessionRequest) returns (ProxyStopSessionResponse);
  rpc ProxyPauseSession(ProxyPauseSessionRequest) returns (ProxyPauseSessionResponse);
  rpc ProxyResumeSession(ProxyResumeSessionRequest) returns (ProxyResumeSessionResponse);
  // Wakes a stopped chat's tmux+claude. Routes to the owning daemon via the
  // reverse stream and waits for CommandResult{WakeChatResult}.
  rpc ProxyWakeChat(ProxyWakeChatRequest) returns (ProxyWakeChatResponse);
  // Merges a session's PR via the owning daemon's reverse stream.
  rpc ProxyMergeSession(ProxyMergeSessionRequest) returns (ProxyMergeSessionResponse);
  // Archives a session via the owning daemon's reverse stream.
  rpc ProxyArchiveSession(ProxyArchiveSessionRequest) returns (ProxyArchiveSessionResponse);
  // Records or resumes a chat via the owning daemon's reverse stream.
  rpc ProxyRecordChat(ProxyRecordChatRequest) returns (ProxyRecordChatResponse);
  // Deletes a chat via the owning daemon's reverse stream.
  rpc ProxyDeleteChat(ProxyDeleteChatRequest) returns (ProxyDeleteChatResponse);
  // Switches a session's live chat to a different account (stop+swap+resume)
  // via the owning daemon's reverse stream. Routes by session_id
  // (FindSessionDaemon) with an optional GetChat authz check, like ProxyWakeChat.
  rpc ProxySwitchSessionAccount(ProxySwitchSessionAccountRequest) returns (ProxySwitchSessionAccountResponse);
  // Lists the rotation accounts on the daemon owning session_id (web
  // account-switch picker). Routes by session_id (FindSessionDaemon) for authz
  // scope, like ProxySwitchSessionAccount. Accounts are metadata only — never
  // credentials. Optional provider filter ("" = all).
  rpc ProxyListAccounts(ProxyListAccountsRequest) returns (ProxyListAccountsResponse);
  // Reads a chat's transcript via the owning daemon's reverse stream. Routes by
  // session_id (FindSessionDaemon) with a GetChat authz check, like ProxyWakeChat.
  rpc ProxyGetChatTranscript(ProxyGetChatTranscriptRequest) returns (ProxyGetChatTranscriptResponse);
  // Sends a user message into a chat via the owning daemon's reverse stream.
  // Routes by agent_session_id (FindDaemonForChat) since the MCP send tool
  // carries no session_id.
  rpc ProxySendChatMessage(ProxySendChatMessageRequest) returns (ProxySendChatMessageResponse);
  // Aggregates repos across all of the caller's live daemons, deduped by
  // origin URL, with the serving daemon IDs unioned per repo.
  rpc ProxyListReposAggregated(ProxyListReposAggregatedRequest) returns (ProxyListReposAggregatedResponse);
  // Lists the installed agents on a single named daemon via its reverse stream.
  rpc ProxyListAgents(ProxyListAgentsRequest) returns (ProxyListAgentsResponse);
  rpc ProxyListRepoPRs(ProxyListRepoPRsRequest) returns (ProxyListRepoPRsResponse);
  rpc ProxyListTrackerIssues(ProxyListTrackerIssuesRequest) returns (ProxyListTrackerIssuesResponse);
  // Per-repo proxies for web repo management. Route to the daemon named by
  // daemon_id and address the repo by repo_id. Reads/updates are secret-masked
  // (RepoSettings); writes carry tri-state SecretUpdate + expected_updated_at.
  rpc ProxyGetRepo(ProxyGetRepoRequest) returns (ProxyGetRepoResponse);
  rpc ProxyUpdateRepo(ProxyUpdateRepoRequest) returns (ProxyUpdateRepoResponse);
  rpc ProxyRemoveRepo(ProxyRemoveRepoRequest) returns (ProxyRemoveRepoResponse);
  // Cron-job proxies for web cron-job management. ProxyListCronJobs aggregates
  // across all of the caller's live daemons; the mutating proxies route to the
  // daemon named by daemon_id and address the job by id.
  rpc ProxyListCronJobs(ProxyListCronJobsRequest) returns (ProxyListCronJobsResponse);
  rpc ProxyCreateCronJob(ProxyCreateCronJobRequest) returns (ProxyCreateCronJobResponse);
  rpc ProxyUpdateCronJob(ProxyUpdateCronJobRequest) returns (ProxyUpdateCronJobResponse);
  rpc ProxyDeleteCronJob(ProxyDeleteCronJobRequest) returns (ProxyDeleteCronJobResponse);
  rpc ProxyRunCronJobNow(ProxyRunCronJobNowRequest) returns (ProxyRunCronJobNowResponse);
  // Daemon-scoped account-management proxies for the web Settings > Accounts
  // section. Unlike ProxyListAccounts (session-scoped, switch picker) these
  // route to the daemon named by daemon_id, since a Settings-level manager is
  // not session-scoped. Accounts stay metadata only on the wire — the add /
  // refresh requests carry an inbound-only credential blob (consumed straight
  // into the daemon keyring, never echoed back). Each proxy forwards 1:1 to the
  // existing daemon account.go handler via a reverse-stream OrchestratorCommand.
  rpc ProxyManageListAccounts(ProxyManageListAccountsRequest) returns (ProxyManageListAccountsResponse);
  rpc ProxyAddAccount(ProxyAddAccountRequest) returns (ProxyAddAccountResponse);
  rpc ProxyRefreshAccount(ProxyRefreshAccountRequest) returns (ProxyRefreshAccountResponse);
  rpc ProxyUpdateAccount(ProxyUpdateAccountRequest) returns (ProxyUpdateAccountResponse);
  rpc ProxyRemoveAccount(ProxyRemoveAccountRequest) returns (ProxyRemoveAccountResponse);
  rpc ProxyTestAccount(ProxyTestAccountRequest) returns (ProxyTestAccountResponse);
  // Read-tier MCP gateway parity (BOS-401). Session-scoped reads route to the
  // owning daemon via FindSessionDaemon; session-less reads aggregate across the
  // caller's Ready daemons via the shared resolver.
  // ProxyListChats reads a session's chats (routes by session_id).
  rpc ProxyListChats(ProxyListChatsRequest) returns (ProxyListChatsResponse);
  // ProxyGetChatStatuses reads one session's per-chat statuses (routes by
  // session_id, exactly as ProxyListChats does). Not interchangeable with
  // ProxyGetSessionStatuses: that aggregates across a session's chats, so it
  // cannot say whether one specific chat has settled.
  rpc ProxyGetChatStatuses(ProxyGetChatStatusesRequest) returns (ProxyGetChatStatusesResponse);
  // ProxyGetSessionStatuses fans out per session_id (FindSessionDaemon), skipping
  // unknown ids, and unions the returned SessionStatusEntry values.
  rpc ProxyGetSessionStatuses(ProxyGetSessionStatusesRequest) returns (ProxyGetSessionStatusesResponse);
  // ProxyListCheckSnapshots reads a session's recent CI check snapshots (routes by session_id).
  rpc ProxyListCheckSnapshots(ProxyListCheckSnapshotsRequest) returns (ProxyListCheckSnapshotsResponse);
  // ProxyListAgentsAggregated aggregates installed agents across the caller's
  // Ready daemons (session-less; distinct from the daemon-scoped ProxyListAgents).
  rpc ProxyListAgentsAggregated(ProxyListAgentsAggregatedRequest) returns (ProxyListAgentsAggregatedResponse);
  // ProxyListPlugins aggregates configured plugins across the caller's Ready daemons.
  rpc ProxyListPlugins(ProxyListPluginsRequest) returns (ProxyListPluginsResponse);
  // ProxyGetCronJob returns the first Ready daemon that owns the id (NotFound if none).
  rpc ProxyGetCronJob(ProxyGetCronJobRequest) returns (ProxyGetCronJobResponse);
  // ProxyRepairDoctor merges repair-doctor reports across the caller's Ready daemons.
  rpc ProxyRepairDoctor(ProxyRepairDoctorRequest) returns (ProxyRepairDoctorResponse);
  // Destructive-tier MCP gateway parity (BOS-404). Session-scoped destructive
  // ops route to the owning daemon via FindSessionDaemon (NotFound for a
  // missing/foreign session); empty_trash is daemon-wide and aggregates across
  // the caller's Ready daemons via the shared resolver.
  // ProxyCloseSession closes (abandons) a session, returning the updated Session.
  rpc ProxyCloseSession(ProxyCloseSessionRequest) returns (ProxyCloseSessionResponse);
  // ProxyResurrectSession restores an archived session, returning the updated Session.
  rpc ProxyResurrectSession(ProxyResurrectSessionRequest) returns (ProxyResurrectSessionResponse);
  // ProxyRemoveSession permanently removes a session and its worktree (Ok-only).
  rpc ProxyRemoveSession(ProxyRemoveSessionRequest) returns (ProxyRemoveSessionResponse);
  // ProxyEmptyTrash permanently deletes archived sessions across the caller's
  // Ready daemons, summing each daemon's deleted_count.
  rpc ProxyEmptyTrash(ProxyEmptyTrashRequest) returns (ProxyEmptyTrashResponse);
  // Mutating MCP gateway parity (BOS-402). Session-scoped mutations route to the
  // owning daemon via FindSessionDaemon; chat-scoped mutations via
  // FindDaemonForChat(agent_session_id). A foreign entity resolves to NotFound,
  // so no cross-user mutation can dispatch.
  // ProxyRetrySession retries a failed session (routes by session_id).
  rpc ProxyRetrySession(ProxyRetrySessionRequest) returns (ProxyRetrySessionResponse);
  // ProxyUpdateSession updates a session's title/tracker (routes by session_id).
  rpc ProxyUpdateSession(ProxyUpdateSessionRequest) returns (ProxyUpdateSessionResponse);
  // ProxyLinkSessionPR attaches an existing PR to a session (routes by session_id).
  rpc ProxyLinkSessionPR(ProxyLinkSessionPRRequest) returns (ProxyLinkSessionPRResponse);
  // ProxyUpdateChatTitle renames a chat (routes by agent_session_id).
  rpc ProxyUpdateChatTitle(ProxyUpdateChatTitleRequest) returns (ProxyUpdateChatTitleResponse);
  // ProxyReportChatStatus forwards chat status heartbeats. All reports must
  // resolve to the caller's own chats on a single daemon.
  rpc ProxyReportChatStatus(ProxyReportChatStatusRequest) returns (ProxyReportChatStatusResponse);
  // GitHub-callback proxies for remote-CLI callback management (BOS-469). All
  // route to the owning daemon by target_chat_id via FindDaemonForChat, reusing
  // the caller's own auth — a foreign chat resolves to NotFound so no cross-user
  // registration can dispatch. Create/Delete require target_chat_id; List routes
  // by target_chat_id when set, else aggregates across the caller's Ready daemons.
  rpc ProxyCreateGithubCallback(ProxyCreateGithubCallbackRequest) returns (ProxyCreateGithubCallbackResponse);
  rpc ProxyListGithubCallbacks(ProxyListGithubCallbacksRequest) returns (ProxyListGithubCallbacksResponse);
  rpc ProxyDeleteGithubCallback(ProxyDeleteGithubCallbackRequest) returns (ProxyDeleteGithubCallbackResponse);
  // Notes proxies for remote-CLI and hosted-gateway note management (BOS-552).
  // A note is repo-scoped, so all five route to the owning daemon by repo_id,
  // reusing the caller's own auth — a foreign repo resolves to NotFound so no
  // cross-user note access can dispatch. Create/Get/Update/Delete require
  // repo_id; List routes by repo_id when set, else aggregates across the
  // caller's Ready daemons.
  rpc ProxyCreateNote(ProxyCreateNoteRequest) returns (ProxyCreateNoteResponse);
  rpc ProxyGetNote(ProxyGetNoteRequest) returns (ProxyGetNoteResponse);
  rpc ProxyListNotes(ProxyListNotesRequest) returns (ProxyListNotesResponse);
  rpc ProxyUpdateNote(ProxyUpdateNoteRequest) returns (ProxyUpdateNoteResponse);
  rpc ProxyDeleteNote(ProxyDeleteNoteRequest) returns (ProxyDeleteNoteResponse);
  // Streams the live chat list (and per-chat statuses) for a session through
  // the orchestrator. Bosso fans out the daemon's ChatDelta / ChatStatusDelta
  // events to subscribed web clients. Terminates with DaemonOffline if the
  // owning daemon disconnects.
  rpc ProxyStreamChats(ProxyStreamChatsRequest) returns (stream ProxyChatListEvent);

  // IssueAttachToken returns a short-lived JWT bound to (user, session,
  // chat, scope) that the browser uses to authenticate the /ws/attach
  // WebSocket handshake. TTL ~5 minutes.
  rpc IssueAttachToken(IssueAttachTokenRequest) returns (IssueAttachTokenResponse);

  // TerminalStream is the bossd-initiated bidirectional channel that
  // carries terminal-attach traffic for the web /ws/attach feature.
  // Daemon opens lazily on the first attach and multiplexes attach_ids
  // inside it; isolated from the control-plane DaemonStream so keystroke
  // traffic never starves Stop/Pause/Transfer commands. Auth: per-daemon
  // X-Daemon-Token + WorkOS JWT, same as DaemonStream.
  //
  // Stream-type orientation matches DaemonStream: bossd is the gRPC
  // client, so the request stream carries daemon→bosso messages
  // (TerminalServerMessage) and the response stream carries bosso→daemon
  // messages (TerminalClientMessage). The "Client"/"Server" prefix refers
  // to the web feature's bosso-server / browser-client perspective, not
  // the gRPC roles. See docs/plans/2026-04-26-web-tmux-attach.md.
  rpc TerminalStream(stream TerminalServerMessage) returns (stream TerminalClientMessage);

  // Webhook configuration management
  rpc CreateWebhookConfig(CreateWebhookConfigRequest) returns (CreateWebhookConfigResponse);
  rpc ListWebhookConfigs(ListWebhookConfigsRequest) returns (ListWebhookConfigsResponse);
  rpc DeleteWebhookConfig(DeleteWebhookConfigRequest) returns (DeleteWebhookConfigResponse);
  // GitHub App repository registration. User-authenticated.
  rpc GetGitHubAppInstallURL(GetGitHubAppInstallURLRequest) returns (GetGitHubAppInstallURLResponse);
  rpc CompleteGitHubAppSetup(CompleteGitHubAppSetupRequest) returns (CompleteGitHubAppSetupResponse);
  rpc ListGitHubAppRepos(ListGitHubAppReposRequest) returns (ListGitHubAppReposResponse);
  rpc DisconnectGitHubAppRepo(DisconnectGitHubAppRepoRequest) returns (DisconnectGitHubAppRepoResponse);

  // Cloud billing and access. User-authenticated.
  rpc GetCloudAccessStatus(GetCloudAccessStatusRequest) returns (GetCloudAccessStatusResponse);
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);
  rpc RefreshCloudEntitlements(RefreshCloudEntitlementsRequest) returns (RefreshCloudEntitlementsResponse);

  // Organizations. User-authenticated.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc RenameOrganization(RenameOrganizationRequest) returns (RenameOrganizationResponse);
  rpc ListOrganizationMembers(ListOrganizationMembersRequest) returns (ListOrganizationMembersResponse);
  rpc InviteOrganizationMember(InviteOrganizationMemberRequest) returns (InviteOrganizationMemberResponse);
  rpc RemoveOrganizationMember(RemoveOrganizationMemberRequest) returns (RemoveOrganizationMemberResponse);
  rpc SetOrganizationMemberRole(SetOrganizationMemberRoleRequest) returns (SetOrganizationMemberRoleResponse);
  // Deprecated: use AuthKit switchToOrganization instead. This RPC is
  // deprecated rather than deleted because buf breaking: use: FILE blocks
  // deleting it from bossanova.v1; true removal requires bossanova.v2.
  rpc SwitchActiveOrganization(SwitchActiveOrganizationRequest) returns (SwitchActiveOrganizationResponse) {
    option deprecated = true;
  }

  // Repo-to-organization ownership mapping, keyed by canonical repo origin URL.
  // User-authenticated; the caller must be a member of the target organization.
  rpc SetRepoOrganization(SetRepoOrganizationRequest) returns (SetRepoOrganizationResponse);
  rpc GetRepoOrganization(GetRepoOrganizationRequest) returns (GetRepoOrganizationResponse);
  rpc ClearRepoOrganization(ClearRepoOrganizationRequest) returns (ClearRepoOrganizationResponse);
  rpc ListRepoOrganizations(ListRepoOrganizationsRequest) returns (ListRepoOrganizationsResponse);

  // Bug reporting (ctrl+g in TUI; ctrl+b is a deprecated alias). Unauthenticated; optionally
  // resolves the caller's identity when a bearer token is present.
  rpc ReportBug(ReportBugRequest) returns (ReportBugResponse);
}

// --- Daemon Registry ---

message RegisterDaemonRequest {
  string daemon_id = 1;
  string hostname = 2;
  // Repos this daemon manages.
  repeated string repo_ids = 3;
  // Optional endpoint URL where the daemon's DaemonService is reachable.
  // Required for proxy RPC support. Daemons behind NAT may omit this.
  optional string endpoint = 4;
  // User email from the WorkOS device code response.
  // Used for JIT user creation when the user doesn't exist in the DB yet.
  string email = 5;
}

message RegisterDaemonResponse {
  string daemon_id = 1;
  // Token for subsequent authenticated requests.
  string session_token = 2;
}

message PublishDaemonSnapshotRequest {
  DaemonSnapshot snapshot = 1;
}

message PublishDaemonSnapshotResponse {}

message ListDaemonsRequest {}

message DaemonInfo {
  string daemon_id = 1;
  string hostname = 2;
  repeated string repo_ids = 3;
  int32 active_sessions = 4;
  // Timestamp the current bidirectional stream from the daemon was
  // established. Resets on every reconnect — the reverse-stream model
  // has no separate heartbeat; the live stream IS the liveness signal.
  google.protobuf.Timestamp connected_at = 5;
  bool online = 6;
}

message ListDaemonsResponse {
  repeated DaemonInfo daemons = 1;
}

// --- Session Transfer ---

message TransferSessionRequest {
  string session_id = 1;
  // Daemon to transfer FROM.
  string source_daemon_id = 2;
  // Daemon to transfer TO.
  string target_daemon_id = 3;
}

message TransferSessionResponse {
  Session session = 1;
  string target_daemon_id = 2;
}

// --- Proxied Daemon RPCs ---
// These mirror DaemonService RPCs but route through the orchestrator
// to the appropriate daemon. Each has its own request/response types
// to satisfy buf lint uniqueness requirements.

message ProxyListSessionsRequest {
  optional string repo_id = 1;
  repeated SessionState states = 2;
  bool include_archived = 3;
  // Target daemon, if known. Otherwise orchestrator queries all.
  optional string daemon_id = 4;
}

message ProxyListSessionsResponse {
  repeated Session sessions = 1;
  // Field 2 (`chat_statuses`) was removed when clients stopped composing
  // their own status — `Session.display_label/intent/spinner` now carries
  // the rendered state directly. Tag reserved to prevent reuse.
  reserved 2;
  reserved "chat_statuses";
}

message ProxyListSessionsAcrossOrganizationsRequest {
  // Mirrors ProxyListSessionsRequest field-for-field; each filter is applied
  // per organization, exactly as the single-organization read applies it.
  // The archived flag carries the should_ prefix the bool naming rule requires;
  // ProxyListSessionsRequest.include_archived keeps its legacy spelling because
  // renaming a shipped field is an API-version change of its own.
  optional string repo_id = 1;
  repeated SessionState states = 2;
  bool should_include_archived = 3;
  // Target daemon, if known. Otherwise orchestrator queries all.
  optional string daemon_id = 4;
}

message ProxyListSessionsAcrossOrganizationsResponse {
  // Union across the caller's memberships, sorted newest-first then by id.
  // Unlike ProxyListSessionsResponse.sessions, every entry carries a non-empty
  // `organization_id` naming the organization whose read produced it.
  repeated Session sessions = 1;
  // Directory of the organizations that were read, so a client can label a
  // filter without a second ListOrganizations call. `caller_role` and
  // `member_count` are best-effort: they are left at their zero values when
  // the organization mirror is unavailable.
  repeated Organization organizations = 2;
  // Organizations whose read failed. Their sessions are absent from
  // `sessions`; the rest of the union is still served. A client showing an
  // "all organizations" view should surface this as a partial result.
  repeated OrganizationSessionReadFailure failed_organizations = 3;
}

// One organization that could not be read during a cross-organization fan-out.
message OrganizationSessionReadFailure {
  string organization_id = 1;
  string organization_name = 2;
  // Human-readable cause, safe to display. Never carries credentials or
  // internal identifiers beyond the organization id above.
  string reason = 3;
}

message ProxyGetSessionRequest {
  string id = 1;
}

message ProxyGetSessionResponse {
  Session session = 1;
}

message ProxyAttachSessionRequest {
  string id = 1;
}

// ProxyAttachSessionResponse is streamed from orchestrator to remote CLI.
// Reuses the streaming event types defined in daemon.proto.
message ProxyAttachSessionResponse {
  oneof event {
    OutputLine output_line = 1;
    StateChange state_change = 2;
    SessionEnded session_ended = 3;
  }
}

// ProxyCreateSessionRequest names the daemon to create the session on plus
// the creation parameters (mirrors CreateSessionCommand in stream.proto).
message ProxyCreateSessionRequest {
  string daemon_id = 1;
  string repo_id = 2;
  string title = 3;
  string plan = 4;
  string base_branch = 5;
  string agent_name = 6;
  bool is_quick_chat = 7;
  optional int32 pr_number = 8;
  optional string branch_name = 9;
  optional string tracker_id = 10;
  optional string tracker_url = 11;
  optional TrackerIssue tracker_issue = 12;
  optional string tracker_source = 13;
  // Bypass the BOS-236 tracker-issue dedup guard so a caller can intentionally
  // create a second session for a tracker/PR/branch that already has an active
  // one. Mirrors CreateSessionRequest.force so the hosted MCP gateway path has
  // the same escape hatch as the local socket backend.
  bool force = 14;
  // Unattended-session fields carried through the hosted gateway so a hosted
  // MCP client (e.g. /boss-epic) gets the same create_session behavior as the
  // local socket backend. Mirror CreateSessionRequest.{detach,model,
  // is_tmux_unattended}; without them a hosted create silently runs interactively
  // on the daemon's default model and never fires the unattended prompt.
  bool detach = 15;
  optional string model = 16;
  optional string effort = 21;
  bool is_tmux_unattended = 17;
  optional string account_id = 18;
  // Mirror CreateSessionRequest.force_branch so hosted MCP create_session can
  // intentionally replace an existing branch, matching the local socket path.
  bool force_branch = 19;
  // Mirror CreateSessionRequest.defer_pr so hosted MCP create_session can skip
  // the up-front draft PR (PR opened at finalize only if commits land), matching
  // the local socket path. Default false = unchanged eager draft-PR behavior.
  bool defer_pr = 20;
}

// ProxyCreateSessionResponse is streamed from orchestrator to the client as
// creation progresses: setup output lines, then a terminal created Session or
// an in-band error message.
message ProxyCreateSessionResponse {
  oneof body {
    string setup_output = 1;
    Session created = 2;
    string error = 3;
  }
  // True when the terminal `created` frame reports an EXISTING active session
  // the daemon attached to (dedup) rather than a freshly created one. Carries
  // SessionCreateChunk.attached_existing through the hosted create path so the
  // MCP gateway can surface it; only meaningful alongside `created`.
  bool attached_existing = 4;
}

message ProxyStopSessionRequest {
  string id = 1;
}

message ProxyStopSessionResponse {
  Session session = 1;
}

message ProxyPauseSessionRequest {
  string id = 1;
}

message ProxyPauseSessionResponse {
  Session session = 1;
}

message ProxyResumeSessionRequest {
  string id = 1;
}

message ProxyResumeSessionResponse {
  Session session = 1;
}

// ProxyWakeChatRequest identifies the chat to wake. Both session_id and
// agent_session_id are required: bosso scopes the chat lookup across both
// (and the authenticated user) to prevent a caller in possession of just
// an agent_session_id from waking a chat in another user's session.
message ProxyWakeChatRequest {
  string session_id = 1;
  string agent_session_id = 2;
  // If true, the daemon will skip --resume even when a transcript exists.
  bool force_fresh = 3;
}

message ProxyWakeChatResponse {
  // Mirrors WakeChatResult.Outcome from stream.proto so callers don't
  // need to import the stream-internal type.
  WakeChatResult.Outcome outcome = 1;
  string tmux_session_name = 2;
  // Stable machine-readable reason when outcome is OUTCOME_FRESH_FALLBACK.
  string reason = 3;
}

message ProxyMergeSessionRequest { string id = 1; }
message ProxyMergeSessionResponse { Session session = 1; }

message ProxyArchiveSessionRequest { string id = 1; }
message ProxyArchiveSessionResponse { Session session = 1; }

message ProxyRecordChatRequest {
  string session_id = 1;
  string agent_session_id = 2;
  string title = 3;
  bool resume = 4;
  string agent_name = 5;
}
message ProxyRecordChatResponse { ClaudeChat chat = 1; }

message ProxyDeleteChatRequest {
  string session_id = 1;       // for authz scoping (mirror ProxyWakeChat)
  string agent_session_id = 2;
}
message ProxyDeleteChatResponse {}

// ProxySwitchSessionAccountRequest switches a session's live chat to a
// different account. session_id is required for authz scoping (mirror
// ProxyWakeChat). agent_session_id is optional; empty => the session's
// primary live chat (resolved by the daemon).
message ProxySwitchSessionAccountRequest {
  string session_id = 1;       // for authz scoping (mirror ProxyWakeChat)
  string agent_session_id = 2; // optional; empty => session's primary live chat
  string account_id = 3;       // "" = system default
  bool force = 4;
}
message ProxySwitchSessionAccountResponse {
  bool resumed = 1;
  string target_label = 2;
  string notice_text = 3;
}

// ProxyGetChatTranscriptRequest reads a chat by agent_session_id, scoped to
// session_id for authz (mirror ProxyWakeChat). max_messages == 0 returns all.
message ProxyGetChatTranscriptRequest {
  string session_id = 1;       // for authz scoping (mirror ProxyWakeChat)
  string agent_session_id = 2;
  int32 max_messages = 3;      // 0 = all; otherwise the most recent N
}
// ProxyGetChatTranscriptResponse mirrors daemon.proto's GetChatTranscriptResponse
// shape so the gateway can forward it field-for-field. ChatMessage is defined in
// daemon.proto (already imported).
message ProxyGetChatTranscriptResponse {
  repeated ChatMessage messages = 1;
  string final_assistant_text = 2;
  bool exists = 3;
  // reason mirrors GetChatTranscriptResponse.reason: why a miss occurred.
  string reason = 4;
}

// ProxySendChatMessageRequest carries only agent_session_id (the MCP send tool
// has no session_id), so bosso routes via FindDaemonForChat rather than
// FindSessionDaemon.
message ProxySendChatMessageRequest {
  string agent_session_id = 1;
  string message = 2;
  bool wake_if_asleep = 3;
  // when true, submit the message (BOS-242); when false, prefill only.
  // optional so an omitting (pre-BOS-242) client is treated as submit=true
  // server-side, preserving the prior always-submit proxy behavior.
  optional bool submit = 4;
}
// ProxySendChatMessageResponse mirrors daemon.proto's SendChatMessageResponse.
message ProxySendChatMessageResponse {
  string tmux_session_name = 1;
  bool delivered = 2;
  // notice_text mirrors SendChatMessageResponse.notice_text: the user-facing
  // outcome of a message bossd handled mechanically (a "/boss switch" account
  // switch intercepted before delivery) instead of forwarding to the agent. On
  // that path delivered is false; callers must read notice_text. Additive,
  // backward-compatible response field. Empty for an ordinary delivered message.
  string notice_text = 3;
  // delivery_state mirrors SendChatMessageResponse.delivery_state. Additive,
  // backward-compatible response field; older bosso builds leave it
  // UNSPECIFIED, so callers still fall back to notice_text guidance.
  SendChatMessageResponse.DeliveryState delivery_state = 4;
}

// AggregatedRepo is one logical repo (deduped by origin URL) plus a ref for
// every live daemon that serves it. Web-safe: carries no Repo and no API keys.
message AggregatedRepo {
  string origin_url = 1;
  string display_name = 2;
  string default_base_branch = 3;
  repeated DaemonRepoRef daemons = 4;
}

// DaemonRepoRef ties a logical repo to one serving daemon: that daemon's local
// repo_id plus its per-daemon tracker capability (Linear/Sentry creds present).
message DaemonRepoRef {
  string daemon_id = 1;
  string repo_id = 2;
  bool has_linear_key = 3;
  bool has_sentry_key = 4;
  // Non-secret, user-facing hostname of the serving daemon, for display only.
  // May be empty, in which case callers fall back to daemon_id.
  string daemon_hostname = 5;
}

message ProxyListReposAggregatedRequest {}

message ProxyListReposAggregatedResponse {
  repeated AggregatedRepo repos = 1;
}

message ProxyListAgentsRequest {
  string daemon_id = 1;
}

message ProxyListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// ProxyListAccountsRequest lists the rotation accounts on the daemon owning
// session_id. session_id locates the owning daemon (FindSessionDaemon) and
// scopes authz. provider optionally filters ("" = all). Accounts are metadata
// only — never credentials.
message ProxyListAccountsRequest {
  string session_id = 1;
  string provider = 2;
}

message ProxyListAccountsResponse {
  repeated Account accounts = 1;
}

// --- Daemon-scoped account management (web Settings > Accounts) ---
//
// Every request routes by daemon_id (the owning daemon), mirroring
// ProxyListAgents / ProxyGetRepo. Responses are metadata only — an Account
// never carries a credential. The add / refresh requests carry an inbound-only
// credential blob (Claude setup-token string bytes; Codex auth.json bytes) that
// is consumed straight into the daemon keyring and never echoed back.

// ProxyManageListAccountsRequest lists every rotation account on the daemon
// named by daemon_id (not session-scoped). provider optionally filters
// ("" = all). should_refresh asks the daemon to run its live usage probe over each
// returned account before responding; false/omitted is the passive read the
// 30-second poll uses and is byte-for-byte the pre-refresh request.
//
// bosso reads should_refresh as a proxy for user intent: it gates the
// cloud_action_invoked telemetry event on this flag so the passive poll stays
// out of action counts (see docs/analytics/events.md). That reading is a
// CONVENTION held by the one production caller — the web Accounts page, which
// sets it true only from the Refresh control — and NOT an invariant this schema
// enforces. Any automated or background caller that sets should_refresh true
// would reintroduce exactly the polling noise the gate removes, and would do so
// silently. A new caller that needs the daemon's live usage probe without
// claiming user intent needs a separate signal, not this flag.
message ProxyManageListAccountsRequest {
  string daemon_id = 1;
  string provider = 2;
  bool should_refresh = 3;
}
message ProxyManageListAccountsResponse {
  repeated Account accounts = 1;
  // Set only when bosso handled a should_refresh=true request and the daemon
  // confirmed its live usage probe. The web requires this acknowledgement for
  // refreshes, so an older bosso that silently ignores should_refresh cannot
  // make a passive list look like a completed usage refresh.
  bool has_refreshed = 2;
}

// ProxyAddAccountRequest registers a new account on the named daemon. The
// credential blob is inbound only (never returned). Mirrors daemon
// AddAccountRequest (minus the reserved email field).
message ProxyAddAccountRequest {
  string daemon_id = 1;
  string provider = 2;   // "claude" | "codex"
  string label = 3;
  int32 priority = 4;    // sort order; lower = preferred
  bytes credential = 5;  // inbound only; consumed into the keyring, never echoed
}
message ProxyAddAccountResponse {
  Account account = 1;   // metadata only; never the credential
}

// ProxyRefreshAccountRequest replaces an account's stored credential on the
// named daemon. Mirrors daemon RefreshAccountRequest.
message ProxyRefreshAccountRequest {
  string daemon_id = 1;
  string id = 2;
  bytes credential = 3;      // inbound only; never echoed
  bool test_after_save = 4;  // run the TestAccount validation path after saving
}
message ProxyRefreshAccountResponse {
  Account account = 1;
  bool live_smoke_ran = 2;
  string detail = 3;
}

// ProxyUpdateAccountRequest edits an account's metadata on the named daemon.
// Mirrors daemon UpdateAccountRequest (optional fields; allowed_models replaces
// the set when present).
message ProxyUpdateAccountRequest {
  string daemon_id = 1;
  string id = 2;
  optional string label = 3;
  optional int32 priority = 4;
  optional string status = 5;  // "active" | "disabled"
  repeated string allowed_models = 6;
}
message ProxyUpdateAccountResponse {
  Account account = 1;
}

// ProxyRemoveAccountRequest removes an account from the named daemon.
message ProxyRemoveAccountRequest {
  string daemon_id = 1;
  string id = 2;
}
message ProxyRemoveAccountResponse {}

// ProxyTestAccountRequest runs a live validation of an account on the named
// daemon. Mirrors daemon TestAccountRequest.
message ProxyTestAccountRequest {
  string daemon_id = 1;
  string id = 2;
}
message ProxyTestAccountResponse {
  Account account = 1;       // updated metadata (last_test_ok_at / last_test_error)
  bool live_smoke_ran = 2;
  string detail = 3;
}

message ProxyListRepoPRsRequest {
  string daemon_id = 1;
  string repo_id = 2;
}
message ProxyListRepoPRsResponse { repeated PRSummary pull_requests = 1; }

message ProxyListTrackerIssuesRequest {
