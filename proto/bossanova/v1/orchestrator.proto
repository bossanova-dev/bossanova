// --- Repo organization mappings ---

// RepoOrganizationMapping records which organization owns a repo, keyed by the
// repo's canonical origin URL. One organization per origin.
message RepoOrganizationMapping {
  string id = 1;
  // Canonical repo origin URL, the mapping key.
  string repo_origin_url = 2;
  string organization_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message SetRepoOrganizationRequest {
  string repo_origin_url = 1;
  string organization_id = 2;
}

message SetRepoOrganizationResponse {
  RepoOrganizationMapping mapping = 1;
}

message GetRepoOrganizationRequest {
  string repo_origin_url = 1;
}

message GetRepoOrganizationResponse {
  // Unset when the origin is unmapped; an unset mapping is the miss signal,
  // not an error.
  RepoOrganizationMapping mapping = 1;
}

message ClearRepoOrganizationRequest {
  string repo_origin_url = 1;
  // Deletes are scoped by organization as an authorization backstop, so the
  // wire carries the organization alongside the key.
  string organization_id = 2;
}

message ClearRepoOrganizationResponse {}

message ListRepoOrganizationsRequest {
  string organization_id = 1;
}

message ListRepoOrganizationsResponse {
  repeated RepoOrganizationMapping mappings = 1;
}

// --- Session webhooks (BOS-1347) ---
//
// Authorization for every RPC is documented on the service.

// SessionWebhook is one outbound session webhook endpoint. It NEVER carries
// the signing secret: the secret is returned exactly once per issue, by
// CreateSessionWebhookResponse or RotateSessionWebhookSecretResponse.
message SessionWebhook {
  string id = 1;
  string organization_id = 2;
  // The https URL deliveries are POSTed to.
  string url = 3;
  string description = 4;
  // Subscribed event types (SessionWebhookEventType.type), sorted.
  repeated string event_types = 5;
  // A disabled endpoint is sent nothing.
  bool is_enabled = 6;
  // bosso users.id of the owner who created the endpoint.
  string created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // When the secret was last rotated; absent until the first rotation.
  google.protobuf.Timestamp secret_rotated_at = 10;
}

// SessionWebhookEventType is one entry of the event catalog.
message SessionWebhookEventType {
  // Wire event type, e.g. "session.passing".
  string type = 1;
  // The session status label the event announces, as the web and TUI show it.
  string display_label = 2;
  // One user-facing sentence saying when the event fires.
  string description = 3;
  // A fully populated sample delivery body (JSON), marked is_test.
  string sample_payload_json = 4;
}

message ListSessionWebhookEventTypesRequest {
  string organization_id = 1;
}

message ListSessionWebhookEventTypesResponse {
  repeated SessionWebhookEventType event_types = 1;
}

message ListSessionWebhooksRequest {
  string organization_id = 1;
}

message ListSessionWebhooksResponse {
  repeated SessionWebhook webhooks = 1;
}

message CreateSessionWebhookRequest {
  string organization_id = 1;
  string url = 2;
  string description = 3;
  // Required, non-empty; each must be a catalog type. Duplicates collapse.
  repeated string event_types = 4;
  // Signing secret to use. Absent generates a random one.
  optional string secret = 5;
  // False creates the endpoint disabled.
  bool is_enabled = 6;
}

message CreateSessionWebhookResponse {
  SessionWebhook webhook = 1;
  // The signing secret, returned ONLY here and by rotation. Callers must show
  // it once and never log it.
  string secret = 2;
}

// UpdateSessionWebhookRequest changes only the fields that are present.
// event_types is replaced as a whole set, and only when
// should_replace_event_types is set (it must then be non-empty); a non-empty
// event_types without the flag is INVALID_ARGUMENT.
message UpdateSessionWebhookRequest {
  string organization_id = 1;
  string id = 2;
  optional string url = 3;
  optional string description = 4;
  repeated string event_types = 5;
  bool should_replace_event_types = 6;
  optional bool is_enabled = 7;
}

message UpdateSessionWebhookResponse {
  SessionWebhook webhook = 1;
}

message RotateSessionWebhookSecretRequest {
  string organization_id = 1;
  string id = 2;
  // New signing secret to use. Absent generates a random one.
  optional string secret = 3;
}

message RotateSessionWebhookSecretResponse {
  SessionWebhook webhook = 1;
  // The new signing secret, returned ONLY here. Callers must show it once and
  // never log it.
  string secret = 2;
}

message DeleteSessionWebhookRequest {
  string organization_id = 1;
  string id = 2;
}

message DeleteSessionWebhookResponse {}

// SessionWebhookDelivery is one event's delivery to one endpoint.
message SessionWebhookDelivery {
  string id = 1;
  string webhook_id = 2;
  // The event id, also sent as the X-Bossanova-Event-Id header.
  string event_id = 3;
  string event_type = 4;
  // True for a SendSessionWebhookTestEvent delivery.
  bool is_test = 5;
  // One of pending, in_flight, succeeded, failed, cancelled.
  string status = 6;
  int32 attempt_count = 7;
  // HTTP status of the latest attempt; absent before the first attempt and
  // after a transport failure.
  optional int32 last_response_status_code = 8;
  string last_error = 9;
  // When the next attempt is due; absent unless the delivery is pending.
  google.protobuf.Timestamp next_attempt_at = 10;
  google.protobuf.Timestamp created_at = 11;
  // When the delivery finished; absent while it is pending or in flight.
  google.protobuf.Timestamp completed_at = 12;
}

// SessionWebhookDeliveryAttempt is one HTTP attempt of a delivery.
message SessionWebhookDeliveryAttempt {
  // 1-based.
  int32 attempt_number = 1;
  google.protobuf.Timestamp started_at = 2;
  int64 duration_ms = 3;
  // Absent on a transport failure.
  optional int32 response_status_code = 4;
  // A prefix of the response body, at most 2 KiB.
  string response_body_excerpt = 5;
  string error_message = 6;
  bool is_success = 7;
}

// SessionWebhookRequestHeader is one HTTP request header of a delivery.
message SessionWebhookRequestHeader {
  string name = 1;
  string value = 2;
}

message SendSessionWebhookTestEventRequest {
  string organization_id = 1;
  string webhook_id = 2;
  // A catalog event type; the endpoint need not be subscribed to it.
  string event_type = 3;
  // The body to send, a JSON object of at most 64 KiB. Absent or empty sends
  // the catalog sample for event_type.
  optional string payload_json = 4;
}

message SendSessionWebhookTestEventResponse {
  // The persisted test delivery, already finished: succeeded or failed, or
  // cancelled when the endpoint was disabled or changed mid-attempt.
  SessionWebhookDelivery delivery = 1;
  // The delivery's single attempt; absent only when the endpoint was disabled
  // or changed while the attempt was in flight, which cancels the delivery.
  SessionWebhookDeliveryAttempt attempt = 2;
}

message ListSessionWebhookDeliveriesRequest {
  string organization_id = 1;
  string webhook_id = 2;
  // Only deliveries in this status (see SessionWebhookDelivery.status).
  optional string status = 3;
  // Only deliveries of this event type.
  optional string event_type = 4;
  // Only test (true) or only live (false) deliveries.
  optional bool is_test = 5;
  // Default 25, at most 100; larger values are clamped and a negative value
  // is INVALID_ARGUMENT.
  int32 page_size = 6;
  // Opaque next_page_token from a previous response with the same filters.
  string page_token = 7;
}

message ListSessionWebhookDeliveriesResponse {
  repeated SessionWebhookDelivery deliveries = 1;
  // Pass as page_token to fetch the next page. Empty on the last page.
  string next_page_token = 2;
}

message GetSessionWebhookDeliveryRequest {
  string organization_id = 1;
  string delivery_id = 2;
}

message GetSessionWebhookDeliveryResponse {
  SessionWebhookDelivery delivery = 1;
  // Every attempt, in attempt order.
  repeated SessionWebhookDeliveryAttempt attempts = 2;
  // The exact signed request body.
  string request_body = 3;
  // The request headers each attempt sends, sorted by name. The signature is
  // computed with the endpoint's current secret, so it differs from the one
  // an attempt made before a rotation carried. The secret itself is never
  // included.
  repeated SessionWebhookRequestHeader request_headers = 4;
}

// --- Inbound triggers (BOS-1348) ---
//
// Model messages (Trigger, TriggerInvocation, TriggerCatalog, ...) live in
// models.proto. Authorization for every RPC is documented on the service.

message GetTriggerCatalogRequest {}

message GetTriggerCatalogResponse {
  TriggerCatalog catalog = 1;
}

message ListTriggersRequest {
  // Restrict to one organization the caller belongs to. Absent lists the
  // caller's triggers across every organization they belong to.
  optional string organization_id = 1;
}

message ListTriggersResponse {
  repeated Trigger triggers = 1;
}

message GetTriggerRequest {
  string id = 1;
}

message GetTriggerResponse {
  Trigger trigger = 1;
}

// CreateTriggerRequest carries the writable Trigger fields. The output-only
// fields (id, creator_user_id, config_version, endpoint_path,
// last_invocation, timestamps) are assigned by bosso.
message CreateTriggerRequest {
  // Required. The caller must be a member.
  string organization_id = 1;
  string name = 2;
  bool is_enabled = 3;
  // Required catalog type name, e.g. "http" or "github".
  string trigger_type = 4;
  // Required; the arm must match trigger_type.
  oneof type_config {
    HttpTriggerConfig http = 5;
    GithubTriggerConfig github = 6;
  }
  string repo_origin_url = 7;
  TriggerLaunchSettings launch = 8;
  TriggerPlacement placement = 9;
  TriggerConcurrencyPolicy concurrency_policy = 10;
  int32 cooldown_seconds = 11;
  repeated TriggerFilter filters = 12;
  repeated string payload_fields = 13;
}

message CreateTriggerResponse {
  Trigger trigger = 1;
  // One-time signing secret. Set only for HTTP triggers, and returned ONLY
  // here: bosso stores a form it cannot reverse, so it can never be read back.
  // Callers must show it once and never log it.
  string secret = 2;
}

// UpdateTriggerRequest changes only the fields that are present. A message
// field (launch, placement) replaces the whole message when set. Repeated
// fields cannot express "absent", so a non-empty list replaces the stored
// list, an empty list leaves it unchanged, and the matching should_clear_*
// flag clears it; a non-empty list together with its flag is INVALID_ARGUMENT.
message UpdateTriggerRequest {
  string id = 1;
  optional string name = 2;
  // Enable or disable the trigger.
  optional bool is_enabled = 3;
  // Replaces the type config when set; the arm must match the trigger's
  // existing trigger_type, which cannot change.
  oneof type_config {
    HttpTriggerConfig http = 4;
    GithubTriggerConfig github = 5;
  }
  optional string repo_origin_url = 6;
  TriggerLaunchSettings launch = 7;
  TriggerPlacement placement = 8;
  optional TriggerConcurrencyPolicy concurrency_policy = 9;
  optional int32 cooldown_seconds = 10;
  repeated TriggerFilter filters = 11;
  bool should_clear_filters = 12;
  repeated string payload_fields = 13;
  bool should_clear_payload_fields = 14;
}

message UpdateTriggerResponse {
  Trigger trigger = 1;
}

message DeleteTriggerRequest {
  string id = 1;
}

message DeleteTriggerResponse {}

message RotateTriggerSecretRequest {
  string id = 1;
}

message RotateTriggerSecretResponse {
  Trigger trigger = 1;
  // The new one-time signing secret, returned ONLY here. Callers must show it
  // once and never log it.
  string secret = 2;
}

message TestTriggerRequest {
  string trigger_id = 1;
  // Sample payload as a JSON object, evaluated as the request body (HTTP) or
  // event payload (GitHub).
  string sample_payload_json = 2;
  // Catalog event id the sample is treated as; required for GitHub triggers,
  // ignored for HTTP.
  string sample_event_type = 3;
  // Launch a real session when the sample passes every filter and policy.
  // False evaluates and records the decision only.
  bool should_launch = 4;
}

message TestTriggerResponse {
  TriggerInvocation invocation = 1;
}

message ListTriggerInvocationsRequest {
  string trigger_id = 1;
  // Maximum invocations to return. 0 means 50; values above 200 are capped
  // at 200.
  int32 limit = 2;
  // Page cursor, paired with before_id: pass the received_at and id of the
  // last invocation of the previous page. Returns only invocations that sort
  // after that one in (received_at DESC, id DESC) order, so invocations that
  // share a received_at are never skipped at a page boundary.
  optional google.protobuf.Timestamp before_received_at = 3;
  // Tiebreak for before_received_at: the id of the last invocation of the
  // previous page. Ignored unless before_received_at is set; when it is empty,
  // every invocation received at exactly before_received_at is excluded.
  optional string before_id = 4;
}

message ListTriggerInvocationsResponse {
  // Newest first by received_at, then by id descending.
  repeated TriggerInvocation invocations = 1;
}

// --- Bug reporting ---

message ReportBugRequest {
  string comment = 1;
  ReportContext context = 2;
}

message ReportBugResponse {
  string report_id = 1;
}

// ReportContext bundles everything the TUI attaches to a bug report.
// All fields are optional; the server tolerates empty values.
message ReportContext {
  // Client identity
  string boss_version = 1;
  string boss_commit = 2;
  string os = 3;
  string arch = 4;
  string terminal = 5;

  // Session state at report time.
  Session current_session = 6;
  repeated SessionSummary sessions = 7;
  map<string, string> daemon_statuses = 8;

  // Tailed log contents (last N lines each).
  string boss_log_tail = 9;
  string bossd_log_tail = 10;

  // Optionally populated — most recent Claude turns, if available.
  repeated ClaudeTurn recent_turns = 11;
}

// --- Read-tier MCP gateway parity (BOS-401) ---
// Session-scoped and session-less read proxies. All reuse daemon.proto response
// shapes field-for-field so the gateway can forward them directly.

// ProxyListChatsRequest reads a session's chats. session_id routes to the owning
// daemon (FindSessionDaemon) and scopes authz.
message ProxyListChatsRequest { string session_id = 1; }
message ProxyListChatsResponse { repeated ClaudeChat chats = 1; }

// ProxyGetChatStatusesRequest reads a session's per-chat statuses. session_id
// routes to the owning daemon (FindSessionDaemon) and scopes authz, matching
// ProxyListChatsRequest.
message ProxyGetChatStatusesRequest { string session_id = 1; }
message ProxyGetChatStatusesResponse { repeated ChatStatusEntry statuses = 1; }

// ProxyGetSessionStatusesRequest resolves each session's owning daemon and
// unions the returned statuses; unknown ids are skipped, not errored.
message ProxyGetSessionStatusesRequest { repeated string session_ids = 1; }
message ProxyGetSessionStatusesResponse { repeated SessionStatusEntry statuses = 1; }

// ProxyListCheckSnapshotsRequest reads a session's recent CI check snapshots.
// session_id routes to the owning daemon; limit defaults to 10 when zero.
message ProxyListCheckSnapshotsRequest {
  string session_id = 1;
  int32 limit = 2;
}
message ProxyListCheckSnapshotsResponse { repeated CheckSnapshot snapshots = 1; }

// ProxyListAgentsAggregatedRequest aggregates installed agents across the
// caller's Ready daemons (session-less). Distinct from the daemon-scoped
// ProxyListAgents, which takes a daemon_id.
message ProxyListAgentsAggregatedRequest {
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 1;
}
message ProxyListAgentsAggregatedResponse {
  repeated AgentInfo agents = 1;
  repeated OrganizationFleetReadFailure failed_organizations = 2;
}

// ProxyListPluginsRequest aggregates configured plugins across the caller's
// Ready daemons.
message ProxyListPluginsRequest {
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 1;
}
message ProxyListPluginsResponse {
  repeated InstalledPlugin plugins = 1;
  repeated OrganizationFleetReadFailure failed_organizations = 2;
}

// ProxyGetCronJobRequest returns the first Ready daemon that owns the id.
// An empty cron_job in the response => not found (bosso returns CodeNotFound).
message ProxyGetCronJobRequest {
  string id = 1;
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 2;
}
message ProxyGetCronJobResponse {
  CronJob cron_job = 1;
  repeated OrganizationFleetReadFailure failed_organizations = 2;
}

// ProxyRepairDoctorRequest merges repair-doctor reports across the caller's
// Ready daemons; when the caller has >1 Ready daemon, bosso prefixes each check
// name and log path with the daemon hostname for provenance.
message ProxyRepairDoctorRequest {
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 1;
}
message ProxyRepairDoctorResponse {
  repeated RepairDoctorCheck checks = 1;
  repeated RepairLogSnapshot recent_logs = 2;
  repeated OrganizationFleetReadFailure failed_organizations = 3;
}

// Destructive-tier proxy messages (BOS-404). Session-scoped requests carry the
// session id; close/resurrect return the updated Session, remove is Ok-only.
message ProxyCloseSessionRequest { string id = 1; }
message ProxyCloseSessionResponse { Session session = 1; }

message ProxyResurrectSessionRequest { string id = 1; }
message ProxyResurrectSessionResponse { Session session = 1; }

message ProxyRemoveSessionRequest { string id = 1; }
message ProxyRemoveSessionResponse {}

// ProxyEmptyTrash is daemon-wide (no session/repo id). older_than mirrors the
// daemon EmptyTrashRequest; the response sums deleted_count across the caller's
// Ready daemons.
message ProxyEmptyTrashRequest {
  optional google.protobuf.Timestamp older_than = 1;
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 2;
}
message ProxyEmptyTrashResponse {
  int32 deleted_count = 1;
  repeated OrganizationFleetReadFailure failed_organizations = 2;
  repeated OrganizationTrashDeletion deletions = 3;
}
message OrganizationTrashDeletion {
  string organization_id = 1;
  string organization_name = 2;
  int32 deleted_count = 3;
}

// SessionSummary is a lightweight view of a Session for report context.
message SessionSummary {
  string id = 1;
  string repo_id = 2;
  string title = 3;
  SessionState state = 4;
  optional int32 pr_number = 5;
  optional string pr_url = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ClaudeTurn is a single turn from a recent Claude conversation.
message ClaudeTurn {
  // "user" or "assistant".
  string role = 1;
  string content = 2;
  google.protobuf.Timestamp timestamp = 3;
}
