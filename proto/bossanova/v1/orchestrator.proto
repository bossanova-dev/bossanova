  string reauthorize_url = 2;
}

message RenameOrganizationRequest {
  string organization_id = 1;
  string name = 2;
}

message RenameOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationMembersRequest {
  string organization_id = 1;
}

message ListOrganizationMembersResponse {
  repeated OrganizationMember members = 1;
}

message InviteOrganizationMemberRequest {
  string organization_id = 1;
  string email = 2;
  MemberRole role = 3;
}

message InviteOrganizationMemberResponse {
  OrganizationMember member = 1;
}

message RemoveOrganizationMemberRequest {
  string organization_id = 1;
  string user_id = 2;
  string workos_membership_id = 3;
}

message RemoveOrganizationMemberResponse {}

message SetOrganizationMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  string workos_membership_id = 3;
  MemberRole role = 4;
}

