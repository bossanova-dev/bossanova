// --- Repo organization mappings ---

// RepoOrganizationMapping records which organization owns a repo, keyed by the
// repo's canonical origin URL. One organization per origin.
message RepoOrganizationMapping {
  string id = 1;
  // Canonical repo origin URL, the mapping key.
  string repo_origin_url = 2;
  string organization_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message SetRepoOrganizationRequest {
  string repo_origin_url = 1;
  string organization_id = 2;
}

message SetRepoOrganizationResponse {
  RepoOrganizationMapping mapping = 1;
}

message GetRepoOrganizationRequest {
  string repo_origin_url = 1;
}

message GetRepoOrganizationResponse {
  // Unset when the origin is unmapped; an unset mapping is the miss signal,
  // not an error.
  RepoOrganizationMapping mapping = 1;
}

message ClearRepoOrganizationRequest {
  string repo_origin_url = 1;
  // Deletes are scoped by organization as an authorization backstop, so the
  // wire carries the organization alongside the key.
  string organization_id = 2;
}

message ClearRepoOrganizationResponse {}

message ListRepoOrganizationsRequest {
  string organization_id = 1;
}

message ListRepoOrganizationsResponse {
  repeated RepoOrganizationMapping mappings = 1;
}

// --- Bug reporting ---

message ReportBugRequest {
  string comment = 1;
  ReportContext context = 2;
}

message ReportBugResponse {
  string report_id = 1;
}

// ReportContext bundles everything the TUI attaches to a bug report.
// All fields are optional; the server tolerates empty values.
message ReportContext {
  // Client identity
  string boss_version = 1;
  string boss_commit = 2;
  string os = 3;
  string arch = 4;
  string terminal = 5;

  // Session state at report time.
  Session current_session = 6;
  repeated SessionSummary sessions = 7;
  map<string, string> daemon_statuses = 8;

  // Tailed log contents (last N lines each).
  string boss_log_tail = 9;
  string bossd_log_tail = 10;

  // Optionally populated — most recent Claude turns, if available.
  repeated ClaudeTurn recent_turns = 11;
}

// --- Read-tier MCP gateway parity (BOS-401) ---
// Session-scoped and session-less read proxies. All reuse daemon.proto response
// shapes field-for-field so the gateway can forward them directly.

// ProxyListChatsRequest reads a session's chats. session_id routes to the owning
// daemon (FindSessionDaemon) and scopes authz.
message ProxyListChatsRequest { string session_id = 1; }
message ProxyListChatsResponse { repeated ClaudeChat chats = 1; }

// ProxyGetChatStatusesRequest reads a session's per-chat statuses. session_id
// routes to the owning daemon (FindSessionDaemon) and scopes authz, matching
// ProxyListChatsRequest.
message ProxyGetChatStatusesRequest { string session_id = 1; }
message ProxyGetChatStatusesResponse { repeated ChatStatusEntry statuses = 1; }

// ProxyGetSessionStatusesRequest resolves each session's owning daemon and
// unions the returned statuses; unknown ids are skipped, not errored.
message ProxyGetSessionStatusesRequest { repeated string session_ids = 1; }
message ProxyGetSessionStatusesResponse { repeated SessionStatusEntry statuses = 1; }

// ProxyListCheckSnapshotsRequest reads a session's recent CI check snapshots.
// session_id routes to the owning daemon; limit defaults to 10 when zero.
message ProxyListCheckSnapshotsRequest {
  string session_id = 1;
  int32 limit = 2;
}
message ProxyListCheckSnapshotsResponse { repeated CheckSnapshot snapshots = 1; }

// ProxyListAgentsAggregatedRequest aggregates installed agents across the
// caller's Ready daemons (session-less). Distinct from the daemon-scoped
// ProxyListAgents, which takes a daemon_id.
message ProxyListAgentsAggregatedRequest {}
message ProxyListAgentsAggregatedResponse { repeated AgentInfo agents = 1; }

// ProxyListPluginsRequest aggregates configured plugins across the caller's
// Ready daemons.
message ProxyListPluginsRequest {}
message ProxyListPluginsResponse { repeated InstalledPlugin plugins = 1; }

// ProxyGetCronJobRequest returns the first Ready daemon that owns the id.
// An empty cron_job in the response => not found (bosso returns CodeNotFound).
message ProxyGetCronJobRequest { string id = 1; }
message ProxyGetCronJobResponse { CronJob cron_job = 1; }

// ProxyRepairDoctorRequest merges repair-doctor reports across the caller's
// Ready daemons; when the caller has >1 Ready daemon, bosso prefixes each check
// name and log path with the daemon hostname for provenance.
message ProxyRepairDoctorRequest {}
message ProxyRepairDoctorResponse {
  repeated RepairDoctorCheck checks = 1;
  repeated RepairLogSnapshot recent_logs = 2;
}

// Destructive-tier proxy messages (BOS-404). Session-scoped requests carry the
// session id; close/resurrect return the updated Session, remove is Ok-only.
message ProxyCloseSessionRequest { string id = 1; }
message ProxyCloseSessionResponse { Session session = 1; }

message ProxyResurrectSessionRequest { string id = 1; }
message ProxyResurrectSessionResponse { Session session = 1; }

message ProxyRemoveSessionRequest { string id = 1; }
message ProxyRemoveSessionResponse {}

// ProxyEmptyTrash is daemon-wide (no session/repo id). older_than mirrors the
// daemon EmptyTrashRequest; the response sums deleted_count across the caller's
// Ready daemons.
message ProxyEmptyTrashRequest {
  optional google.protobuf.Timestamp older_than = 1;
}
message ProxyEmptyTrashResponse { int32 deleted_count = 1; }

// SessionSummary is a lightweight view of a Session for report context.
message SessionSummary {
  string id = 1;
  string repo_id = 2;
  string title = 3;
  SessionState state = 4;
  optional int32 pr_number = 5;
  optional string pr_url = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ClaudeTurn is a single turn from a recent Claude conversation.
message ClaudeTurn {
  // "user" or "assistant".
  string role = 1;
  string content = 2;
  google.protobuf.Timestamp timestamp = 3;
}
