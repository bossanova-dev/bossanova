}

// Notes proxy messages (BOS-552). The requests mirror the daemon.proto field
// sets; repo_id is the routing key, because a note is repo-scoped. Get/Update/
// Delete carry repo_id purely so bosso can route (the daemon addresses the note
// by id alone) — exactly the precedent set by ProxyDeleteGithubCallbackRequest,
// which carries target_chat_id for the same reason. Responses reuse the Note
// message from daemon.proto rather than redeclaring it.
//
// repo_id IS THE DAEMON-LOCAL repos.id — the value ResolveContext returns in
// Repo.id, and the same namespace CreateCronJobCommand.repo_id already uses. It
// is NOT the canonical origin URL that DaemonSnapshot.repo_ids advertises for
// webhook routing. Bosso resolves the owning daemon by asking the caller's Ready
// daemons for their repo lists, so passing an origin URL here resolves to
// NotFound.
//
// On Get/Update/Delete, repo_id ROUTES BUT DOES NOT SCOPE: once bosso has picked
// the daemon, the daemon addresses the note by id alone and does NOT verify that
// the note belongs to repo_id. Naming repo A while passing an id that lives in
// repo B on the same daemon therefore acts on B's note. This is not a privilege
// boundary — every candidate daemon is already the caller's own — but a client
// must not present repo_id to a user as a safety check.
message ProxyCreateNoteRequest {
  // Owning repository (daemon-local repos.id). Required — also the routing key.
  string repo_id = 1;
  // Optional provenance: which run recorded this note.
  optional string session_id = 2;
  optional string chat_id    = 3;
  // Stored verbatim. Must be non-empty after trimming and within the 64 KiB
  // cap, else InvalidArgument.
  string body = 4;
  // Trimmed, lowercased and de-duplicated before storage. At most 32 tags of
  // at most 64 bytes each (measured after trimming), else InvalidArgument.
  repeated string tags = 5;
  // Optional repo-scoped key for an atomic idempotent create. A retry with the
  // same key returns the original note without changing it.
  optional string idempotency_key = 6;
}
message ProxyCreateNoteResponse { Note note = 1; }

message ProxyGetNoteRequest {
  string repo_id = 1; // routing key only; the daemon resolves by id alone
  string id      = 2;
}
message ProxyGetNoteResponse { Note note = 1; }

// ProxyListNotesRequest mirrors ListNotesRequest: every filter is optional, an
// unset field is not constrained, and set fields intersect (AND). repo_id
// doubles as the routing key — set to a non-blank repos.id, the call goes to the
// owning daemon; unset, bosso fans out across the caller's Ready daemons. Set to
// the empty string it matches nothing (see below), and bosso answers with an
// empty list without asking any daemon.
message ProxyListNotesRequest {
  // Applied whenever the field is SET, including when set to the empty string:
  // the value is trimmed and compared with `=`, and blank provenance is stored
  // as NULL, so a set-but-blank filter matches NOTHING. Leave the field unset
  // to leave that column unconstrained; there is no way to ask for "notes with
  // no session".
  optional string repo_id    = 1;
  optional string session_id = 2;
  optional string chat_id    = 3;
  // Matches notes carrying ANY of these tags (OR), not all of them. Entries are
  // trimmed and lowercased to match the normalisation applied on write, and
  // blank entries are dropped. A non-empty list whose entries ALL normalise
  // away matches nothing rather than everything — the filter fails closed, so a
  // stray empty tag can never widen the result set.
  repeated string tags = 4;
  // Substring match on the body. SQL wildcards are matched literally, not as
  // patterns. Case-insensitivity is ASCII-only. A term that is blank after
  // trimming means NO search, unlike a blank tag entry, which matches nothing.
  optional string search = 5;
  // Caps the rows returned; zero or negative means unlimited. On an unfiltered
  // fan-out it is passed through to every daemon AND re-applied to the merged
  // list, so a caller asking for N always receives at most N — never N per
  // daemon. Because each daemon returns its own oldest `limit` notes, the merged
  // list truncated after the (created_at, id) sort is exactly the oldest `limit`
  // notes ACROSS THE DAEMONS THAT ANSWERED: the fan-out is fail-soft, so a
  // daemon that is offline or times out contributes nothing and is skipped
  // rather than failing the call.
  int32 limit = 6;
  // Target organization, if the caller needs one. Absent queries every
  // organization the caller belongs to. Set narrows after a membership check;
  // a non-member organization is denied rather than quietly widened. Before
  // V20260910 there was no field and this read resolved one organization.
  optional string organization_id = 7;
}
message ProxyListNotesResponse {
  repeated Note notes = 1;
  repeated OrganizationFleetReadFailure failed_organizations = 2;
}

message ProxyUpdateNoteRequest {
  string repo_id = 1; // routing key only; the daemon resolves by id alone
  string id      = 2;
  // Unset = leave the body alone.
  optional string body = 3;
  // Unset = leave the tags alone. SET = REPLACE the entire tag set with this
  // list, including replacing it with nothing when the list is empty.
  optional NoteTagSet tags = 4;
}
message ProxyUpdateNoteResponse { Note note = 1; }

message ProxyDeleteNoteRequest {
  string repo_id = 1; // routing key only; the daemon resolves by id alone
  string id      = 2;
}
message ProxyDeleteNoteResponse {}

// --- Organization notes (BOS-1349) ---

// OrganizationNoteOrigin records how a note entered the organization store.
enum OrganizationNoteOrigin {
  ORGANIZATION_NOTE_ORIGIN_UNSPECIFIED = 0;
  // Mirrored from a daemon by SyncDaemonNotes. The daemon stays the source of
  // truth: UpdateOrganizationNote answers FailedPrecondition (edit the note at
  // its source daemon), and DeleteOrganizationNote tombstones the source note
  // so a later sync of it is SUPPRESSED rather than resurrected.
  ORGANIZATION_NOTE_ORIGIN_SYNCED = 1;
  // Created through CreateOrganizationNote. Fully editable, and hard-deleted by
  // DeleteOrganizationNote.
  ORGANIZATION_NOTE_ORIGIN_API = 2;
}

// OrganizationNote is a note held by bosso on behalf of one organization: the
// aggregate of what its members' daemons recorded (origin SYNCED) plus notes
// written straight to the API (origin API).
//
// body is user content. It is returned on every read surface, exactly like the
// daemon Note, but bosso never writes it (or the tags) to logs or metrics.
//
// tags are normalised exactly like the daemon Note: trimmed, lowercased,
// de-duplicated, and returned in ascending order.
//
// Every note has a hard 90-day time to live. expires_at is fixed when the note
// is first stored (from the source note's creation time for a synced note) and
// is not extended by later edits or syncs. Once it passes, reads treat the note
// as absent (NotFound on Get, omitted from List) and the row is deleted.
message OrganizationNote {
  string id = 1;
  // bosso-local organization row id (Organization.id).
  string organization_id = 2;
  // The user who wrote the note: the caller of CreateOrganizationNote, or the
  // owner of the daemon that synced it.
  string author_user_id = 3;
  OrganizationNoteOrigin origin = 4;
  // Provenance of a synced note: the daemon that sent it, the note's id in
  // that daemon's store, and the version last applied. Meaningful only when
  // origin is SYNCED; clients must not interpret them for API notes.
  string source_daemon_id = 5;
  string source_note_id = 6;
  int64 source_version = 7;
  // Canonical repository origin URL the note is about; empty when the note is
  // not repository-scoped.
  string repo_origin_url = 8;
  // Provenance only, never foreign keys: the session and chat that recorded the
  // note, which may no longer exist. Empty when not session- or chat-scoped.
  string session_id = 9;
  string chat_id = 10;
  string body = 11;
  repeated string tags = 12;
  // Creation and last-edit time at the source daemon. Meaningful only when
  // origin is SYNCED.
  google.protobuf.Timestamp source_created_at = 13;
  google.protobuf.Timestamp source_updated_at = 14;
  // When bosso first stored the note, and when bosso last changed it.
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The hard 90-day TTL deadline (see the message comment).
  google.protobuf.Timestamp expires_at = 17;
}

// OrganizationNoteQuota is one organization's write quota for the current
// window. The window is a fixed UTC clock hour (for example 14:00:00 to
// 15:00:00 UTC), not a rolling 60 minutes: used_count resets to zero at
// window_resets_at. The limit is configured server-side and is the same for
// every organization.
message OrganizationNoteQuota {
  string organization_id = 1;
  // Writes the organization may make per window.
  int32 hourly_limit = 2;
  // Writes consumed in the current window.
  int32 used_count = 3;
  // Start of the current window (the top of the UTC hour).
  google.protobuf.Timestamp window_started_at = 4;
  // End of the current window, when used_count resets. Retry after this time.
  google.protobuf.Timestamp window_resets_at = 5;
}

// OrganizationNoteQuotaExceeded is the error detail attached to the
// ResourceExhausted error a write returns when the organization's quota for
// the current window is spent, so a client can show usage and the reset time
// without a second call.
message OrganizationNoteQuotaExceeded {
  OrganizationNoteQuota quota = 1;
}

message CreateOrganizationNoteRequest {
  // Target organization. Required; the caller must be a member.
  string organization_id = 1;
  // Must be non-empty after trimming and within the same 64 KiB cap as the
  // daemon Note, else InvalidArgument. Stored verbatim.
  string body = 2;
  // Normalised like the daemon Note. At most 32 tags of at most 64 bytes each
  // (measured after trimming), else InvalidArgument.
  repeated string tags = 3;
  // Optional repository the note is about. Canonicalised the same way as a
  // repository-organization mapping; a malformed URL is InvalidArgument.
  optional string repo_origin_url = 4;
  // Optional provenance.
  optional string session_id = 5;
  optional string chat_id = 6;
  // Optional key for an idempotent create, scoped to (organization_id, caller).
  // A retry with the same key returns the original note unchanged and consumes
  // no quota. The key is remembered for as long as that note exists (until it
  // is deleted or expires). Reusing a key with a different body or tags is
  // AlreadyExists.
  optional string idempotency_key = 7;
}
message CreateOrganizationNoteResponse { OrganizationNote note = 1; }

message GetOrganizationNoteRequest {
  string organization_id = 1;
  string id = 2;
}
message GetOrganizationNoteResponse { OrganizationNote note = 1; }

// ListOrganizationNotesRequest lists one organization's unexpired notes. Every
// filter is optional; an unset filter is unconstrained and set filters
// intersect (AND).
message ListOrganizationNotesRequest {
  // Target organization. Required; the caller must be a member.
  string organization_id = 1;
  optional string author_user_id = 2;
  optional string repo_origin_url = 3;
  optional string session_id = 4;
  // Matches notes carrying ANY of these tags (OR), normalised like the daemon
  // ListNotesRequest.tags filter.
  repeated string tags = 5;
  // Substring match on the body. A term that is blank after trimming means no
  // search.
  optional string search = 6;
  // Maximum notes per page. Zero or negative means the server default (50);
  // values above 200 are clamped to 200.
  int32 page_size = 7;
  // Opaque next_page_token from a previous response with the same filters.
  // Empty asks for the first page; a malformed token is InvalidArgument.
  string page_token = 8;
}
message ListOrganizationNotesResponse {
  // One page, in a stable server-defined order that does not shift between
  // pages.
  repeated OrganizationNote notes = 1;
  // Pass as page_token to fetch the next page. Empty on the last page.
  string next_page_token = 2;
}

// UpdateOrganizationNoteRequest edits an API-origin note. A synced note is
// FailedPrecondition: edit it at its source daemon.
message UpdateOrganizationNoteRequest {
  string organization_id = 1;
  string id = 2;
  // Unset = leave the body alone.
  optional string body = 3;
  // Unset = leave the tags alone. SET = REPLACE the entire tag set with this
  // list, including replacing it with nothing when the list is empty.
  optional NoteTagSet tags = 4;
}
message UpdateOrganizationNoteResponse { OrganizationNote note = 1; }

// DeleteOrganizationNoteRequest hard-deletes an API-origin note, and
// tombstones a synced one so the source daemon cannot sync it back.
message DeleteOrganizationNoteRequest {
  string organization_id = 1;
  string id = 2;
}
message DeleteOrganizationNoteResponse {}

message GetOrganizationNoteQuotaRequest {
  string organization_id = 1;
}
message GetOrganizationNoteQuotaResponse { OrganizationNoteQuota quota = 1; }

// SyncDaemonNotesRequest is one batch of daemon note changes. At most 50 items,
// each within the per-note body and tag limits. Only a malformed batch as a
// whole fails the call with InvalidArgument: more than 50 items, an empty
// source_note_id, a non-positive source_version, or the same source_note_id
// twice. Every other problem is a per-item NoteSyncOutcome, so a batch is never
// all-or-nothing and is safe to resend: replays come back STALE and never
// duplicate a note.
message SyncDaemonNotesRequest {
  repeated NoteSyncItem items = 1;
}

// NoteSyncItem is the current state of one daemon-local note.
message NoteSyncItem {
  // The note's id in the daemon's store. Together with the authenticated
  // daemon it identifies the cloud copy.
  string source_note_id = 1;
  // Monotonic per source note; the cloud keeps the highest version it has
  // applied and answers STALE for anything not newer.
  int64 source_version = 2;
  // Canonical origin URL of the note's repository. Picks the organization: an
  // unmapped repository routes to the daemon owner's personal organization; a
  // mapped one routes to its mapped organization when the owner is a member of
  // it, and is ORGANIZATION_REFUSED otherwise.
  string repo_origin_url = 3;
  string session_id = 4;
  string chat_id = 5;
  string body = 6;
  repeated string tags = 7;
  google.protobuf.Timestamp source_created_at = 8;
  google.protobuf.Timestamp source_updated_at = 9;
  // True when the note was deleted on the daemon. The cloud copy is
  // tombstoned, no quota is consumed, and the result is SYNCED even when no
  // cloud copy existed.
  bool is_deleted = 10;
}

// NoteSyncOutcome is the result for one NoteSyncItem.
enum NoteSyncOutcome {
  NOTE_SYNC_OUTCOME_UNSPECIFIED = 0;
  // Applied (or tombstoned). organization_id and organization_note_id are set.
  NOTE_SYNC_OUTCOME_SYNCED = 1;
  // The cloud already holds this source_version or a newer one; nothing
  // changed and no quota was consumed. A replay or reorder, not an error.
  NOTE_SYNC_OUTCOME_STALE = 2;
  // The item failed per-item validation (for example an empty or oversized
  // body, or invalid tags). reason says why. Do not retry unchanged.
  NOTE_SYNC_OUTCOME_REJECTED = 3;
  // The organization's hourly quota is spent. Retry at or after retry_at.
  NOTE_SYNC_OUTCOME_RATE_LIMITED = 4;
  // The source note is already past the 90-day TTL; nothing was stored.
  NOTE_SYNC_OUTCOME_EXPIRED = 5;
  // The resolved organization does not have the paid-plan entitlement.
  NOTE_SYNC_OUTCOME_NOT_ENTITLED = 6;
  // The repository is mapped to an organization the daemon owner is not a
  // member of, so the note was refused rather than routed elsewhere.
  NOTE_SYNC_OUTCOME_ORGANIZATION_REFUSED = 7;
  // The cloud copy was deleted through DeleteOrganizationNote, which tombstoned
  // this source note. It will never be accepted again; stop retrying it.
  NOTE_SYNC_OUTCOME_SUPPRESSED = 8;
}

message SyncDaemonNotesResponse {
  // Exactly one result per request item, in request order.
  repeated NoteSyncResult results = 1;
}

message NoteSyncResult {
  // Echo of the item's source_note_id and source_version.
  string source_note_id = 1;
  int64 source_version = 2;
  NoteSyncOutcome outcome = 3;
  // The organization the item resolved to, and the cloud note id. Set on
  // SYNCED; otherwise set when known.
  string organization_id = 4;
  string organization_note_id = 5;
  // Human-readable explanation for REJECTED (and any other non-SYNCED outcome
  // when available). Never contains the note body.
  string reason = 6;
  // Set on RATE_LIMITED: the end of the organization's quota window
  // (OrganizationNoteQuota.window_resets_at).
  google.protobuf.Timestamp retry_at = 7;
}

message ProxyRunCronJobNowRequest { string daemon_id = 1; string id = 2; }
message ProxyRunCronJobNowResponse { Session session = 1; string skipped_reason = 2; }

// ProxyStreamChatsRequest selects the session whose chat list (and per-chat
// statuses) the caller wants to follow. The orchestrator resolves the owning
// daemon and forwards live ChatDelta / ChatStatusDelta events.
message ProxyStreamChatsRequest {
  string session_id = 1;
}

// ProxyChatListEvent is a single event in the proxied chat-list stream.
// Bosso sends a ProxyChatListSnapshot first, then forwards live deltas, and
// finally a DaemonOffline (or a SessionDelta with KIND_DELETED for the
// watched session) as a terminal event.
message ProxyChatListEvent {
  oneof event {
    // First event on every connect. Replaces any prior client state.
    ProxyChatListSnapshot snapshot = 1;
    // Forwarded verbatim from the daemon (defined in stream.proto).
    ChatDelta chat_delta = 2;
    // Forwarded verbatim from the daemon (defined in stream.proto).
    ChatStatusDelta status_delta = 3;
    // Forwarded only on KIND_DELETED for the watched session — signals the
    // session itself was removed and the stream should close.
    SessionDelta session_delta = 4;
    // Terminal event when the owning daemon disconnects.
    DaemonOffline daemon_offline = 5;
  }
}

// ProxyChatListSnapshot is the required first event on every
// ProxyStreamChats connection. It carries the current chat list and live
// per-chat statuses for the requested session.
message ProxyChatListSnapshot {
  string session_id = 1;
  string daemon_id = 2;
  repeated ClaudeChatMetadata chats = 3;
  repeated ChatStatusEntry statuses = 4;
}

// DaemonOffline is the terminal event emitted by the orchestrator when the
// owning daemon's stream goes offline mid-subscription. The client should
// treat this as a signal to retry later.
message DaemonOffline {
  string daemon_id = 1;
  // Optional reason for logs/diagnostics.
  string reason = 2;
}

// --- Attach token (web tmux-attach feature) ---

// IssueAttachTokenRequest asks bosso for a short-lived JWT bound to the
// triple (session_id, chat_id, scope). Bosso validates that
// chat ∈ session ∈ caller-user before signing the token.
message IssueAttachTokenRequest {
  string session_id = 1;
  string chat_id = 2;
  // EDITOR or VIEWER. Only EDITOR is used in v1 — VIEWER is accepted and
  // behaves identically for now (see the plan's deferred items).
  AttachScope scope = 3;
}

// IssueAttachTokenResponse carries the freshly-minted attach JWT and its
// expiry. The browser sends `token` as the second value of the
// `Sec-WebSocket-Protocol` header on the /ws/attach handshake.
message IssueAttachTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// AttachScope distinguishes editor (input allowed) from viewer (read-only)
// attach modes. v1 ships only EDITOR semantics; VIEWER is wire-reserved.
enum AttachScope {
  // Default zero value. Bosso MUST reject IssueAttachToken requests with
  // this scope — do not silently default to EDITOR.
  ATTACH_SCOPE_UNSPECIFIED = 0;
  ATTACH_SCOPE_EDITOR = 1;
  // Accepted but behaves identically to EDITOR in v1.
  ATTACH_SCOPE_VIEWER = 2;
}

