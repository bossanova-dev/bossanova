syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "bossanova/v1/models.proto";
import "google/protobuf/timestamp.proto";

// TaskSourceService pulls tasks from external systems (eg. Linear, GitHub Issues)
// and converts them into session-creation requests.
service TaskSourceService {
  // GetInfo returns the plugin's name, version, and capabilities.
  rpc GetInfo(TaskSourceServiceGetInfoRequest) returns (TaskSourceServiceGetInfoResponse);

  // PollTasks returns tasks that are ready to become sessions.
  rpc PollTasks(PollTasksRequest) returns (PollTasksResponse);

  // UpdateTaskStatus reports the outcome of a session back to the source.
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);

  // ListAvailableIssues returns browsable issues from the external tracker.
  rpc ListAvailableIssues(ListAvailableIssuesRequest) returns (ListAvailableIssuesResponse);
}

// EventSourceService streams events from external systems (eg. webhooks, polls)
// into the daemon's event bus.
service EventSourceService {
  // GetInfo returns the plugin's name, version, and capabilities.
  rpc GetInfo(EventSourceServiceGetInfoRequest) returns (EventSourceServiceGetInfoResponse);

  // StreamEvents opens a server-streaming RPC that pushes events to the daemon.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

// SchedulerService triggers time-based jobs (eg. cron-style recurring tasks).
service SchedulerService {
  // GetInfo returns the plugin's name, version, and capabilities.
  rpc GetInfo(SchedulerServiceGetInfoRequest) returns (SchedulerServiceGetInfoResponse);

  // GetSchedule returns the set of scheduled jobs this plugin manages.
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);

  // ExecuteJob runs a scheduled job and returns the action to take.
  rpc ExecuteJob(ExecuteJobRequest) returns (ExecuteJobResponse);
}

// --- Plugin Identity ---

// PluginInfo describes a plugin's identity and capabilities.
message PluginInfo {
  string name = 1;
  string version = 2;
  repeated string capabilities = 3;
  // user_settings describes plugin-tunable settings that the boss TUI
  // renders as a section in the settings page. Empty list = no user-
  // facing settings for this plugin.
  repeated UserSetting user_settings = 4;
  // user_initiated marks a task source that is driven on-demand rather than
  // polled. When true, the task orchestrator skips PollTasks for this plugin.
  bool user_initiated = 5;
}

// Per-service GetInfo request/response types to satisfy buf lint uniqueness.

message TaskSourceServiceGetInfoRequest {}

message TaskSourceServiceGetInfoResponse {
  PluginInfo info = 1;
}

message EventSourceServiceGetInfoRequest {}

message EventSourceServiceGetInfoResponse {
  PluginInfo info = 1;
}

message SchedulerServiceGetInfoRequest {}

message SchedulerServiceGetInfoResponse {
  PluginInfo info = 1;
}

// --- TaskSource Messages ---

message PollTasksRequest {
  // Optional filter by repo origin URL.
  optional string repo_origin_url = 1;
}

message PollTasksResponse {
  repeated TaskItem tasks = 1;
}

// TaskAction specifies what the daemon should do with a task.
enum TaskAction {
  TASK_ACTION_UNSPECIFIED = 0;    // Daemon treats as CREATE_SESSION.
  TASK_ACTION_AUTO_MERGE = 1;     // Merge PR directly (no Claude session).
  TASK_ACTION_CREATE_SESSION = 2; // Create Claude Code session with plan.
  TASK_ACTION_NOTIFY_USER = 3;    // Skip action, notify user (eg. previously-rejected).
}

// TaskItem is a task from an external system ready to become a session.
message TaskItem {
  // External system's unique ID for this task.
  string external_id = 1;
  // Human-readable title for the session.
  string title = 2;
  // The plan / instructions for Claude.
  string plan = 3;
  // Repo origin URL to match against registered repos.
  string repo_origin_url = 4;
  // Base branch to create the session from.
  string base_branch = 5;
  // Priority (lower = higher priority).
  int32 priority = 6;
  // Labels / tags from the external system.
  repeated string labels = 7;
  // What the daemon should do with this task.
  TaskAction action = 8;
  // Existing branch to check out (eg. dependabot's PR branch).
  string existing_branch = 9;
}

message UpdateTaskStatusRequest {
  // The external ID of the task to update.
  string external_id = 1;
  // The new status to report.
  TaskItemStatus status = 2;
  // Optional details (eg. PR URL, error message).
  string details = 3;
}

message UpdateTaskStatusResponse {}

// TaskItemStatus represents the lifecycle of a task sourced from an external system.
enum TaskItemStatus {
  TASK_ITEM_STATUS_UNSPECIFIED = 0;
  TASK_ITEM_STATUS_IN_PROGRESS = 1;
  TASK_ITEM_STATUS_COMPLETED = 2;
  TASK_ITEM_STATUS_FAILED = 3;
}

message ListAvailableIssuesRequest {
  string repo_origin_url = 1;
  map<string, string> config = 2;
  string query = 3;
}

message ListAvailableIssuesResponse {
  repeated TrackerIssue issues = 1;
}

// --- EventSource Messages ---

message StreamEventsRequest {
  // Optional filter: only stream events for these repo origin URLs.
  repeated string repo_origin_urls = 1;
}

// StreamEventsResponse wraps a single event notification from a plugin.
message StreamEventsResponse {
  EventNotification notification = 1;
}

// EventNotification wraps all possible plugin events in a oneof.
message EventNotification {
  // When this event occurred.
  google.protobuf.Timestamp timestamp = 1;
  // The source plugin name.
  string source = 2;

  oneof event {
    TaskReadyEvent task_ready = 10;
    TaskUpdatedEvent task_updated = 11;
    ExternalCheckEvent external_check = 12;
    CustomEvent custom = 20;
  }
}

// TaskReadyEvent signals that a new task is available for session creation.
message TaskReadyEvent {
  TaskItem task = 1;
}

// TaskUpdatedEvent signals that an external task was updated (eg. re-prioritized).
message TaskUpdatedEvent {
  string external_id = 1;
  // The updated fields.
  optional string title = 2;
  optional int32 priority = 3;
  repeated string labels = 4;
}

// ExternalCheckEvent signals an external check result (eg. from a non-GitHub CI).
message ExternalCheckEvent {
  string repo_origin_url = 1;
  int32 pr_id = 2;
  string check_name = 3;
  bool passed = 4;
  string details = 5;
}

// CustomEvent is an extensibility point for plugin-specific events.
message CustomEvent {
  string event_type = 1;
  // JSON-encoded payload.
  string payload = 2;
}

// --- Scheduler Messages ---

message GetScheduleRequest {}

message GetScheduleResponse {
  repeated ScheduledJob jobs = 1;
}

// ScheduledJob describes a recurring job managed by the scheduler plugin.
message ScheduledJob {
  // Unique ID for this job within the plugin.
  string id = 1;
  // Human-readable name.
  string name = 2;
  // Cron expression (eg. "0 9 * * MON").
  string cron_expr = 3;
  // Repo origin URL this job targets.
  string repo_origin_url = 4;
  // Whether this job is currently enabled.
  bool is_enabled = 5;
  // When this job last ran.
  optional google.protobuf.Timestamp last_run = 6;
  // When this job is next scheduled to run.
  optional google.protobuf.Timestamp next_run = 7;
}

message ExecuteJobRequest {
  // The job ID to execute.
  string job_id = 1;
}

message ExecuteJobResponse {
  // The action the daemon should take.
  JobAction action = 1;
}

// JobAction wraps the possible outcomes of a scheduled job execution.
message JobAction {
  oneof action {
    CreateSessionAction create_session = 1;
    NoOpAction no_op = 2;
  }
}

// CreateSessionAction tells the daemon to create a new session.
message CreateSessionAction {
  string title = 1;
  string plan = 2;
  string repo_origin_url = 3;
  string base_branch = 4;
}

// NoOpAction indicates the job ran but no action is needed.
message NoOpAction {
  string reason = 1;
}

// --- WorkflowService ---

// WorkflowService orchestrates end-to-end plan execution by sequentially
// invoking boss- skills (plan → implement → handoff/resume loop → verify → land).
service WorkflowService {
  // GetInfo returns the plugin's name, version, and capabilities.
  rpc GetInfo(WorkflowServiceGetInfoRequest) returns (WorkflowServiceGetInfoResponse);

  // StartWorkflow begins a new autopilot workflow for a plan file.
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);

  // PauseWorkflow gracefully pauses a running workflow after the current flight leg.
  rpc PauseWorkflow(PauseWorkflowRequest) returns (PauseWorkflowResponse);

  // ResumeWorkflow resumes a paused workflow from where it left off.
  rpc ResumeWorkflow(ResumeWorkflowRequest) returns (ResumeWorkflowResponse);

  // CancelWorkflow terminates a workflow. If a flight leg is running, waits for
  // it to finish then marks the workflow as cancelled.
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);

  // GetWorkflowStatus returns the current status of a workflow.
  rpc GetWorkflowStatus(GetWorkflowStatusRequest) returns (GetWorkflowStatusResponse);

  // NotifyStatusChange is called by the daemon when a PR's display status changes.
  rpc NotifyStatusChange(NotifyStatusChangeRequest) returns (NotifyStatusChangeResponse);
}

message WorkflowServiceGetInfoRequest {}

message WorkflowServiceGetInfoResponse {
  PluginInfo info = 1;
}

message StartWorkflowRequest {
  // Path to the plan file (relative to repo root).
  string plan_path = 1;
  // The session this workflow belongs to.
  string session_id = 2;
  // The repo this workflow operates on.
  string repo_id = 3;
  // Override max flight legs (0 = use default).
  int32 max_legs = 4;
  // Pause for user confirmation before landing.
  bool confirm_land = 5;
  // JSON-encoded config overrides.
  string config_json = 6;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  WorkflowStatusInfo status = 2;
}

message PauseWorkflowRequest {
  string workflow_id = 1;
}

message PauseWorkflowResponse {
  WorkflowStatusInfo status = 1;
}

message ResumeWorkflowRequest {
  string workflow_id = 1;
}

message ResumeWorkflowResponse {
  WorkflowStatusInfo status = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
}

message CancelWorkflowResponse {
  WorkflowStatusInfo status = 1;
}

message GetWorkflowStatusRequest {
  string workflow_id = 1;
}

message GetWorkflowStatusResponse {
  WorkflowStatusInfo status = 1;
}

// WorkflowStatusInfo is the status snapshot returned by the plugin.
message WorkflowStatusInfo {
  string id = 1;
  WorkflowStatus status = 2;
  WorkflowStep current_step = 3;
  int32 flight_leg = 4;
  string last_error = 5;
  google.protobuf.Timestamp started_at = 6;
}

message NotifyStatusChangeRequest {
  // Session ID whose PR status changed.
  string session_id = 1;
  // New display status.
  DisplayStatus display_status = 2;
  // Whether the PR has failing checks.
  bool has_failures = 3;
}

message NotifyStatusChangeResponse {}

// --- AgentRunnerService ---

// AgentRunnerService is served by coding-agent plugins (e.g. claude,
// opencode, codex). The daemon spawns one such plugin and routes session
// runs through it.
service AgentRunnerService {
  rpc GetInfo(AgentRunnerServiceGetInfoRequest)
      returns (AgentRunnerServiceGetInfoResponse);

  // Validate an explicit headless capability profile against the agent's
  // runtime operation surface without starting a run.
  rpc PreflightHeadlessRun(PreflightHeadlessRunRequest)
      returns (PreflightHeadlessRunResponse);

  // Spawn the agent in work_dir with plan piped to stdin. log_path is
  // bossd-owned (under the daemon's data dir, NOT the worktree); the
  // plugin opens it with openat(O_NOFOLLOW) and writes one NDJSON line
  // per output line: {"ts": "...", "text": "..."}. resume_id (optional)
  // makes the agent resume that session. session_id (optional) makes the
  // plugin use it; otherwise the plugin generates one. Returns the
  // resolved session ID.
  rpc StartRun(StartAgentRunRequest) returns (StartAgentRunResponse);

  // Send SIGTERM (then SIGKILL after WaitDelay) to the named run.
  rpc StopRun(StopAgentRunRequest) returns (StopAgentRunResponse);

  // Liveness check.
  rpc IsRunning(IsAgentRunningRequest) returns (IsAgentRunningResponse);

  // Final exit status. exit_error is empty on clean exit. is_complete
  // is false if the run is still active.
  rpc ExitStatus(AgentExitStatusRequest) returns (AgentExitStatusResponse);

  // Configure the agent's "tell bossd when the run finishes" hook. For
  // Claude this writes .claude/settings.local.json. Returns
  // is_supported=false for agents without one.
  rpc ConfigureFinalizeHook(ConfigureFinalizeHookRequest)
      returns (ConfigureFinalizeHookResponse);

  // Remove the run-scoped Stop-hook entry a prior ConfigureFinalizeHook (with
  // a non-empty agent_session_id) installed. Called by the daemon when a run
  // completes so a finished run's completion ping can't linger in the
  // worktree's settings.local.json. No-op (is_supported may be false) for
  // agents without a finalize hook. Idempotent: removing an absent entry
  // succeeds.
  rpc RemoveAgentRunHook(RemoveAgentRunHookRequest)
      returns (RemoveAgentRunHookResponse);

  // Build the argv for an interactive (tmux-hosted) launch. argv MUST
  // tee stdout/stderr to log_path so AttachSession can read it.
  rpc BuildInteractiveCommand(BuildInteractiveCommandRequest)
      returns (BuildInteractiveCommandResponse);

  // ResolveInteractiveSessionID discovers the provider-owned session ID for an
  // interactive tmux launch. Agents that accept caller-provided IDs may return
  // requested_session_id. Agents like Codex scan their transcript store.
  rpc ResolveInteractiveSessionID(ResolveInteractiveSessionIDRequest)
      returns (ResolveInteractiveSessionIDResponse);

  // Files in workDir that the agent owns (e.g. .claude/settings.local.json).
  // bossd unions these into git-status filtering.
  rpc ListIgnoredDirtyFiles(ListIgnoredDirtyFilesRequest)
      returns (ListIgnoredDirtyFilesResponse);

  // Title from the agent's transcript for a given run.
  rpc GetChatTitle(GetChatTitleRequest) returns (GetChatTitleResponse);

  // SuggestPRTitle asks the agent to propose a concise pull-request title from
  // the git history + PR description, returning the current title UNCHANGED when
  // it already describes the change accurately. The daemon uses this at cron
  // finalize instead of deriving the title from the last commit subject.
  // supported=false (or any error) means "agent has no opinion" — the daemon
  // then falls back to its deterministic title heuristic, so plugins that do not
  // implement this stay correct.
  rpc SuggestPRTitle(SuggestPRTitleRequest) returns (SuggestPRTitleResponse);

  // HasQuestionPrompt scans pane content for the agent's TUI grammar that
  // signals "waiting for the user to answer a question." Plugin owns its
  // grammar; daemon owns the timing logic that combines this with content-
  // change detection.
  rpc HasQuestionPrompt(HasQuestionPromptRequest) returns (HasQuestionPromptResponse);

  // HasWorkingIndicator scans pane content for the agent's TUI grammar that
  // signals "still actively working" (e.g. a running background shell or an
  // active spinner), even when the pane is otherwise static. Plugin owns its
  // grammar; the daemon uses it to keep a busy-but-static pane from flipping
  // idle. Consulted only in the would-be-idle branch, so active chats pay no
  // extra RPC.
  rpc HasWorkingIndicator(HasWorkingIndicatorRequest) returns (HasWorkingIndicatorResponse);

  // LastTurnIsUser reports whether the most recent meaningful turn in the
  // agent's transcript is a user message (not a tool-result-only entry).
  // Used to suppress the QUESTION status when the user has already replied.
  rpc LastTurnIsUser(LastTurnIsUserRequest) returns (LastTurnIsUserResponse);

  // DetectUsageLimit scans pane content for the agent's usage-cap banner in
  // the CLI-owned status region below the bottom-most prompt marker. Plugin
  // owns the per-agent banner grammar; the daemon owns the LIMITED status
  // transition and reset-time plumbing. Fail-safe: no status-region match =>
  // limited=false. reset_at is absent when no reset time is parseable.
  rpc DetectUsageLimit(DetectUsageLimitRequest) returns (DetectUsageLimitResponse);

  // ProbeRateLimit authoritatively reports the target account's usage-cap
  // posture by querying the provider directly (claude: GET /api/oauth/usage;
  // codex: the rollout JSONL under CODEX_HOME) rather than scraping the TUI.
  // credential_env carries that account's materialized env overlay so bossd can
  // probe ANY account on demand; it is secret-bearing and NEVER logged.
  // Providers without a probe return status=RATE_LIMIT_PLAN_STATUS_UNSUPPORTED,
  // limited=false (fail-safe).
  rpc ProbeRateLimit(ProbeRateLimitRequest) returns (ProbeRateLimitResponse);

  // TranscriptExists reports whether a non-empty transcript file is present
  // on disk for (work_dir, agent_session_id). Used by wake-up logic to
  // choose between resume and fresh-start argv.
  rpc TranscriptExists(TranscriptExistsRequest) returns (TranscriptExistsResponse);

  // ReadTranscript parses the agent's on-disk transcript for a chat and returns
  // its messages plus the derived final assistant message. Each plugin resolves
  // the transcript path the same way it does for TranscriptExists.
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse);

  // RotationCapability reports whether this agent supports account rotation and,
  // if so, how its credentials are injected (an env token like
  // CLAUDE_CODE_OAUTH_TOKEN, or a per-account home dir like CODEX_HOME). Agents
  // that do not implement it (codes.Unimplemented) degrade to status-only:
  // supports_rotation=false, never an error.
  rpc RotationCapability(RotationCapabilityRequest) returns (RotationCapabilityResponse);

  // MaterializeAccount turns an opaque, provider-specific credential blob into a
  // concrete process-credential spec: an environment overlay (e.g.
  // CLAUDE_CODE_OAUTH_TOKEN) and/or home-dir files (e.g. codex auth.json) plus
  // the env key that must point at that home dir (home_dir_env_key, e.g.
  // CODEX_HOME). Only the owning plugin ever sees its provider's blob. The blob
  // and all returned secret material are NEVER logged.
  //
  // codex note: the returned home-dir spec assumes a BASE-SEEDED codex home —
  // the per-account dir must have its sessions/ (and session_index.jsonl) shared
  // or symlinked from a shared base home, with only auth.json written fresh.
  // BOS-158 proved a per-account home whose sessions/ lacks the rollout fails
  // fast (thread/resume: no rollout found ... code -32600). Seeding sessions/ is
  // BOS-162's credmaterialize executor's job, NOT this RPC's; MaterializeAccount
  // returns only auth.json + HomeDirEnvKey=CODEX_HOME. See
  // docs/solutions/account-rotation/spike-cross-account-resume-credential-isolation.md.
  rpc MaterializeAccount(MaterializeAccountRequest) returns (MaterializeAccountResponse);
}

message AgentRunnerServiceGetInfoRequest {}
message AgentRunnerServiceGetInfoResponse {
  PluginInfo info = 1;
}

// HeadlessCapabilityProfile is an explicit, versioned contract for work that
// needs a particular runtime operation surface. UNSPECIFIED preserves every
// historical launch shape; callers must opt in rather than deriving a profile
// from a prompt or command name.
enum HeadlessCapabilityProfile {
  HEADLESS_CAPABILITY_PROFILE_UNSPECIFIED = 0;
  HEADLESS_CAPABILITY_PROFILE_TRACKER_PLAN_ATTACHMENT_V1 = 1;
}

message PreflightHeadlessRunRequest {
  string model = 1;
  map<string, string> extra_env = 2;
  HeadlessCapabilityProfile headless_capability_profile = 3;
}

message PreflightHeadlessRunResponse {
  string source = 1;
  repeated string provided = 2;
}

message StartAgentRunRequest {
  string work_dir = 1;
  string plan = 2;
  optional string resume_id = 3;
  string session_id = 4;   // empty = plugin generates
  string log_path = 5;     // bossd-owned, openat(O_NOFOLLOW)
  string model = 6;        // opaque agent model id; "" = plugin default. Never enumerated by bossd.
  // extra_env is an allowlisted, daemon-resolved environment overlay applied to
  // the spawned agent process on top of the inherited environment. It carries
  // proof credentials/constants AND (for account rotation) the account's env
  // overlay (e.g. CLAUDE_CODE_OAUTH_TOKEN / CODEX_HOME). Values are NEVER logged
  // by bossd or the plugin — treat as secret-bearing.
  map<string, string> extra_env = 7;
  // Explicit required runtime operation surface for a headless launch. The
  // zero/default profile is legacy-compatible and performs no preflight.
  HeadlessCapabilityProfile headless_capability_profile = 8;
}
message StartAgentRunResponse {
  string session_id = 1;   // resolved session ID
}

message StopAgentRunRequest {
  string session_id = 1;
}
message StopAgentRunResponse {}

message IsAgentRunningRequest {
  string session_id = 1;
}
message IsAgentRunningResponse {
  bool running = 1;
}

message AgentExitStatusRequest {
  string session_id = 1;
}
message AgentExitStatusResponse {
  bool is_complete = 1;
  string exit_error = 2; // empty on clean exit
  // failure_class is the shared agenterr taxonomy string (e.g.
  // "usage_exhausted", "auth_invalidated") when the plugin classified the
  // exit as a known cap/auth failure; unset otherwise. Read-only signal —
  // the daemon logs it and (later) reacts, but exit_error is untouched.
  optional string failure_class = 3;
  // reset_at is the parsed usage-cap reset time, set only alongside a
  // "usage_exhausted" failure_class when the banner carried a parseable
  // reset. Unset when unknown.
  optional google.protobuf.Timestamp reset_at = 4;
}

message ConfigureFinalizeHookRequest {
  string work_dir = 1;
  string session_id = 2;
  string hook_token = 3;
  int32 hook_port = 4;
  // When non-empty, the plugin installs a run-scoped Stop-hook entry that POSTs
  // to /hooks/agent-run-complete/{agent_session_id} alongside (not replacing)
  // any existing session-keyed entry. Empty means legacy session-keyed
  // behaviour: POST to /hooks/finalize/{session_id}.
  string agent_session_id = 5;
}
message ConfigureFinalizeHookResponse {
  bool is_supported = 1;
}

message RemoveAgentRunHookRequest {
  string work_dir = 1;
  string agent_session_id = 2;
}
message RemoveAgentRunHookResponse {
  bool is_supported = 1;
}

message BuildInteractiveCommandRequest {
  string session_id = 1;
  bool resume = 2;
  string log_path = 3;     // argv MUST tee output here
  string initial_prompt = 4;  // raw user prompt to submit at startup
  string initial_command = 5; // boss command name without agent prefix
  string worktree_path = 6;   // directory where the interactive pane launches
  // append_system_prompt, when non-empty, is appended to the agent's system
  // prompt (e.g. Claude Code's --append-system-prompt). bossd uses it to carry
  // the chat's boss session context (session/chat/repo identifiers) for every
  // chat, plus the cron autonomy directive for scheduler-spawned runs.
  string append_system_prompt = 7;
  string model = 8;           // opaque agent model id; "" = plugin default.
  // mcp_config_path, when non-empty, is an absolute path to a JSON file
  // describing MCP servers to expose to the interactive agent (e.g. Claude
  // Code's --mcp-config). bossd writes it into the boss app-data dir (NEVER
  // the worktree) per spawn so the agent can reach the boss MCP server's
  // mcp__boss__* tools in-session. Empty means no boss MCP wiring.
  string mcp_config_path = 9;
  // strict_mcp_config, when true, tells the agent to load ONLY the servers in
  // mcp_config_path and ignore project .mcp.json / settings MCP servers (Claude
  // Code's --strict-mcp-config). bossd sets it for cron/fleet spawns so the
  // curated set (boss + Linear) is the whole surface; absent/false preserves the
  // pre-existing merge behavior for interactive and any un-updated caller.
  bool strict_mcp_config = 10;
}
message BuildInteractiveCommandResponse {
  repeated string argv = 1;
  // Prompt marker rendered by the interactive agent when it is ready for
  // pasted input. Empty means the daemon uses its legacy Claude marker.
  string ready_marker = 2;
  // Prefix used to invoke boss-provided commands in the interactive agent.
  // Examples: "/" for Claude Code, "$" for Codex. Empty preserves the
  // legacy Claude slash prefix.
  string command_prefix = 3;
  // True when argv embeds initial_prompt/initial_command so the daemon must
  // not inject input into the tmux pane after launch.
  bool consumes_initial_input = 4;
}

message ResolveInteractiveSessionIDRequest {
  string work_dir = 1;
  string requested_session_id = 2;
  google.protobuf.Timestamp launched_after = 3;
  google.protobuf.Timestamp chat_created_at = 4;
  bool allow_legacy_backfill = 5;
  // pane_pid is the tmux pane PID (the login shell) hosting this chat's agent
  // process. When > 0 and allow_legacy_backfill is false, the codex plugin
  // resolves the rollout by inspecting the open file descriptors of the codex
  // process running under this pane (process-fd resolution), which binds each
  // sibling chat to its OWN rollout deterministically. On a miss (process not
  // up yet, fd inspection unavailable, no rollout open) the plugin falls back
  // to the (work_dir, launched_after) time-window scan. Additive request-side
  // field: no apiversion bump (apiversion is response-side/unary-only).
  int32 pane_pid = 6;
}
message ResolveInteractiveSessionIDResponse {
  bool found = 1;
  string session_id = 2;
  string transcript_path = 3;
  bool ambiguous = 4;
  string reason = 5;
}

message ListIgnoredDirtyFilesRequest {
  string work_dir = 1;
}
message ListIgnoredDirtyFilesResponse {
  repeated string paths = 1; // relative to work_dir
}

message GetChatTitleRequest {
  string work_dir = 1;
  string session_id = 2;
}
message GetChatTitleResponse {
  bool supported = 1;
  string title = 2;
  // explicit is true when title came from an agent-side rename signal rather
  // than the first-user-message fallback.
  bool explicit = 3;
}

message SuggestPRTitleRequest {
  // The worktree the change lives in (the agent runs read-only here).
  string work_dir = 1;
  // The PR's current title (set earlier, e.g. by the agent at PR creation).
  // The agent should return this verbatim when it already fits the change.
  string current_title = 2;
  // The PR description / body (the human/agent-authored intent).
  string pr_body = 3;
  // The git log of commits on the branch vs the base (subjects, oldest→newest).
  string git_log = 4;
  // The base branch the PR targets.
  string base_branch = 5;
}
message SuggestPRTitleResponse {
  // false = the agent has no suggestion (unimplemented / failed); the daemon
  // falls back to its deterministic title heuristic.
  bool supported = 1;
  // The suggested title (== current_title when it is already accurate).
  string title = 2;
}

message HasQuestionPromptRequest {
  bytes pane_content = 1;
}
message HasQuestionPromptResponse {
  bool has_prompt = 1;
}

message DetectUsageLimitRequest {
  bytes pane_content = 1;
}
message DetectUsageLimitResponse {
  bool limited = 1;
  optional google.protobuf.Timestamp reset_at = 2;
}

// RateLimitPlanStatus is the normalized usage-cap posture for one account,
// derived by the owning plugin's probe. UNSUPPORTED means the provider exposes
// no probe (fail-safe default for agents without ProbeRateLimit logic).
enum RateLimitPlanStatus {
  RATE_LIMIT_PLAN_STATUS_UNSPECIFIED = 0;
  RATE_LIMIT_PLAN_STATUS_UNSUPPORTED = 1;
  RATE_LIMIT_PLAN_STATUS_ACTIVE = 2;
  RATE_LIMIT_PLAN_STATUS_WARNING = 3;
  RATE_LIMIT_PLAN_STATUS_RATE_LIMITED = 4;
}

message ProbeRateLimitRequest {
  // Materialized credential env overlay for the TARGET account (e.g.
  // CLAUDE_CODE_OAUTH_TOKEN=<token> for claude, CODEX_HOME=<dir> for codex).
  // Secret-bearing; NEVER logged.
  map<string, string> credential_env = 1;
}

// RateLimitStatus is the normalized probe result, reused by B/C/D.
message RateLimitStatus {
  bool limited = 1;
  RateLimitPlanStatus status = 2;
  double util_5h = 3; // fraction 0..1 of the 5-hour window consumed
  optional google.protobuf.Timestamp reset_5h = 4;
  double util_7d = 5; // fraction 0..1 of the 7-day window consumed
  optional google.protobuf.Timestamp reset_7d = 6;
  string plan_tier = 7;
}

message ProbeRateLimitResponse {
  RateLimitStatus status = 1;
}

message HasWorkingIndicatorRequest {
  bytes pane_content = 1;
}
message HasWorkingIndicatorResponse {
  bool is_working = 1;
}

message LastTurnIsUserRequest {
  string work_dir = 1;
  string agent_session_id = 2;
}
message LastTurnIsUserResponse {
  bool is_user = 1;
}

message TranscriptExistsRequest {
  string work_dir = 1;
  string agent_session_id = 2;
}
message TranscriptExistsResponse {
  bool exists = 1;
}

message ReadTranscriptRequest {
  string work_dir = 1;           // worktree path (claude derives the project key from it)
  string agent_session_id = 2;   // chat's agent session UUID
  int32 max_messages = 3;        // 0 = all; otherwise return the most recent N
}
message ReadTranscriptResponse {
  repeated ChatMessage messages = 1;
  string final_assistant_text = 2; // last assistant turn, flattened — the "result"
  bool exists = 3;                 // false when no transcript file is found
}

// AuthKind identifies how an agent's per-account credential is injected into a
// spawned process. Reported by RotationCapability.
enum AuthKind {
  AUTH_KIND_UNSPECIFIED = 0;
  // Agent does not support rotation.
  AUTH_KIND_NONE = 1;
  // Credential is a single environment token (e.g. CLAUDE_CODE_OAUTH_TOKEN).
  AUTH_KIND_ENV_TOKEN = 2;
  // Credential is a per-account home directory (e.g. CODEX_HOME) containing
  // auth material on disk.
  AUTH_KIND_HOME_DIR = 3;
}

message RotationCapabilityRequest {}
message RotationCapabilityResponse {
  bool supports_rotation = 1;
  AuthKind auth_kind = 2;
}

// MaterializedFile is one file the daemon must write into the agent's
// per-account home directory. content is secret-bearing and NEVER logged.
message MaterializedFile {
  string relative_path = 1;   // path relative to the home dir, e.g. "auth.json"
  bytes content = 2;          // file bytes; secret-bearing, never logged
  uint32 mode = 3;            // unix file mode, e.g. 0600
}

message MaterializeAccountRequest {
  // Opaque, provider-specific credential blob. Only the owning plugin can
  // interpret it. NEVER logged.
  bytes credential_blob = 1;
}
message MaterializeAccountResponse {
  // Environment overlay applied to the spawned agent (e.g.
  // CLAUDE_CODE_OAUTH_TOKEN=<token>). Values are secret-bearing, never logged.
  map<string, string> env = 1;
  // Files to write into the per-account home dir (e.g. codex auth.json).
  repeated MaterializedFile files = 2;
  // Env key that must point at the per-account home dir (e.g. "CODEX_HOME").
  // Empty for env-token agents (claude).
  string home_dir_env_key = 3;
}

message UserSetting {
  string key = 1;
  string label = 2;
  string description = 3;
  UserSettingType type = 4;
  string default_value = 5;
  repeated string allowed_values = 6;
}

enum UserSettingType {
  USER_SETTING_TYPE_UNSPECIFIED = 0;
  USER_SETTING_TYPE_BOOL = 1;
  USER_SETTING_TYPE_STRING = 2;
  USER_SETTING_TYPE_ENUM = 3;
}
