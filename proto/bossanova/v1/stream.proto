syntax = "proto3";

package bossanova.v1;

option go_package = "github.com/recurser/bossalib/gen/bossanova/v1;bossanovav1";

import "bossanova/v1/daemon.proto";
import "bossanova/v1/models.proto";
import "google/protobuf/timestamp.proto";

// This file defines the messages for the DaemonStream bidirectional RPC.
// The RPC itself is declared in orchestrator.proto.
//
// DaemonEvent: daemon → orchestrator (bossd → bosso)
// OrchestratorCommand: orchestrator → daemon (bosso → bossd)
//
// Protocol:
//   - On connect, daemon MUST send DaemonSnapshot as the first event.
//   - Bosso replaces any prior in-memory state for the daemon_id from the snapshot.
//   - Subsequent events are incremental deltas (SessionDelta, ChatDelta, ...).
//   - OrchestratorCommands flow bosso → bossd; daemon replies with CommandResult
//     (correlated by command_id), SessionAttachChunk (for attach), or WebhookAck.
//
// See docs/plans/2026-04-24-reverse-stream-daemon-model.md for full design.

// --- Envelope: daemon → orchestrator ---

// DaemonEvent is the oneof envelope for every message a daemon pushes up the
// stream. Unknown oneof cases are logged and skipped by the orchestrator for
// forward compatibility.
message DaemonEvent {
  oneof event {
    // Required first event on every connect; bosso replaces any prior snapshot.
    DaemonSnapshot snapshot = 1;
    SessionDelta session = 2;
    ChatDelta chat = 3;
    // Coalesced ~100ms on the daemon (decision #11). Named *Delta to avoid
    // collision with the ChatStatus enum in models.proto.
    ChatStatusDelta status = 4;
    // Response to a WebhookEvent command from the orchestrator.
    WebhookAck ack = 5;
    // Response to Stop/Pause/Resume/Transfer/Attach commands.
    CommandResult result = 6;
    // In-band WorkOS JWT refresh. Bosso re-verifies against WorkOS JWKS.
    TokenRefresh token_refresh = 7;
    // Stdout/stderr chunk from an active AttachSession.
    SessionAttachChunk attach_chunk = 8;
    // Streaming frame from an in-flight CreateSession (setup output, then a
    // terminal created/error).
    SessionCreateChunk create_chunk = 9;
    // The daemon's complete current GitHub callback-interest set, re-advertised
    // whenever a callback is created, deleted, triggered, or expires. bosso
    // replaces the daemon's interest set on receipt (snapshot semantics), so
    // withdrawal after a terminal transition is automatic — an empty set means
    // the daemon holds no callbacks. The connect-time set rides DaemonSnapshot
    // (field 7); this delta refreshes it while the stream stays up.
    CallbackInterestSet callback_interests = 10;
    // A broadcast this daemon produced whose audience reaches beyond itself,
    // published for bosso to route to the other daemons. Outbound only: the
    // inbound half is the separate BroadcastCommand type, so an inbound
    // broadcast can never be re-published here and loop. See BroadcastEgress.
    BroadcastEgress egress_broadcast = 11;
  }
}

// --- Envelope: orchestrator → daemon ---

// OrchestratorCommand is the envelope for every command bosso sends down the
// stream. command_id is echoed back in the matching CommandResult, WebhookAck,
// or SessionAttachChunk.
message OrchestratorCommand {
  // Correlates with CommandResult/WebhookAck/SessionAttachChunk responses.
  string command_id = 1;
  oneof cmd {
    StopSessionCommand stop = 2;
    PauseSessionCommand pause = 3;
    ResumeSessionCommand resume = 4;
    // Coordinated transfer protocol (decision #14 in the design doc).
    TransferSessionCommand transfer = 5;
    WebhookEvent webhook = 6;
    // bosso → daemon: start streaming stdout for a session. Replies flow as
    // SessionAttachChunk events on the daemon→orchestrator side.
    AttachSessionCommand attach = 7;
    // Second half of the coordinated transfer protocol (decision #14). Sent
    // by bosso to the SOURCE daemon after the target's CommandResult has
    // confirmed a successful resume. The source DELETEs its copy and ACKs
    // with CommandResult{Ok:true}; this is the only place the UI's "one
    // copy visible" invariant transitions the visible session from source
    // to target.
    TransferConfirmed transfer_confirmed = 8;
    // Rollback leg of the coordinated transfer protocol (decision #14).
    // Sent by bosso to EITHER the source (clear transferring_to → session
    // reappears) or the target (if it already CREATEd → delete the copy)
    // when any earlier step fails. Idempotent: a daemon that never saw a
    // matching transferring_to / transferring_from ACKs Ok:true with
    // no-op.
    TransferCancel transfer_cancel = 9;
    // bosso → daemon: bring a chat's tmux+claude back to life. Replies
    // with CommandResult{WakeChatResult} carrying the Outcome enum.
    WakeChatCommand wake_chat = 10;
    // bosso → daemon: merge a session's PR. Replies CommandResult{Session}.
    MergeSessionCommand merge = 11;
    // bosso → daemon: archive a session. Replies CommandResult{Session}.
    ArchiveSessionCommand archive = 12;
    // bosso → daemon: record/resume a chat. Replies CommandResult{record_chat}.
    RecordChatCommand record_chat = 13;
    // bosso → daemon: delete a chat. Replies CommandResult{Ok} with no payload.
    DeleteChatCommand delete_chat = 14;
    // bosso → daemon: create a new session. The daemon replies with a STREAM of
    // SessionCreateChunk events (live setup output, then a terminal
    // created/error) correlated by command_id.
    CreateSessionCommand create_session = 15;
    // bosso → daemon: list the daemon's repos. Replies CommandResult{list_repos}.
    ListReposCommand list_repos = 16;
    // bosso → daemon: list the daemon's agents. Replies CommandResult{list_agents}.
    ListAgentsCommand list_agents = 17;
    // bosso → daemon: list a repo's open PRs. Replies CommandResult{list_repo_prs}.
    ListRepoPRsCommand list_repo_prs = 18;
    // bosso → daemon: list a repo's tracker issues. Replies CommandResult{list_tracker_issues}.
    ListTrackerIssuesCommand list_tracker_issues = 19;
    // bosso → daemon: read a chat's transcript. Replies CommandResult{get_chat_transcript}.
    GetChatTranscriptCommand get_chat_transcript = 20;
    // bosso → daemon: send a user message into a chat. Replies CommandResult{send_chat_message}.
    SendChatMessageCommand send_chat_message = 21;
    // bosso → daemon: switch a session's live chat to a different account
    // (stop+swap+resume). Replies CommandResult{SwitchAccountResult}.
    SwitchAccountCommand switch_account = 22;
    // bosso → daemon: list the daemon's rotation accounts (web account-switch
    // picker). Optional provider filter. Replies CommandResult{list_accounts}.
    ListAccountsCommand list_accounts = 23;
    // bosso → daemon: read a repo's web-safe settings. Replies
    // CommandResult{get_repo}.
    GetRepoCommand get_repo = 24;
    // bosso → daemon: update a repo. Replies CommandResult{update_repo}.
    UpdateRepoCommand update_repo = 25;
    // bosso → daemon: remove a repo. Replies CommandResult{Ok}.
    RemoveRepoCommand remove_repo = 26;
    // bosso → daemon: list the daemon's cron jobs. Replies CommandResult{list_cron_jobs}.
    ListCronJobsCommand list_cron_jobs = 27;
    // bosso → daemon: create a cron job. Replies CommandResult{create_cron_job}.
    CreateCronJobCommand create_cron_job = 28;
    // bosso → daemon: update a cron job. Replies CommandResult{update_cron_job}.
    UpdateCronJobCommand update_cron_job = 29;
    // bosso → daemon: delete a cron job. Replies CommandResult{Ok} with no payload.
    DeleteCronJobCommand delete_cron_job = 30;
    // bosso → daemon: fire a cron job immediately. Replies CommandResult{run_cron_job_now}.
    RunCronJobNowCommand run_cron_job_now = 31;
    // bosso → daemon: register a new rotation account (web Settings > Accounts).
    // The credential blob is inbound only. Replies CommandResult{add_account}.
    AddAccountCommand add_account = 32;
    // bosso → daemon: replace an account's stored credential. The credential
    // blob is inbound only. Replies CommandResult{refresh_account}.
    RefreshAccountCommand refresh_account = 33;
    // bosso → daemon: edit an account's metadata. Replies CommandResult{update_account}.
    UpdateAccountCommand update_account = 34;
    // bosso → daemon: remove an account. Replies CommandResult{Ok} with no payload.
    RemoveAccountCommand remove_account = 35;
    // bosso → daemon: run a live account validation. Replies CommandResult{test_account}.
    TestAccountCommand test_account = 36;
    // bosso → daemon: list a session's chats. Replies CommandResult{list_chats}.
    ListChatsCommand list_chats = 37;
    // bosso → daemon: aggregate status for the given sessions. Replies CommandResult{get_session_statuses}.
    GetSessionStatusesCommand get_session_statuses = 38;
    // bosso → daemon: list a session's recent CI check snapshots. Replies CommandResult{list_check_snapshots}.
    ListCheckSnapshotsCommand list_check_snapshots = 39;
    // bosso → daemon: list the daemon's configured plugins. Replies CommandResult{list_plugins}.
    ListPluginsCommand list_plugins = 40;
    // bosso → daemon: read a single cron job by id. Replies CommandResult{get_cron_job}.
    GetCronJobCommand get_cron_job = 41;
    // bosso → daemon: run repair-doctor diagnostics. Replies CommandResult{repair_doctor}.
    RepairDoctorCommand repair_doctor = 42;
    // bosso → daemon: close (abandon) a session. Replies CommandResult{session}.
    CloseSessionCommand close_session = 43;
    // bosso → daemon: resurrect an archived session. Replies CommandResult{session}.
    ResurrectSessionCommand resurrect_session = 44;
    // bosso → daemon: permanently remove a session and its worktree. Replies CommandResult{Ok} with no payload.
    RemoveSessionCommand remove_session = 45;
    // bosso → daemon: permanently delete archived sessions. Replies CommandResult{empty_trash}.
    EmptyTrashCommand empty_trash = 46;
    // bosso → daemon: retry a failed session. Replies CommandResult{Session}.
    RetrySessionCommand retry_session = 47;
    // bosso → daemon: update a session's title/tracker. Replies CommandResult{Session}.
    UpdateSessionCommand update_session = 48;
    // bosso → daemon: attach an existing PR to a session. Replies CommandResult{Session}.
    LinkSessionPRCommand link_session_pr = 49;
    // bosso → daemon: update a chat's title. Replies CommandResult{Ok} with no payload.
    UpdateChatTitleCommand update_chat_title = 50;
    // bosso → daemon: report chat status heartbeats. Replies CommandResult{Ok} with no payload.
    ReportChatStatusCommand report_chat_status = 51;
    // bosso → daemon: register a GitHub callback. Replies CommandResult{create_github_callback}.
    CreateGithubCallbackCommand create_github_callback = 52;
    // bosso → daemon: list GitHub callbacks. Replies CommandResult{list_github_callbacks}.
    ListGithubCallbacksCommand list_github_callbacks = 53;
    // bosso → daemon: delete a GitHub callback by id. Replies CommandResult{Ok} with no payload.
    DeleteGithubCallbackCommand delete_github_callback = 54;
    // bosso → daemon: record a note against a repo. Replies CommandResult{create_note}.
    CreateNoteCommand create_note = 55;
    // bosso → daemon: read one note by id. Replies CommandResult{get_note}.
    GetNoteCommand get_note = 56;
    // bosso → daemon: list notes. Replies CommandResult{list_notes}.
    ListNotesCommand list_notes = 57;
    // bosso → daemon: edit a note by id. Replies CommandResult{update_note}.
    UpdateNoteCommand update_note = 58;
    // bosso → daemon: delete a note by id. Replies CommandResult{Ok} with no payload.
    DeleteNoteCommand delete_note = 59;
    // bosso → daemon: this daemon is a target for a broadcast that originated
    // elsewhere; resolve it locally and deliver it. Delivery is asynchronous, so
    // this replies CommandResult{ok:true} with no payload once accepted. The
    // handler NEVER publishes a BroadcastEgress in response — see
    // BroadcastCommand.
    BroadcastCommand broadcast = 60;
  }
}

// --- Snapshot (first event on every connect) ---

// DaemonSnapshot is the required first event on every stream connect. It
// carries slim metadata only (IDs, state, timestamps, preview strings) — full
// chat transcripts are fetched on demand via AttachSessionCommand (decision #5).
message DaemonSnapshot {
  string daemon_id = 1;
  string hostname = 2;
  repeated string repo_ids = 3;
  // Slim: no full transcripts, just session state + display fields.
  repeated Session sessions = 4;
  // Metadata only — see ClaudeChatMetadata.
  repeated ClaudeChatMetadata chats = 5;
  // Live chat statuses keyed by agent_session_id (reuses ChatStatusEntry from daemon.proto).
  repeated ChatStatusEntry statuses = 6;
  // The daemon's GitHub callback interests at connect time (repo + PR). Carried
  // on the snapshot so a (re)connect reconciles interests atomically with the
  // rest of the read model; steady-state changes arrive as CallbackInterestSet
  // deltas (DaemonEvent field 10).
  repeated CallbackInterest callback_interests = 7;
}

// CallbackInterest advertises that a daemon holds one or more active GitHub
// callbacks awaiting a verified state change on a repository + pull request.
// bosso routes matching verified webhook signals to the advertising daemon even
// when it owns no live session for that PR — interests are additive to session
// ownership, never modeled as synthetic sessions.
message CallbackInterest {
  // Canonical repository origin URL (matches WebhookEvent.repo_origin_url).
  string repo_origin_url = 1;
  // Pull request number the daemon holds callbacks for.
  int32 pr_number = 2;
}

// CallbackInterestSet is a daemon's complete current callback-interest set,
// carried on the DaemonEvent stream to refresh interests while connected.
message CallbackInterestSet {
  repeated CallbackInterest interests = 1;
}

// --- Deltas ---

// SessionDelta is a single session lifecycle change. On DELETE, only
// session.id is populated; on CREATE/UPDATE the full Session is included.
message SessionDelta {
  // Kind names are prefixed with KIND_ to satisfy buf STANDARD lint
  // (enum values must share the enum-name prefix). Wire numbers match the
  // design doc spec.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_UPDATED = 2;
    KIND_DELETED = 3;
  }
  Kind kind = 1;
  // On CREATE/UPDATE: full Session. On DELETE: id only.
  // Session.transferring_to / transferring_from (models.proto) hide the
  // session from ListForUser during the coordinated transfer protocol.
  Session session = 2;
}

// ChatDelta is a single ClaudeChatMetadata lifecycle change.
message ChatDelta {
  // Kind names are prefixed with KIND_ to satisfy buf STANDARD lint.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_UPDATED = 2;
    KIND_DELETED = 3;
  }
  Kind kind = 1;
  // On CREATE/UPDATE: full metadata. On DELETE: id only.
  ClaudeChatMetadata chat = 2;
}

// ChatStatusDelta reports the live status of a Claude Code chat process.
// Named *Delta to avoid collision with the ChatStatus enum in models.proto.
// Coalesced by the daemon in a ~100ms window (decision #11).
message ChatStatusDelta {
  string session_id = 1;
  ChatStatus status = 2;
  google.protobuf.Timestamp last_output_at = 3;
  // Per-chat key. Empty for legacy daemons; new daemons MUST set this.
  string agent_session_id = 4;
  // Short human-readable reason the chat is waiting, e.g.
  // "awaiting checks_passed_ready on owner/repo#123". Empty unless status is
  // CHAT_STATUS_WAITING.
  string waiting_reason = 5;
}

// --- Slim metadata types ---

// ClaudeChatMetadata is the slim, snapshot-sized view of a Claude chat.
// NO full transcripts — last_message_preview is a short summary only.
// Full transcripts are fetched on demand via AttachSessionCommand.
message ClaudeChatMetadata {
  string id = 1;
  string session_id = 2;
  string agent_session_id = 3;
  string title = 4;
  string daemon_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // First ~200 characters of the last message. NOT the full message.
  string last_message_preview = 8;
  // Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
  string agent_name = 9;
}

// --- Command responses ---

// WebhookAck is the daemon's acknowledgement that it received (and dispatched
// or rejected) a forwarded webhook. command_id correlates to the
// OrchestratorCommand.command_id that carried the WebhookEvent.
message WebhookAck {
  string command_id = 1;
  bool ok = 2;
  // Populated when ok == false.
  string error = 3;
}

// CommandResult is the daemon's response to Stop/Pause/Resume/Transfer
// commands. command_id correlates back to the originating OrchestratorCommand.
message CommandResult {
  // ErrorCode is a typed channel for failure-mode signalling so bosso can
  // map daemon errors back to ConnectRPC codes without parsing the human-
  // readable `error` string. Append-only — old daemons emit
  // ERROR_CODE_UNSPECIFIED, which bosso treats as CodeAborted (the
  // historical default before this field existed).
  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    ERROR_CODE_NOT_FOUND = 1;
    ERROR_CODE_FAILED_PRECONDITION = 2;
    // The command itself is malformed or unsatisfiable, so re-sending the same
    // bytes will fail identically. Distinct from FAILED_PRECONDITION, which
    // says "the state is wrong, fix it and retry": this says "do not retry".
    // Commands travel over an at-least-once stream, so a sender that cannot
    // tell a permanent failure from a transient one has to assume transient —
    // which turns a malformed command into a poison pill that redelivers
    // forever. Emitted for an invalid inbound broadcast and an over-cap
    // broadcast selector (BOS-558).
    ERROR_CODE_INVALID_ARGUMENT = 3;
  }

  string command_id = 1;
  bool ok = 2;
  // Populated when ok == false. Human-readable; do NOT match on it for
  // routing — use error_code instead.
  string error = 3;
  oneof payload {
    // Stop/Pause/Resume return the updated Session.
    Session session = 4;
    // Transfer target confirms RESUME with this payload (decision #14).
    TransferConfirmed transfer_confirmed = 5;
    // WakeChat returns the Outcome enum + the persisted tmux session name.
    WakeChatResult wake_chat = 6;
    // RecordChat returns the created/resumed chat.
    ClaudeChat record_chat = 8;
    // ListRepos returns the daemon's full Repo set (reuses daemon.proto type).
    ListReposResponse list_repos = 9;
    // ListAgents returns the daemon's installed agents (reuses daemon.proto type).
    ListAgentsResponse list_agents = 10;
    // ListRepoPRs returns the repo's open PRs (reuses daemon.proto type).
    ListRepoPRsResponse list_repo_prs = 11;
    // ListTrackerIssues returns the repo's tracker issues (reuses daemon.proto type).
    ListTrackerIssuesResponse list_tracker_issues = 12;
    // GetChatTranscript returns the chat's transcript (reuses daemon.proto type).
    GetChatTranscriptResponse get_chat_transcript = 13;
    // SendChatMessage returns the delivery outcome (reuses daemon.proto type).
    SendChatMessageResponse send_chat_message = 14;
    // SwitchAccount returns the resumed flag + target label + notice text.
    SwitchAccountResult switch_account = 15;
    // ListAccounts returns the daemon's rotation accounts (reuses daemon.proto
    // type; metadata only — never credentials).
    ListAccountsResponse list_accounts = 16;
    // GetRepo returns the daemon's web-safe repo settings.
    GetRepoSettingsResponse get_repo = 17;
    // UpdateRepo returns the daemon's full repo; bosso projects it before
    // returning it to a browser.
    UpdateRepoResponse update_repo = 18;
    // ListCronJobs returns the daemon's cron jobs (reuses daemon.proto type).
    ListCronJobsResponse list_cron_jobs = 19;
    // CreateCronJob returns the created cron job (reuses daemon.proto type).
    CreateCronJobResponse create_cron_job = 20;
    // UpdateCronJob returns the updated cron job (reuses daemon.proto type).
    UpdateCronJobResponse update_cron_job = 21;
    // RunCronJobNow returns the spawned session or a skip reason (reuses daemon.proto type).
    RunCronJobNowResponse run_cron_job_now = 22;
    // AddAccount returns the created account (reuses daemon.proto type; metadata
    // only — never the credential).
    AddAccountResponse add_account = 23;
    // RefreshAccount returns the updated account + smoke-test outcome (reuses
    // daemon.proto type).
    RefreshAccountResponse refresh_account = 24;
    // UpdateAccount returns the updated account (reuses daemon.proto type).
    UpdateAccountResponse update_account = 25;
    // TestAccount returns the updated account + validation outcome (reuses
    // daemon.proto type).
    TestAccountResponse test_account = 26;
    // ListChats returns the session's chats (reuses daemon.proto type).
    ListChatsResponse list_chats = 27;
    // GetSessionStatuses returns the sessions' aggregate statuses (reuses daemon.proto type).
    GetSessionStatusesResponse get_session_statuses = 28;
    // ListCheckSnapshots returns the session's recent CI snapshots (reuses daemon.proto type).
    ListCheckSnapshotsResponse list_check_snapshots = 29;
    // ListPlugins returns the daemon's configured plugins (reuses daemon.proto type).
    ListPluginsResponse list_plugins = 30;
    // GetCronJob returns a single cron job (reuses daemon.proto type).
    GetCronJobResponse get_cron_job = 31;
    // RepairDoctor returns the daemon's diagnostics report (reuses daemon.proto type).
    RepairDoctorResponse repair_doctor = 32;
    // EmptyTrash returns the number of archived sessions permanently deleted.
    // CloseSession/ResurrectSession reuse session = 4; RemoveSession is Ok-only.
    EmptyTrashResult empty_trash = 33;
    // CreateGithubCallback returns the registered callback (reuses daemon.proto type).
    CreateGithubCallbackResponse create_github_callback = 34;
    // ListGithubCallbacks returns the matching callbacks (reuses daemon.proto type).
    // DeleteGithubCallback is Ok-only (no payload).
    ListGithubCallbacksResponse list_github_callbacks = 35;
    // CreateNote returns the created note (reuses daemon.proto type).
    CreateNoteResponse create_note = 36;
    // GetNote returns the note (reuses daemon.proto type).
    GetNoteResponse get_note = 37;
    // ListNotes returns the matching notes (reuses daemon.proto type).
    ListNotesResponse list_notes = 38;
    // UpdateNote returns the updated note (reuses daemon.proto type).
    // DeleteNote is Ok-only (no payload), exactly like DeleteGithubCallback.
    UpdateNoteResponse update_note = 39;
  }
  // Populated when ok == false. Lets bosso map structured failures
  // (CodeNotFound, CodeFailedPrecondition, …) without string-prefix games.
  ErrorCode error_code = 7;
}

// TokenRefresh carries a freshly-obtained WorkOS JWT. Bosso re-verifies it
// against WorkOS JWKS (same path as initial validation) before accepting. On
// refresh failure, the daemon closes the stream and reconnects.
//
// Only the access_token travels on the wire — refresh tokens never cross the
// stream.
message TokenRefresh {
  // Newly-obtained WorkOS JWT.
  string access_token = 1;
}

// SessionCreateChunk is one streaming frame from an in-flight CreateSession,
// correlated to the originating CreateSessionCommand by command_id. Mirrors
// SessionAttachChunk. Terminal frame is `created` (success) or `error`.
message SessionCreateChunk {
  string command_id = 1;
  oneof body {
    string setup_output = 2;
    Session created = 3;
    CreateError error = 4;
  }
  // True when the terminal `created` frame reports an EXISTING active session
  // the daemon attached to (dedup) rather than a freshly created one. Mirrors
  // SessionCreated.attached_existing so the flag survives the daemon → bosso
  // upstream hop; only meaningful alongside `created`.
  bool attached_existing = 5;
}

// CreateError carries a human-readable failure reason for a CreateSession that
// could not complete. It is the terminal frame on the error path.
message CreateError {
  string message = 1;
}

// SessionAttachChunk is a single streaming event from an active AttachSession.
// Reuses OutputLine / StateChange / SessionEnded from daemon.proto so the
// orchestrator can forward these verbatim to the proxied AttachSession
// response.
message SessionAttachChunk {
  string session_id = 1;
  // Correlates back to the originating AttachSessionCommand.
  string command_id = 2;
  oneof event {
    OutputLine output_line = 3;
    StateChange state_change = 4;
    SessionEnded session_ended = 5;
  }
}

// --- Commands: bosso → bossd ---

// StopSessionCommand asks the daemon to stop a session and emit a
// CommandResult with the updated Session in the payload.
message StopSessionCommand {
  string session_id = 1;
}

// PauseSessionCommand asks the daemon to pause a session and emit a
// CommandResult with the updated Session in the payload.
message PauseSessionCommand {
  string session_id = 1;
}

// ResumeSessionCommand asks the daemon to resume a session and emit a
// CommandResult with the updated Session in the payload.
message ResumeSessionCommand {
  string session_id = 1;
}

// AttachSessionCommand asks the daemon to start streaming stdout/stderr for
// a session. Replies flow as SessionAttachChunk events carrying the same
// command_id.
message AttachSessionCommand {
  string session_id = 1;
}

// CreateSessionCommand asks the daemon to create a new session. The daemon
// replies with a STREAM of SessionCreateChunk events (live setup output, then
// a terminal created/error) correlated by command_id — mirroring
// AttachSessionCommand/SessionAttachChunk. Fields are a wizard-relevant subset
// of daemon.proto's CreateSessionRequest.
message CreateSessionCommand {
  string repo_id = 1;
  string title = 2;
  string plan = 3;
  string base_branch = 4;
  bool is_quick_chat = 5;
  string agent_name = 6;
  // PR/tracker fields (wizard "existing PR" / "Linear" / "Sentry" flows).
  optional int32 pr_number = 7;
  optional string branch_name = 8;
  optional string tracker_id = 9;
  optional string tracker_url = 10;
  // Full selected issue + source, so the daemon can format the plan (D3).
  optional TrackerIssue tracker_issue = 11;
  optional string tracker_source = 12;
  // Bypass the BOS-236 tracker-issue dedup guard (mirrors
  // CreateSessionRequest.force) so the reverse-stream create path carries the
  // same escape hatch as the direct socket create.
  bool force = 13;
  // Unattended-session fields carried over the reverse stream so a hosted
  // create (bosso → daemon) reproduces the local socket create. Mirror
  // CreateSessionRequest.{detach,model,is_tmux_unattended}; without them the
  // daemon builds an interactive/default-model session and skips the
  // unattended prompt.
  bool detach = 14;
  optional string model = 15;
  bool is_tmux_unattended = 16;
  optional string account_id = 17;
  // Mirror CreateSessionRequest.force_branch so reverse-stream hosted creates
  // preserve the local socket path's branch replacement behavior.
  bool force_branch = 18;
  // Mirror CreateSessionRequest.defer_pr so reverse-stream hosted creates skip
  // the up-front draft PR (PR opened at finalize only if commits land), matching
  // the local socket path. Default false = unchanged eager draft-PR behavior.
  bool defer_pr = 19;
}

// WakeChatCommand asks the daemon to bring a chat's tmux+claude back to
// life. The daemon replies with CommandResult carrying a WakeChatResult
// payload. Idempotent under concurrent calls (per-chat singleflight on
// the daemon).
message WakeChatCommand {
  // agent_session_id of the chat to wake. The chat must already exist
  // (previously started via RecordChat).
  string agent_session_id = 1;
  // If true, skip --resume even if the transcript exists. Default false.
  bool force_fresh = 2;
}

// WakeChatResult is the payload sent in a CommandResult for a successful
// WakeChatCommand. Mirrors the daemon's WakeChatResponse with a stream-
// scoped Outcome enum (kept separate from daemon.proto's enum to avoid a
// cross-package import here).
message WakeChatResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_ALREADY_LIVE = 1;
    OUTCOME_RESUMED = 2;
    OUTCOME_FRESH_FALLBACK = 3;
  }
  Outcome outcome = 1;
  string tmux_session_name = 2;
  // Stable machine-readable reason when outcome is OUTCOME_FRESH_FALLBACK.
  string reason = 3;
}

// SwitchAccountCommand asks the daemon to switch a session's live chat to a
// different account (stop+swap+resume). The daemon replies with a
// CommandResult carrying a SwitchAccountResult payload.
message SwitchAccountCommand {
  // owning session (daemon resolves primary live chat if agent_session_id empty)
  string session_id = 1;
  // optional; empty => session's primary live chat
  string agent_session_id = 2;
  // target; "" = system default (account 0)
  string account_id = 3;
  // interrupt a mid-turn (WORKING) chat
  bool force = 4;
}

// SwitchAccountResult is the payload sent in a CommandResult for a successful
// SwitchAccountCommand. Mirrors the daemon's SwitchSessionAccountResponse.
message SwitchAccountResult {
  bool resumed = 1;
  string target_label = 2;
  string notice_text = 3;
}

// MergeSessionCommand asks the daemon to merge a session's PR.
// Replies with CommandResult carrying the updated Session.
message MergeSessionCommand { string session_id = 1; }

// ArchiveSessionCommand asks the daemon to archive a session.
// Replies with CommandResult carrying the updated Session.
message ArchiveSessionCommand { string session_id = 1; }

// CloseSessionCommand asks the daemon to close (abandon) a session.
// Replies with CommandResult carrying the updated Session (session = 4).
message CloseSessionCommand { string session_id = 1; }

// ResurrectSessionCommand asks the daemon to restore an archived session.
// Replies with CommandResult carrying the updated Session (session = 4).
message ResurrectSessionCommand { string session_id = 1; }

// RemoveSessionCommand asks the daemon to permanently remove a session and its
// worktree. Replies with CommandResult{ok:true} and no payload.
message RemoveSessionCommand { string session_id = 1; }

// RecordChatCommand asks the daemon to record or resume a chat.
// Replies with CommandResult carrying a ClaudeChat payload (record_chat = 8).
message RecordChatCommand {
  string session_id = 1;
  string agent_session_id = 2;
  string title = 3;
  bool resume = 4;
  string agent_name = 5;
}

// DeleteChatCommand asks the daemon to delete a chat.
// Replies with CommandResult{ok:true} and no payload.
message DeleteChatCommand {
  string agent_session_id = 1;
  // session_id scopes the delete to a session the caller owns. The daemon
  // rejects the delete when the chat does not belong to this session, so the
  // bosso-side authz scoping (FindSessionDaemon) is enforced end-to-end rather
  // than being advisory. Empty session_id skips the check (backward compat for
  // callers that predate scoping).
  string session_id = 2;
}

// bosso → daemon: list the daemon's managed repos.
// Replies with CommandResult carrying a ListReposResponse (list_repos = 9).
message ListReposCommand {}

// bosso → daemon: list the daemon's installed agents.
// Replies with CommandResult carrying a ListAgentsResponse (list_agents = 10).
message ListAgentsCommand {}

// bosso → daemon: list the daemon's cron jobs.
// Replies with CommandResult carrying a ListCronJobsResponse (list_cron_jobs = 19).
message ListCronJobsCommand {}

