// RetrySessionCommand asks the daemon to retry a failed session. Mirrors
// daemon.proto's RetrySessionRequest. Replies with CommandResult carrying the
// updated Session (session = 4).
message RetrySessionCommand { string session_id = 1; }

// UpdateSessionCommand asks the daemon to update a session's title/tracker.
// Mirrors daemon.proto's UpdateSessionRequest. Replies with CommandResult
// carrying the updated Session (session = 4).
message UpdateSessionCommand {
  string session_id = 1;
  optional string title = 2;
  optional string tracker_url = 3;
  optional string tracker_id = 4;
}

// LinkSessionPRCommand asks the daemon to attach an existing PR to a session.
// Mirrors daemon.proto's LinkSessionPRRequest. Replies with CommandResult
// carrying the updated Session (session = 4).
message LinkSessionPRCommand {
  string session_id = 1;
  string pr = 2;
}

// UpdateChatTitleCommand asks the daemon to rename a chat. Mirrors
// daemon.proto's UpdateChatTitleRequest. Replies with CommandResult{ok:true}
// and no payload.
message UpdateChatTitleCommand {
  string agent_session_id = 1;
  string title = 2;
}

// ReportChatStatusCommand forwards one or more chat status heartbeats. Mirrors
// daemon.proto's ReportChatStatusRequest. Replies with CommandResult{ok:true}
// and no payload.
message ReportChatStatusCommand { repeated ChatStatusReport reports = 1; }

// CreateGithubCallbackCommand registers a GitHub callback. Mirrors daemon.proto's
// CreateGithubCallbackRequest. Replies with CommandResult carrying a
// CreateGithubCallbackResponse (create_github_callback = 34).
message CreateGithubCallbackCommand {
  optional string group_id = 1;
  string target_chat_id    = 2;
  string repo_owner        = 3;
  string repo_name         = 4;
  int32  pr_number         = 5;
  string trigger           = 6;
  string message           = 7;
  optional google.protobuf.Timestamp expires_at = 8;
}

// ListGithubCallbacksCommand lists GitHub callbacks. Mirrors daemon.proto's
// ListGithubCallbacksRequest. Replies with CommandResult carrying a
// ListGithubCallbacksResponse (list_github_callbacks = 35).
message ListGithubCallbacksCommand {
  optional string target_chat_id = 1;
  optional string repo_owner     = 2;
  optional string repo_name      = 3;
  optional int32  pr_number      = 4;
  optional string trigger        = 5;
  optional string state          = 6;
}

// DeleteGithubCallbackCommand deletes a GitHub callback by id. Mirrors
// daemon.proto's DeleteGithubCallbackRequest. Replies with CommandResult{ok:true}
// and no payload.
message DeleteGithubCallbackCommand { string id = 1; }

// Notes commands (BOS-552). Each mirrors the matching daemon.proto request.
// Only CreateNoteCommand carries repo_id, because only creation needs it: the
// daemon addresses an existing note by id alone, and choosing WHICH daemon to
// ask is bosso's job, not something the daemon needs told.

// CreateNoteCommand records a note against a repo. Mirrors daemon.proto's
// CreateNoteRequest. Replies with CommandResult carrying a CreateNoteResponse
// (create_note = 36).
message CreateNoteCommand {
  string repo_id = 1;
  optional string session_id = 2;
  optional string chat_id    = 3;
  string body = 4;
  repeated string tags = 5;
}

// GetNoteCommand reads one note by id. Mirrors daemon.proto's GetNoteRequest.
// Replies with CommandResult carrying a GetNoteResponse (get_note = 37).
message GetNoteCommand { string id = 1; }

// ListNotesCommand lists notes. Mirrors daemon.proto's ListNotesRequest: every
// filter is optional, unset fields are unconstrained, set fields intersect, and
// a set-but-blank provenance filter matches nothing. Tags match ANY (OR), and a
// tag list that normalises away entirely fails closed. Replies with
// CommandResult carrying a ListNotesResponse (list_notes = 38).
message ListNotesCommand {
  optional string repo_id    = 1;
  optional string session_id = 2;
  optional string chat_id    = 3;
  repeated string tags       = 4;
  optional string search     = 5;
  int32 limit                = 6;
}

// UpdateNoteCommand edits a note by id. Mirrors daemon.proto's
// UpdateNoteRequest: an unset field is left alone, and a SET tags field replaces
// the entire tag set (including clearing it when empty). Replies with
// CommandResult carrying an UpdateNoteResponse (update_note = 39).
message UpdateNoteCommand {
  string id = 1;
  optional string body = 2;
  optional NoteTagSet tags = 3;
}

// DeleteNoteCommand deletes a note by id. Mirrors daemon.proto's
// DeleteNoteRequest. Replies with CommandResult{ok:true} and no payload — Ok-only,
// exactly like DeleteGithubCallbackCommand.
message DeleteNoteCommand { string id = 1; }

// SendChatMessageCommand asks the daemon to deliver a user message into a chat.
// Replies with CommandResult carrying a SendChatMessageResponse (send_chat_message = 14).
message SendChatMessageCommand {
  string agent_session_id = 1;
  string message = 2;
  bool wake_if_asleep = 3;
  bool submit = 4;  // when true, submit (press Enter + verify) a single-line command; default (false) prefills the composer without submitting
}

// TransferSessionCommand asks a daemon to take part in a coordinated transfer
// protocol (decision #14). Source daemon receives this first, pauses, emits a
// SessionDelta with transferring_to set. Target daemon then receives it,
// creates the session with transferring_from set, resumes, and replies with
// CommandResult{TransferConfirmed}.
message TransferSessionCommand {
  string session_id = 1;
  string source_daemon_id = 2;
  string target_daemon_id = 3;
}

// TransferConfirmed is the payload sent by the target daemon on successful
// resume. Bosso uses this to tell the source daemon to DELETE its copy.
message TransferConfirmed {
  string session_id = 1;
  string target_daemon_id = 2;
}

// TransferCancel is emitted by the source daemon (or by bosso to the source)
// when any step of the coordinated transfer fails. Clears the
// transferring_to marker so the session becomes visible on the source again.
message TransferCancel {
  string session_id = 1;
  string reason = 2;
}

// WebhookEvent is the payload of an OrchestratorCommand that forwards a
// provider webhook (GitHub, GitLab, ...) to a daemon. Bosso has already
// HMAC-verified the payload and selected the target daemons from the
// repo_id → daemon_id index.
message WebhookEvent {
  // Origin URL of the repo the webhook fired on (e.g. "https://github.com/owner/repo").
  string repo_origin_url = 1;
  // VCS provider: "github", "gitlab", etc.
  string provider = 2;
  // Event type, e.g. "pull_request", "push".
  string event_type = 3;
  // Raw webhook body. Already HMAC-verified by bosso.
  bytes payload = 4;
  // Selected headers for replay context (e.g. X-GitHub-Delivery, X-GitHub-Event).
  map<string, string> headers = 5;
  // Parsed by bosso for routing only. Zero means unknown or not PR-scoped.
  int32 pull_request = 6;
  // GitHub App installation ID. Zero for legacy/manual webhooks.
  int64 installation_id = 7;
}

// --- Broadcasts (BOS-558) ---
//
// The two halves of the cross-daemon broadcast path. They are DELIBERATELY two
// message types rather than one type reused in both directions, even though
// their fields are identical (and carry the same field numbers so the two can
// be diffed side by side). The types encode DIRECTION, and direction is the
// whole safety argument:
//
//   - BroadcastEgress (daemon → bosso, DaemonEvent field 11) means "here is a
//     broadcast, route it" — an outbound request for fan-out.
//   - BroadcastCommand (bosso → daemon, OrchestratorCommand field 60) means
//     "you are a target, deliver it" — an inbound instruction to deliver
//     locally, and NOTHING else.
//
// Conflating them into one type would make it trivially easy for a handler to
// take an inbound broadcast and hand it straight back to the egress publisher,
// producing a routing loop that amplifies with every hop. With separate types
// that mistake does not typecheck: the ingress handler never holds a value the
// egress path will accept.
//
// SECRET BODY: the `message` field on BOTH types is the broadcast body and is
// governed by exactly the rule stated on Broadcast.message in daemon.proto. It
// is carried only for the delivering owner: it is never echoed on a read
// surface, never written to a log line, never placed in an error detail or a
// persisted diagnostic. Log a broadcast with its id, origin daemon id, and
// resolved target count — never its body.

// BroadcastEgress travels daemon → bosso on the reverse stream: "this daemon
// produced a broadcast whose audience reaches beyond itself; route it". Local
// delivery is already the origin daemon's own business and has happened (or is
// happening) independently — this event asks only for the foreign leg. Bosso
// selects the target daemons and sends each a BroadcastCommand.
message BroadcastEgress {
  // The ORIGIN daemon's broadcast id. Every daemon that delivers this broadcast
  // persists it under this id (see BroadcastCommand.broadcast_id).
  string broadcast_id = 1;
  // Audience as issued by the origin. Each receiving daemon re-resolves it
  // against its own local chats; a selector is not a pre-resolved target list.
  BroadcastSelector selector = 2;
  // The persisted `.config/daemon-id` of the daemon that ORIGINATED the
  // broadcast. Carried so the ingress side can drop its own echo — see the loop
  // guard on BroadcastCommand.origin_daemon_id.
  string origin_daemon_id = 3;
  // Chat the broadcast was issued from (ClaudeChat.agent_session_id), on the
  // origin daemon. Empty = operator-issued with no originating chat.
  string origin_chat_id = 4;
  // Broadcast body. SECRET — see the rule on Broadcast.message in daemon.proto:
  // never echoed on a read surface, never logged.
  string message = 5;
  // Absolute expiry inherited from the origin's broadcast row, so a slow route
  // cannot extend a broadcast's lifetime past what the sender asked for.
  google.protobuf.Timestamp expires_at = 6;
}

// BroadcastCommand travels bosso → daemon: "you are a target for this
// broadcast; resolve it against YOUR chats and deliver it". A daemon that
// receives one delivers locally and MUST NOT publish a BroadcastEgress in
// response — that is the anti-storm invariant, and it is why this is a distinct
// type from BroadcastEgress rather than the same one flowing back.
message BroadcastCommand {
  // The ORIGIN daemon's broadcast id, NOT one minted by the receiver. The
  // reverse stream is at-least-once, so a redelivery of the same broadcast must
  // be recognisable: persisting under the origin's id makes a repeat a no-op,
  // whereas a locally minted id would make every redelivery look like a brand
  // new broadcast and fan out duplicate deliveries.
  string broadcast_id = 1;
  // Audience as issued by the origin, re-resolved against the receiving
  // daemon's LOCAL chats only, under the same fan-out cap and start-error
  // filter the daemon applies to its own sends.
  BroadcastSelector selector = 2;
  // The ORIGIN daemon's persisted `.config/daemon-id`. LOOP GUARD: a daemon
  // MUST drop, before doing anything else, any command whose origin_daemon_id
  // equals its own daemon id. Without that check a daemon whose selector names
  // itself would deliver its own broadcast twice — once locally at send time,
  // once again on the round trip through bosso.
  string origin_daemon_id = 3;
  // Chat the broadcast was issued from, on the ORIGIN daemon. It is not a local
  // chat id here, so it is recorded as provenance only and is not resolvable
  // against the receiver's chats.
  string origin_chat_id = 4;
  // Broadcast body delivered to each resolved local target. SECRET — see the
  // rule on Broadcast.message in daemon.proto: never echoed on a read surface,
  // never logged.
  string message = 5;
  // Absolute expiry inherited from the origin, so the receiver stops retrying
  // at the same instant the origin does rather than restarting the clock.
  google.protobuf.Timestamp expires_at = 6;
}

// --- TerminalStream messages (web-tmux-attach feature) ---
//
// These messages travel on the dedicated TerminalStream RPC (declared in
// orchestrator.proto). TerminalStream is parallel to DaemonStream so that
// keystroke-rate byte traffic never starves control-plane commands.
//
// Directionality (matches DaemonStream's client/server convention — bossd is
// the gRPC client, bosso is the gRPC server):
//   - TerminalServerMessage travels daemon → bosso (request stream)
//   - TerminalClientMessage travels bosso → daemon (response stream)
//
// "Client" / "Server" here refer to the bosso-server / browser-client
// perspective of the web feature, NOT the gRPC client/server roles. See
// docs/plans/2026-04-26-web-tmux-attach.md for the full design.

// TerminalAttachCommand: bosso → daemon. Carried inside TerminalClientMessage.
// Asks the daemon to spawn a new tmux attach PTY for the given chat. The
// attach_id is bosso-generated (UUID); the daemon uses it to multiplex
// subsequent input/resize/close commands and to tag outbound data chunks.
message TerminalAttachCommand {
  // bosso-generated UUID. The daemon does NOT pick routing keys.
  string attach_id = 1;
  string chat_id = 2;
  // Initial PTY size from the browser (xterm.js).
  uint32 cols = 3;
  uint32 rows = 4;
}

// TerminalInputCommand: bosso → daemon. Raw bytes typed by the browser
// client to be written to the PTY stdin. Payload is opaque to bosso so a
// future libsodium framing layer can swap in without changing the wire
// shape.
message TerminalInputCommand {
  string attach_id = 1;
  // Raw PTY input (opaque — ready for E2E later).
  bytes data = 2;
}

// TerminalResizeCommand: bosso → daemon. Forwarded from the browser when
// the xterm viewport size changes. Daemon applies the new size to the PTY
// (and tmux propagates to all attached clients per the window-size policy).
message TerminalResizeCommand {
  string attach_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// TerminalCloseCommand: bosso → daemon. Asks the daemon to tear down the
// attach (closes PTY, kills the `tmux attach` process — does NOT kill the
// underlying tmux session running Claude).
message TerminalCloseCommand {
  string attach_id = 1;
}

// BOS-661 chat file upload subprotocol.
//
// The upload rides the dedicated TerminalStream (never the control-plane
// DaemonStream and its 128-command queue) so a 500 MiB transfer cannot
// starve Stop/Pause/Transfer. It is bounded and acknowledged: the browser
// keeps at most four fixed-size chunks in flight and the daemon answers
// each durably-written chunk with a TerminalUploadAck. No layer buffers a
// whole file.
//
// Limits are normative and enforced independently in the browser, bosso,
// and bossd:
//   * max total size   = 500 * 1024 * 1024 bytes
//   * max chunk size   = 1024 * 1024 bytes (the existing web-frame cap)
//   * max in-flight    = 4 chunks

// TerminalUploadStart: bosso → daemon. Opens a new upload on an existing
// attach. filename is a DISPLAY name only — it MUST NOT contain path
// separators or `..`; the daemon derives a randomized basename and never
// honours the client's name on disk.
message TerminalUploadStart {
  string attach_id = 1;
  // Opaque client-chosen upload id, unique per attach.
  string upload_id = 2;
  // Display filename (basename only, no path components).
  string filename = 3;
  // Declared total size in bytes. Rejected above 500 MiB, and the finish
  // is rejected when the received total does not match exactly.
  uint64 size_bytes = 4;
}

// TerminalUploadChunk: bosso → daemon. One bounded slice of the file.
// seq is zero-based and strictly sequential per upload; a gap or a repeat
// terminates the upload with a TerminalUploadResult error.
message TerminalUploadChunk {
  string attach_id = 1;
  string upload_id = 2;
  uint64 seq = 3;
  bytes data = 4;
}

// TerminalUploadFinish: bosso → daemon. Declares the byte stream complete.
// The daemon syncs and closes the file only when the received byte count
// equals the declared size, then submits one chat message naming the path.
message TerminalUploadFinish {
  string attach_id = 1;
  string upload_id = 2;
}

// TerminalUploadCancel: bosso → daemon. Abandons an in-flight upload. The
// daemon removes the partial file. Also synthesised by bosso on WebSocket
// teardown so a disconnect can never leave partial data behind.
message TerminalUploadCancel {
  string attach_id = 1;
  string upload_id = 2;
  // Free-form diagnostic (never contains file contents).
  string reason = 3;
}

// TerminalUploadAck: daemon → bosso. Sent only AFTER the chunk has been
// durably accepted by the daemon's writer. This is the backpressure
// signal the browser's four-chunk window keys on.
message TerminalUploadAck {
  string attach_id = 1;
  string upload_id = 2;
  // The seq of the chunk that was accepted.
  uint64 seq = 3;
  // Total bytes accepted so far for this upload.
  uint64 bytes_received = 4;
}

// TerminalUploadResult: daemon → bosso. Terminal outcome for an upload.
// Exactly one is sent per upload id. On success the daemon has already
// submitted the path instruction through normal chat delivery.
message TerminalUploadResult {
  string attach_id = 1;
  string upload_id = 2;
  bool is_ok = 3;
  // Fixed, non-sensitive diagnostic string when is_ok is false. Never
  // contains file contents or the generated absolute path.
  string error_message = 4;
  // True when the client may retry the same file (transport/stream loss)
  // rather than a permanent rejection (too large, bad name, bad order,
  // or a submit whose delivery could not be confirmed).
  bool can_retry = 5;
}

// TerminalDataChunk: daemon → bosso. Carried inside TerminalServerMessage.
// Raw PTY output (including VT escape codes) tagged with the attach_id so
// bosso can route it to the correct WebSocket subscriber.
message TerminalDataChunk {
  string attach_id = 1;
  // Monotonic per attach. Reserved for a future delta-replay upgrade; not
  // currently used by the consumer beyond debug logging.
  uint64 seq = 2;
  // Raw PTY output incl. VT escape codes (opaque — ready for E2E).
  bytes data = 3;
  // True when the daemon's per-attach ringbuffer dropped bytes due to a
  // slow consumer. The browser MUST treat this as a RESYNC signal: the
  // daemon will follow up with `tmux refresh-client` so all attached
  // clients redraw fresh state.
  bool lost = 4;
}

// TerminalAttachExited: daemon → bosso. Carried inside
// TerminalServerMessage. Sent when the PTY child exits (tmux session was
// killed, attach was closed, etc.). exit_code mirrors the underlying
// process; reason is a free-form string for diagnostics.
message TerminalAttachExited {
  string attach_id = 1;
  int32 exit_code = 2;
  string reason = 3;
}

// TerminalReady: bosso → daemon. Carried inside TerminalClientMessage.
// Sent exactly once, immediately after the bosso handler installs the
// terminal sender and has confirmed the DaemonStream is local-and-Ready.
// It is the daemon's positive, application-level proof that its
// TerminalStream is bound to a healthy, co-located pod — the daemon does
// NOT treat the stream as connected until this frame arrives. A ready
// frame that never comes (e.g. a deploy split the two reverse streams
// across pods) is what the daemon's watchdog keys on to self-heal.
message TerminalReady {}

// TerminalPing: bosso → daemon. Application-level liveness probe sent on a
// fixed interval while the stream is open. The daemon answers each with a
// TerminalPong. A missed-beats budget on the daemon tears the stream down,
// which detects an alive-but-wrongly-bound stream — a failure mode HTTP/2
// keepalive cannot see because the underlying connection is still healthy.
message TerminalPing {
  uint64 seq = 1;
}

// TerminalPong: daemon → bosso. Answer to a TerminalPing, echoing its seq
// so bosso can match the round-trip.
message TerminalPong {
  uint64 seq = 1;
}

// TerminalClientMessage is the bosso → daemon envelope on the new RPC.
// Despite the name, this is the gRPC RESPONSE stream type (bosso is the
// gRPC server). Unknown oneof cases are logged and skipped by the daemon
// for forward compatibility.
message TerminalClientMessage {
  oneof msg {
    TerminalAttachCommand attach = 1;
    TerminalInputCommand input = 2;
    TerminalResizeCommand resize = 3;
    TerminalCloseCommand close = 4;
    TerminalReady ready = 5;
    TerminalPing ping = 6;
    // BOS-661 chat file upload (editor-scoped attaches only).
    TerminalUploadStart upload_start = 7;
    TerminalUploadChunk upload_chunk = 8;
    TerminalUploadFinish upload_finish = 9;
    TerminalUploadCancel upload_cancel = 10;
  }
}

// TerminalServerMessage is the daemon → bosso envelope on the new RPC.
// Despite the name, this is the gRPC REQUEST stream type (bossd is the
// gRPC client and initiates the stream). Unknown oneof cases are logged
// and skipped by bosso for forward compatibility.
message TerminalServerMessage {
  oneof msg {
    TerminalDataChunk data = 1;
    TerminalAttachExited exited = 2;
    TerminalPong pong = 3;
    // BOS-661 chat file upload.
    TerminalUploadAck upload_ack = 4;
    TerminalUploadResult upload_result = 5;
  }
}
