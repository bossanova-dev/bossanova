message UpdateRepoCommand {
  string repo_id = 1;
  optional string display_name = 2;
  optional string setup_script = 3;
  optional MergeStrategy merge_strategy = 4;
  optional bool can_auto_merge = 5;
  optional bool can_auto_merge_dependabot = 6;
  optional bool can_auto_repair = 7;
  optional bool should_archive_sessions_after_merge = 12;
  optional string sentry_org = 8;
  SecretUpdate linear_key = 9;
  SecretUpdate sentry_key = 10;
  google.protobuf.Timestamp expected_updated_at = 11;
}

// RemoveRepoCommand asks the daemon to remove a repo. Successful responses
// carry no payload.
message RemoveRepoCommand { string repo_id = 1; }

// ListRepoPRsCommand asks the daemon for a repo's open PRs (new-session
// "existing PR" picker). Reuses daemon.proto's ListRepoPRsResponse.
message ListRepoPRsCommand { string repo_id = 1; }

// ListTrackerIssuesCommand asks the daemon for a repo's tracker issues, with an
// optional server-side search query and source ("linear"|"sentry"). Reuses
// daemon.proto's ListTrackerIssuesResponse.
message ListTrackerIssuesCommand {
  string repo_id = 1;
  string query = 2;
  optional string source = 3;
}

// GetChatTranscriptCommand asks the daemon for a chat's transcript. Replies with
// CommandResult carrying a GetChatTranscriptResponse (get_chat_transcript = 13).
// session_id scopes the read for authz, mirroring DeleteChatCommand.
message GetChatTranscriptCommand {
  string session_id = 1;
  string agent_session_id = 2;
  int32 max_messages = 3;
}

// ListChatsCommand asks the daemon for a session's chats. Replies with
// CommandResult carrying a ListChatsResponse (list_chats = 27). session_id
// scopes the read for authz, mirroring GetChatTranscriptCommand.
message ListChatsCommand { string session_id = 1; }

// GetSessionStatusesCommand asks the daemon for the aggregate status of the
// given sessions. Replies with CommandResult carrying a
// GetSessionStatusesResponse (get_session_statuses = 28).
message GetSessionStatusesCommand { repeated string session_ids = 1; }

// ListCheckSnapshotsCommand asks the daemon for a session's recent CI check
// snapshots (newest-first, limit defaults to 10 when zero). Replies with
// CommandResult carrying a ListCheckSnapshotsResponse (list_check_snapshots = 29).
message ListCheckSnapshotsCommand {
  string session_id = 1;
  int32 limit = 2;
}

// ListPluginsCommand asks the daemon for its configured plugins and load
// state. Replies with CommandResult carrying a ListPluginsResponse
// (list_plugins = 30).
message ListPluginsCommand {}

// GetCronJobCommand asks the daemon for a single cron job by id. Replies with
// CommandResult carrying a GetCronJobResponse (get_cron_job = 31).
message GetCronJobCommand { string id = 1; }

// RepairDoctorCommand asks the daemon to run its repair-doctor diagnostics.
// Replies with CommandResult carrying a RepairDoctorResponse (repair_doctor = 32).
message RepairDoctorCommand {}

// EmptyTrashCommand asks the daemon to permanently delete archived sessions.
// Replies with CommandResult carrying an EmptyTrashResult (empty_trash = 33).
message EmptyTrashCommand {
  // Only empty sessions archived before this timestamp.
  optional google.protobuf.Timestamp older_than = 1;
}

// EmptyTrashResult carries the number of archived sessions permanently deleted.
