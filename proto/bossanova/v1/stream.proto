message CreateCronJobCommand {
  string repo_id = 1;
  string name = 2;
  string prompt = 3;
  string schedule = 4;
  string timezone = 5;
  bool is_enabled = 6;
  string agent_name = 7;
  string model = 8;
  string gate_command = 9;
  optional bool should_run_setup_command = 10;
  optional bool is_zero_output = 11;
}

// UpdateCronJobCommand asks the daemon to mutate an existing cron job. Mutable
// fields are optional. Fields mirror daemon.proto's UpdateCronJobRequest.
// Replies with CommandResult carrying an UpdateCronJobResponse (update_cron_job = 21).
message UpdateCronJobCommand {
  string id = 1;
  optional string name = 2;
  optional string prompt = 3;
  optional string schedule = 4;
  optional string timezone = 5;
  optional bool is_enabled = 6;
  optional string agent_name = 7;
  optional string model = 8;
  optional string gate_command = 9;
  optional bool should_run_setup_command = 10;
  optional bool is_zero_output = 11;
}

// DeleteCronJobCommand asks the daemon to remove a cron job.
