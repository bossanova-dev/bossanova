    bossanova.v1.CloseSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
      title: CloseSessionResponse
      additionalProperties: false
    bossanova.v1.CloudAccessState:
      type: string
      title: CloudAccessState
      enum:
        - CLOUD_ACCESS_STATE_UNSPECIFIED
        - CLOUD_ACCESS_STATE_ACTIVE
        - CLOUD_ACCESS_STATE_NEEDS_SUBSCRIPTION
        - CLOUD_ACCESS_STATE_PENDING_ENTITLEMENT_REFRESH
        - CLOUD_ACCESS_STATE_PAST_DUE
        - CLOUD_ACCESS_STATE_CANCELED
        - CLOUD_ACCESS_STATE_BILLING_UNAVAILABLE
    bossanova.v1.CloudAccessStatus:
      type: object
      properties:
        state:
          title: state
          $ref: '#/components/schemas/bossanova.v1.CloudAccessState'
        accountId:
          type: string
          title: account_id
        workosOrgId:
          type: string
          title: workos_org_id
        message:
          type: string
          title: message
        canRetry:
          type: boolean
          title: can_retry
        canCreateCheckout:
          type: boolean
          title: can_create_checkout
          description: True when the client should call CreateCheckoutSession to open Stripe Checkout.
        checkoutStarted:
          type: boolean
          title: checkout_started
          description: |-
            True when checkout has already been started and the client should poll
             RefreshCloudEntitlements instead of creating another checkout.
        denialReason:
          type: string
          title: denial_reason
          description: Short machine-readable reason for inactive cloud access.
      title: CloudAccessStatus
      additionalProperties: false
    bossanova.v1.CommandResult:
      type: object
      allOf:
        - properties:
            commandId:
              type: string
              title: command_id
            ok:
              type: boolean
              title: ok
            error:
              type: string
              title: error
              description: |-
                Populated when ok == false. Human-readable; do NOT match on it for
                 routing — use error_code instead.
            errorCode:
              title: error_code
              description: |-
                Populated when ok == false. Lets bosso map structured failures
                 (CodeNotFound, CodeFailedPrecondition, …) without string-prefix games.
              $ref: '#/components/schemas/bossanova.v1.CommandResult.ErrorCode'
        - oneOf:
            - type: object
              properties:
                getChatTranscript:
                  title: get_chat_transcript
                  description: GetChatTranscript returns the chat's transcript (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.GetChatTranscriptResponse'
              title: get_chat_transcript
              required:
                - getChatTranscript
            - type: object
              properties:
                listAccounts:
                  title: list_accounts
                  description: |-
                    ListAccounts returns the daemon's rotation accounts (reuses daemon.proto
                     type; metadata only — never credentials).
                  $ref: '#/components/schemas/bossanova.v1.ListAccountsResponse'
              title: list_accounts
              required:
                - listAccounts
            - type: object
              properties:
                listAgents:
                  title: list_agents
                  description: ListAgents returns the daemon's installed agents (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.ListAgentsResponse'
              title: list_agents
              required:
                - listAgents
            - type: object
              properties:
                listRepoPrs:
                  title: list_repo_prs
                  description: ListRepoPRs returns the repo's open PRs (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.ListRepoPRsResponse'
              title: list_repo_prs
              required:
                - listRepoPrs
            - type: object
              properties:
                listRepos:
                  title: list_repos
                  description: ListRepos returns the daemon's full Repo set (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.ListReposResponse'
              title: list_repos
              required:
                - listRepos
            - type: object
              properties:
                listTrackerIssues:
                  title: list_tracker_issues
                  description: ListTrackerIssues returns the repo's tracker issues (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.ListTrackerIssuesResponse'
              title: list_tracker_issues
              required:
                - listTrackerIssues
            - type: object
              properties:
                recordChat:
                  title: record_chat
                  description: RecordChat returns the created/resumed chat.
                  $ref: '#/components/schemas/bossanova.v1.ClaudeChat'
              title: record_chat
              required:
                - recordChat
            - type: object
              properties:
                sendChatMessage:
                  title: send_chat_message
                  description: SendChatMessage returns the delivery outcome (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.SendChatMessageResponse'
              title: send_chat_message
              required:
                - sendChatMessage
            - type: object
              properties:
                session:
                  title: session
                  description: Stop/Pause/Resume return the updated Session.
                  $ref: '#/components/schemas/bossanova.v1.Session'
              title: session
              required:
                - session
            - type: object
              properties:
                switchAccount:
                  title: switch_account
                  description: SwitchAccount returns the resumed flag + target label + notice text.
                  $ref: '#/components/schemas/bossanova.v1.SwitchAccountResult'
              title: switch_account
              required:
                - switchAccount
            - type: object
              properties:
                transferConfirmed:
                  title: transfer_confirmed
                  description: 'Transfer target confirms RESUME with this payload (decision #14).'
                  $ref: '#/components/schemas/bossanova.v1.TransferConfirmed'
              title: transfer_confirmed
              required:
                - transferConfirmed
            - type: object
              properties:
                wakeChat:
                  title: wake_chat
                  description: WakeChat returns the Outcome enum + the persisted tmux session name.
                  $ref: '#/components/schemas/bossanova.v1.WakeChatResult'
              title: wake_chat
              required:
                - wakeChat
      title: CommandResult
      additionalProperties: false
      description: |-
        CommandResult is the daemon's response to Stop/Pause/Resume/Transfer
         commands. command_id correlates back to the originating OrchestratorCommand.
    bossanova.v1.CommandResult.ErrorCode:
      type: string
      title: ErrorCode
      enum:
        - ERROR_CODE_UNSPECIFIED
        - ERROR_CODE_NOT_FOUND
        - ERROR_CODE_FAILED_PRECONDITION
      description: |-
        ErrorCode is a typed channel for failure-mode signalling so bosso can
         map daemon errors back to ConnectRPC codes without parsing the human-
         readable `error` string. Append-only — old daemons emit
         ERROR_CODE_UNSPECIFIED, which bosso treats as CodeAborted (the
         historical default before this field existed).
    bossanova.v1.CompleteGitHubAppSetupRequest:
      type: object
      properties:
        installationId:
          type:
            - integer
            - string
          title: installation_id
          format: int64
        state:
          type: string
          title: state
          description: Server-issued setup state returned by GetGitHubAppInstallURL.
        githubCode:
          type: string
          title: github_code
          description: |-
            GitHub OAuth code returned by the GitHub App setup callback. Exchanged once
             for a user access token to verify the caller can access installation_id.
      title: CompleteGitHubAppSetupRequest
      additionalProperties: false
    bossanova.v1.CompleteGitHubAppSetupResponse:
      type: object
      properties:
        repos:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.GitHubAppRepoStatus'
          title: repos
      title: CompleteGitHubAppSetupResponse
      additionalProperties: false
    bossanova.v1.ConfigureFinalizeHookRequest:
      type: object
      properties:
        workDir:
          type: string
          title: work_dir
        sessionId:
          type: string
          title: session_id
        hookToken:
          type: string
          title: hook_token
        hookPort:
