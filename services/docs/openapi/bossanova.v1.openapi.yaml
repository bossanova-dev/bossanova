          title: repo_origin_url
          description: The repository origin URL this webhook is for (e.g. "https://github.com/owner/repo").
        provider:
          type: string
          title: provider
          description: 'VCS provider type: "github", "gitlab", etc.'
        secret:
          type: string
          title: secret
          description: HMAC secret for signature verification.
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: WebhookConfig
      additionalProperties: false
    bossanova.v1.WebhookEvent:
      type: object
      properties:
        repoOriginUrl:
          type: string
          title: repo_origin_url
          description: Origin URL of the repo the webhook fired on (e.g. "https://github.com/owner/repo").
        provider:
          type: string
          title: provider
          description: 'VCS provider: "github", "gitlab", etc.'
        eventType:
          type: string
          title: event_type
          description: Event type, e.g. "pull_request", "push".
        payload:
          type: string
          title: payload
          format: byte
          description: Raw webhook body. Already HMAC-verified by bosso.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: Selected headers for replay context (e.g. X-GitHub-Delivery, X-GitHub-Event).
        pullRequest:
          type: integer
          title: pull_request
          format: int32
          description: Parsed by bosso for routing only. Zero means unknown or not PR-scoped.
        installationId:
          type:
            - integer
            - string
          title: installation_id
          format: int64
          description: GitHub App installation ID. Zero for legacy/manual webhooks.
      title: WebhookEvent
      additionalProperties: false
      description: |-
        WebhookEvent is the payload of an OrchestratorCommand that forwards a
         provider webhook (GitHub, GitLab, ...) to a daemon. Bosso has already
         HMAC-verified the payload and selected the target daemons from the
         repo_id → daemon_id index.
    bossanova.v1.WebhookEvent.HeadersEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: HeadersEntry
      additionalProperties: false
