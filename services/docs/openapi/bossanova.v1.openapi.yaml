components:
  schemas:
    bossanova.v1.Account:
      type: object
      properties:
        id:
          type: string
          title: id
        provider:
          type: string
          title: provider
          description: '"claude" | "codex"'
        label:
          type: string
          title: label
        status:
          type: string
          title: status
          description: '"active" | "disabled"'
        priority:
          type: integer
          title: priority
          format: int32
          description: sort order; lower = preferred
        cooldownUntil:
          title: cooldown_until
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastUsedAt:
          title: last_used_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        health:
          type: string
          title: health
          description: '"ok" | "failed"'
        tier:
          type: string
          title: tier
          description: plan/tier metadata, free-form
        allowedModels:
          type: array
          items:
            type: string
          title: allowed_models
        lastTestOkAt:
          title: last_test_ok_at
          description: last time a credential test passed
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastTestError:
          type: string
          title: last_test_error
          description: most recent test failure detail; "" = none
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        usage:
          title: usage
          description: |-
            Cached per-account rate-limit usage snapshot (BOS-297). METADATA ONLY —
             never a credential. Absent = never probed. NO credential field. Ever.
          $ref: '#/components/schemas/bossanova.v1.UsageSnapshot'
      title: Account
      additionalProperties: false
      description: |-
        Account is registry metadata for one provider login used by account
         rotation (BOS-157). It carries METADATA ONLY — the credential blob is never
         a field here and never crosses this message (locked decision D3); secrets
         live only in the OS keyring on the daemon host.
    bossanova.v1.AddAccountCommand:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: '"claude" | "codex"'
        label:
          type: string
          title: label
        priority:
          type: integer
          title: priority
          format: int32
        credential:
          type: string
          title: credential
          format: byte
          description: inbound only; consumed into the keyring, never echoed
      title: AddAccountCommand
      additionalProperties: false
      description: |-
        AddAccountCommand registers a new rotation account. Fields mirror
         daemon.proto's AddAccountRequest (minus the reserved email field). Replies
         with CommandResult carrying an AddAccountResponse (add_account = 23).
    bossanova.v1.AddAccountRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: '"claude" | "codex"'
        label:
          type: string
          title: label
        priority:
          type: integer
          title: priority
          format: int32
          description: sort order; lower = preferred
        credential:
          type: string
          title: credential
          format: byte
          description: |-
            Credential blob (Claude setup-token string; Codex auth.json bytes).
             Inbound only — consumed straight into the keyring, NEVER echoed back.
      title: AddAccountRequest
      additionalProperties: false
    bossanova.v1.AddAccountResponse:
      type: object
      properties:
        account:
          title: account
          description: metadata only; never the credential
          $ref: '#/components/schemas/bossanova.v1.Account'
      title: AddAccountResponse
      additionalProperties: false
    bossanova.v1.AgentExitStatusRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: AgentExitStatusRequest
      additionalProperties: false
    bossanova.v1.AgentExitStatusResponse:
      type: object
      properties:
        isComplete:
          type: boolean
          title: is_complete
        exitError:
          type: string
          title: exit_error
          description: empty on clean exit
        failureClass:
          type:
            - string
            - "null"
          title: failure_class
          description: |-
            failure_class is the shared agenterr taxonomy string (e.g.
             "usage_exhausted", "auth_invalidated") when the plugin classified the
             exit as a known cap/auth failure; unset otherwise. Read-only signal —
             the daemon logs it and (later) reacts, but exit_error is untouched.
        resetAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: reset_at
          description: |-
            reset_at is the parsed usage-cap reset time, set only alongside a
             "usage_exhausted" failure_class when the banner carried a parseable
             reset. Unset when unknown.
      title: AgentExitStatusResponse
      additionalProperties: false
    bossanova.v1.AgentInfo:
      type: object
      properties:
        name:
          type: string
          title: name
        version:
          type: string
          title: version
        userSettings:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.UserSetting'
          title: user_settings
          description: user_settings imported from plugin.proto.
      title: AgentInfo
      additionalProperties: false
    bossanova.v1.AgentRunnerServiceGetInfoRequest:
      type: object
      title: AgentRunnerServiceGetInfoRequest
      additionalProperties: false
    bossanova.v1.AgentRunnerServiceGetInfoResponse:
      type: object
      properties:
        info:
          title: info
          $ref: '#/components/schemas/bossanova.v1.PluginInfo'
      title: AgentRunnerServiceGetInfoResponse
      additionalProperties: false
    bossanova.v1.AgentSettings:
      type: object
      properties:
        name:
          type: string
          title: name
        enabled:
          type: boolean
          title: enabled
        config:
          type: object
          title: config
          additionalProperties:
            type: string
            title: value
      title: AgentSettings
      additionalProperties: false
      description: |-
        AgentSettings mirrors a PluginConfig entry: the agent's enabled flag plus its
         untyped dynamic config map. The map mirrors on-disk storage (bool kept as
         "true", enum/string stored as-is; an absent key is the zero value).
    bossanova.v1.AgentSettings.ConfigEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ConfigEntry
      additionalProperties: false
    bossanova.v1.AgentSettingsUpdate:
      type: object
      properties:
        name:
          type: string
          title: name
        enabled:
          type:
            - boolean
            - "null"
          title: enabled
        config:
          type: object
          title: config
          additionalProperties:
            type: string
            title: value
      title: AgentSettingsUpdate
      additionalProperties: false
      description: |-
        AgentSettingsUpdate carries a per-agent partial update. enabled is applied
         only when present; each config entry is an upsert where an empty value
         deletes the key (matching SetPluginConfigString/Bool semantics).
    bossanova.v1.AgentSettingsUpdate.ConfigEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ConfigEntry
      additionalProperties: false
    bossanova.v1.AggregatedRepo:
      type: object
      properties:
        originUrl:
          type: string
          title: origin_url
        displayName:
          type: string
          title: display_name
        defaultBaseBranch:
          type: string
          title: default_base_branch
        daemons:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.DaemonRepoRef'
          title: daemons
      title: AggregatedRepo
      additionalProperties: false
      description: |-
        AggregatedRepo is one logical repo (deduped by origin URL) plus a ref for
         every live daemon that serves it. Web-safe: carries no Repo and no API keys.
    bossanova.v1.AppendSystemPromptSupport:
      type: string
      title: AppendSystemPromptSupport
      enum:
        - APPEND_SYSTEM_PROMPT_SUPPORT_UNSPECIFIED
        - APPEND_SYSTEM_PROMPT_SUPPORT_IN_ARGV
        - APPEND_SYSTEM_PROMPT_SUPPORT_NONE
      description: |-
        AppendSystemPromptSupport is a runner's per-launch declaration about
         BuildInteractiveCommandRequest.append_system_prompt. It describes the ARGV
         the runner just returned — it is NOT a receipt that the launched binary
         accepted, retained or applied the instructions.
    bossanova.v1.ArchiveSessionCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: ArchiveSessionCommand
      additionalProperties: false
      description: |-
        ArchiveSessionCommand asks the daemon to archive a session.
         Replies with CommandResult carrying the updated Session.
    bossanova.v1.ArchiveSessionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: ArchiveSessionRequest
      additionalProperties: false
    bossanova.v1.ArchiveSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
      title: ArchiveSessionResponse
      additionalProperties: false
    bossanova.v1.AttachScope:
      type: string
      title: AttachScope
      enum:
        - ATTACH_SCOPE_UNSPECIFIED
        - ATTACH_SCOPE_EDITOR
        - ATTACH_SCOPE_VIEWER
      description: |-
        AttachScope distinguishes editor (input allowed) from viewer (read-only)
         attach modes. v1 ships only EDITOR semantics; VIEWER is wire-reserved.
    bossanova.v1.AttachSessionCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: AttachSessionCommand
      additionalProperties: false
      description: |-
        AttachSessionCommand asks the daemon to start streaming stdout/stderr for
         a session. Replies flow as SessionAttachChunk events carrying the same
         command_id.
    bossanova.v1.AttachSessionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: AttachSessionRequest
      additionalProperties: false
    bossanova.v1.AttachSessionResponse:
      type: object
      oneOf:
        - type: object
          properties:
            outputLine:
              title: output_line
              description: A line of Claude output.
              $ref: '#/components/schemas/bossanova.v1.OutputLine'
          title: output_line
          required:
            - outputLine
        - type: object
          properties:
            sessionEnded:
              title: session_ended
              description: Session ended (merged, closed, or blocked).
              $ref: '#/components/schemas/bossanova.v1.SessionEnded'
          title: session_ended
          required:
            - sessionEnded
        - type: object
          properties:
            stateChange:
              title: state_change
              description: Session state changed.
              $ref: '#/components/schemas/bossanova.v1.StateChange'
          title: state_change
          required:
            - stateChange
      title: AttachSessionResponse
      additionalProperties: false
      description: AttachSessionResponse is streamed to the CLI while attached to a session.
    bossanova.v1.Attempt:
      type: object
      properties:
        id:
          type: string
          title: id
        sessionId:
          type: string
          title: session_id
        trigger:
          title: trigger
          $ref: '#/components/schemas/bossanova.v1.AttemptTrigger'
        result:
          title: result
          $ref: '#/components/schemas/bossanova.v1.AttemptResult'
        error:
          type:
            - string
            - "null"
          title: error
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Attempt
      additionalProperties: false
      description: Attempt represents a fix attempt within a session.
    bossanova.v1.AttemptResult:
      type: string
      title: AttemptResult
      enum:
        - ATTEMPT_RESULT_UNSPECIFIED
        - ATTEMPT_RESULT_SUCCESS
        - ATTEMPT_RESULT_FAILED
        - ATTEMPT_RESULT_INCOMPLETE
      description: AttemptResult represents the outcome of a fix attempt.
    bossanova.v1.AttemptTrigger:
      type: string
      title: AttemptTrigger
      enum:
        - ATTEMPT_TRIGGER_UNSPECIFIED
        - ATTEMPT_TRIGGER_CHECK_FAILURE
        - ATTEMPT_TRIGGER_CONFLICT
        - ATTEMPT_TRIGGER_REVIEW_FEEDBACK
      description: AttemptTrigger represents what triggered a fix attempt.
    bossanova.v1.AttentionReason:
      type: string
      title: AttentionReason
      enum:
        - ATTENTION_REASON_UNSPECIFIED
        - ATTENTION_REASON_BLOCKED_MAX_ATTEMPTS
        - ATTENTION_REASON_AWAITING_HUMAN_INPUT
        - ATTENTION_REASON_REVIEW_REQUESTED
        - ATTENTION_REASON_MERGE_CONFLICT_UNRESOLVABLE
        - ATTENTION_REASON_AGENT_AUTH_FAILED
      description: AttentionReason represents why a session needs human attention.
    bossanova.v1.AttentionStatus:
      type: object
      properties:
        needsAttention:
          type: boolean
          title: needs_attention
        reason:
          title: reason
          $ref: '#/components/schemas/bossanova.v1.AttentionReason'
        summary:
          type: string
          title: summary
        since:
          title: since
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: AttentionStatus
      additionalProperties: false
      description: AttentionStatus represents whether and why a session needs human attention.
    bossanova.v1.AuthKind:
      type: string
      title: AuthKind
      enum:
        - AUTH_KIND_UNSPECIFIED
        - AUTH_KIND_NONE
        - AUTH_KIND_ENV_TOKEN
        - AUTH_KIND_HOME_DIR
      description: |-
        AuthKind identifies how an agent's per-account credential is injected into a
         spawned process. Reported by RotationCapability.
    bossanova.v1.Broadcast:
      type: object
      properties:
        id:
          type: string
          title: id
        selector:
          title: selector
          $ref: '#/components/schemas/bossanova.v1.BroadcastSelector'
        originChatId:
          type: string
          title: origin_chat_id
          description: |-
            ClaudeChat.agent_session_id — the same identifier BroadcastSelectorClause
             .chat_ids carries, NOT ClaudeChat.id. Spelled out because ClaudeChat has
             both, and a delivery child storing the row id here would produce records
             that cannot be joined against a selector. chat that sent it; empty = not chat-originated
        message:
          type: string
          title: message
          description: |-
            Prompt body delivered to each target chat. SECRET: stored verbatim and
             NEVER echoed back on any read surface — not in a list/get response, not in
             a log line, not in an error detail. It is carried here only for the
             delivering owner. The precedent is GithubCallback.message and the
             deliberately body-free githubCallbackJSON in services/boss/cmd/callback.go.
        state:
          type: string
          title: state
          description: lifecycle state; stable lowercase strings, defined by the delivery child
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Broadcast
      additionalProperties: false
      description: |-
        Broadcast is one message addressed at the set of chats a selector resolves
         to. It mirrors the daemon's domain model; timestamps use
         google.protobuf.Timestamp and enum-like fields are stable lowercase strings.
    bossanova.v1.BroadcastCommand:
      type: object
      properties:
        broadcastId:
          type: string
          title: broadcast_id
          description: |-
            The ORIGIN daemon's broadcast id, NOT one minted by the receiver. The
             reverse stream is at-least-once, so a redelivery of the same broadcast must
             be recognisable: persisting under the origin's id makes a repeat a no-op,
             whereas a locally minted id would make every redelivery look like a brand
             new broadcast and fan out duplicate deliveries.
        selector:
          title: selector
          description: |-
            Audience as issued by the origin, re-resolved against the receiving
             daemon's LOCAL chats only, under the same fan-out cap and start-error
             filter the daemon applies to its own sends.
          $ref: '#/components/schemas/bossanova.v1.BroadcastSelector'
        originDaemonId:
          type: string
          title: origin_daemon_id
          description: |-
            The ORIGIN daemon's persisted `.config/daemon-id`. LOOP GUARD: a daemon
             MUST drop, before doing anything else, any command whose origin_daemon_id
             equals its own daemon id. Without that check a daemon whose selector names
             itself would deliver its own broadcast twice — once locally at send time,
             once again on the round trip through bosso.
        originChatId:
          type: string
          title: origin_chat_id
          description: |-
            Chat the broadcast was issued from, on the ORIGIN daemon. It is not a local
             chat id here, so it is recorded as provenance only and is not resolvable
             against the receiver's chats.
        message:
          type: string
          title: message
          description: |-
            Broadcast body delivered to each resolved local target. SECRET — see the
             rule on Broadcast.message in daemon.proto: never echoed on a read surface,
             never logged.
        expiresAt:
          title: expires_at
          description: |-
            Absolute expiry inherited from the origin, so the receiver stops retrying
             at the same instant the origin does rather than restarting the clock.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: BroadcastCommand
      additionalProperties: false
      description: |-
        BroadcastCommand travels bosso → daemon: "you are a target for this
         broadcast; resolve it against YOUR chats and deliver it". A daemon that
         receives one delivers locally and MUST NOT publish a BroadcastEgress in
         response — that is the anti-storm invariant, and it is why this is a distinct
         type from BroadcastEgress rather than the same one flowing back.
    bossanova.v1.BroadcastDelivery:
      type: object
      properties:
        broadcastId:
          type: string
          title: broadcast_id
        targetChatId:
          type: string
          title: target_chat_id
          description: ClaudeChat.agent_session_id, as in BroadcastSelectorClause.chat_ids
        state:
          type: string
          title: state
          description: per-target delivery state; stable lowercase strings, defined by the delivery child
        attemptCount:
          type: integer
          title: attempt_count
          format: int32
        lastError:
          type: string
          title: last_error
          description: delivery diagnostic; empty = none. NEVER the message body.
        deliveredAt:
          title: delivered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: BroadcastDelivery
      additionalProperties: false
      description: |-
        BroadcastDelivery is the per-target outcome of one broadcast: one record per
         chat the selector resolved to.
    bossanova.v1.BroadcastEgress:
      type: object
      properties:
        broadcastId:
          type: string
          title: broadcast_id
          description: |-
            The ORIGIN daemon's broadcast id. Every daemon that delivers this broadcast
             persists it under this id (see BroadcastCommand.broadcast_id).
        selector:
          title: selector
          description: |-
            Audience as issued by the origin. Each receiving daemon re-resolves it
             against its own local chats; a selector is not a pre-resolved target list.
          $ref: '#/components/schemas/bossanova.v1.BroadcastSelector'
        originDaemonId:
          type: string
          title: origin_daemon_id
          description: |-
            The persisted `.config/daemon-id` of the daemon that ORIGINATED the
             broadcast. Carried so the ingress side can drop its own echo — see the loop
             guard on BroadcastCommand.origin_daemon_id.
        originChatId:
          type: string
          title: origin_chat_id
          description: |-
            Chat the broadcast was issued from (ClaudeChat.agent_session_id), on the
             origin daemon. Empty = operator-issued with no originating chat.
        message:
          type: string
          title: message
          description: |-
            Broadcast body. SECRET — see the rule on Broadcast.message in daemon.proto:
             never echoed on a read surface, never logged.
        expiresAt:
          title: expires_at
          description: |-
            Absolute expiry inherited from the origin's broadcast row, so a slow route
             cannot extend a broadcast's lifetime past what the sender asked for.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: BroadcastEgress
      additionalProperties: false
      description: |-
        BroadcastEgress travels daemon → bosso on the reverse stream: "this daemon
         produced a broadcast whose audience reaches beyond itself; route it". Local
         delivery is already the origin daemon's own business and has happened (or is
         happening) independently — this event asks only for the foreign leg. Bosso
         selects the target daemons and sends each a BroadcastCommand.
    bossanova.v1.BroadcastSelector:
      type: object
      properties:
        clauses:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.BroadcastSelectorClause'
          title: clauses
      title: BroadcastSelector
      additionalProperties: false
      description: |-
        BroadcastSelector is a disjunction of clauses: a candidate chat is in the
         audience if ANY clause matches (OR). A selector with no clauses is INVALID,
         never universal — an empty selector must never mean everyone, and the
         delivery boundary re-validates before fanning out.
    bossanova.v1.BroadcastSelectorClause:
      type: object
      properties:
        chatIds:
          type: array
          items:
            type: string
          title: chat_ids
          description: ClaudeChat.agent_session_id
        sessionIds:
          type: array
          items:
            type: string
          title: session_ids
          description: Session.id
        repoIds:
          type: array
          items:
            type: string
          title: repo_ids
          description: Session.repo_id
        agentNames:
          type: array
          items:
            type: string
          title: agent_names
          description: ClaudeChat.agent_name
        accountIds:
          type: array
          items:
            type: string
          title: account_ids
          description: |-
            No wire message carries a chat's account today (ClaudeChat has no
             account_id), so this dimension is resolved daemon-side from the
             agent_chats.account_id column. The delivery child either keeps resolving it
             there or adds account_id to ClaudeChat. The "" default account is not
             addressable.
        daemonIds:
          type: array
          items:
            type: string
          title: daemon_ids
          description: ClaudeChat.daemon_id (the "" local daemon is not addressable)
      title: BroadcastSelectorClause
      additionalProperties: false
      description: |-
        BroadcastSelectorClause is a conjunction: every non-empty dimension must
         match (AND), and within one dimension the listed values are alternatives
         (OR). A dimension left empty is not a constraint. A clause that constrains
         nothing matches NOTHING, never everyone.

         A blank ("") entry is invalid in every dimension, so the system-default
         account and the local daemon — which carry "" on the target side — are not
         addressable by name; those chats are reached via the other four dimensions
         until a grammar sentinel exists. Values may not carry the textual grammar's
         "+" or "," separators either, since the canonical selector string must
         re-parse to the same selector.
    bossanova.v1.BroadcastSubscription:
      type: object
      properties:
        id:
          type: string
          title: id
        ownerSessionId:
          type: string
          title: owner_session_id
          description: |-
            Session whose outcome fires this subscription. Carries no foreign key: a
             subscription may outlive the session it watches, and expiry — not a
             referential cascade — retires one whose session will never settle.
        originChatId:
          type: string
          title: origin_chat_id
          description: |-
            Chat that registered it (ClaudeChat.agent_session_id), as in
             BroadcastSelectorClause.chat_ids. Empty = operator-issued with no
             registering chat.

             Provenance only: it never narrows the audience. Unlike SendBroadcast — where
             the origin is the sender and is dropped from its own audience unless
             include_origin — the origin of a subscription is the REQUESTER, so a
             selector naming it is honoured and the registering chat is told. The
             selector alone decides who receives the fired broadcast.
        triggerEvent:
          type: string
          title: trigger_event
          description: 'Outcome class awaited: "completed", "errored", or "settled" (either).'
        selector:
          title: selector
          description: |-
            Audience to broadcast to when it fires. Resolved at FIRE time, so the
             chats that exist then are the ones addressed.
          $ref: '#/components/schemas/bossanova.v1.BroadcastSelector'
        state:
          type: string
          title: state
          description: 'Lifecycle state: "active", "fired", "canceled", or "expired".'
        firedBroadcastId:
          type: string
          title: fired_broadcast_id
          description: Broadcast the winning compare-and-swap produced; empty until it fires.
        firedAt:
          title: fired_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: BroadcastSubscription
      additionalProperties: false
      description: |-
        BroadcastSubscription is a standing rule: when owner_session_id reaches an
         outcome matching trigger_event, the daemon broadcasts the registered message
         to the audience selector resolves.

         THE MESSAGE BODY IS DELIBERATELY ABSENT from this message, and that omission
         is the contract, not an oversight. Unlike Broadcast — which carries a
         `message` field because the delivering owner needs it and every read surface
         clears it — a BroadcastSubscription is only ever built on a READ path, so the
         body has no legitimate reason to exist on the wire here at all. It is
         write-only: CreateBroadcastSubscriptionRequest.message carries it inbound,
         and no response, log line, or persisted diagnostic ever returns it. Do not
         add a `message` field to this message or to any subscription response.
    bossanova.v1.BuildInteractiveCommandRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        resume:
          type: boolean
          title: resume
        logPath:
          type: string
          title: log_path
          description: argv MUST tee output here
        initialPrompt:
          type: string
          title: initial_prompt
          description: raw user prompt to submit at startup
        initialCommand:
          type: string
          title: initial_command
          description: boss command name without agent prefix
        worktreePath:
          type: string
          title: worktree_path
          description: directory where the interactive pane launches
        appendSystemPrompt:
          type: string
          title: append_system_prompt
          description: |-
            append_system_prompt, when non-empty, is appended to the agent's system
             prompt (e.g. Claude Code's --append-system-prompt). bossd uses it to carry
             the chat's boss session context (session/chat/repo identifiers) for every
             chat, plus the cron autonomy directive for scheduler-spawned runs.
        model:
          type: string
          title: model
          description: opaque agent model id; "" = plugin default.
        mcpConfigPath:
          type: string
          title: mcp_config_path
          description: |-
            mcp_config_path, when non-empty, is an absolute path to a JSON file
             describing MCP servers to expose to the interactive agent (e.g. Claude
             Code's --mcp-config). bossd writes it into the boss app-data dir (NEVER
             the worktree) per spawn so the agent can reach the boss MCP server's
             mcp__boss__* tools in-session. Empty means no boss MCP wiring.
        strictMcpConfig:
          type: boolean
          title: strict_mcp_config
          description: |-
            strict_mcp_config, when true, tells the agent to load ONLY the servers in
             mcp_config_path and ignore project .mcp.json / settings MCP servers (Claude
             Code's --strict-mcp-config). bossd sets it for cron/fleet spawns so the
             curated set (boss + Linear) is the whole surface; absent/false preserves the
             pre-existing merge behavior for interactive and any un-updated caller.
      title: BuildInteractiveCommandRequest
      additionalProperties: false
    bossanova.v1.BuildInteractiveCommandResponse:
      type: object
      properties:
        argv:
          type: array
          items:
            type: string
          title: argv
        readyMarker:
          type: string
          title: ready_marker
          description: |-
            Prompt marker rendered by the interactive agent when it is ready for
             pasted input. Empty means the daemon uses its legacy Claude marker.
        commandPrefix:
          type: string
          title: command_prefix
          description: |-
            Prefix used to invoke boss-provided commands in the interactive agent.
             Examples: "/" for Claude Code, "$" for Codex. Empty preserves the
             legacy Claude slash prefix.
        consumesInitialInput:
          type: boolean
          title: consumes_initial_input
          description: |-
            True when argv embeds initial_prompt/initial_command so the daemon must
             not inject input into the tmux pane after launch.
        appendSystemPromptSupport:
          title: append_system_prompt_support
          description: |-
            The runner's declaration about BuildInteractiveCommandRequest
             .append_system_prompt for THIS launch. The host compares it against the
             instruction classes it built and logs one structured record naming what
             was dropped; it never fails the spawn and never alters argv.

             The declaration is atomic for the whole suffix: append_system_prompt is a
             single string, so there is no partial support to negotiate. The class list
             the host logs describes what bossd BUILT (and therefore what was dropped),
             not a per-class handshake.
          $ref: '#/components/schemas/bossanova.v1.AppendSystemPromptSupport'
      title: BuildInteractiveCommandResponse
      additionalProperties: false
    bossanova.v1.CallbackInterest:
      type: object
      properties:
        repoOriginUrl:
          type: string
          title: repo_origin_url
          description: Canonical repository origin URL (matches WebhookEvent.repo_origin_url).
        prNumber:
          type: integer
          title: pr_number
          format: int32
          description: Pull request number the daemon holds callbacks for.
      title: CallbackInterest
      additionalProperties: false
      description: |-
        CallbackInterest advertises that a daemon holds one or more active GitHub
         callbacks awaiting a verified state change on a repository + pull request.
         bosso routes matching verified webhook signals to the advertising daemon even
         when it owns no live session for that PR — interests are additive to session
         ownership, never modeled as synthetic sessions.
    bossanova.v1.CallbackInterestSet:
      type: object
      properties:
        interests:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.CallbackInterest'
          title: interests
      title: CallbackInterestSet
      additionalProperties: false
      description: |-
        CallbackInterestSet is a daemon's complete current callback-interest set,
         carried on the DaemonEvent stream to refresh interests while connected.
    bossanova.v1.CancelWorkflowRequest:
      type: object
      properties:
        workflowId:
          type: string
          title: workflow_id
      title: CancelWorkflowRequest
      additionalProperties: false
    bossanova.v1.CancelWorkflowResponse:
      type: object
      properties:
        status:
          title: status
          $ref: '#/components/schemas/bossanova.v1.WorkflowStatusInfo'
      title: CancelWorkflowResponse
      additionalProperties: false
    bossanova.v1.ChatDelta:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/bossanova.v1.ChatDelta.Kind'
        chat:
          title: chat
          description: 'On CREATE/UPDATE: full metadata. On DELETE: id only.'
          $ref: '#/components/schemas/bossanova.v1.ClaudeChatMetadata'
      title: ChatDelta
      additionalProperties: false
      description: ChatDelta is a single ClaudeChatMetadata lifecycle change.
    bossanova.v1.ChatDelta.Kind:
      type: string
      title: Kind
      enum:
        - KIND_UNSPECIFIED
        - KIND_CREATED
        - KIND_UPDATED
        - KIND_DELETED
      description: Kind names are prefixed with KIND_ to satisfy buf STANDARD lint.
    bossanova.v1.ChatMessage:
      type: object
      properties:
        role:
          type: string
          title: role
          description: user | assistant | system | tool
        text:
          type: string
          title: text
          description: flattened text content of the turn
        timestamp:
          type: string
          title: timestamp
          description: RFC3339, best-effort from the transcript ("" if unknown)
        kind:
          type: string
          title: kind
          description: 'optional: text | tool_use | tool_result'
      title: ChatMessage
      additionalProperties: false
      description: |-
        ChatMessage is a transport-neutral, single turn of an agent chat transcript,
         flattened from the agent's on-disk JSONL by the owning plugin. It carries
         enough to render a conversation and to derive the "final result" without the
         daemon needing to understand any agent-specific transcript format.
    bossanova.v1.ChatStatus:
      type: string
      title: ChatStatus
      enum:
        - CHAT_STATUS_UNSPECIFIED
        - CHAT_STATUS_WORKING
        - CHAT_STATUS_IDLE
        - CHAT_STATUS_STOPPED
        - CHAT_STATUS_QUESTION
        - CHAT_STATUS_LIMITED
      description: ChatStatus represents the live status of a Claude Code chat process.
    bossanova.v1.ChatStatusDelta:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        status:
          title: status
          $ref: '#/components/schemas/bossanova.v1.ChatStatus'
        lastOutputAt:
          title: last_output_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        agentSessionId:
          type: string
          title: agent_session_id
          description: Per-chat key. Empty for legacy daemons; new daemons MUST set this.
      title: ChatStatusDelta
      additionalProperties: false
      description: |-
        ChatStatusDelta reports the live status of a Claude Code chat process.
         Named *Delta to avoid collision with the ChatStatus enum in models.proto.
         Coalesced by the daemon in a ~100ms window (decision #11).
    bossanova.v1.ChatStatusEntry:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
        status:
          title: status
          $ref: '#/components/schemas/bossanova.v1.ChatStatus'
        lastOutputAt:
          title: last_output_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ChatStatusEntry
      additionalProperties: false
      description: ChatStatusEntry is a single chat's cached status.
    bossanova.v1.ChatStatusReport:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: Agent session UUID
        status:
          title: status
          description: Current process status
          $ref: '#/components/schemas/bossanova.v1.ChatStatus'
        lastOutputAt:
          title: last_output_at
          description: Last PTY output time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ChatStatusReport
      additionalProperties: false
      description: ChatStatusReport is a single heartbeat from an owning client.
    bossanova.v1.CheckConclusion:
      type: string
      title: CheckConclusion
      enum:
        - CHECK_CONCLUSION_UNSPECIFIED
        - CHECK_CONCLUSION_SUCCESS
        - CHECK_CONCLUSION_FAILURE
        - CHECK_CONCLUSION_NEUTRAL
        - CHECK_CONCLUSION_CANCELLED
        - CHECK_CONCLUSION_SKIPPED
        - CHECK_CONCLUSION_TIMED_OUT
      description: CheckConclusion represents the conclusion of a completed CI check.
    bossanova.v1.CheckResult:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        status:
          title: status
          $ref: '#/components/schemas/bossanova.v1.CheckStatus'
        conclusion:
          oneOf:
            - $ref: '#/components/schemas/bossanova.v1.CheckConclusion'
            - type: "null"
          title: conclusion
      title: CheckResult
      additionalProperties: false
      description: CheckResult represents the result of a single CI check.
    bossanova.v1.CheckSnapshot:
      type: object
      properties:
        polledAt:
          title: polled_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        headSha:
          type: string
          title: head_sha
        rawJson:
          type: string
          title: raw_json
          description: |-
            Raw JSON of the parsed []vcs.CheckResult slice the DisplayPoller
             fed into ComputeDisplayStatus. The CLI renders this verbatim.
        computedStatus:
          title: computed_status
          description: The DisplayStatus enum int the poller resolved for this snapshot.
          $ref: '#/components/schemas/bossanova.v1.DisplayStatus'
      title: CheckSnapshot
      additionalProperties: false
    bossanova.v1.CheckStatus:
      type: string
      title: CheckStatus
      enum:
        - CHECK_STATUS_UNSPECIFIED
        - CHECK_STATUS_QUEUED
        - CHECK_STATUS_IN_PROGRESS
        - CHECK_STATUS_COMPLETED
      description: CheckStatus represents the status of a CI check run.
    bossanova.v1.ChecksFailedEvent:
      type: object
      properties:
        prId:
          type: integer
          title: pr_id
          format: int32
        failedChecks:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.CheckResult'
          title: failed_checks
      title: ChecksFailedEvent
      additionalProperties: false
    bossanova.v1.ChecksOverall:
      type: string
      title: ChecksOverall
      enum:
        - CHECKS_OVERALL_UNSPECIFIED
        - CHECKS_OVERALL_PENDING
        - CHECKS_OVERALL_PASSED
        - CHECKS_OVERALL_FAILED
      description: ChecksOverall represents the aggregate status of all checks on a PR.
    bossanova.v1.ChecksPassedEvent:
      type: object
      properties:
        prId:
          type: integer
          title: pr_id
          format: int32
      title: ChecksPassedEvent
      additionalProperties: false
    bossanova.v1.ClaudeChat:
      type: object
      properties:
        id:
          type: string
          title: id
        sessionId:
          type: string
          title: session_id
        agentSessionId:
          type: string
          title: agent_session_id
          description: Agent session UUID
        title:
          type: string
          title: title
          description: First user prompt or "New chat"
        daemonId:
          type: string
          title: daemon_id
          description: Originating daemon (empty = local)
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        tmuxSessionName:
          type: string
          title: tmux_session_name
          description: Empty if no tmux session is hosting this chat
        agentName:
          type: string
          title: agent_name
          description: Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
        providerSessionId:
          type: string
          title: provider_session_id
          description: |-
            Provider-owned resume/session UUID. Empty when provider uses agent_session_id
             directly or the value has not been discovered yet.
        startError:
          type: string
          title: start_error
          description: |-
            Short human-readable reason the agent never came up for this chat
             (e.g. "send plan failed: ready marker ❯ not seen within 5s").
             Empty on the happy path; non-empty rows are preserved as
             "attempted but never came up" entries so the chat list can show a
             (failed to start) badge instead of silently swallowing the
             attempt.
      title: ClaudeChat
      additionalProperties: false
      description: ClaudeChat represents a Claude Code conversation associated with a session.
    bossanova.v1.ClaudeChatMetadata:
      type: object
      properties:
        id:
          type: string
          title: id
        sessionId:
          type: string
          title: session_id
        agentSessionId:
          type: string
          title: agent_session_id
        title:
          type: string
          title: title
        daemonId:
          type: string
          title: daemon_id
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastMessagePreview:
          type: string
          title: last_message_preview
          description: First ~200 characters of the last message. NOT the full message.
        agentName:
          type: string
          title: agent_name
          description: Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
      title: ClaudeChatMetadata
      additionalProperties: false
      description: |-
        ClaudeChatMetadata is the slim, snapshot-sized view of a Claude chat.
         NO full transcripts — last_message_preview is a short summary only.
         Full transcripts are fetched on demand via AttachSessionCommand.
    bossanova.v1.ClaudeTurn:
      type: object
      properties:
        role:
          type: string
          title: role
          description: '"user" or "assistant".'
        content:
          type: string
          title: content
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ClaudeTurn
      additionalProperties: false
      description: ClaudeTurn is a single turn from a recent Claude conversation.
    bossanova.v1.CloneAndRegisterRepoRequest:
      type: object
      properties:
        cloneUrl:
          type: string
          title: clone_url
        localPath:
          type: string
          title: local_path
        displayName:
          type: string
          title: display_name
        defaultBaseBranch:
          type: string
          title: default_base_branch
        worktreeBaseDir:
          type: string
          title: worktree_base_dir
        setupScript:
          type:
            - string
            - "null"
          title: setup_script
      title: CloneAndRegisterRepoRequest
      additionalProperties: false
    bossanova.v1.CloneAndRegisterRepoResponse:
      type: object
      properties:
        repo:
          title: repo
          $ref: '#/components/schemas/bossanova.v1.Repo'
      title: CloneAndRegisterRepoResponse
      additionalProperties: false
    bossanova.v1.CloseSessionCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: CloseSessionCommand
      additionalProperties: false
      description: |-
        CloseSessionCommand asks the daemon to close (abandon) a session.
         Replies with CommandResult carrying the updated Session (session = 4).
    bossanova.v1.CloseSessionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: CloseSessionRequest
      additionalProperties: false
    bossanova.v1.CloseSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
      title: CloseSessionResponse
      additionalProperties: false
    bossanova.v1.CloudAccessState:
      type: string
      title: CloudAccessState
      enum:
        - CLOUD_ACCESS_STATE_UNSPECIFIED
        - CLOUD_ACCESS_STATE_ACTIVE
        - CLOUD_ACCESS_STATE_NEEDS_SUBSCRIPTION
        - CLOUD_ACCESS_STATE_PENDING_ENTITLEMENT_REFRESH
        - CLOUD_ACCESS_STATE_PAST_DUE
        - CLOUD_ACCESS_STATE_CANCELED
        - CLOUD_ACCESS_STATE_BILLING_UNAVAILABLE
    bossanova.v1.CloudAccessStatus:
      type: object
      properties:
        state:
          title: state
          $ref: '#/components/schemas/bossanova.v1.CloudAccessState'
        accountId:
          type: string
          title: account_id
        workosOrgId:
          type: string
          title: workos_org_id
        message:
          type: string
          title: message
        canRetry:
          type: boolean
          title: can_retry
        canCreateCheckout:
          type: boolean
          title: can_create_checkout
          description: True when the client should call CreateCheckoutSession to open Stripe Checkout.
        checkoutStarted:
          type: boolean
          title: checkout_started
          description: |-
            True when checkout has already been started and the client should poll
             RefreshCloudEntitlements instead of creating another checkout.
        denialReason:
          type: string
          title: denial_reason
          description: Short machine-readable reason for inactive cloud access.
      title: CloudAccessStatus
      additionalProperties: false
    bossanova.v1.CommandResult:
      type: object
      allOf:
        - properties:
            commandId:
              type: string
              title: command_id
            ok:
              type: boolean
              title: ok
            error:
              type: string
              title: error
              description: |-
                Populated when ok == false. Human-readable; do NOT match on it for
                 routing — use error_code instead.
            errorCode:
              title: error_code
              description: |-
                Populated when ok == false. Lets bosso map structured failures
                 (CodeNotFound, CodeFailedPrecondition, …) without string-prefix games.
              $ref: '#/components/schemas/bossanova.v1.CommandResult.ErrorCode'
        - oneOf:
            - type: object
              properties:
                addAccount:
                  title: add_account
                  description: |-
                    AddAccount returns the created account (reuses daemon.proto type; metadata
                     only — never the credential).
                  $ref: '#/components/schemas/bossanova.v1.AddAccountResponse'
              title: add_account
              required:
                - addAccount
            - type: object
              properties:
                createCronJob:
                  title: create_cron_job
                  description: CreateCronJob returns the created cron job (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.CreateCronJobResponse'
              title: create_cron_job
              required:
                - createCronJob
            - type: object
              properties:
                createGithubCallback:
                  title: create_github_callback
                  description: CreateGithubCallback returns the registered callback (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.CreateGithubCallbackResponse'
              title: create_github_callback
              required:
                - createGithubCallback
            - type: object
              properties:
                createNote:
                  title: create_note
                  description: CreateNote returns the created note (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.CreateNoteResponse'
              title: create_note
              required:
                - createNote
            - type: object
              properties:
                emptyTrash:
                  title: empty_trash
                  description: |-
                    EmptyTrash returns the number of archived sessions permanently deleted.
                     CloseSession/ResurrectSession reuse session = 4; RemoveSession is Ok-only.
                  $ref: '#/components/schemas/bossanova.v1.EmptyTrashResult'
              title: empty_trash
              required:
                - emptyTrash
            - type: object
              properties:
                getChatTranscript:
                  title: get_chat_transcript
                  description: GetChatTranscript returns the chat's transcript (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.GetChatTranscriptResponse'
              title: get_chat_transcript
              required:
                - getChatTranscript
            - type: object
              properties:
                getCronJob:
                  title: get_cron_job
                  description: GetCronJob returns a single cron job (reuses daemon.proto type).
                  $ref: '#/components/schemas/bossanova.v1.GetCronJobResponse'
              title: get_cron_job
              required:
                - getCronJob
            - type: object
              properties:
                getNote:
