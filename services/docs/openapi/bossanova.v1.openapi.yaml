        GitHub-callback proxy messages (BOS-469). The create/list requests mirror the
         daemon.proto field sets; target_chat_id is the routing key. Delete carries
         target_chat_id purely for routing (the daemon addresses the callback by id).
    bossanova.v1.ProxyCreateGithubCallbackResponse:
      type: object
      properties:
        githubCallback:
          title: github_callback
          $ref: '#/components/schemas/bossanova.v1.GithubCallback'
      title: ProxyCreateGithubCallbackResponse
      additionalProperties: false
    bossanova.v1.ProxyCreateNoteRequest:
      type: object
      properties:
        repoId:
          type: string
          title: repo_id
          description: Owning repository (daemon-local repos.id). Required — also the routing key.
        sessionId:
          type:
            - string
            - "null"
          title: session_id
          description: 'Optional provenance: which run recorded this note.'
        chatId:
          type:
            - string
            - "null"
          title: chat_id
        body:
          type: string
          title: body
          description: |-
            Stored verbatim. Must be non-empty after trimming and within the 64 KiB
             cap, else InvalidArgument.
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            Trimmed, lowercased and de-duplicated before storage. At most 32 tags of
             at most 64 bytes each (measured after trimming), else InvalidArgument.
      title: ProxyCreateNoteRequest
      additionalProperties: false
      description: |-
        Notes proxy messages (BOS-552). The requests mirror the daemon.proto field
         sets; repo_id is the routing key, because a note is repo-scoped. Get/Update/
         Delete carry repo_id purely so bosso can route (the daemon addresses the note
         by id alone) — exactly the precedent set by ProxyDeleteGithubCallbackRequest,
         which carries target_chat_id for the same reason. Responses reuse the Note
         message from daemon.proto rather than redeclaring it.

         repo_id IS THE DAEMON-LOCAL repos.id — the value ResolveContext returns in
         Repo.id, and the same namespace CreateCronJobCommand.repo_id already uses. It
         is NOT the canonical origin URL that DaemonSnapshot.repo_ids advertises for
         webhook routing. Bosso resolves the owning daemon by asking the caller's Ready
         daemons for their repo lists, so passing an origin URL here resolves to
         NotFound.

         On Get/Update/Delete, repo_id ROUTES BUT DOES NOT SCOPE: once bosso has picked
         the daemon, the daemon addresses the note by id alone and does NOT verify that
         the note belongs to repo_id. Naming repo A while passing an id that lives in
         repo B on the same daemon therefore acts on B's note. This is not a privilege
         boundary — every candidate daemon is already the caller's own — but a client
         must not present repo_id to a user as a safety check.
    bossanova.v1.ProxyCreateNoteResponse:
      type: object
      properties:
        note:
          title: note
          $ref: '#/components/schemas/bossanova.v1.Note'
      title: ProxyCreateNoteResponse
      additionalProperties: false
    bossanova.v1.ProxyCreateSessionRequest:
      type: object
      properties:
        daemonId:
          type: string
          title: daemon_id
        repoId:
          type: string
          title: repo_id
        title:
          type: string
          title: title
        plan:
          type: string
          title: plan
        baseBranch:
          type: string
          title: base_branch
        agentName:
          type: string
          title: agent_name
        isQuickChat:
          type: boolean
          title: is_quick_chat
        prNumber:
          type:
            - integer
            - "null"
          title: pr_number
          format: int32
        branchName:
          type:
            - string
            - "null"
          title: branch_name
        trackerId:
          type:
            - string
            - "null"
          title: tracker_id
        trackerUrl:
          type:
            - string
            - "null"
          title: tracker_url
        trackerIssue:
          oneOf:
            - $ref: '#/components/schemas/bossanova.v1.TrackerIssue'
            - type: "null"
          title: tracker_issue
        trackerSource:
          type:
            - string
            - "null"
          title: tracker_source
        force:
          type: boolean
          title: force
          description: |-
            Bypass the BOS-236 tracker-issue dedup guard so a caller can intentionally
             create a second session for a tracker/PR/branch that already has an active
             one. Mirrors CreateSessionRequest.force so the hosted MCP gateway path has
             the same escape hatch as the local socket backend.
        detach:
          type: boolean
          title: detach
          description: |-
            Unattended-session fields carried through the hosted gateway so a hosted
             MCP client (e.g. /boss-epic) gets the same create_session behavior as the
             local socket backend. Mirror CreateSessionRequest.{detach,model,
             is_tmux_unattended}; without them a hosted create silently runs interactively
             on the daemon's default model and never fires the unattended prompt.
        model:
          type:
            - string
            - "null"
          title: model
        isTmuxUnattended:
          type: boolean
          title: is_tmux_unattended
        accountId:
          type:
            - string
            - "null"
          title: account_id
        forceBranch:
          type: boolean
          title: force_branch
          description: |-
            Mirror CreateSessionRequest.force_branch so hosted MCP create_session can
             intentionally replace an existing branch, matching the local socket path.
        deferPr:
          type: boolean
          title: defer_pr
          description: |-
            Mirror CreateSessionRequest.defer_pr so hosted MCP create_session can skip
             the up-front draft PR (PR opened at finalize only if commits land), matching
             the local socket path. Default false = unchanged eager draft-PR behavior.
      title: ProxyCreateSessionRequest
      additionalProperties: false
      description: |-
        ProxyCreateSessionRequest names the daemon to create the session on plus
         the creation parameters (mirrors CreateSessionCommand in stream.proto).
    bossanova.v1.ProxyCreateSessionResponse:
      type: object
      allOf:
        - properties:
            attachedExisting:
              type: boolean
              title: attached_existing
              description: |-
                True when the terminal `created` frame reports an EXISTING active session
                 the daemon attached to (dedup) rather than a freshly created one. Carries
                 SessionCreateChunk.attached_existing through the hosted create path so the
                 MCP gateway can surface it; only meaningful alongside `created`.
        - oneOf:
            - type: object
              properties:
                created:
                  title: created
                  $ref: '#/components/schemas/bossanova.v1.Session'
              title: created
              required:
                - created
            - type: object
              properties:
                error:
                  type: string
                  title: error
              title: error
              required:
                - error
            - type: object
              properties:
                setupOutput:
                  type: string
                  title: setup_output
              title: setup_output
              required:
                - setupOutput
      title: ProxyCreateSessionResponse
      additionalProperties: false
      description: |-
        ProxyCreateSessionResponse is streamed from orchestrator to the client as
         creation progresses: setup output lines, then a terminal created Session or
         an in-band error message.
