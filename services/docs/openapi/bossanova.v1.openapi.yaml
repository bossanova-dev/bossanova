         session id; close/resurrect return the updated Session, remove is Ok-only.
    bossanova.v1.ProxyCloseSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
      title: ProxyCloseSessionResponse
      additionalProperties: false
