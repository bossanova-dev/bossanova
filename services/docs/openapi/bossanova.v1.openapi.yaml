          type:
            - string
            - "null"
          title: session_id
        chatId:
          type:
            - string
            - "null"
          title: chat_id
        body:
          type: string
          title: body
        tags:
          type: array
          items:
            type: string
          title: tags
      title: CreateNoteCommand
      additionalProperties: false
      description: |-
        CreateNoteCommand records a note against a repo. Mirrors daemon.proto's
         CreateNoteRequest. Replies with CommandResult carrying a CreateNoteResponse
         (create_note = 36).
    bossanova.v1.CreateNoteRequest:
      type: object
      properties:
        repoId:
          type: string
          title: repo_id
          description: Owning repository. Required.
        sessionId:
          type:
            - string
            - "null"
          title: session_id
          description: 'Optional provenance: which run recorded this note.'
        chatId:
          type:
            - string
            - "null"
          title: chat_id
        body:
          type: string
          title: body
          description: |-
            Stored verbatim. Must be non-empty after trimming and within the 64 KiB
             cap, else InvalidArgument.
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            Trimmed, lowercased and de-duplicated before storage. At most 32 tags of
             at most 64 bytes each (measured after trimming), else InvalidArgument.
      title: CreateNoteRequest
      additionalProperties: false
    bossanova.v1.CreateNoteResponse:
      type: object
      properties:
        note:
          title: note
          $ref: '#/components/schemas/bossanova.v1.Note'
