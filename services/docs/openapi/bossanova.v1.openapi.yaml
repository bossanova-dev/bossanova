        repoId:
          type: string
          title: repo_id
        name:
          type: string
          title: name
        prompt:
          type: string
          title: prompt
        schedule:
          type: string
          title: schedule
        timezone:
          type: string
          title: timezone
        isEnabled:
          type: boolean
          title: is_enabled
        agentName:
          type: string
          title: agent_name
        model:
          type: string
          title: model
        gateCommand:
          type: string
          title: gate_command
        shouldRunSetupCommand:
          type:
            - boolean
            - "null"
          title: should_run_setup_command
        isZeroOutput:
          type:
            - boolean
            - "null"
          title: is_zero_output
      title: CreateCronJobCommand
      additionalProperties: false
      description: |-
        CreateCronJobCommand asks the daemon to register a new scheduled prompt for a
         repo. Fields mirror daemon.proto's CreateCronJobRequest. Replies with
         CommandResult carrying a CreateCronJobResponse (create_cron_job = 20).
    bossanova.v1.CreateCronJobRequest:
      type: object
      properties:
        repoId:
          type: string
          title: repo_id
        name:
          type: string
          title: name
        prompt:
          type: string
          title: prompt
        schedule:
          type: string
          title: schedule
        timezone:
          type: string
          title: timezone
          description: optional IANA tz; empty = daemon-local
        isEnabled:
          type: boolean
          title: is_enabled
        agentName:
          type: string
          title: agent_name
          description: optional agent runner plugin name; empty = claude
        model:
          type: string
          title: model
          description: opaque agent model id; "" = plugin default. Never enumerated by bossd.
        gateCommand:
          type: string
          title: gate_command
          description: optional gate command run before each fire; empty = no gate
        shouldRunSetupCommand:
          type:
            - boolean
            - "null"
          title: should_run_setup_command
          description: |-
            run the repo setup script before the agent. optional so the server can
             default it to true when a client omits it (a plain bool can't tell
             "omitted" from "explicit false").
        isZeroOutput:
          type:
            - boolean
            - "null"
          title: is_zero_output
          description: |-
            mark the job "zero output": intended to fire with no worktree/branch/PR,
             because the run is expected to produce no repo changes. optional purely for
             symmetry with UpdateCronJobRequest; omitted and explicit false mean the same
             thing (default false). Persisted and echoed back only — nothing honours it
             yet, so a job with this set still fires exactly as it does today (BOS-543).
      title: CreateCronJobRequest
      additionalProperties: false
    bossanova.v1.CreateCronJobResponse:
      type: object
      properties:
        cronJob:
          title: cron_job
          $ref: '#/components/schemas/bossanova.v1.CronJob'
      title: CreateCronJobResponse
      additionalProperties: false
    bossanova.v1.CreateError:
      type: object
      properties:
        message:
          type: string
          title: message
      title: CreateError
      additionalProperties: false
      description: |-
        CreateError carries a human-readable failure reason for a CreateSession that
         could not complete. It is the terminal frame on the error path.
    bossanova.v1.CreateGithubCallbackCommand:
