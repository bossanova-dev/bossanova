          type: string
          title: name
        prompt:
          type: string
          title: prompt
        schedule:
          type: string
          title: schedule
        timezone:
          type: string
          title: timezone
          description: optional IANA tz; empty = daemon-local
        enabled:
          type: boolean
          title: enabled
        agentName:
          type: string
