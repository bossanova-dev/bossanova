          title: last_delivery_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastDeliveryStatus:
          type: string
          title: last_delivery_status
        lastError:
          type: string
          title: last_error
      title: GitHubAppRepoStatus
      additionalProperties: false
    bossanova.v1.GithubCallback:
      type: object
      properties:
        id:
          type: string
          title: id
        groupId:
          type: string
          title: group_id
          description: empty = ungrouped (a group of one)
        targetChatId:
          type: string
          title: target_chat_id
        repoOwner:
          type: string
          title: repo_owner
        repoName:
          type: string
          title: repo_name
        prNumber:
          type: integer
          title: pr_number
          format: int32
        trigger:
          type: string
          title: trigger
          description: merged | closed | checks_passed | checks_failed | ready_for_review | checks_passed_ready
        state:
          type: string
          title: state
          description: active | leased | triggered | delivered | canceled | expired
        message:
          type: string
          title: message
          description: registered prompt body; secret — never logged
        leaseOwner:
          type: string
          title: lease_owner
          description: empty = no active lease
        attemptCount:
          type: integer
          title: attempt_count
          format: int32
        lastError:
          type: string
          title: last_error
          description: delivery diagnostic; empty = none. Never the message body.
        lastEvent:
          type: string
          title: last_event
          description: last matched event label; empty = none. Never the message body.
        leaseDeadlineAt:
          title: lease_deadline_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        nextAttemptAt:
          title: next_attempt_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        triggeredAt:
          title: triggered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deliveredAt:
          title: delivered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: GithubCallback
      additionalProperties: false
      description: |-
        GithubCallback is a durable one-shot registration that delivers a chat
         message when a pull-request event fires (BOS-467). It mirrors the daemon's
         domain model; timestamps use google.protobuf.Timestamp and enum-like fields
         are stable lowercase strings. The message body is a secret payload — it is
         carried here for the registering owner but must never be logged.
    bossanova.v1.GlobalSettings:
      type: object
      properties:
        worktreeBaseDir:
          type: string
          title: worktree_base_dir
        pollIntervalSeconds:
          type: integer
          title: poll_interval_seconds
          format: int32
          description: 0 = default (30 at read)
        defaultAgent:
          type: string
          title: default_agent
        eventTracingEnabled:
          type: boolean
          title: event_tracing_enabled
        errorTrackingEnabled:
          type: boolean
          title: error_tracking_enabled
        posthogProjectToken:
          type: string
          title: posthog_project_token
        posthogHost:
          type: string
          title: posthog_host
        agents:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.AgentSettings'
          title: agents
      title: GlobalSettings
      additionalProperties: false
      description: |-
        GlobalSettings is the TUI-editable subset of settings.json — the fields the
         boss settings form edits — plus one AgentSettings entry per configured agent
         plugin. Non-editable bookkeeping fields (app_data_dir, socket_path, skills,
         managed_accounts, …) are intentionally out of scope.
    bossanova.v1.HasQuestionPromptRequest:
      type: object
      properties:
        paneContent:
          type: string
          title: pane_content
          format: byte
      title: HasQuestionPromptRequest
      additionalProperties: false
    bossanova.v1.HasQuestionPromptResponse:
      type: object
      properties:
        hasPrompt:
          type: boolean
          title: has_prompt
          description: |-
            The pane is waiting on the user: notify a human. True for a modal AND for
             a conversational question asked with a live composer.
        blocksInput:
          type: boolean
          title: blocks_input
          description: |-
            The prompt is MODAL: a selection UI has taken over the composer, so a
             keystroke is consumed as a choice rather than typed as text. Strict subset
             of has_prompt. Callers gating whether it is safe to DELIVER input must read
             this field, never has_prompt -- a conversational question sets has_prompt
             with the composer live, and refusing there would drop the answer (BOS-600).
             Plugins predating this field leave it false, which fails open to the
             pre-BOS-600 behaviour rather than refusing every send.
      title: HasQuestionPromptResponse
      additionalProperties: false
    bossanova.v1.HasWorkingIndicatorRequest:
      type: object
      properties:
        paneContent:
          type: string
          title: pane_content
          format: byte
      title: HasWorkingIndicatorRequest
      additionalProperties: false
    bossanova.v1.HasWorkingIndicatorResponse:
      type: object
      properties:
        isWorking:
          type: boolean
          title: is_working
      title: HasWorkingIndicatorResponse
      additionalProperties: false
    bossanova.v1.HeadlessCapabilityProfile:
      type: string
      title: HeadlessCapabilityProfile
      enum:
        - HEADLESS_CAPABILITY_PROFILE_UNSPECIFIED
        - HEADLESS_CAPABILITY_PROFILE_TRACKER_PLAN_ATTACHMENT_V1
      description: |-
        HeadlessCapabilityProfile is an explicit, versioned contract for work that
         needs a particular runtime operation surface. UNSPECIFIED preserves every
         historical launch shape; callers must opt in rather than deriving a profile
         from a prompt or command name.
    bossanova.v1.HostServiceListSessionsRequest:
      type: object
      title: HostServiceListSessionsRequest
      additionalProperties: false
      description: HostServiceListSessionsRequest is currently empty as it lists all sessions.
    bossanova.v1.HostServiceListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.Session'
          title: sessions
      title: HostServiceListSessionsResponse
      additionalProperties: false
    bossanova.v1.HttpEndpoint:
      type: object
      properties:
        port:
          type: integer
          title: port
        url:
          type: string
          title: url
      title: HttpEndpoint
      additionalProperties: false
      description: |-
        HttpEndpoint is a single verified, machine-local web endpoint for a session:
         the listening TCP port and the reachable loopback URL (scheme + loopback host
         + port), e.g. "http://127.0.0.1:8080" or "https://[::1]:8443".

         These values are local, dynamic, and NEVER persisted. They exist only on the
         wire, and only for an opted-in local TUI read that clears the daemon's
         locality gates (see GetSessionRequest / ListSessionsRequest). Default reads,
         CLI/MCP callers, mutation responses, daemon snapshots, reverse-stream
         commands, and every bosso/orchestrator surface leave Session.http_endpoints
         empty.
    bossanova.v1.InstalledPlugin:
      type: object
      properties:
        name:
          type: string
          title: name
        path:
          type: string
          title: path
        enabled:
          type: boolean
          title: enabled
        status:
          title: status
          $ref: '#/components/schemas/bossanova.v1.InstalledPlugin.Status'
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: |-
            capabilities is the set of plugin interfaces the daemon dispensed
             for this plugin: "agent", "workflow", "task_source". Empty for
             disabled or failed plugins.
        error:
          type: string
          title: error
          description: |-
            error is populated when status == STATUS_LOAD_FAILED and carries
             the underlying go-plugin handshake / spawn error.
      title: InstalledPlugin
      additionalProperties: false
      description: |-
        InstalledPlugin describes a single entry from the daemon's plugin
         configuration along with its current load state. Both successfully
         loaded and failed plugins are returned so operators can see typos in
         `path` (load_failed) or accidental disables (status=disabled).
    bossanova.v1.InstalledPlugin.Status:
      type: string
      title: Status
      enum:
        - STATUS_UNSPECIFIED
        - STATUS_LOADED
        - STATUS_DISABLED
        - STATUS_LOAD_FAILED
    bossanova.v1.IsAgentRunningRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: IsAgentRunningRequest
      additionalProperties: false
    bossanova.v1.IsAgentRunningResponse:
      type: object
      properties:
        running:
          type: boolean
          title: running
      title: IsAgentRunningResponse
      additionalProperties: false
    bossanova.v1.IssueAttachTokenRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        chatId:
          type: string
          title: chat_id
        scope:
          title: scope
          description: |-
            EDITOR or VIEWER. Only EDITOR is used in v1 — VIEWER is accepted and
             behaves identically for now (see the plan's deferred items).
          $ref: '#/components/schemas/bossanova.v1.AttachScope'
      title: IssueAttachTokenRequest
      additionalProperties: false
      description: |-
        IssueAttachTokenRequest asks bosso for a short-lived JWT bound to the
         triple (session_id, chat_id, scope). Bosso validates that
         chat ∈ session ∈ caller-user before signing the token.
    bossanova.v1.IssueAttachTokenResponse:
      type: object
      properties:
        token:
          type: string
          title: token
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: IssueAttachTokenResponse
      additionalProperties: false
      description: |-
        IssueAttachTokenResponse carries the freshly-minted attach JWT and its
         expiry. The browser sends `token` as the second value of the
