    bossanova.v1.SwitchAccountCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: owning session (daemon resolves primary live chat if agent_session_id empty)
        agentSessionId:
          type: string
          title: agent_session_id
          description: optional; empty => session's primary live chat
        accountId:
          type: string
          title: account_id
          description: target; "" = system default (account 0)
        force:
          type: boolean
          title: force
          description: interrupt a mid-turn (WORKING) chat
      title: SwitchAccountCommand
      additionalProperties: false
      description: |-
        SwitchAccountCommand asks the daemon to switch a session's live chat to a
         different account (stop+swap+resume). The daemon replies with a
         CommandResult carrying a SwitchAccountResult payload.
    bossanova.v1.SwitchAccountResult:
      type: object
      properties:
        resumed:
          type: boolean
          title: resumed
        targetLabel:
          type: string
          title: target_label
        noticeText:
          type: string
          title: notice_text
      title: SwitchAccountResult
      additionalProperties: false
      description: |-
        SwitchAccountResult is the payload sent in a CommandResult for a successful
         SwitchAccountCommand. Mirrors the daemon's SwitchSessionAccountResponse.
    bossanova.v1.SwitchSessionAccountRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        accountId:
          type: string
          title: account_id
          description: target account id; "" = system default ("account 0")
        agentSessionId:
          type:
            - string
            - "null"
          title: agent_session_id
          description: which chat to switch; if unset, the session's primary live chat
        force:
          type: boolean
          title: force
          description: interrupt a mid-turn (WORKING) chat
      title: SwitchSessionAccountRequest
      additionalProperties: false
    bossanova.v1.SwitchSessionAccountResponse:
      type: object
      properties:
        resumed:
          type: boolean
          title: resumed
        targetLabel:
          type: string
          title: target_label
        noticeText:
          type: string
          title: notice_text
      title: SwitchSessionAccountResponse
      additionalProperties: false
    bossanova.v1.TaskAction:
