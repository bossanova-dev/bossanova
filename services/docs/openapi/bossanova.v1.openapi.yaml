          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        canAutoMerge:
          type: boolean
          title: can_auto_merge
        canAutoMergeDependabot:
          type: boolean
          title: can_auto_merge_dependabot
        mergeStrategy:
          type: string
          title: merge_strategy
        canAutoRepair:
          type: boolean
          title: can_auto_repair
          description: |-
            Whether the daemon's repair plugin may automatically repair this repo's PRs
             (failing checks, merge conflicts, review feedback). Honored by the plugin.
             Defaults on.
        shouldArchiveSessionsAfterMerge:
          type: boolean
          title: should_archive_sessions_after_merge
          description: |-
            Whether the daemon automatically archives a session once its PR is merged.
             Honored by the session dispatcher on the PR-merged transition. Defaults on.
        canAutoDeleteBranches:
          type: boolean
          title: can_auto_delete_branches
          description: |-
            Whether the daemon automatically deletes a session's git branch once its
             session is archived. Honored by the session dispatcher. Defaults on.
        shouldKeepBranchesCurrent:
          type: boolean
          title: should_keep_branches_current
          description: |-
            Whether the daemon proactively rebases this repo's other in-flight session
             branches onto the base branch whenever a merge advances it, force-pushing
             with lease. Opt-in (every rebase re-runs CI), so it defaults OFF.
        linearApiKey:
          type: string
          title: linear_api_key
        sentryApiKey:
          type: string
          title: sentry_api_key
          description: |-
            Sentry credentials. Mirrors linear_api_key: a Sentry auth token alone can't
             address an organization, so the org slug is stored alongside it. Issues are
             listed org-wide (across every project), so no project slug is needed.
        sentryOrg:
          type: string
          title: sentry_org
      title: Repo
      additionalProperties: false
      description: Repo represents a registered Git repository.
    bossanova.v1.RepoSettings:
      type: object
      properties:
        id:
          type: string
          title: id
        displayName:
          type: string
          title: display_name
        setupScript:
          type:
            - string
            - "null"
          title: setup_script
        mergeStrategy:
          title: merge_strategy
          $ref: '#/components/schemas/bossanova.v1.MergeStrategy'
        canAutoMerge:
