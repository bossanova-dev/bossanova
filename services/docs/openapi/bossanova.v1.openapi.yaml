  /bossanova.v1.OrchestratorService/ProxyCreateGithubCallback:
    post:
      tags:
        - bossanova.v1.OrchestratorService
      summary: ProxyCreateGithubCallback
      description: |-
        GitHub-callback proxies for remote-CLI callback management (BOS-469). All
         route to the owning daemon by target_chat_id via FindDaemonForChat, reusing
         the caller's own auth — a foreign chat resolves to NotFound so no cross-user
         registration can dispatch. Create/Delete require target_chat_id; List routes
         by target_chat_id when set, else aggregates across the caller's Ready daemons.
      operationId: bossanova.v1.OrchestratorService.ProxyCreateGithubCallback
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bossanova.v1.ProxyCreateGithubCallbackRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bossanova.v1.ProxyCreateGithubCallbackResponse'
  /bossanova.v1.OrchestratorService/ProxyCreateNote:
    post:
      tags:
        - bossanova.v1.OrchestratorService
      summary: ProxyCreateNote
      description: |-
        Notes proxies for remote-CLI and hosted-gateway note management (BOS-552).
         A note is repo-scoped, so all five route to the owning daemon by repo_id,
         reusing the caller's own auth — a foreign repo resolves to NotFound so no
         cross-user note access can dispatch. Create/Get/Update/Delete require
         repo_id; List routes by repo_id when set, else aggregates across the
         caller's Ready daemons.
      operationId: bossanova.v1.OrchestratorService.ProxyCreateNote
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
