    bossanova.v1.CreateSessionCommand:
      type: object
      properties:
        repoId:
          type: string
          title: repo_id
        title:
          type: string
          title: title
        plan:
          type: string
          title: plan
        baseBranch:
          type: string
          title: base_branch
        isQuickChat:
          type: boolean
          title: is_quick_chat
        agentName:
          type: string
          title: agent_name
        prNumber:
          type:
            - integer
            - "null"
          title: pr_number
          format: int32
          description: PR/tracker fields (wizard "existing PR" / "Linear" / "Sentry" flows).
        branchName:
          type:
            - string
            - "null"
          title: branch_name
        trackerId:
          type:
            - string
            - "null"
          title: tracker_id
        trackerUrl:
          type:
            - string
            - "null"
          title: tracker_url
        trackerIssue:
          oneOf:
            - $ref: '#/components/schemas/bossanova.v1.TrackerIssue'
            - type: "null"
          title: tracker_issue
          description: Full selected issue + source, so the daemon can format the plan (D3).
        trackerSource:
          type:
            - string
            - "null"
          title: tracker_source
        force:
          type: boolean
          title: force
          description: |-
            Bypass the BOS-236 tracker-issue dedup guard (mirrors
             CreateSessionRequest.force) so the reverse-stream create path carries the
             same escape hatch as the direct socket create.
        detach:
          type: boolean
          title: detach
          description: |-
            Unattended-session fields carried over the reverse stream so a hosted
             create (bosso → daemon) reproduces the local socket create. Mirror
             CreateSessionRequest.{detach,model,is_tmux_unattended}; without them the
             daemon builds an interactive/default-model session and skips the
             unattended prompt.
        model:
          type:
            - string
            - "null"
          title: model
        isTmuxUnattended:
          type: boolean
          title: is_tmux_unattended
        accountId:
          type:
            - string
            - "null"
          title: account_id
        forceBranch:
          type: boolean
          title: force_branch
          description: |-
            Mirror CreateSessionRequest.force_branch so reverse-stream hosted creates
             preserve the local socket path's branch replacement behavior.
        deferPr:
          type: boolean
          title: defer_pr
          description: |-
            Mirror CreateSessionRequest.defer_pr so reverse-stream hosted creates skip
             the up-front draft PR (PR opened at finalize only if commits land), matching
             the local socket path. Default false = unchanged eager draft-PR behavior.
      title: CreateSessionCommand
      additionalProperties: false
      description: |-
        CreateSessionCommand asks the daemon to create a new session. The daemon
         replies with a STREAM of SessionCreateChunk events (live setup output, then
         a terminal created/error) correlated by command_id — mirroring
         AttachSessionCommand/SessionAttachChunk. Fields are a wizard-relevant subset
         of daemon.proto's CreateSessionRequest.
    bossanova.v1.CreateSessionRequest:
      type: object
      properties:
        repoId:
          type: string
          title: repo_id
        title:
          type: string
          title: title
        plan:
          type: string
          title: plan
        baseBranch:
          type: string
          title: base_branch
        prNumber:
          type:
            - integer
            - "null"
          title: pr_number
          format: int32
          description: If set, attach to an existing PR instead of creating a new one.
        forceBranch:
          type: boolean
          title: force_branch
          description: If true, remove any existing branch with the same name before creating.
        isQuickChat:
          type: boolean
          title: is_quick_chat
          description: If true, run as a quick chat session (no worktree, no branch, no PR).
        branchName:
          type:
            - string
            - "null"
          title: branch_name
          description: Optional branch name (eg. from Linear's suggested branch name).
        trackerId:
          type:
            - string
            - "null"
          title: tracker_id
          description: External issue tracker fields. External issue ID (eg. "FRE-1176")
        trackerUrl:
          type:
            - string
            - "null"
          title: tracker_url
          description: URL to issue in external tracker
        agentName:
          type:
            - string
            - "null"
          title: agent_name
          description: Agent plugin to run this session under. Empty → server-chosen default agent.
        trackerIssue:
          oneOf:
            - $ref: '#/components/schemas/bossanova.v1.TrackerIssue'
            - type: "null"
          title: tracker_issue
          description: |-
            Full selected tracker issue + source, used to format the session plan
             server-side when plan is empty (web new-session tracker flows).
        trackerSource:
          type:
            - string
            - "null"
          title: tracker_source
          description: '"linear" | "sentry"'
        detach:
          type: boolean
          title: detach
          description: |-
            If true, run the session's initial agent pass headlessly (codex exec /
             claude --print) instead of leaving it idle to start interactively on
             first attach. Set by `boss new --detach`. Default false = interactive:
             no headless run fires, the agent starts when the user attaches.
        model:
          type:
            - string
            - "null"
          title: model
          description: |-
            Opaque agent model id to run this session under (e.g. an Opus id).
             Empty → the agent plugin's default model. Mirrors `boss cron add --model`;
             set by `boss new --model` and the MCP create_session tool.
        isTmuxUnattended:
          type: boolean
          title: is_tmux_unattended
        force:
          type: boolean
          title: force
          description: |-
            If true, bypass the tracker-issue dedup guard and create a second session
             for a tracker/PR/branch that already has an active one (BOS-236 escape hatch).
        accountId:
          type:
            - string
            - "null"
          title: account_id
          description: |-
            account_id binds the session to a rotation account. Presence matters: absent
             applies the default-account policy; present-and-empty ("") is an explicit
             system-default account 0 opt-out (no injected env, D9); present-and-non-empty
             binds that account.
        deferPr:
          type: boolean
          title: defer_pr
          description: |-
            If true, create the worktree-backed session but do NOT open a draft PR up
             front. A PR is opened only at finalize (the Stop-hook EnsurePR path) if the
             run produces commits. Default false = unchanged eager behavior: an empty
             draft PR is opened at session start. Meaningful only alongside
             detach/is_tmux_unattended, which install the finalize hook; useful for
             read-only/planning sessions. Mirrors StartSessionOpts.DeferPR (used by cron).
      title: CreateSessionRequest
      additionalProperties: false
    bossanova.v1.CreateSessionResponse:
      type: object
      oneOf:
        - type: object
          properties:
            sessionCreated:
              title: session_created
              $ref: '#/components/schemas/bossanova.v1.SessionCreated'
          title: session_created
          required:
            - sessionCreated
        - type: object
          properties:
            setupOutput:
              title: setup_output
              $ref: '#/components/schemas/bossanova.v1.SetupScriptOutput'
          title: setup_output
          required:
            - setupOutput
      title: CreateSessionResponse
      additionalProperties: false
    bossanova.v1.CreateWebhookConfigRequest:
      type: object
      properties:
        repoOriginUrl:
          type: string
          title: repo_origin_url
        provider:
          type: string
          title: provider
        secret:
          type: string
          title: secret
          description: If empty, a random secret will be generated.
      title: CreateWebhookConfigRequest
      additionalProperties: false
    bossanova.v1.CreateWebhookConfigResponse:
      type: object
      properties:
        config:
          title: config
          $ref: '#/components/schemas/bossanova.v1.WebhookConfig'
      title: CreateWebhookConfigResponse
      additionalProperties: false
    bossanova.v1.CronJob:
      type: object
      properties:
        id:
          type: string
          title: id
        repoId:
          type: string
          title: repo_id
        name:
          type: string
          title: name
        prompt:
          type: string
          title: prompt
        schedule:
          type: string
          title: schedule
          description: 5-field cron expression (or @daily, @hourly, etc.)
        timezone:
          type: string
          title: timezone
          description: optional IANA tz name; empty = daemon-local
        isEnabled:
          type: boolean
          title: is_enabled
        lastRunSessionId:
          type: string
          title: last_run_session_id
          description: empty if never run
        lastRunAt:
          title: last_run_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastRunOutcome:
          type: string
          title: last_run_outcome
          description: 'one of: deleted_no_changes, pr_created,'
        nextRunAt:
          title: next_run_at
          description: |-
            pr_skipped_no_github, pr_failed,
             chat_spawn_failed, cleanup_failed,
             failed_recovered, fire_failed
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastRunStatus:
          title: last_run_status
          description: derived; not persisted
          $ref: '#/components/schemas/bossanova.v1.CronJobStatus'
        agentName:
          type: string
          title: agent_name
          description: agent runner plugin name; empty legacy data defaults to claude
        model:
          type: string
          title: model
          description: opaque agent model id; "" = plugin default. Never enumerated by bossd.
        gateCommand:
          type: string
          title: gate_command
          description: optional gate command run before each fire; empty = no gate
        shouldRunSetupCommand:
          type: boolean
          title: should_run_setup_command
          description: run the repo setup script before the agent; default true
        isZeroOutput:
          type: boolean
          title: is_zero_output
          description: |-
            Marks this job as "zero output": it is intended to fire with no worktree,
             branch, or pull request, because the run is expected to produce no repo
             changes. Persisted and echoed back only — nothing honours it yet, so a job
             with this set still fires exactly as it does today (BOS-543).
      title: CronJob
      additionalProperties: false
      description: |-
        CronJob represents a scheduled prompt that fires on a cron expression.

         At fire time, bossd spawns a new session in a fresh worktree with
         PR creation deferred. When Claude's Stop hook fires, the daemon
         finalizes the run: empty diff -> delete worktree; non-empty diff +
         GitHub origin -> push and open PR; otherwise preserve the worktree.
    bossanova.v1.CronJobStatus:
      type: string
      title: CronJobStatus
      enum:
        - CRON_JOB_STATUS_UNSPECIFIED
        - CRON_JOB_STATUS_IDLE
        - CRON_JOB_STATUS_RUNNING
        - CRON_JOB_STATUS_FAILED
        - CRON_JOB_STATUS_GATED
        - CRON_JOB_STATUS_GATING
      description: |-
        CronJobStatus is the derived run-status for a cron job, computed from
         the previous run's session state and recorded outcome. Not persisted —
         `last_run_outcome` (string) remains the audit field on disk.
    bossanova.v1.CronJobWithDaemon:
      type: object
      properties:
        job:
          title: job
          $ref: '#/components/schemas/bossanova.v1.CronJob'
        daemonId:
          type: string
          title: daemon_id
        daemonHostname:
          type: string
          title: daemon_hostname
      title: CronJobWithDaemon
      additionalProperties: false
      description: |-
        CronJobWithDaemon tags a cron job with the daemon that owns it, so the web
         aggregated list can route subsequent mutating calls back to the right daemon.
    bossanova.v1.CustomEvent:
      type: object
      properties:
        eventType:
          type: string
          title: event_type
        payload:
          type: string
          title: payload
          description: JSON-encoded payload.
      title: CustomEvent
      additionalProperties: false
      description: CustomEvent is an extensibility point for plugin-specific events.
    bossanova.v1.DaemonEvent:
      type: object
      oneOf:
        - type: object
          properties:
            ack:
              title: ack
              description: Response to a WebhookEvent command from the orchestrator.
              $ref: '#/components/schemas/bossanova.v1.WebhookAck'
          title: ack
          required:
            - ack
        - type: object
          properties:
            attachChunk:
              title: attach_chunk
              description: Stdout/stderr chunk from an active AttachSession.
              $ref: '#/components/schemas/bossanova.v1.SessionAttachChunk'
          title: attach_chunk
          required:
            - attachChunk
        - type: object
          properties:
            callbackInterests:
              title: callback_interests
              description: |-
                The daemon's complete current GitHub callback-interest set, re-advertised
                 whenever a callback is created, deleted, triggered, or expires. bosso
                 replaces the daemon's interest set on receipt (snapshot semantics), so
                 withdrawal after a terminal transition is automatic — an empty set means
                 the daemon holds no callbacks. The connect-time set rides DaemonSnapshot
                 (field 7); this delta refreshes it while the stream stays up.
              $ref: '#/components/schemas/bossanova.v1.CallbackInterestSet'
          title: callback_interests
          required:
            - callbackInterests
        - type: object
          properties:
            chat:
              title: chat
              $ref: '#/components/schemas/bossanova.v1.ChatDelta'
          title: chat
          required:
            - chat
        - type: object
          properties:
            createChunk:
              title: create_chunk
              description: |-
                Streaming frame from an in-flight CreateSession (setup output, then a
                 terminal created/error).
              $ref: '#/components/schemas/bossanova.v1.SessionCreateChunk'
          title: create_chunk
          required:
            - createChunk
        - type: object
          properties:
            egressBroadcast:
              title: egress_broadcast
              description: |-
                A broadcast this daemon produced whose audience reaches beyond itself,
                 published for bosso to route to the other daemons. Outbound only: the
                 inbound half is the separate BroadcastCommand type, so an inbound
                 broadcast can never be re-published here and loop. See BroadcastEgress.
              $ref: '#/components/schemas/bossanova.v1.BroadcastEgress'
          title: egress_broadcast
          required:
            - egressBroadcast
        - type: object
          properties:
            result:
              title: result
              description: Response to Stop/Pause/Resume/Transfer/Attach commands.
              $ref: '#/components/schemas/bossanova.v1.CommandResult'
          title: result
          required:
            - result
        - type: object
          properties:
            session:
              title: session
              $ref: '#/components/schemas/bossanova.v1.SessionDelta'
          title: session
          required:
            - session
        - type: object
          properties:
            snapshot:
              title: snapshot
              description: Required first event on every connect; bosso replaces any prior snapshot.
              $ref: '#/components/schemas/bossanova.v1.DaemonSnapshot'
          title: snapshot
          required:
            - snapshot
        - type: object
          properties:
            status:
              title: status
              description: |-
                Coalesced ~100ms on the daemon (decision #11). Named *Delta to avoid
                 collision with the ChatStatus enum in models.proto.
              $ref: '#/components/schemas/bossanova.v1.ChatStatusDelta'
          title: status
          required:
            - status
        - type: object
          properties:
            tokenRefresh:
              title: token_refresh
              description: In-band WorkOS JWT refresh. Bosso re-verifies against WorkOS JWKS.
              $ref: '#/components/schemas/bossanova.v1.TokenRefresh'
          title: token_refresh
          required:
            - tokenRefresh
      title: DaemonEvent
      additionalProperties: false
      description: |-
        DaemonEvent is the oneof envelope for every message a daemon pushes up the
         stream. Unknown oneof cases are logged and skipped by the orchestrator for
         forward compatibility.
    bossanova.v1.DaemonInfo:
      type: object
      properties:
        daemonId:
          type: string
          title: daemon_id
        hostname:
          type: string
          title: hostname
        repoIds:
          type: array
          items:
            type: string
          title: repo_ids
        activeSessions:
          type: integer
          title: active_sessions
          format: int32
        connectedAt:
          title: connected_at
          description: |-
            Timestamp the current bidirectional stream from the daemon was
             established. Resets on every reconnect — the reverse-stream model
             has no separate heartbeat; the live stream IS the liveness signal.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        online:
          type: boolean
          title: online
      title: DaemonInfo
      additionalProperties: false
    bossanova.v1.DaemonOffline:
      type: object
      properties:
        daemonId:
          type: string
          title: daemon_id
        reason:
          type: string
          title: reason
          description: Optional reason for logs/diagnostics.
      title: DaemonOffline
      additionalProperties: false
      description: |-
        DaemonOffline is the terminal event emitted by the orchestrator when the
         owning daemon's stream goes offline mid-subscription. The client should
         treat this as a signal to retry later.
    bossanova.v1.DaemonRepoRef:
      type: object
      properties:
        daemonId:
          type: string
          title: daemon_id
        repoId:
          type: string
          title: repo_id
        hasLinearKey:
          type: boolean
          title: has_linear_key
        hasSentryKey:
          type: boolean
          title: has_sentry_key
      title: DaemonRepoRef
      additionalProperties: false
      description: |-
        DaemonRepoRef ties a logical repo to one serving daemon: that daemon's local
         repo_id plus its per-daemon tracker capability (Linear/Sentry creds present).
    bossanova.v1.DaemonSnapshot:
      type: object
      properties:
        daemonId:
          type: string
          title: daemon_id
        hostname:
          type: string
          title: hostname
        repoIds:
          type: array
          items:
            type: string
          title: repo_ids
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.Session'
          title: sessions
          description: 'Slim: no full transcripts, just session state + display fields.'
        chats:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.ClaudeChatMetadata'
          title: chats
          description: Metadata only — see ClaudeChatMetadata.
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.ChatStatusEntry'
          title: statuses
          description: Live chat statuses keyed by agent_session_id (reuses ChatStatusEntry from daemon.proto).
        callbackInterests:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.CallbackInterest'
          title: callback_interests
          description: |-
            The daemon's GitHub callback interests at connect time (repo + PR). Carried
             on the snapshot so a (re)connect reconciles interests atomically with the
             rest of the read model; steady-state changes arrive as CallbackInterestSet
             deltas (DaemonEvent field 10).
      title: DaemonSnapshot
      additionalProperties: false
      description: |-
        DaemonSnapshot is the required first event on every stream connect. It
         carries slim metadata only (IDs, state, timestamps, preview strings) — full
         chat transcripts are fetched on demand via AttachSessionCommand (decision #5).
    bossanova.v1.DeleteBroadcastRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteBroadcastRequest
      additionalProperties: false
    bossanova.v1.DeleteBroadcastResponse:
      type: object
      title: DeleteBroadcastResponse
      additionalProperties: false
    bossanova.v1.DeleteBroadcastSubscriptionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteBroadcastSubscriptionRequest
      additionalProperties: false
    bossanova.v1.DeleteBroadcastSubscriptionResponse:
      type: object
      title: DeleteBroadcastSubscriptionResponse
      additionalProperties: false
    bossanova.v1.DeleteChatCommand:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
        sessionId:
          type: string
          title: session_id
          description: |-
            session_id scopes the delete to a session the caller owns. The daemon
             rejects the delete when the chat does not belong to this session, so the
             bosso-side authz scoping (FindSessionDaemon) is enforced end-to-end rather
             than being advisory. Empty session_id skips the check (backward compat for
             callers that predate scoping).
      title: DeleteChatCommand
      additionalProperties: false
      description: |-
        DeleteChatCommand asks the daemon to delete a chat.
         Replies with CommandResult{ok:true} and no payload.
    bossanova.v1.DeleteChatRequest:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: Agent session UUID
        sessionId:
          type: string
          title: session_id
          description: |-
            session_id, when set, scopes the delete: the daemon rejects the request
             (NotFound) if the chat does not belong to this session. Empty skips the
             check for backward-compatible callers.
      title: DeleteChatRequest
      additionalProperties: false
    bossanova.v1.DeleteChatResponse:
      type: object
      title: DeleteChatResponse
      additionalProperties: false
    bossanova.v1.DeleteCronJobCommand:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteCronJobCommand
      additionalProperties: false
      description: |-
        DeleteCronJobCommand asks the daemon to remove a cron job.
         Replies with CommandResult{ok:true} and no payload.
    bossanova.v1.DeleteCronJobRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteCronJobRequest
      additionalProperties: false
    bossanova.v1.DeleteCronJobResponse:
      type: object
      title: DeleteCronJobResponse
      additionalProperties: false
    bossanova.v1.DeleteGithubCallbackCommand:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteGithubCallbackCommand
      additionalProperties: false
      description: |-
        DeleteGithubCallbackCommand deletes a GitHub callback by id. Mirrors
         daemon.proto's DeleteGithubCallbackRequest. Replies with CommandResult{ok:true}
         and no payload.
    bossanova.v1.DeleteGithubCallbackRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteGithubCallbackRequest
      additionalProperties: false
    bossanova.v1.DeleteGithubCallbackResponse:
      type: object
      title: DeleteGithubCallbackResponse
      additionalProperties: false
    bossanova.v1.DeleteNoteCommand:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteNoteCommand
      additionalProperties: false
      description: |-
        DeleteNoteCommand deletes a note by id. Mirrors daemon.proto's
         DeleteNoteRequest. Replies with CommandResult{ok:true} and no payload — Ok-only,
         exactly like DeleteGithubCallbackCommand.
    bossanova.v1.DeleteNoteRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteNoteRequest
      additionalProperties: false
    bossanova.v1.DeleteNoteResponse:
      type: object
      title: DeleteNoteResponse
      additionalProperties: false
    bossanova.v1.DeleteWebhookConfigRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteWebhookConfigRequest
      additionalProperties: false
    bossanova.v1.DeleteWebhookConfigResponse:
      type: object
      title: DeleteWebhookConfigResponse
      additionalProperties: false
    bossanova.v1.DeliverVCSEventRequest:
      type: object
      properties:
        repoOriginUrl:
          type: string
          title: repo_origin_url
          description: The repo this event pertains to (origin URL for matching).
        event:
          title: event
          description: The parsed VCS event.
          $ref: '#/components/schemas/bossanova.v1.VCSEvent'
      title: DeliverVCSEventRequest
      additionalProperties: false
    bossanova.v1.DeliverVCSEventResponse:
      type: object
      title: DeliverVCSEventResponse
      additionalProperties: false
    bossanova.v1.DescribeChatLaunchRequest:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: chat to describe
      title: DescribeChatLaunchRequest
      additionalProperties: false
    bossanova.v1.DescribeChatLaunchResponse:
      type: object
      properties:
        argv:
          type: array
          items:
            type: string
          title: argv
          description: |-
            argv is the launch command bossd runs in the worktree, already wrapped in
             the user's login shell (e.g. fish -l -i -c 'exec $argv' claude …). Empty
             when the agent or session could not be resolved. The boss session-context
             system prompt and MCP config flags are intentionally omitted so the command
             stays readable; they do not affect whether the agent binary resolves, which
             is the failure this command helps diagnose.
        worktreePath:
          type: string
          title: worktree_path
          description: working directory bossd launches it in
        host:
          type: string
          title: host
          description: daemon hostname — where to run argv
        agentName:
          type: string
          title: agent_name
          description: resolved agent (claude, codex, …)
        capturedOutput:
          type: string
          title: captured_output
          description: |-
            captured_output is the agent's own final output, captured by bossd at pane
             death for a chat that exited before its pane came up (e.g. "Session ID …
             already in use"). Empty when nothing was captured. Additive daemon-RPC field
             (BOS-477) — not the bossanova.v1 orchestrator surface — so no apiversion
             bump. Shown verbatim (sanitized) in the attach diagnostic.
      title: DescribeChatLaunchResponse
      additionalProperties: false
    bossanova.v1.DetectUsageLimitRequest:
      type: object
      properties:
        paneContent:
          type: string
          title: pane_content
          format: byte
      title: DetectUsageLimitRequest
      additionalProperties: false
    bossanova.v1.DetectUsageLimitResponse:
      type: object
      properties:
        limited:
          type: boolean
          title: limited
        resetAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: reset_at
      title: DetectUsageLimitResponse
      additionalProperties: false
    bossanova.v1.DisconnectGitHubAppRepoRequest:
      type: object
      properties:
        repoOriginUrl:
          type: string
          title: repo_origin_url
      title: DisconnectGitHubAppRepoRequest
      additionalProperties: false
    bossanova.v1.DisconnectGitHubAppRepoResponse:
      type: object
      title: DisconnectGitHubAppRepoResponse
      additionalProperties: false
    bossanova.v1.DisplayIntent:
      type: string
      title: DisplayIntent
      enum:
        - DISPLAY_INTENT_UNSPECIFIED
        - DISPLAY_INTENT_SUCCESS
        - DISPLAY_INTENT_WARNING
        - DISPLAY_INTENT_DANGER
        - DISPLAY_INTENT_MUTED
        - DISPLAY_INTENT_INFO
      description: |-
        DisplayIntent represents the semantic meaning of a session's display
         status. Clients map intent to styling (color, weight, etc.) — the proto
         itself stays presentation-agnostic.
    bossanova.v1.DisplayStatus:
      type: string
      title: DisplayStatus
      enum:
        - DISPLAY_STATUS_UNSPECIFIED
        - DISPLAY_STATUS_IDLE
        - DISPLAY_STATUS_CHECKING
        - DISPLAY_STATUS_FAILING
        - DISPLAY_STATUS_CONFLICT
        - DISPLAY_STATUS_REJECTED
        - DISPLAY_STATUS_PASSING
        - DISPLAY_STATUS_MERGED
        - DISPLAY_STATUS_CLOSED
        - DISPLAY_STATUS_DRAFT
        - DISPLAY_STATUS_APPROVED
        - DISPLAY_STATUS_REVIEW
      description: DisplayStatus represents the unified display status for a session in the TUI.
    bossanova.v1.EmptyTrashCommand:
      type: object
      properties:
        olderThan:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: older_than
          description: Only empty sessions archived before this timestamp.
      title: EmptyTrashCommand
      additionalProperties: false
      description: |-
        EmptyTrashCommand asks the daemon to permanently delete archived sessions.
         Replies with CommandResult carrying an EmptyTrashResult (empty_trash = 33).
    bossanova.v1.EmptyTrashRequest:
      type: object
      properties:
        olderThan:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: older_than
          description: Only empty sessions archived before this timestamp.
