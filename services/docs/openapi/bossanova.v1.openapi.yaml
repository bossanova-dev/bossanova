          title: repo_name
        prNumber:
          type: integer
          title: pr_number
          format: int32
        trigger:
          type: string
          title: trigger
        message:
          type: string
          title: message
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: expires_at
      title: CreateGithubCallbackCommand
      additionalProperties: false
      description: |-
        CreateGithubCallbackCommand registers a GitHub callback. Mirrors daemon.proto's
         CreateGithubCallbackRequest. Replies with CommandResult carrying a
         CreateGithubCallbackResponse (create_github_callback = 34).
    bossanova.v1.CreateGithubCallbackRequest:
      type: object
      properties:
        groupId:
          type:
            - string
            - "null"
          title: group_id
          description: |-
            Optional group id; unset/empty = ungrouped (a group of one). Callbacks in
             one group are siblings: the first to trigger cancels the rest.
        targetChatId:
          type: string
          title: target_chat_id
        repoOwner:
          type: string
          title: repo_owner
        repoName:
          type: string
          title: repo_name
        prNumber:
          type: integer
          title: pr_number
          format: int32
        trigger:
          type: string
          title: trigger
          description: merged | closed | checks_passed | checks_failed | ready_for_review | checks_passed_ready
        message:
          type: string
          title: message
          description: prompt body delivered on fire; stored verbatim
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: expires_at
          description: |-
            Optional explicit expiry. Unset = server default (24h). Must be in the
             future and within 30 days, else InvalidArgument.
      title: CreateGithubCallbackRequest
      additionalProperties: false
    bossanova.v1.CreateGithubCallbackResponse:
      type: object
      properties:
        githubCallback:
          title: github_callback
          $ref: '#/components/schemas/bossanova.v1.GithubCallback'
      title: CreateGithubCallbackResponse
      additionalProperties: false
    bossanova.v1.CreateNoteCommand:
      type: object
      properties:
        repoId:
