            - type: object
              properties:
                updateNote:
                  title: update_note
                  description: 'bosso → daemon: edit a note by id. Replies CommandResult{update_note}.'
                  $ref: '#/components/schemas/bossanova.v1.UpdateNoteCommand'
              title: update_note
