            - type: object
              properties:
                updateRepo:
                  title: update_repo
                  description: 'bosso → daemon: update a repo. Replies CommandResult{update_repo}.'
                  $ref: '#/components/schemas/bossanova.v1.UpdateRepoCommand'
              title: update_repo
              required:
