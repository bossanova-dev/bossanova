    bossanova.v1.ListNotesCommand:
      type: object
      properties:
        repoId:
          type:
            - string
            - "null"
          title: repo_id
        sessionId:
          type:
            - string
            - "null"
          title: session_id
        chatId:
          type:
            - string
            - "null"
          title: chat_id
        tags:
          type: array
          items:
            type: string
          title: tags
        search:
          type:
            - string
            - "null"
          title: search
        limit:
          type: integer
          title: limit
          format: int32
      title: ListNotesCommand
      additionalProperties: false
      description: |-
        ListNotesCommand lists notes. Mirrors daemon.proto's ListNotesRequest: every
         filter is optional, unset fields are unconstrained, set fields intersect, and
         a set-but-blank provenance filter matches nothing. Tags match ANY (OR), and a
         tag list that normalises away entirely fails closed. Replies with
         CommandResult carrying a ListNotesResponse (list_notes = 38).
    bossanova.v1.ListNotesRequest:
      type: object
      properties:
        repoId:
          type:
            - string
            - "null"
          title: repo_id
          description: |-
            Applied whenever the field is SET, including when set to the empty string:
             the value is trimmed and compared with `=`, and blank provenance is stored
             as NULL, so a set-but-blank filter matches NOTHING. Leave the field unset
             to leave that column unconstrained; there is no way to ask for "notes with
             no session".
        sessionId:
          type:
            - string
            - "null"
          title: session_id
        chatId:
          type:
            - string
            - "null"
          title: chat_id
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            Matches notes carrying ANY of these tags (OR), not all of them. Entries are
             trimmed and lowercased to match the normalisation applied on write, and
             blank entries are dropped. A non-empty list whose entries ALL normalise
             away matches nothing rather than everything — the filter fails closed, so a
             stray empty tag can never widen the result set.
        search:
          type:
            - string
            - "null"
          title: search
          description: |-
            Substring match on the body. SQL wildcards are matched literally, not as
             patterns. Case-insensitivity is ASCII-only — the daemon folds case with
             SQLite's LOWER(), which does not fold non-ASCII without ICU. A term that is
             blank after trimming means NO search, unlike a blank tag entry, which
             matches nothing: an empty substring already matches every body, so applying
             and dropping the filter give the same rows.
        limit:
          type: integer
          title: limit
          format: int32
          description: Caps the rows returned; zero or negative means unlimited.
      title: ListNotesRequest
      additionalProperties: false
      description: |-
        ListNotesRequest mirrors db.ListNotesFilter: every filter is optional, an
         unset field is not constrained, and set fields intersect (AND).
    bossanova.v1.ListNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.Note'
          title: notes
      title: ListNotesResponse
      additionalProperties: false
