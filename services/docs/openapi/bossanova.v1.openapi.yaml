          title: expected_updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: UpdateRepoCommand
      additionalProperties: false
      description: |-
        UpdateRepoCommand mirrors the browser-safe proxy update surface. SecretUpdate
         values are forwarded unchanged to the daemon's existing UpdateRepo handler.
    bossanova.v1.UpdateRepoRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        displayName:
          type:
            - string
            - "null"
          title: display_name
        canAutoMerge:
          type:
            - boolean
            - "null"
          title: can_auto_merge
        canAutoMergeDependabot:
          type:
            - boolean
            - "null"
          title: can_auto_merge_dependabot
        mergeStrategy:
          type:
            - string
            - "null"
          title: merge_strategy
        setupScript:
          type:
            - string
            - "null"
          title: setup_script
        linearApiKey:
          type:
            - string
            - "null"
          title: linear_api_key
          description: |-
            Legacy plaintext secret fields. Retained for backward-compat: a present
             value still writes the key. When a SecretUpdate (linear_key/sentry_key
             below) carries an action other than UNSPECIFIED/UNCHANGED, the SecretUpdate
             wins over the legacy field for that secret.
        sentryApiKey:
          type:
            - string
            - "null"
          title: sentry_api_key
        sentryOrg:
          type:
            - string
            - "null"
          title: sentry_org
        canAutoRepair:
          type:
            - boolean
            - "null"
          title: can_auto_repair
        linearKey:
          title: linear_key
          description: |-
            Tri-state secret actions (UNCHANGED/SET/CLEAR): the authoritative secret
             surface that never blanks a key on a save that does not re-supply it.
          $ref: '#/components/schemas/bossanova.v1.SecretUpdate'
        sentryKey:
          title: sentry_key
          $ref: '#/components/schemas/bossanova.v1.SecretUpdate'
        expectedUpdatedAt:
          title: expected_updated_at
          description: |-
            Optimistic-concurrency token: when set, the update is rejected (CodeAborted)
             unless it still equals the repo's stored updated_at.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        shouldArchiveSessionsAfterMerge:
          type:
            - boolean
            - "null"
          title: should_archive_sessions_after_merge
        canAutoDeleteBranches:
          type:
            - boolean
            - "null"
          title: can_auto_delete_branches
        shouldKeepBranchesCurrent:
          type:
            - boolean
            - "null"
          title: should_keep_branches_current
