  /bossanova.v1.OrchestratorService/ProxyEmptyTrash:
    post:
      tags:
        - bossanova.v1.OrchestratorService
      summary: ProxyEmptyTrash
      description: |-
        ProxyEmptyTrash permanently deletes archived sessions across the caller's
         Ready daemons, summing each daemon's deleted_count.
      operationId: bossanova.v1.OrchestratorService.ProxyEmptyTrash
      parameters:
        - name: Connect-Protocol-Version
          in: header
