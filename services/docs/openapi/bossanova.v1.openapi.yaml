    bossanova.v1.SecretAction:
      type: string
      title: SecretAction
      enum:
        - SECRET_ACTION_UNSPECIFIED
        - SECRET_ACTION_UNCHANGED
        - SECRET_ACTION_SET
        - SECRET_ACTION_CLEAR
      description: |-
        SecretAction is the tri-state applied to a secret field on update.
         UNSPECIFIED is treated as UNCHANGED (safe default for a default-constructed
         message); SET replaces the value; CLEAR removes it.
    bossanova.v1.SecretUpdate:
      type: object
      properties:
        action:
          title: action
          $ref: '#/components/schemas/bossanova.v1.SecretAction'
        value:
          type:
            - string
            - "null"
          title: value
      title: SecretUpdate
      additionalProperties: false
      description: |-
        SecretUpdate carries a secret mutation. value is required iff action == SET
         and is ignored otherwise. Never populated on read/aggregate responses.
    bossanova.v1.SendBroadcastRequest:
      type: object
      properties:
        selector:
          title: selector
          description: |-
            Audience to resolve. Required, and must carry at least one clause: an
             empty selector is rejected rather than treated as "everyone".
          $ref: '#/components/schemas/bossanova.v1.BroadcastSelector'
        originChatId:
          type: string
          title: origin_chat_id
          description: |-
            Chat this broadcast is issued from (ClaudeChat.agent_session_id). Empty =
             operator-issued from the CLI or MCP with no originating chat, which is why
             this is a plain string rather than a required id.
        message:
          type: string
          title: message
          description: |-
            Prompt body delivered to each target. SECRET on the way back out — see the
             rule on Broadcast.message; it travels inbound here and is never echoed.
        expiresIn:
          type:
            - string
            - "null"
          title: expires_in
          description: |-
            Optional expiry as a duration string ("24h", "30m"). Empty = the server
             default of 24h, maximum 30 days — the same expiry convention
             CreateGithubCallbackRequest.expires_at applies, expressed as a duration
             because a broadcast's lifetime is "how long to keep retrying", not a
             wall-clock deadline the caller computed.
        includeOrigin:
          type: boolean
          title: include_origin
          description: |-
            When false (the default), the origin chat is excluded from its own
             audience even if the selector matches it. A coordinator broadcasting "I
             finished" to its own repo must not wake itself and loop. Set true only for
             the deliberate self-include case.
        crossDaemon:
          type: boolean
          title: cross_daemon
          description: |-
            Whether the caller is asking for this broadcast to leave the daemon it was
             issued on.

             When false (the default, which preserves today's behaviour exactly) the
             broadcast is confined to this daemon's own chats — no egress event is
             published — UNLESS the selector itself names `daemon:` ids other than this
             daemon's, which is already an explicit request to reach elsewhere.

             When true the caller is explicitly asking bosso to route it to other
             daemons, so an egress event is published even when the selector names no
             foreign daemon: a selector like "repo:foo" is ambiguous about reach, and
             this flag is how the caller says "yes, other daemons too".
      title: SendBroadcastRequest
      additionalProperties: false
    bossanova.v1.SendBroadcastResponse:
      type: object
      properties:
        broadcast:
          title: broadcast
          $ref: '#/components/schemas/bossanova.v1.Broadcast'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.BroadcastDelivery'
          title: deliveries
          description: |-
            One record per resolved target, in the frozen audience order. Empty when
             the selector resolved to nobody, which is a successful send.
      title: SendBroadcastResponse
      additionalProperties: false
      description: |-
        SendBroadcastResponse reports ids and states only, NEVER the message body:
         Broadcast.message is populated solely on the delivering owner's path and is
         cleared on every read surface, including this one — see the secret-body rule
         on Broadcast.message.
    bossanova.v1.SendChatMessageCommand:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
        message:
          type: string
          title: message
        wakeIfAsleep:
          type: boolean
          title: wake_if_asleep
        submit:
          type: boolean
          title: submit
          description: when true, submit (press Enter + verify) a single-line command; default (false) prefills the composer without submitting
      title: SendChatMessageCommand
      additionalProperties: false
      description: |-
        SendChatMessageCommand asks the daemon to deliver a user message into a chat.
         Replies with CommandResult carrying a SendChatMessageResponse (send_chat_message = 14).
    bossanova.v1.SendChatMessageRequest:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: target chat
        message:
          type: string
          title: message
          description: text to deliver to the agent
        wakeIfAsleep:
          type: boolean
          title: wake_if_asleep
          description: when true, wake an asleep chat before pasting
        submit:
          type: boolean
          title: submit
          description: when true, submit (press Enter + verify) a single-line command; default (false) prefills the composer without submitting
      title: SendChatMessageRequest
      additionalProperties: false
    bossanova.v1.SendChatMessageResponse:
      type: object
      properties:
        tmuxSessionName:
          type: string
          title: tmux_session_name
        delivered:
          type: boolean
          title: delivered
        noticeText:
          type: string
          title: notice_text
          description: |-
            notice_text carries a user-facing outcome summary for a message that bossd
             handled mechanically instead of delivering to the agent — today, a
             single-line "/boss switch" account switch intercepted before the tmux paste
             (credit-free manual switch), or a submit whose outcome could not be
             confirmed (delivery_state UNCONFIRMED). On those paths delivered is false, so
             callers keying on delivered to mean "handled" MUST also read notice_text.
             Empty for an ordinary delivered message.
        deliveryState:
          title: delivery_state
          description: |-
            delivery_state is UNSPECIFIED on every path that does not run the submit
             verifier, SUBMITTED alongside delivered=true, QUEUED alongside
             delivered=true when the agent queued the message behind a running turn, and
             UNCONFIRMED alongside delivered=false when verification could not resolve.
             NOT_SUBMITTED never appears on a response (that outcome is an error whose
             message names it).
          $ref: '#/components/schemas/bossanova.v1.SendChatMessageResponse.DeliveryState'
      title: SendChatMessageResponse
      additionalProperties: false
    bossanova.v1.SendChatMessageResponse.DeliveryState:
      type: string
      title: DeliveryState
      enum:
        - DELIVERY_STATE_UNSPECIFIED
        - DELIVERY_STATE_SUBMITTED
        - DELIVERY_STATE_NOT_SUBMITTED
        - DELIVERY_STATE_UNCONFIRMED
        - DELIVERY_STATE_QUEUED
      description: |-
        DeliveryState reports what the submit verifier actually observed, so a caller
         can tell "confirmed not submitted" (retrying is safe and necessary) from
         "could not confirm" (retrying may double-type) without scraping tmux.
    bossanova.v1.Session:
      type: object
      properties:
        id:
          type: string
          title: id
        repoId:
          type: string
          title: repo_id
        title:
          type: string
          title: title
        plan:
          type: string
          title: plan
        worktreePath:
          type: string
          title: worktree_path
        branchName:
          type: string
          title: branch_name
        baseBranch:
          type: string
          title: base_branch
        state:
          title: state
          $ref: '#/components/schemas/bossanova.v1.SessionState'
        agentSessionId:
          type:
            - string
            - "null"
          title: agent_session_id
        prNumber:
          type:
            - integer
            - "null"
          title: pr_number
          format: int32
        prUrl:
          type:
            - string
            - "null"
          title: pr_url
        lastCheckState:
          title: last_check_state
          $ref: '#/components/schemas/bossanova.v1.ChecksOverall'
        isAutomationEnabled:
          type: boolean
          title: is_automation_enabled
        attemptCount:
          type: integer
          title: attempt_count
          format: int32
        blockedReason:
          type:
            - string
            - "null"
          title: blocked_reason
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: archived_at
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        repoDisplayName:
          type: string
          title: repo_display_name
          description: Denormalized repo display name, populated server-side for convenience.
        displayStatus:
          title: display_status
          description: PR display status, hydrated server-side from the PR display tracker.
          $ref: '#/components/schemas/bossanova.v1.DisplayStatus'
        displayHasFailures:
          type: boolean
          title: display_has_failures
        displayHasChangesRequested:
          type: boolean
          title: display_has_changes_requested
        attentionStatus:
          oneOf:
            - $ref: '#/components/schemas/bossanova.v1.AttentionStatus'
            - type: "null"
          title: attention_status
          description: Attention status, hydrated server-side from session state.
        displayIsRepairing:
          type: boolean
          title: display_is_repairing
          description: Whether this session is currently being repaired by the repair plugin.
        workflowDisplayStatus:
          title: workflow_display_status
          description: Workflow display fields, hydrated server-side from active workflows.
          $ref: '#/components/schemas/bossanova.v1.WorkflowStatus'
        workflowDisplayLeg:
          type: integer
          title: workflow_display_leg
          format: int32
        workflowDisplayMaxLegs:
          type: integer
          title: workflow_display_max_legs
          format: int32
        hasActiveChat:
          type: boolean
          title: has_active_chat
          description: Whether the session has an active Claude Code chat process (heartbeat-tracked).
        trackerId:
          type:
            - string
            - "null"
          title: tracker_id
          description: External issue tracker fields (eg. Linear, Jira). External issue ID (eg. "FRE-1176")
        trackerUrl:
          type:
            - string
            - "null"
          title: tracker_url
          description: URL to issue in external tracker
        tmuxSessionName:
          type:
            - string
            - "null"
          title: tmux_session_name
          description: tmux session name for persistent terminal sessions.
        prDisplayHeadSha:
          type: string
          title: pr_display_head_sha
          description: Head commit SHA of the PR, used by repair plugin to skip duplicate repairs.
        displayLabel:
          type: string
          title: display_label
          description: |-
            Composite display fields, computed by bossd's DisplayStatusComputer and
             persisted so every client (TUI, web, future consumers) renders the same
             label/intent/spinner verbatim — including when bosso falls back to its
             own DB while the originating bossd is offline. eg. "working", "checking", "running 2/4", "? question", "stopped"
        displayIntent:
          title: display_intent
          description: semantic meaning; clients map to styling
          $ref: '#/components/schemas/bossanova.v1.DisplayIntent'
        displaySpinner:
          type: boolean
          title: display_spinner
          description: whether to render the spinner glyph
        transferringTo:
          type: string
          title: transferring_to
          description: |-
            Transfer coordination markers used by the coordinated TransferSession
             protocol (see docs/plans/2026-04-24-reverse-stream-daemon-model.md,
             decision #14). When set, the session is hidden from ListForUser on the
             orchestrator until the transfer protocol completes. empty if not transferring out
        transferringFrom:
          type: string
          title: transferring_from
          description: empty if not transferring in
        agentName:
          type: string
          title: agent_name
          description: Agent plugin name (e.g. "claude", "opencode"). Empty in legacy data.
        lastRepairStartedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: last_repair_started_at
          description: |-
            Last repair-attempt diagnostics, persisted by the repair plugin via
             RecordRepairOutcome so the TUI can surface "failing ⚠ repair: claude
             not in PATH (3×)" hints. Both error fields are empty for clean runs;
             runner_error means StartAgentRun never produced a process (eg. claude
             not on PATH), exit_error means the agent ran but exited non-zero.
             last_repair_attempt_count is a *consecutive-failure* counter: clean
             runs reset it to zero, failed runs increment it. Total attempts are
             not tracked.
        lastRepairRunnerError:
          type: string
          title: last_repair_runner_error
        lastRepairExitError:
          type: string
          title: last_repair_exit_error
        lastRepairAttemptCount:
          type: integer
          title: last_repair_attempt_count
          format: int32
        lastRepairHeadSha:
          type: string
          title: last_repair_head_sha
        lastRepairDisplayStatus:
          title: last_repair_display_status
          $ref: '#/components/schemas/bossanova.v1.DisplayStatus'
        lastChatActivityAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: last_chat_activity_at
          description: |-
            Last time any of the session's live chat processes produced output.
             Populated server-side from the chat tracker — the max LastOutputAt across
             all of the session's chat tracker entries whose heartbeat is fresh
             (within StaleThreshold). Empty when no chat is live. The repair plugin
             uses this to gate auto-repair: an interactive chat that hasn't produced
             output for `idle_repair_threshold_minutes` is treated as idle, so repair
             can proceed even though the claude process is still attached.
        repoOriginUrl:
          type: string
          title: repo_origin_url
          description: Denormalized repo origin URL, populated server-side for webhook routing.
        lastRepairReviewFingerprint:
          type: string
          title: last_repair_review_fingerprint
          description: |-
            Fingerprint of review feedback targeted by the last repair run.
             Empty for non-review-triggered repairs and for legacy rows.
        displaySettingUp:
          type: boolean
          title: display_setting_up
          description: |-
            True while the repo's setup script is running during session creation
             (the "initializing" display status). Transport-only: hydrated server-side
             from the in-memory DisplayTracker and never persisted. Mirrors
             display_is_repairing (field 24).
        repoCanAutoRepair:
          type: boolean
          title: repo_can_auto_repair
          description: |-
            Denormalized repo.can_auto_repair, populated server-side so the repair
             plugin can honor the per-repo auto-repair toggle without a separate lookup.
        setupError:
          type: string
          title: setup_error
          description: |-
            Why the repo's configured setup script failed during worktree creation.
             A setup-script failure is non-fatal — the session still starts — so this
             flags the degraded state for `boss show <id>` and the TUI. Empty for clean
             runs or repos with no setup script.
        lastRepairBlockedReason:
          type: string
          title: last_repair_blocked_reason
          description: |-
            Blocked-refusal lane: set when the daemon refused to START a repair chat
             (a FailedPrecondition displace/reclaim refusal) rather than running one.
             Recorded for operator visibility without bumping last_repair_attempt_count
             or the runner/exit error fields. Cleared on every real repair outcome, so
             a non-empty reason IS the latest repair-related state.
        lastRepairBlockedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: last_repair_blocked_at
        repairActive:
          type: boolean
          title: repair_active
          description: |-
            True while a single-repairer lease is held for this session — i.e. a repair
             chat has started and its post-repair status has not yet been assessed.
             Transport-only: hydrated server-side from the in-memory RepairLeaseManager
             and never persisted. Distinct from display_is_repairing (field 24), which
             is a best-effort display flag; repair_active is the authoritative,
             lease-backed signal a dispatcher (boss-epic driver, /boss-repair, plugin
             sweep) reads to defer to an already-active repairer without racing.
        prMergeable:
          type:
            - boolean
            - "null"
          title: pr_mergeable
          description: |-
            PR mergeability, hydrated server-side from the display poller's PR fetch so
             a conflict-after-green is detectable without attempting a merge. Unset when
             unknown/not yet polled; true = mergeable; false = conflicting. Transport-
             only, never persisted.
        mergeBlock:
          title: merge_block
          description: |-
            Structured reason a session's PR cannot currently be merged, hydrated on
             get_session/list_sessions from the daemon's display tracker. Lets an
             unattended driver (boss-epic) decide repair-vs-proceed without scraping tmux.
          $ref: '#/components/schemas/bossanova.v1.MergeBlock'
        lastAgentActivityAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: last_agent_activity_at
          description: |-
            Most-recent real agent output across the session's chats; advances on
             genuine output, NOT pane mtime. Absent when never observed.
        accountId:
          type:
            - string
            - "null"
          title: account_id
          description: |-
            account_id binds the session to a rotation account; empty/absent =
             system-default account 0 (no injected env, D9).
        accountLabel:
          type:
            - string
            - "null"
          title: account_label
          description: |-
            account_label is the server-resolved human label for account_id ("Unmanaged
             local credentials" when unbound); read-only, non-secret.
        rotationEvents:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.RotationEvent'
          title: rotation_events
          description: |-
            Recent rotation audit events (newest first, capped server-side at 10),
             hydrated by bossd like the display_* fields so TUI/web render history,
             the exhausted badge, and toasts from one field. (BOS-176)
        displayMerging:
          type: boolean
          title: display_merging
          description: |-
            True while a PR merge (MergeSession) is in flight. Transport-only: hydrated
             server-side from the in-memory DisplayTracker and never persisted. Drives
             the transient blue "merging" display status. Distinct from
             display_is_repairing (24) / display_setting_up (48).
        repoShouldArchiveSessionsAfterMerge:
          type: boolean
          title: repo_should_archive_sessions_after_merge
          description: |-
            Denormalized repo.should_archive_sessions_after_merge, populated server-side by
             GetSession so the TUI session-detail view can show an "Archiving…" status
             and know a merged session is about to be auto-archived (BOS-46 follow-up).
        archivePending:
          type: boolean
          title: archive_pending
          description: |-
            True while an archive (ArchiveSession) is actually in flight for this
             session. Transport-only: hydrated server-side from the in-memory
             DisplayTracker and never persisted. Set/cleared around the single archive
             chokepoint (Lifecycle.ArchiveSession) so the TUI renders "Archiving…" only
             when the daemon has an archive running — not inferred from steady-state
             MERGED + repo_should_archive_sessions_after_merge, which stays true forever for a
             merged→archived→resurrected session (BOS-425). Mirrors display_merging (60).
        httpEndpoints:
          type: array
          items:
            $ref: '#/components/schemas/bossanova.v1.HttpEndpoint'
          title: http_endpoints
          description: |-
            Verified machine-local HTTP/HTTPS endpoints for this session, hydrated
             server-side ONLY for an opted-in local TUI read that passes the daemon's
             locality gates (request opt-in + endpoint tracker available + a matching
             network namespace on Linux / a local Unix-socket request on macOS).

             Transport-only: local, dynamic, and NEVER persisted. SessionToProto leaves
             this empty; it is filled at the very end of GetSession/ListSessions and
             nowhere else. Default local reads, CLI/MCP callers, mutation responses,
             daemon snapshots, reverse-stream commands, RemoteClient/orchestrator
             requests, bosso, the MCP gateway, and DB models all carry an empty list.
        repairStalledAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: repair_stalled_at
          description: |-
            When this session's repair lease was released because the repair round
             STALLED — no repair-head-SHA advance and no repair-chat output for
             RepairStallWindow (8m). Absent for a healthy or never-repaired session, and
             for a lease reclaimed by the 45m crash TTL (that is a dead holder, not a
             stalled round).

             Transport-only: hydrated server-side from the in-memory RepairLeaseManager's
             stall record and NEVER persisted, exactly like repair_active (53). The
             record is cleared when a new repair round acquires the lease or when
             progress is observed, so a set value means "the last repair round died on
             its feet" — the signal an unattended driver reads to stop waiting on a
             frozen lease. While it is set, last_repair_blocked_reason (51) carries the
             stall reason.
      title: Session
      additionalProperties: false
      description: Session represents a coding-agent session.
    bossanova.v1.SessionAttachChunk:
      type: object
      allOf:
        - properties:
            sessionId:
              type: string
              title: session_id
            commandId:
              type: string
              title: command_id
              description: Correlates back to the originating AttachSessionCommand.
        - oneOf:
            - type: object
              properties:
                outputLine:
                  title: output_line
                  $ref: '#/components/schemas/bossanova.v1.OutputLine'
              title: output_line
              required:
                - outputLine
            - type: object
              properties:
                sessionEnded:
                  title: session_ended
                  $ref: '#/components/schemas/bossanova.v1.SessionEnded'
              title: session_ended
              required:
                - sessionEnded
            - type: object
              properties:
                stateChange:
                  title: state_change
                  $ref: '#/components/schemas/bossanova.v1.StateChange'
              title: state_change
              required:
                - stateChange
      title: SessionAttachChunk
      additionalProperties: false
      description: |-
        SessionAttachChunk is a single streaming event from an active AttachSession.
         Reuses OutputLine / StateChange / SessionEnded from daemon.proto so the
         orchestrator can forward these verbatim to the proxied AttachSession
         response.
    bossanova.v1.SessionCreateChunk:
      type: object
      allOf:
        - properties:
            commandId:
              type: string
              title: command_id
            attachedExisting:
              type: boolean
              title: attached_existing
              description: |-
                True when the terminal `created` frame reports an EXISTING active session
                 the daemon attached to (dedup) rather than a freshly created one. Mirrors
                 SessionCreated.attached_existing so the flag survives the daemon → bosso
                 upstream hop; only meaningful alongside `created`.
        - oneOf:
            - type: object
              properties:
                created:
                  title: created
                  $ref: '#/components/schemas/bossanova.v1.Session'
              title: created
              required:
                - created
            - type: object
              properties:
                error:
                  title: error
                  $ref: '#/components/schemas/bossanova.v1.CreateError'
              title: error
              required:
                - error
            - type: object
              properties:
                setupOutput:
                  type: string
                  title: setup_output
              title: setup_output
              required:
                - setupOutput
      title: SessionCreateChunk
      additionalProperties: false
      description: |-
        SessionCreateChunk is one streaming frame from an in-flight CreateSession,
         correlated to the originating CreateSessionCommand by command_id. Mirrors
         SessionAttachChunk. Terminal frame is `created` (success) or `error`.
    bossanova.v1.SessionCreated:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
        attachedExisting:
          type: boolean
          title: attached_existing
          description: |-
            True when this event reports an EXISTING active session that already owns
             the requested branch/PR (the create was a dedup/attach), rather than a
             newly created session. On the attach path the request's plan/prompt is NOT
             run — the caller must run it in the existing session (e.g. send_chat_message).
      title: SessionCreated
      additionalProperties: false
    bossanova.v1.SessionDelta:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/bossanova.v1.SessionDelta.Kind'
        session:
          title: session
          description: |-
            On CREATE/UPDATE: full Session. On DELETE: id only.
             Session.transferring_to / transferring_from (models.proto) hide the
             session from ListForUser during the coordinated transfer protocol.
          $ref: '#/components/schemas/bossanova.v1.Session'
      title: SessionDelta
      additionalProperties: false
      description: |-
        SessionDelta is a single session lifecycle change. On DELETE, only
         session.id is populated; on CREATE/UPDATE the full Session is included.
    bossanova.v1.SessionDelta.Kind:
      type: string
      title: Kind
      enum:
        - KIND_UNSPECIFIED
        - KIND_CREATED
        - KIND_UPDATED
        - KIND_DELETED
      description: |-
        Kind names are prefixed with KIND_ to satisfy buf STANDARD lint
         (enum values must share the enum-name prefix). Wire numbers match the
         design doc spec.
    bossanova.v1.SessionEnded:
      type: object
      properties:
        finalState:
          title: final_state
          $ref: '#/components/schemas/bossanova.v1.SessionState'
        reason:
          type:
            - string
            - "null"
          title: reason
      title: SessionEnded
      additionalProperties: false
    bossanova.v1.SessionEvent:
      type: string
      title: SessionEvent
      enum:
        - SESSION_EVENT_UNSPECIFIED
        - SESSION_EVENT_WORKTREE_CREATED
        - SESSION_EVENT_AGENT_STARTED
        - SESSION_EVENT_BRANCH_PUSHED
        - SESSION_EVENT_PR_OPENED
        - SESSION_EVENT_PLAN_COMPLETE
        - SESSION_EVENT_CHECKS_PASSED
        - SESSION_EVENT_CHECKS_FAILED
        - SESSION_EVENT_CONFLICT_DETECTED
        - SESSION_EVENT_REVIEW_SUBMITTED
        - SESSION_EVENT_FIX_COMPLETE
        - SESSION_EVENT_FIX_FAILED
        - SESSION_EVENT_BLOCK
        - SESSION_EVENT_UNBLOCK
        - SESSION_EVENT_PR_MERGED
        - SESSION_EVENT_PR_CLOSED
        - SESSION_EVENT_FINALIZE_REQUESTED
      description: SessionEvent represents the 16 events that trigger state transitions.
    bossanova.v1.SessionState:
      type: string
      title: SessionState
      enum:
        - SESSION_STATE_UNSPECIFIED
        - SESSION_STATE_CREATING_WORKTREE
        - SESSION_STATE_STARTING_AGENT
        - SESSION_STATE_PUSHING_BRANCH
        - SESSION_STATE_OPENING_DRAFT_PR
        - SESSION_STATE_IMPLEMENTING_PLAN
        - SESSION_STATE_AWAITING_CHECKS
        - SESSION_STATE_FIXING_CHECKS
        - SESSION_STATE_GREEN_DRAFT
        - SESSION_STATE_READY_FOR_REVIEW
        - SESSION_STATE_BLOCKED
        - SESSION_STATE_MERGED
        - SESSION_STATE_CLOSED
        - SESSION_STATE_FINALIZING
        - SESSION_STATE_ORPHANED
      description: SessionState represents the 14 states of the session lifecycle.
    bossanova.v1.SessionStatusEntry:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        status:
          title: status
          description: Best status across all chats (working > idle > stopped)
          $ref: '#/components/schemas/bossanova.v1.ChatStatus'
      title: SessionStatusEntry
      additionalProperties: false
      description: SessionStatusEntry is an aggregate status for a session.
    bossanova.v1.SessionSummary:
      type: object
      properties:
        id:
          type: string
          title: id
        repoId:
          type: string
          title: repo_id
        title:
          type: string
          title: title
        state:
          title: state
          $ref: '#/components/schemas/bossanova.v1.SessionState'
        prNumber:
          type:
            - integer
            - "null"
          title: pr_number
          format: int32
        prUrl:
          type:
            - string
            - "null"
          title: pr_url
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: SessionSummary
      additionalProperties: false
      description: SessionSummary is a lightweight view of a Session for report context.
    bossanova.v1.SetRepairStatusRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: Session ID to set repair status on.
        isRepairing:
          type: boolean
          title: is_repairing
          description: Whether the session is currently being repaired.
        dispatcherId:
          type: string
          title: dispatcher_id
          description: |-
            Stable identity of the repair dispatcher (e.g. the repair plugin instance).
             Used to take/release the per-session single-repairer lease: setting
             is_repairing=true acquires the lease for this dispatcher (re-entrant for the
             same id, refused with FailedPrecondition for a different one while held);
             is_repairing=false releases it. Empty for legacy callers, which then only
             toggle the advisory display flag without lease enforcement.
      title: SetRepairStatusRequest
      additionalProperties: false
    bossanova.v1.SetRepairStatusResponse:
      type: object
      title: SetRepairStatusResponse
      additionalProperties: false
    bossanova.v1.SetupScriptOutput:
      type: object
      properties:
        text:
          type: string
          title: text
      title: SetupScriptOutput
      additionalProperties: false
    bossanova.v1.StartAgentRunHostRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: Session ID whose worktree should host the run.
        prompt:
          type: string
          title: prompt
          description: Prompt to feed the agent.
      title: StartAgentRunHostRequest
      additionalProperties: false
    bossanova.v1.StartAgentRunHostResponse:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: Resolved session ID returned by the loaded AgentRunner plugin.
      title: StartAgentRunHostResponse
      additionalProperties: false
    bossanova.v1.StartAgentRunRequest:
      type: object
      properties:
        workDir:
          type: string
          title: work_dir
        plan:
          type: string
          title: plan
        resumeId:
          type:
            - string
            - "null"
          title: resume_id
        sessionId:
          type: string
          title: session_id
          description: empty = plugin generates
        logPath:
          type: string
          title: log_path
          description: bossd-owned, openat(O_NOFOLLOW)
        model:
          type: string
          title: model
          description: opaque agent model id; "" = plugin default. Never enumerated by bossd.
        extraEnv:
          type: object
          title: extra_env
          additionalProperties:
            type: string
            title: value
          description: |-
            extra_env is an allowlisted, daemon-resolved environment overlay applied to
             the spawned agent process on top of the inherited environment. It carries
             proof credentials/constants AND (for account rotation) the account's env
             overlay (e.g. CLAUDE_CODE_OAUTH_TOKEN / CODEX_HOME). Values are NEVER logged
             by bossd or the plugin — treat as secret-bearing.
        headlessCapabilityProfile:
          title: headless_capability_profile
          description: |-
            Explicit required runtime operation surface for a headless launch. The
             zero/default profile is legacy-compatible and performs no preflight.
          $ref: '#/components/schemas/bossanova.v1.HeadlessCapabilityProfile'
      title: StartAgentRunRequest
      additionalProperties: false
    bossanova.v1.StartAgentRunRequest.ExtraEnvEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ExtraEnvEntry
      additionalProperties: false
    bossanova.v1.StartAgentRunResponse:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: resolved session ID
      title: StartAgentRunResponse
      additionalProperties: false
    bossanova.v1.StartChatRunHostRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: Session ID whose worktree should host the run.
        prompt:
          type: string
          title: prompt
          description: |-
            Raw prompt to feed the agent (typed as a bracketed paste into the tmux pane).
             Mutually exclusive with command.
        title:
          type: string
          title: title
          description: |-
            Chat title surfaced in the chat list (eg. `Repair: <session>` or
             `Run "<cron>"`).
        command:
          type: string
          title: command
          description: |-
            Boss command name without any agent-specific prefix (eg. "boss-repair").
             The daemon formats it using the loaded AgentRunner plugin's command_prefix.
             Mutually exclusive with prompt.
        replaceExistingChat:
          type: boolean
          title: replace_existing_chat
          description: |-
            When true, bossd may replace an existing live chat in the same session
             before starting this run. Used by auto-repair only after its idle gate
             has already decided the existing chat is safe to interrupt.
        replaceExistingReason:
          type: string
          title: replace_existing_reason
          description: Durable reason written to the replaced chat row.
        replaceExistingObservedLastChatActivityAt:
          title: replace_existing_observed_last_chat_activity_at
          description: |-
            Last chat activity observed by the repair plugin when it decided the
             blocking chat was idle. bossd refuses replacement if the current blocking
             chat has produced newer output since that snapshot.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        resumeAgentSessionId:
          type: string
          title: resume_agent_session_id
          description: |-
            When set, resume this prior agent session (claude `--resume <id>`) instead
             of starting a fresh one, so the agent retains the history of earlier
             attempts. Used by auto-repair to make each loop iteration continue the
             previous iteration's conversation. Empty = fresh start.
      title: StartChatRunHostRequest
      additionalProperties: false
    bossanova.v1.StartChatRunHostResponse:
      type: object
      properties:
        agentSessionId:
          type: string
          title: agent_session_id
          description: Resolved agent session ID returned by the loaded AgentRunner plugin.
      title: StartChatRunHostResponse
      additionalProperties: false
    bossanova.v1.StartRepairWorkflowRequest:
      type: object
      title: StartRepairWorkflowRequest
      additionalProperties: false
    bossanova.v1.StartRepairWorkflowResponse:
      type: object
