          description: path relative to the home dir, e.g. "auth.json"
        content:
          type: string
          title: content
          format: byte
          description: file bytes; secret-bearing, never logged
        mode:
          type: integer
          title: mode
          description: unix file mode, e.g. 0600
      title: MaterializedFile
      additionalProperties: false
      description: |-
        MaterializedFile is one file the daemon must write into the agent's
         per-account home directory. content is secret-bearing and NEVER logged.
    bossanova.v1.MergeBlock:
      type: object
      properties:
        gate:
          title: gate
          $ref: '#/components/schemas/bossanova.v1.MergeBlock.Gate'
        detail:
          type: string
          title: detail
          description: human-readable one-liner
        blockingReviewers:
          type: array
          items:
            type: string
          title: blocking_reviewers
          description: logins whose latest review is CHANGES_REQUESTED
        displayStatus:
          title: display_status
          description: the DisplayStatus this derives from
          $ref: '#/components/schemas/bossanova.v1.DisplayStatus'
      title: MergeBlock
      additionalProperties: false
      description: |-
        MergeBlock explains why a session's PR cannot currently be merged, so an
         unattended driver (boss-epic) can decide repair-vs-proceed without scraping tmux.
    bossanova.v1.MergeBlock.Gate:
      type: string
      title: Gate
      enum:
        - GATE_UNSPECIFIED
        - GATE_NONE
        - GATE_REVIEW
        - GATE_CI
        - GATE_PENDING
        - GATE_CONFLICT
        - GATE_BASE_SYNC
        - GATE_DRAFT
    bossanova.v1.MergeSessionCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: MergeSessionCommand
      additionalProperties: false
      description: |-
        MergeSessionCommand asks the daemon to merge a session's PR.
         Replies with CommandResult carrying the updated Session.
    bossanova.v1.MergeSessionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: MergeSessionRequest
      additionalProperties: false
    bossanova.v1.MergeSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
        detail:
          type: string
          title: detail
          description: |-
            Human-readable note about how the merge was performed, e.g. a merge
             strategy substitution. Empty when the merge ran exactly as configured.
      title: MergeSessionResponse
      additionalProperties: false
    bossanova.v1.MergeStrategy:
      type: string
      title: MergeStrategy
      enum:
        - MERGE_STRATEGY_UNSPECIFIED
        - MERGE_STRATEGY_MERGE
        - MERGE_STRATEGY_REBASE
        - MERGE_STRATEGY_SQUASH
      description: |-
        MergeStrategy is the merge method used when auto-merging PRs. Mirrors the
         domain values in lib/bossalib/models (merge / rebase / squash).
    bossanova.v1.NoOpAction:
      type: object
      properties:
        reason:
          type: string
          title: reason
      title: NoOpAction
      additionalProperties: false
      description: NoOpAction indicates the job ran but no action is needed.
    bossanova.v1.Note:
      type: object
      properties:
        id:
          type: string
          title: id
        repoId:
          type: string
          title: repo_id
        sessionId:
          type: string
          title: session_id
          description: |-
            Session that recorded the note; empty = not session-scoped. The referenced
             session may no longer exist.
        chatId:
          type: string
          title: chat_id
          description: Chat that recorded the note; empty = not chat-scoped.
        body:
          type: string
          title: body
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            Normalised (trimmed, lowercased, de-duplicated) and returned in ascending
             order. Normalisation is lossy: display casing is not preserved.
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Note
      additionalProperties: false
      description: |-
        Note is durable free-text recorded against a repository, so a later sweep can
         harvest what past runs learned. It mirrors the daemon's domain model;
         timestamps use google.protobuf.Timestamp.

         session_id and chat_id are PROVENANCE, not ownership: they record which run
         wrote the note and are deliberately not foreign keys, so archiving or
         deleting that session leaves the note — and this provenance — intact.

         Unlike GithubCallback.message and Broadcast.message, a note's body is NOT a
         secret: it exists to be read back, so it is populated on every read surface.
    bossanova.v1.NoteTagSet:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          title: tags
      title: NoteTagSet
      additionalProperties: false
      description: |-
        NoteTagSet wraps a repeated tag field so UpdateNoteRequest can distinguish
         "leave the tags alone" (field unset) from "clear every tag" (field set to an
         empty list). A bare proto3 `repeated` cannot express that difference — an
         empty list and an absent list are the same wire bytes — and the difference is
         load-bearing here, because an update that means to change only the body must
         not silently wipe the note's tags.
    bossanova.v1.NotifyAuthChangeRequest:
      type: object
      properties:
        action:
          type: string
          title: action
          description: '"login" or "logout"'
      title: NotifyAuthChangeRequest
      additionalProperties: false
    bossanova.v1.NotifyAuthChangeResponse:
      type: object
      title: NotifyAuthChangeResponse
      additionalProperties: false
    bossanova.v1.NotifyStatusChangeRequest:
