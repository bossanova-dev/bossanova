    bossanova.v1.TaskSourceServiceGetInfoRequest:
      type: object
      title: TaskSourceServiceGetInfoRequest
      additionalProperties: false
    bossanova.v1.TaskSourceServiceGetInfoResponse:
      type: object
      properties:
        info:
          title: info
          $ref: '#/components/schemas/bossanova.v1.PluginInfo'
      title: TaskSourceServiceGetInfoResponse
      additionalProperties: false
    bossanova.v1.TaskUpdatedEvent:
      type: object
      properties:
        externalId:
          type: string
          title: external_id
        title:
          type:
            - string
            - "null"
          title: title
          description: The updated fields.
        priority:
          type:
            - integer
            - "null"
          title: priority
          format: int32
        labels:
          type: array
          items:
            type: string
          title: labels
      title: TaskUpdatedEvent
      additionalProperties: false
      description: TaskUpdatedEvent signals that an external task was updated (eg. re-prioritized).
    bossanova.v1.TerminalAttachCommand:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
          description: bosso-generated UUID. The daemon does NOT pick routing keys.
        chatId:
          type: string
          title: chat_id
        cols:
          type: integer
          title: cols
          description: Initial PTY size from the browser (xterm.js).
        rows:
          type: integer
          title: rows
      title: TerminalAttachCommand
      additionalProperties: false
      description: |-
        TerminalAttachCommand: bosso → daemon. Carried inside TerminalClientMessage.
         Asks the daemon to spawn a new tmux attach PTY for the given chat. The
         attach_id is bosso-generated (UUID); the daemon uses it to multiplex
         subsequent input/resize/close commands and to tag outbound data chunks.
    bossanova.v1.TerminalAttachExited:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
        exitCode:
          type: integer
          title: exit_code
          format: int32
        reason:
          type: string
          title: reason
      title: TerminalAttachExited
      additionalProperties: false
      description: |-
        TerminalAttachExited: daemon → bosso. Carried inside
         TerminalServerMessage. Sent when the PTY child exits (tmux session was
         killed, attach was closed, etc.). exit_code mirrors the underlying
         process; reason is a free-form string for diagnostics.
    bossanova.v1.TerminalClientMessage:
      type: object
      oneOf:
        - type: object
          properties:
            attach:
              title: attach
              $ref: '#/components/schemas/bossanova.v1.TerminalAttachCommand'
          title: attach
          required:
            - attach
        - type: object
          properties:
            close:
              title: close
              $ref: '#/components/schemas/bossanova.v1.TerminalCloseCommand'
          title: close
          required:
            - close
        - type: object
          properties:
            input:
              title: input
              $ref: '#/components/schemas/bossanova.v1.TerminalInputCommand'
          title: input
          required:
            - input
        - type: object
          properties:
            ping:
              title: ping
              $ref: '#/components/schemas/bossanova.v1.TerminalPing'
          title: ping
          required:
            - ping
        - type: object
          properties:
            ready:
              title: ready
              $ref: '#/components/schemas/bossanova.v1.TerminalReady'
          title: ready
          required:
            - ready
        - type: object
          properties:
            resize:
              title: resize
              $ref: '#/components/schemas/bossanova.v1.TerminalResizeCommand'
          title: resize
          required:
            - resize
      title: TerminalClientMessage
      additionalProperties: false
      description: |-
        TerminalClientMessage is the bosso → daemon envelope on the new RPC.
         Despite the name, this is the gRPC RESPONSE stream type (bosso is the
         gRPC server). Unknown oneof cases are logged and skipped by the daemon
         for forward compatibility.
    bossanova.v1.TerminalCloseCommand:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
      title: TerminalCloseCommand
      additionalProperties: false
      description: |-
        TerminalCloseCommand: bosso → daemon. Asks the daemon to tear down the
         attach (closes PTY, kills the `tmux attach` process — does NOT kill the
         underlying tmux session running Claude).
    bossanova.v1.TerminalDataChunk:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
        seq:
          type:
            - integer
            - string
          title: seq
          format: int64
          description: |-
            Monotonic per attach. Reserved for a future delta-replay upgrade; not
             currently used by the consumer beyond debug logging.
        data:
          type: string
          title: data
          format: byte
          description: Raw PTY output incl. VT escape codes (opaque — ready for E2E).
        lost:
          type: boolean
          title: lost
          description: |-
            True when the daemon's per-attach ringbuffer dropped bytes due to a
             slow consumer. The browser MUST treat this as a RESYNC signal: the
             daemon will follow up with `tmux refresh-client` so all attached
             clients redraw fresh state.
      title: TerminalDataChunk
      additionalProperties: false
      description: |-
        TerminalDataChunk: daemon → bosso. Carried inside TerminalServerMessage.
         Raw PTY output (including VT escape codes) tagged with the attach_id so
         bosso can route it to the correct WebSocket subscriber.
    bossanova.v1.TerminalInputCommand:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
        data:
          type: string
          title: data
          format: byte
          description: Raw PTY input (opaque — ready for E2E later).
      title: TerminalInputCommand
      additionalProperties: false
      description: |-
        TerminalInputCommand: bosso → daemon. Raw bytes typed by the browser
         client to be written to the PTY stdin. Payload is opaque to bosso so a
         future libsodium framing layer can swap in without changing the wire
         shape.
    bossanova.v1.TerminalPing:
      type: object
      properties:
        seq:
          type:
            - integer
            - string
          title: seq
          format: int64
      title: TerminalPing
      additionalProperties: false
      description: |-
        TerminalPing: bosso → daemon. Application-level liveness probe sent on a
         fixed interval while the stream is open. The daemon answers each with a
         TerminalPong. A missed-beats budget on the daemon tears the stream down,
         which detects an alive-but-wrongly-bound stream — a failure mode HTTP/2
         keepalive cannot see because the underlying connection is still healthy.
    bossanova.v1.TerminalPong:
      type: object
      properties:
        seq:
          type:
            - integer
            - string
          title: seq
          format: int64
      title: TerminalPong
      additionalProperties: false
      description: |-
        TerminalPong: daemon → bosso. Answer to a TerminalPing, echoing its seq
         so bosso can match the round-trip.
    bossanova.v1.TerminalReady:
      type: object
      title: TerminalReady
      additionalProperties: false
      description: |-
        TerminalReady: bosso → daemon. Carried inside TerminalClientMessage.
         Sent exactly once, immediately after the bosso handler installs the
         terminal sender and has confirmed the DaemonStream is local-and-Ready.
         It is the daemon's positive, application-level proof that its
         TerminalStream is bound to a healthy, co-located pod — the daemon does
         NOT treat the stream as connected until this frame arrives. A ready
         frame that never comes (e.g. a deploy split the two reverse streams
         across pods) is what the daemon's watchdog keys on to self-heal.
    bossanova.v1.TerminalResizeCommand:
      type: object
      properties:
        attachId:
          type: string
          title: attach_id
        cols:
          type: integer
          title: cols
        rows:
          type: integer
          title: rows
      title: TerminalResizeCommand
      additionalProperties: false
      description: |-
        TerminalResizeCommand: bosso → daemon. Forwarded from the browser when
         the xterm viewport size changes. Daemon applies the new size to the PTY
         (and tmux propagates to all attached clients per the window-size policy).
    bossanova.v1.TerminalServerMessage:
      type: object
      oneOf:
        - type: object
          properties:
            data:
              title: data
              $ref: '#/components/schemas/bossanova.v1.TerminalDataChunk'
          title: data
          required:
            - data
        - type: object
          properties:
            exited:
              title: exited
              $ref: '#/components/schemas/bossanova.v1.TerminalAttachExited'
          title: exited
          required:
            - exited
        - type: object
          properties:
            pong:
              title: pong
              $ref: '#/components/schemas/bossanova.v1.TerminalPong'
          title: pong
          required:
            - pong
      title: TerminalServerMessage
      additionalProperties: false
      description: |-
        TerminalServerMessage is the daemon → bosso envelope on the new RPC.
         Despite the name, this is the gRPC REQUEST stream type (bossd is the
         gRPC client and initiates the stream). Unknown oneof cases are logged
         and skipped by bosso for forward compatibility.
    bossanova.v1.TestAccountCommand:
      type: object
      properties:
        id:
          type: string
          title: id
      title: TestAccountCommand
      additionalProperties: false
      description: |-
        TestAccountCommand runs a live account validation. Fields mirror
         daemon.proto's TestAccountRequest. Replies with CommandResult carrying a
         TestAccountResponse (test_account = 26).
    bossanova.v1.TestAccountRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: TestAccountRequest
      additionalProperties: false
    bossanova.v1.TestAccountResponse:
      type: object
      properties:
        account:
          title: account
          description: updated metadata (last_test_ok_at / last_test_error)
          $ref: '#/components/schemas/bossanova.v1.Account'
        liveSmokeRan:
          type: boolean
          title: live_smoke_ran
          description: true only when provider verification executed
        detail:
          type: string
          title: detail
          description: human-readable outcome detail
      title: TestAccountResponse
      additionalProperties: false
    bossanova.v1.TokenRefresh:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
          description: Newly-obtained WorkOS JWT.
      title: TokenRefresh
      additionalProperties: false
      description: |-
        TokenRefresh carries a freshly-obtained WorkOS JWT. Bosso re-verifies it
         against WorkOS JWKS (same path as initial validation) before accepting. On
         refresh failure, the daemon closes the stream and reconnects.

         Only the access_token travels on the wire — refresh tokens never cross the
         stream.
    bossanova.v1.TrackerIssue:
      type: object
      properties:
        externalId:
          type: string
          title: external_id
          description: eg. "ENG-123"
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        branchName:
          type: string
          title: branch_name
          description: Suggested branch name from tracker
        url:
          type: string
          title: url
          description: Link to issue in tracker
        state:
          type: string
          title: state
          description: eg. "In Progress", "Todo"
        prNumber:
          type: integer
          title: pr_number
          format: int32
          description: Existing PR if found (0 = none)
        existingBranch:
          type: string
          title: existing_branch
          description: Existing branch if found
      title: TrackerIssue
      additionalProperties: false
      description: TrackerIssue represents an issue from an external tracker (Linear, Jira, etc.).
    bossanova.v1.TranscriptExistsRequest:
      type: object
      properties:
        workDir:
          type: string
          title: work_dir
        agentSessionId:
          type: string
          title: agent_session_id
      title: TranscriptExistsRequest
      additionalProperties: false
    bossanova.v1.TranscriptExistsResponse:
      type: object
      properties:
        exists:
          type: boolean
          title: exists
      title: TranscriptExistsResponse
      additionalProperties: false
    bossanova.v1.TransferCancel:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        reason:
          type: string
          title: reason
      title: TransferCancel
      additionalProperties: false
      description: |-
        TransferCancel is emitted by the source daemon (or by bosso to the source)
         when any step of the coordinated transfer fails. Clears the
         transferring_to marker so the session becomes visible on the source again.
    bossanova.v1.TransferConfirmed:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        targetDaemonId:
          type: string
          title: target_daemon_id
      title: TransferConfirmed
      additionalProperties: false
      description: |-
        TransferConfirmed is the payload sent by the target daemon on successful
         resume. Bosso uses this to tell the source daemon to DELETE its copy.
    bossanova.v1.TransferSessionCommand:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        sourceDaemonId:
          type: string
          title: source_daemon_id
        targetDaemonId:
          type: string
          title: target_daemon_id
      title: TransferSessionCommand
      additionalProperties: false
      description: |-
        TransferSessionCommand asks a daemon to take part in a coordinated transfer
         protocol (decision #14). Source daemon receives this first, pauses, emits a
         SessionDelta with transferring_to set. Target daemon then receives it,
         creates the session with transferring_from set, resumes, and replies with
         CommandResult{TransferConfirmed}.
    bossanova.v1.TransferSessionRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        sourceDaemonId:
          type: string
          title: source_daemon_id
          description: Daemon to transfer FROM.
        targetDaemonId:
          type: string
          title: target_daemon_id
          description: Daemon to transfer TO.
      title: TransferSessionRequest
      additionalProperties: false
    bossanova.v1.TransferSessionResponse:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/bossanova.v1.Session'
        targetDaemonId:
          type: string
          title: target_daemon_id
      title: TransferSessionResponse
      additionalProperties: false
    bossanova.v1.UpdateAccountCommand:
      type: object
      properties:
        id:
          type: string
          title: id
        label:
          type:
            - string
            - "null"
          title: label
        priority:
          type:
            - integer
            - "null"
          title: priority
          format: int32
        status:
          type:
            - string
            - "null"
          title: status
          description: '"active" | "disabled"'
        allowedModels:
          type: array
          items:
            type: string
          title: allowed_models
      title: UpdateAccountCommand
      additionalProperties: false
      description: |-
        UpdateAccountCommand edits an account's metadata. Fields mirror
         daemon.proto's UpdateAccountRequest. Replies with CommandResult carrying an
         UpdateAccountResponse (update_account = 25).
    bossanova.v1.UpdateAccountRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        label:
          type:
            - string
            - "null"
          title: label
        priority:
          type:
            - integer
            - "null"
          title: priority
          format: int32
        status:
          type:
            - string
            - "null"
          title: status
          description: '"active" | "disabled"'
        allowedModels:
          type: array
          items:
            type: string
          title: allowed_models
          description: replaces the set when present
      title: UpdateAccountRequest
      additionalProperties: false
    bossanova.v1.UpdateAccountResponse:
      type: object
      properties:
