            - type: object
              properties:
                updateSession:
                  title: update_session
                  description: 'bosso → daemon: update a session''s title/tracker. Replies CommandResult{Session}.'
                  $ref: '#/components/schemas/bossanova.v1.UpdateSessionCommand'
              title: update_session
              required:
